:"Fine-grained locking","quote":"Fine-grained locking protects smaller independent pieces of state with separate locks. It improves concurrency but increases design complexity.","explanation":"","image":"images/part-02/java_concurrency__synchronization__fine_grained_locking.png","doc":"docs/part-02/java_concurrency__synchronization__fine_grained_locking.md"},{"title":"Lock striping","quote":"Lock striping divides data into segments, each guarded by a different lock. It reduces contention without requiring one lock per item.","explanation":"","image":"images/part-02/java_concurrency__synchronization__lock_striping.png","doc":"docs/part-02/java_concurrency__synchronization__lock_striping.md"}]},{"name":"Memory Model","topics":[{"title":"Java Memory Model","quote":"The Java Memory Model defines how threads interact through memory, including visibility, ordering, atomicity, and happens-before guarantees.","explanation":"","image":"images/part-02/java_concurrency__memory_model__java_memory_model.png","doc":"docs/part-02/java_concurrency__memory_model__java_memory_model.md"},{"title":"Happens-before","quote":"A happens-before relationship guarantees that one action\u0027s effects are visible to another action. Locks, volatile access, thread start, and join create such relationships.","explanation":"","image":"images/part-02/java_concurrency__memory_model__happens_before.png","doc":"docs/part-02/java_concurrency__memory_model__happens_before.md"},{"title":"Visibility","quote":"Visibility means one thread can observe another thread\u0027s writes. Synchronization, volatile, final-field guarantees, and concurrent utilities provide visibility.","explanation":"","image":"images/part-02/java_concurrency__memory_model__visibility.png","doc":"docs/part-02/java_concurrency__memory_model__visibility.md"},{"title":"Atomicity","quote":"Atomicity means an operation appears indivisible to other threads. Simple reads and writes may be atomic, but compound actions usually need synchronization or atomics.","explanation":"","image":"images/part-02/java_concurrency__memory_model__atomicity.png","doc":"docs/part-02/java_concurrency__memory_model__atomicity.md"},{"title":"Ordering","quote":"Ordering defines which execution sequences other threads may observe. The JVM and CPU may reorder operations unless memory-model rules prevent it.","explanation":"","image":"images/part-02/java_concurrency__memory_model__ordering.png","doc":"docs/part-02/java_concurrency__memory_model__ordering.md"},{"title":"volatile keyword","quote":"volatile guarantees visibility and ordering for reads and writes of a field, but it does not make compound operations such as increment atomic.","explanation":"","image":"images/part-02/java_concurrency__memory_model__volatile_keyword.png","doc":"docs/part-02/java_concurrency__memory_model__volatile_keyword.md"},{"title":"Final field semantics","quote":"Properly constructed objects give special visibility guarantees for final fields. Other threads can safely observe their initialized values after safe publication.","explanation":"","image":"images/part-02/java_concurrency__memory_model__final_field_semantics.png","doc":"docs/part-02/java_concurrency__memory_model__final_field_semantics.md"},{"title":"Safe publication","quote":"Safe publication makes a fully constructed object visible to other threads through synchronization, volatile fields, static initialization, or concurrent collections.","explanation":"","image":"images/part-02/java_concurrency__memory_model__safe_publication.png","doc":"docs/part-02/java_concurrency__memory_model__safe_publication.md"},{"title":"Double-checked locking","quote":"Double-checked locking avoids repeated synchronization during lazy initialization. The shared instance field must be volatile for correctness.","explanation":"","image":"images/part-02/java_concurrency__memory_model__double_checked_locking.png","doc":"docs/part-02/java_concurrency__memory_model__double_checked_locking.md"},{"title":"Instruction reordering","quote":"Compilers and processors may reorder instructions for performance as long as single-thread behavior is preserved. Synchronization constrains harmful reorderings.","explanation":"","image":"images/part-02/java_concurrency__memory_model__instruction_reordering.png","doc":"docs/part-02/java_concurrency__memory_model__instruction_reordering.md"},{"title":"Memory barriers","quote":"Memory barriers restrict reordering and force certain memory visibility effects. Java synchronization constructs insert the required barriers automatically.","explanation":"","image":"images/part-02/java_concurrency__memory_model__memory_barriers.png","doc":"docs/part-02/java_concurrency__memory_model__memory_barriers.md"},{"title":"False sharing","quote":"False sharing occurs when threads update different variables that occupy the same CPU cache line, causing unnecessary cache invalidation.","explanation":"","image":"images/part-02/java_concurrency__memory_model__false_sharing.png","doc":"docs/part-02/java_concurrency__memory_model__false_sharing.md"}]},{"name":"Atomic and Lock-Free","topics":[{"title":"CAS","quote":"Compare-and-set atomically updates a value only when it still matches an expected value. It is the foundation of many lock-free algorithms.","explanation":"","image":"images/part-02/java_concurrency__atomic_and_lock_free__cas.png","doc":"docs/part-02/java_concurrency__atomic_and_lock_free__cas.md"},{"title":"AtomicInteger","quote":"AtomicInteger provides thread-safe atomic operations on an int, such as increment, compareAndSet, and updateAndGet, without explicit locking.","explanation":"","image":"images/part-02/java_concurrency__atomic_and_lock_free__atomicinteger.png","doc":"docs/part-02/java_concurrency__atomic_and_lock_free__atomicinteger.md"},{"title":"AtomicLong","quote":"AtomicLong provides atomic operations for long values. Under extreme contention, LongAdder may scale better for counters.","explanation":"","image":"images/part-02/java_concurrency__atomic_and_lock_free__atomiclong.png","doc":"docs/part-02/java_concurrency__atomic_and_lock_free__atomiclong.md"},{"title":"AtomicReference","quote":"AtomicReference performs atomic reads, writes, and compare-and-set updates on object references.","explanation":"","image":"images/part-02/java_concurrency__atomic_and_lock_free__atomicreference.png","doc":"docs/part-02/java_concurrency__atomic_and_lock_free__atomicreference.md"},{"title":"AtomicStampedReference","quote":"AtomicStampedReference pairs a reference with a version stamp, helping detect changes that would otherwise create the ABA problem.","explanation":"","image":"images/part-02/java_concurrency__atomic_and_lock_free__atomicstampedreference.png","doc":"docs/part-02/java_concurrency__atomic_and_lock_free__atomicstampedreference.md"},{"title":"ABA problem","quote":"The ABA problem occurs when a value changes from A to B and back to A, making CAS incorrectly assume nothing changed.","explanation":"","image":"images/part-02/java_concurrency__atomic_and_lock_free__aba_problem.png","doc":"docs/part-02/java_concurrency__atomic_and_lock_free__aba_problem.md"},{"title":"LongAdder","quote":"LongAdder spreads updates across internal cells and combines them when read. It offers high-throughput counters under contention.","explanation":"","image":"images/part-02/java_concurrency__atomic_and_lock_free__longadder.png","doc":"docs/part-02/java_concurrency__atomic_and_lock_free__longadder.md"},{"title":"LongAccumulator","quote":"LongAccumulator generalizes LongAdder by combining values with a supplied associative function and identity.","explanation":"","image":"images/part-02/java_concurrency__atomic_and_lock_free__longaccumulator.png","doc":"docs/part-02/java_concurrency__atomic_and_lock_free__longaccumulator.md"},{"title":"VarHandle","quote":"VarHandle provides strongly typed access to fields and array elements with plain, opaque, acquire-release, volatile, and atomic modes.","explanation":"","image":"images/part-02/java_concurrency__atomic_and_lock_free__varhandle.png","doc":"docs/part-02/java_concurrency__atomic_and_lock_free__varhandle.md"},{"title":"Lock-free algorithms","quote":"A lock-free algorithm guarantees that some thread always makes progress even if others pause. It often relies on CAS retry loops.","explanation":"","image":"images/part-02/java_concurrency__atomic_and_lock_free__lock_free_algorithms.png","doc":"docs/part-02/java_concurrency__atomic_and_lock_free__lock_free_algorithms.md"},{"title":"Wait-free algorithms","quote":"A wait-free algorithm guarantees every thread completes its operation within a bounded number of steps. This guarantee is stronger than lock-free.","explanation":"","image":"images/part-02/java_concurrency__atomic_and_lock_free__wait_free_algorithms.png","doc":"docs/part-02/java_concurrency__atomic_and_lock_free__wait_free_algorithms.md"}]},{"name":"Executors","topics":[{"title":"Executor framework","quote":"The Executor framework separates task submission from thread creation and scheduling. It provides reusable pools, queues, futures, and lifecycle control.","explanation":"","image":"images/part-02/java_concurrency__executors__executor_framework.png","doc":"docs/part-02/java_concurrency__executors__executor_framework.md"},{"title":"ExecutorService","quote":"ExecutorService executes Runnable and Callable tasks, returns Futures, and provides shutdown methods for controlled lifecycle management.","explanation":"","image":"images/part-02/java_concurrency__executors__executorservice.png","doc":"docs/part-02/java_concurrency__executors__executorservice.md"},{"title":"ThreadPoolExecutor","quote":"ThreadPoolExecutor is the configurable core implementation behind many executors. It controls pool size, queueing, thread creation, and rejection.","explanation":"","image":"images/part-02/java_concurrency__executors__threadpoolexecutor.png","doc":"docs/part-02/java_concurrency__executors__threadpoolexecutor.md"},{"title":"Fixed thread pool","quote":"A fixed thread pool keeps a constant maximum number of workers and queues additional tasks. An unbounded queue can hide overload.","explanation":"","image":"images/part-02/java_concurrency__executors__fixed_thread_pool.png","doc":"docs/part-02/java_concurrency__executors__fixed_thread_pool.md"},{"title":"Cached thread pool","quote":"A cached thread pool creates threads as needed and reuses idle ones. It can grow rapidly and is risky for unbounded workloads.","explanation":"","image":"images/part-02/java_concurrency__executors__cached_thread_pool.png","doc":"docs/part-02/java_concurrency__executors__cached_thread_pool.md"},{"title":"Single-thread executor","quote":"A single-thread executor processes tasks sequentially on one worker, preserving submission order and isolating failures through worker replacement.","explanation":"","image":"images/part-02/java_concurrency__executors__single_thread_executor.png","doc":"docs/part-02/java_concurrency__executors__single_thread_executor.md"},{"title":"ScheduledExecutorService","quote":"ScheduledExecutorService runs tasks after delays or at fixed rates and delays. It is preferred over Timer for concurrent scheduling.","explanation":"","image":"images/part-02/java_concurrency__executors__scheduledexecutorservice.png","doc":"docs/part-02/java_concurrency__executors__scheduledexecutorservice.md"},{"title":"Work-stealing pool","quote":"A work-stealing pool gives each worker a deque and lets idle workers steal tasks from others, improving load balancing for recursive workloads.","explanation":"","image":"images/part-02/java_concurrency__executors__work_stealing_pool.png","doc":"docs/part-02/java_concurrency__executors__work_stealing_pool.md"},{"title":"RejectedExecutionHandler","quote":"RejectedExecutionHandler decides what happens when a ThreadPoolExecutor cannot accept more work. Policies may abort, discard, run in the caller, or customize backpressure.","explanation":"","image":"images/part-02/java_concurrency__executors__rejectedexecutionhandler.png","doc":"docs/part-02/java_concurrency__executors__rejectedexecutionhandler.md"},{"title":"Thread factory","quote":"A ThreadFactory centralizes thread naming, daemon status, priority, uncaught-exception handlers, and other creation settings.","explanation":"","image":"images/part-02/java_concurrency__executors__thread_factory.png","doc":"docs/part-02/java_concurrency__executors__thread_factory.md"},{"title":"Graceful executor shutdown","quote":"Graceful shutdown stops new submissions, waits for queued tasks, and escalates to interruption only after a timeout.","explanation":"","image":"images/part-02/java_concurrency__executors__graceful_executor_shutdown.png","doc":"docs/part-02/java_concurrency__executors__graceful_executor_shutdown.md"},{"title":"Thread pool sizing","quote":"CPU-bound pools are usually near the number of cores, while blocking workloads may need more threads. Measure queueing, latency, and utilization.","explanation":"","image":"images/part-02/java_concurrency__executors__thread_pool_sizing.png","doc":"docs/part-02/java_concurrency__executors__thread_pool_sizing.md"},{"title":"Queue selection for thread pools","quote":"Queue choice controls backpressure and scaling behavior. Bounded queues protect memory, direct handoff favors scaling, and unbounded queues can hide overload.","explanation":"","image":"images/part-02/java_concurrency__executors__queue_selection_for_thread_pools.png","doc":"docs/part-02/java_concurrency__executors__queue_selection_for_thread_pools.md"}]},{"name":"Coordination Utilities","topics":[{"title":"CountDownLatch","quote":"CountDownLatch lets threads wait until a fixed number of events complete. It is one-use and cannot be reset.","explanation":"","image":"images/part-02/java_concurrency__coordination_utilities__countdownlatch.png","doc":"docs/part-02/java_concurrency__coordination_utilities__countdownlatch.md"},{"title":"CyclicBarrier","quote":"CyclicBarrier makes a fixed group of threads wait for one another at a common phase and can be reused.","explanation":"","image":"images/part-02/java_concurrency__coordination_utilities__cyclicbarrier.png","doc":"docs/part-02/java_concurrency__coordination_utilities__cyclicbarrier.md"},{"title":"Phaser","quote":"Phaser coordinates reusable multi-phase work with dynamically registering and deregistering parties.","explanation":"","image":"images/part-02/java_concurrency__coordination_utilities__phaser.png","doc":"docs/part-02/java_concurrency__coordination_utilities__phaser.md"},{"title":"Semaphore","quote":"Semaphore controls access to a limited number of permits. It is useful for throttling concurrent access to scarce resources.","explanation":"","image":"images/part-02/java_concurrency__coordination_utilities__semaphore.png","doc":"docs/part-02/java_concurrency__coordination_utilities__semaphore.md"},{"title":"Exchanger","quote":"Exchanger lets two threads meet and swap objects at a synchronization point.","explanation":"","image":"images/part-02/java_concurrency__coordination_utilities__exchanger.png","doc":"docs/part-02/java_concurrency__coordination_utilities__exchanger.md"},{"title":"CompletableFuture","quote":"CompletableFuture represents an asynchronous result and supports non-blocking composition, combination, callbacks, and error handling.","explanation":"","image":"images/part-02/java_concurrency__coordination_utilities__completablefuture.png","doc":"docs/part-02/java_concurrency__coordination_utilities__completablefuture.md"},{"title":"CompletionStage","quote":"CompletionStage defines the API for composing asynchronous computations. CompletableFuture is its common implementation.","explanation":"","image":"images/part-02/java_concurrency__coordination_utilities__completionstage.png","doc":"docs/part-02/java_concurrency__coordination_utilities__completionstage.md"},{"title":"thenApply vs thenCompose","quote":"thenApply transforms a completed value, while thenCompose flattens a function that already returns another CompletionStage.","explanation":"","image":"images/part-02/java_concurrency__coordination_utilities__thenapply_vs_thencompose.png","doc":"docs/part-02/java_concurrency__coordination_utilities__thenapply_vs_thencompose.md"},{"title":"allOf and anyOf","quote":"allOf completes when every future completes, while anyOf completes when the first future completes. allOf does not directly collect individual results.","explanation":"","image":"images/part-02/java_concurrency__coordination_utilities__allof_and_anyof.png","doc":"docs/part-02/java_concurrency__coordination_utilities__allof_and_anyof.md"},{"title":"CompletableFuture exception handling","quote":"Use exceptionally for fallback, handle for success-or-failure transformation, and whenComplete for observation without replacing the result.","explanation":"","image":"images/part-02/java_concurrency__coordination_utilities__completablefuture_exception_handling.png","doc":"docs/part-02/java_concurrency__coordination_utilities__completablefuture_exception_handling.md"},{"title":"CompletableFuture timeouts","quote":"orTimeout completes exceptionally after a deadline, while completeOnTimeout supplies a fallback value when time expires.","explanation":"","image":"images/part-02/java_concurrency__coordination_utilities__completablefuture_timeouts.png","doc":"docs/part-02/java_concurrency__coordination_utilities__completablefuture_timeouts.md"},{"title":"Structured concurrency","quote":"Structured concurrency treats related concurrent tasks as one scoped operation, improving cancellation, error propagation, and lifecycle clarity.","explanation":"","image":"images/part-02/java_concurrency__coordination_utilities__structured_concurrency.png","doc":"docs/part-02/java_concurrency__coordination_utilities__structured_concurrency.md"},{"title":"Virtual threads","quote":"Virtual threads are lightweight JVM-managed threads designed for large numbers of blocking tasks. They simplify synchronous code without removing resource limits.","explanation":"","image":"images/part-02/java_concurrency__coordination_utilities__virtual_threads.png","doc":"docs/part-02/java_concurrency__coordination_utilities__virtual_threads.md"},{"title":"Scoped values","quote":"Scoped values provide immutable context shared within a bounded execution scope, offering a safer alternative to some ThreadLocal use cases.","explanation":"","image":"images/part-02/java_concurrency__coordination_utilities__scoped_values.png","doc":"docs/part-02/java_concurrency__coordination_utilities__scoped_values.md"}]},{"name":"Concurrent Collections","topics":[{"title":"ConcurrentHashMap","quote":"ConcurrentHashMap provides thread-safe high-concurrency map operations with mostly non-blocking reads and no null keys or values.","explanation":"","image":"images/part-02/java_concurrency__concurrent_collections__concurrenthashmap.png","doc":"docs/part-02/java_concurrency__concurrent_collections__concurrenthashmap.md"},{"title":"ConcurrentLinkedQueue","quote":"ConcurrentLinkedQueue is an unbounded lock-free FIFO queue suited to high-concurrency non-blocking access.","explanation":"","image":"images/part-02/java_concurrency__concurrent_collections__concurrentlinkedqueue.png","doc":"docs/part-02/java_concurrency__concurrent_collections__concurrentlinkedqueue.md"},{"title":"ConcurrentLinkedDeque","quote":"ConcurrentLinkedDeque is a lock-free double-ended queue supporting concurrent insertion and removal at both ends.","explanation":"","image":"images/part-02/java_concurrency__concurrent_collections__concurrentlinkeddeque.png","doc":"docs/part-02/java_concurrency__concurrent_collections__concurrentlinkeddeque.md"},{"title":"Producer-consumer pattern","quote":"The producer-consumer pattern separates work creation from processing through a shared queue, balancing rates and isolating responsibilities.","explanation":"","image":"images/part-02/java_concurrency__concurrent_collections__producer_consumer_pattern.png","doc":"docs/part-02/java_concurrency__concurrent_collections__producer_consumer_pattern.md"},{"title":"Backpressure with bounded queues","quote":"A bounded queue limits outstanding work and forces producers to slow down, reject, block, or shed load when consumers fall behind.","explanation":"","image":"images/part-02/java_concurrency__concurrent_collections__backpressure_with_bounded_queues.png","doc":"docs/part-02/java_concurrency__concurrent_collections__backpressure_with_bounded_queues.md"}]}]},{"name":"JVM","groups":[{"name":"Runtime Architecture","topics":[{"title":"JVM architecture","quote":"The JVM contains class loading, runtime memory areas, execution engines, garbage collection, native interfaces, and supporting runtime services.","explanation":"","image":"images/part-02/jvm__runtime_architecture__jvm_architecture.png","doc":"docs/part-02/jvm__runtime_architecture__jvm_architecture.md"},{"title":"Class loading subsystem","quote":"The class loading subsystem locates, loads, links, and initializes classes as they are needed.","explanation":"","image":"images/part-02/jvm__runtime_architecture__class_loading_subsystem.png","doc":"docs/part-02/jvm__runtime_architecture__class_loading_subsystem.md"},{"title":"Bootstrap class loader","quote":"The bootstrap class loader loads core Java classes from the runtime image and is implemented inside the JVM.","explanation":"","image":"images/part-02/jvm__runtime_architecture__bootstrap_class_loader.png","doc":"docs/part-02/jvm__runtime_architecture__bootstrap_class_loader.md"},{"title":"Platform class loader","quote":"The platform class loader loads platform modules and libraries that are not part of the bootstrap class path.","explanation":"","image":"images/part-02/jvm__runtime_architecture__platform_class_loader.png","doc":"docs/part-02/jvm__runtime_architecture__platform_class_loader.md"},{"title":"Application class loader","quote":"The application class loader loads classes from the application\u0027s classpath or module path.","explanation":"","image":"images/part-02/jvm__runtime_architecture__application_class_loader.png","doc":"docs/part-02/jvm__runtime_architecture__application_class_loader.md"},{"title":"Parent delegation model","quote":"Class loaders normally ask their parent to load a class first, preventing duplicate core classes and improving consistency.","explanation":"","image":"images/part-02/jvm__runtime_architecture__parent_delegation_model.png","doc":"docs/part-02/jvm__runtime_architecture__parent_delegation_model.md"},{"title":"Class loading lifecycle","quote":"A class moves through loading, verification, preparation, resolution, initialization, use, and eventual unloading.","explanation":"","image":"images/part-02/jvm__runtime_architecture__class_loading_lifecycle.png","doc":"docs/part-02/jvm__runtime_architecture__class_loading_lifecycle.md"},{"title":"Linking and initialization","quote":"Linking verifies bytecode, allocates static storage, and resolves references. Initialization executes static field initializers and static blocks.","explanation":"","image":"images/part-02/jvm__runtime_architecture__linking_and_initialization.png","doc":"docs/part-02/jvm__runtime_architecture__linking_and_initialization.md"},{"title":"Runtime data areas","quote":"JVM runtime areas include the heap, Java stacks, metaspace, program counters, native stacks, and shared code structures.","explanation":"","image":"images/part-02/jvm__runtime_architecture__runtime_data_areas.png","doc":"docs/part-02/jvm__runtime_architecture__runtime_data_areas.md"},{"title":"Java stacks","quote":"Each thread has a Java stack containing frames for method calls, local variables, operand stacks, and return information.","explanation":"","image":"images/part-02/jvm__runtime_architecture__java_stacks.png","doc":"docs/part-02/jvm__runtime_architecture__java_stacks.md"},{"title":"Heap","quote":"The heap stores objects and arrays shared across threads. Garbage collectors reclaim unreachable objects.","explanation":"","image":"images/part-02/jvm__runtime_architecture__heap.png","doc":"docs/part-02/jvm__runtime_architecture__heap.md"},{"title":"Metaspace","quote":"Metaspace stores class metadata in native memory and replaced PermGen starting with Java 8.","explanation":"","image":"images/part-02/jvm__runtime_architecture__metaspace.png","doc":"docs/part-02/jvm__runtime_architecture__metaspace.md"},{"title":"Program counter","quote":"Each thread has a program counter indicating the current bytecode instruction, except while executing native code.","explanation":"","image":"images/part-02/jvm__runtime_architecture__program_counter.png","doc":"docs/part-02/jvm__runtime_architecture__program_counter.md"},{"title":"Native method stack","quote":"The native method stack supports calls into native code through mechanisms such as JNI.","explanation":"","image":"images/part-02/jvm__runtime_architecture__native_method_stack.png","doc":"docs/part-02/jvm__runtime_architecture__native_method_stack.md"}]},{"name":"Memory Management","topics":[{"title":"Object allocation","quote":"Most objects are allocated quickly by moving a pointer in a thread-local or shared heap region, followed by initialization.","explanation":"","image":"images/part-02/jvm__memory_management__object_allocation.png","doc":"docs/part-02/jvm__memory_management__object_allocation.md"},{"title":"TLAB","quote":"A Thread-Local Allocation Buffer gives each thread a private heap region for fast lock-free object allocation.","explanation":"","image":"images/part-02/jvm__memory_management__tlab.png","doc":"docs/part-02/jvm__memory_management__tlab.md"},{"title":"Escape analysis","quote":"Escape analysis determines whether an object remains within a method or thread, enabling optimizations such as allocation elimination and lock removal.","explanation":"","image":"images/part-02/jvm__memory_management__escape_analysis.png","doc":"docs/part-02/jvm__memory_management__escape_analysis.md"},{"title":"Stack allocation","quote":"The JVM may eliminate heap allocation or keep object data in stack-like storage when escape analysis proves the object does not escape.","explanation":"","image":"images/part-02/jvm__memory_management__stack_allocation.png","doc":"docs/part-02/jvm__memory_management__stack_allocation.md"},{"title":"Object headers","quote":"An object header stores metadata such as identity hash, locking state, age, class pointer, and array length when applicable.","explanation":"","image":"images/part-02/jvm__memory_management__object_headers.png","doc":"docs/part-02/jvm__memory_management__object_headers.md"},{"title":"Compressed ordinary object pointers","quote":"Compressed ordinary object pointers reduce reference size on suitable heaps, lowering memory usage and improving cache efficiency.","explanation":"","image":"images/part-02/jvm__memory_management__compressed_ordinary_object_pointers.png","doc":"docs/part-02/jvm__memory_management__compressed_ordinary_object_pointers.md"},{"title":"String deduplication","quote":"String deduplication lets supported collectors share identical character data between different String objects to reduce memory usage.","explanation":"","image":"images/part-02/jvm__memory_management__string_deduplication.png","doc":"docs/part-02/jvm__memory_management__string_deduplication.md"},{"title":"Off-heap memory","quote":"Off-heap memory lives outside the Java heap and can reduce GC pressure, but lifecycle and safety must be managed explicitly.","explanation":"","image":"images/part-02/jvm__memory_management__off_heap_memory.png","doc":"docs/part-02/jvm__memory_management__off_heap_memory.md"},{"title":"DirectByteBuffer","quote":"DirectByteBuffer stores data in native memory for efficient IO with channels. Allocation and cleanup are costlier than heap buffers.","explanation":"","image":"images/part-02/jvm__memory_management__directbytebuffer.png","doc":"docs/part-02/jvm__memory_management__directbytebuffer.md"},{"title":"Reference types","quote":"Java reference strengths include strong, soft, weak, and phantom references, each with different garbage-collection behavior.","explanation":"","image":"images/part-02/jvm__memory_management__reference_types.png","doc":"docs/part-02/jvm__memory_management__reference_types.md"},{"title":"Weak references","quote":"A weakly referenced object can be collected once no strong or soft references remain. Weak references are useful for canonical maps and metadata.","explanation":"","image":"images/part-02/jvm__memory_management__weak_references.png","doc":"docs/part-02/jvm__memory_management__weak_references.md"},{"title":"Soft references","quote":"Soft references may survive until memory pressure increases. They are not a reliable general-purpose cache policy.","explanation":"","image":"images/part-02/jvm__memory_management__soft_references.png","doc":"docs/part-02/jvm__memory_management__soft_references.md"},{"title":"Phantom references","quote":"Phantom references are enqueued after an object becomes phantom reachable and are used for post-mortem cleanup tracking.","explanation":"","image":"images/part-02/jvm__memory_management__phantom_references.png","doc":"docs/part-02/jvm__memory_management__phantom_references.md"},{"title":"Reference queues","quote":"A ReferenceQueue receives reference objects after the garbage collector determines their referents reached the relevant reachability state.","explanation":"","image":"images/part-02/jvm__memory_management__reference_queues.png","doc":"docs/part-02/jvm__memory_management__reference_queues.md"}]},{"name":"Garbage Collection","topics":[{"title":"Garbage collection roots","quote":"GC roots include active stack references, static fields, JNI references, and JVM-internal structures. Reachable objects are retained.","explanation":"","image":"images/part-02/jvm__garbage_collection__garbage_collection_roots.png","doc":"docs/part-02/jvm__garbage_collection__garbage_collection_roots.md"},{"title":"Mark and sweep","quote":"Mark-and-sweep traces reachable objects, marks them, and reclaims unmarked memory. It may leave fragmentation.","explanation":"","image":"images/part-02/jvm__garbage_collection__mark_and_sweep.png","doc":"docs/part-02/jvm__garbage_collection__mark_and_sweep.md"},{"title":"Copying collectors","quote":"Copying collectors move live objects from one region to another, compacting memory and making allocation fast.","explanation":"","image":"images/part-02/jvm__garbage_collection__copying_collectors.png","doc":"docs/part-02/jvm__garbage_collection__copying_collectors.md"},{"title":"Generational hypothesis","quote":"The generational hypothesis observes that most objects die young, so collectors separate young and old objects for efficiency.","explanation":"","image":"images/part-02/jvm__garbage_collection__generational_hypothesis.png","doc":"docs/part-02/jvm__garbage_collection__generational_hypothesis.md"},{"title":"Minor GC","quote":"Minor GC collects the young generation and is usually frequent and relatively short.","explanation":"","image":"images/part-02/jvm__garbage_collection__minor_gc.png","doc":"docs/part-02/jvm__garbage_collection__minor_gc.md"},{"title":"Major GC","quote":"Major GC primarily targets the old generation. Terminology varies by collector and may not imply a full-heap collection.","explanation":"","image":"images/part-02/jvm__garbage_collection__major_gc.png","doc":"docs/part-02/jvm__garbage_collection__major_gc.md"},{"title":"Full GC","quote":"Full GC typically processes most or all heap regions and often performs compaction. It is usually the most disruptive pause.","explanation":"","image":"images/part-02/jvm__garbage_collection__full_gc.png","doc":"docs/part-02/jvm__garbage_collection__full_gc.md"},{"title":"Serial GC","quote":"Serial GC uses a single garbage-collection thread and suits small heaps or simple applications.","explanation":"","image":"images/part-02/jvm__garbage_collection__serial_gc.png","doc":"docs/part-02/jvm__garbage_collection__serial_gc.md"},{"title":"Parallel GC","quote":"Parallel GC uses multiple threads for stop-the-world collection and prioritizes throughput over pause time.","explanation":"","image":"images/part-02/jvm__garbage_collection__parallel_gc.png","doc":"docs/part-02/jvm__garbage_collection__parallel_gc.md"},{"title":"G1 GC","quote":"G1 divides the heap into regions and incrementally collects those with the most reclaimable space, targeting predictable pauses.","explanation":"","image":"images/part-02/jvm__garbage_collection__g1_gc.png","doc":"docs/part-02/jvm__garbage_collection__g1_gc.md"},{"title":"ZGC","quote":"ZGC is a low-latency collector that performs most work concurrently and supports very large heaps with short pauses.","explanation":"","image":"images/part-02/jvm__garbage_collection__zgc.png","doc":"docs/part-02/jvm__garbage_collection__zgc.md"},{"title":"Shenandoah GC","quote":"Shenandoah is a low-pause collector that performs concurrent evacuation and compaction to reduce pause times.","explanation":"","image":"images/part-02/jvm__garbage_collection__shenandoah_gc.png","doc":"docs/part-02/jvm__garbage_collection__shenandoah_gc.md"},{"title":"GC pauses","quote":"GC pauses are periods when application threads stop so the collector can perform work that requires a consistent heap view. Pause length depends on collector, heap size, live data, and allocation rate.","explanation":"","image":"images/part-02/jvm__garbage_collection__gc_pauses.png","doc":"docs/part-02/jvm__garbage_collection__gc_pauses.md"},{"title":"GC tuning","quote":"GC tuning balances throughput, latency, heap size, and CPU usage. Start with measurements, choose a suitable collector, size the heap sensibly, and change one setting at a time.","explanation":"","image":"images/part-02/jvm__garbage_collection__gc_tuning.png","doc":"docs/part-02/jvm__garbage_collection__gc_tuning.md"},{"title":"GC logs","quote":"GC logs record collection events, pause times, heap occupancy, promotion, and collector phases. They are essential for diagnosing allocation pressure and long pauses.","explanation":"","image":"images/part-02/jvm__garbage_collection__gc_logs.png","doc":"docs/part-02/jvm__garbage_collection__gc_logs.md"},{"title":"Memory leaks in Java","quote":"A Java memory leak occurs when objects are no longer useful but remain strongly reachable. Common causes include caches, listeners, static collections, ThreadLocal misuse, and unclosed resources.","explanation":"","image":"images/part-02/jvm__garbage_collection__memory_leaks_in_java.png","doc":"docs/part-02/jvm__garbage_collection__memory_leaks_in_java.md"},{"title":"OutOfMemoryError types","quote":"OutOfMemoryError can indicate Java heap exhaustion, Metaspace exhaustion, direct-buffer limits, native-thread creation failure, or GC overhead limits.","explanation":"","image":"images/part-02/jvm__garbage_collection__outofmemoryerror_types.png","doc":"docs/part-02/jvm__garbage_collection__outofmemoryerror_types.md"},{"title":"Heap dump analysis","quote":"Heap-dump analysis identifies dominant object types, retained size, reference chains, duplicate data, and GC-root paths that keep unwanted objects alive.","explanation":"","image":"images/part-02/jvm__garbage_collection__heap_dump_analysis.png","doc":"docs/part-02/jvm__garbage_collection__heap_dump_analysis.md"}]},{"name":"JIT and Performance","topics":[{"title":"JIT compilation","quote":"The Just-In-Time compiler converts frequently executed bytecode into optimized native machine code while the application runs.","explanation":"","image":"images/part-02/jvm__jit_and_performance__jit_compilation.png","doc":"docs/part-02/jvm__jit_and_performance__jit_compilation.md"},{"title":"C1 compiler","quote":"The C1 compiler performs fast, lightweight compilation to improve startup and collect profiling data for later optimization.","explanation":"","image":"images/part-02/jvm__jit_and_performance__c1_compiler.png","doc":"docs/part-02/jvm__jit_and_performance__c1_compiler.md"},{"title":"C2 compiler","quote":"The C2 compiler performs aggressive optimizations for hot code, trading longer compilation time for stronger peak performance.","explanation":"","image":"images/part-02/jvm__jit_and_performance__c2_compiler.png","doc":"docs/part-02/jvm__jit_and_performance__c2_compiler.md"},{"title":"Tiered compilation","quote":"Tiered compilation combines interpretation, C1, and C2 so applications warm up quickly while still reaching highly optimized execution.","explanation":"","image":"images/part-02/jvm__jit_and_performance__tiered_compilation.png","doc":"docs/part-02/jvm__jit_and_performance__tiered_compilation.md"},{"title":"Inlining","quote":"Inlining replaces a method call with the called method\u0027s body, removing call overhead and enabling further optimizations.","explanation":"","image":"images/part-02/jvm__jit_and_performance__inlining.png","doc":"docs/part-02/jvm__jit_and_performance__inlining.md"},{"title":"Deoptimization","quote":"Deoptimization discards optimized machine code when assumptions become invalid and returns execution to a less optimized form.","explanation":"","image":"images/part-02/jvm__jit_and_performance__deoptimization.png","doc":"docs/part-02/jvm__jit_and_performance__deoptimization.md"},{"title":"On-stack replacement","quote":"On-stack replacement compiles and replaces a currently running hot loop without waiting for the method invocation to finish.","explanation":"","image":"images/part-02/jvm__jit_and_performance__on_stack_replacement.png","doc":"docs/part-02/jvm__jit_and_performance__on_stack_replacement.md"},{"title":"Hot methods","quote":"Hot methods are methods executed frequently enough for the JVM to prioritize compilation and optimization.","explanation":"","image":"images/part-02/jvm__jit_and_performance__hot_methods.png","doc":"docs/part-02/jvm__jit_and_performance__hot_methods.md"},{"title":"JVM warm-up","quote":"JVM warm-up is the period when classes load, code compiles, profiles accumulate, and caches fill before steady-state performance.","explanation":"","image":"images/part-02/jvm__jit_and_performance__jvm_warm_up.png","doc":"docs/part-02/jvm__jit_and_performance__jvm_warm_up.md"},{"title":"JMH benchmarking","quote":"JMH is the standard Java microbenchmark harness. It handles warm-up, forks, measurement iterations, and many JVM optimization traps.","explanation":"","image":"images/part-02/jvm__jit_and_performance__jmh_benchmarking.png","doc":"docs/part-02/jvm__jit_and_performance__jmh_benchmarking.md"},{"title":"Dead code elimination in benchmarks","quote":"The JIT may remove benchmarked work when its result is unused. JMH Blackhole or observable results prevent misleadingly fast measurements.","explanation":"","image":"images/part-02/jvm__jit_and_performance__dead_code_elimination_in_benchmarks.png","doc":"docs/part-02/jvm__jit_and_performance__dead_code_elimination_in_benchmarks.md"},{"title":"JVM flags","quote":"JVM flags configure memory, collectors, diagnostics, compilation, and runtime behavior. Production flags should be documented, tested, and version-aware.","explanation":"","image":"images/part-02/jvm__jit_and_performance__jvm_flags.png","doc":"docs/part-02/jvm__jit_and_performance__jvm_flags.md"},{"title":"Flight Recorder","quote":"Java Flight Recorder collects low-overhead runtime events such as CPU samples, allocation, locks, GC, IO, and exceptions.","explanation":"","image":"images/part-02/jvm__jit_and_performance__flight_recorder.png","doc":"docs/part-02/jvm__jit_and_performance__flight_recorder.md"},{"title":"Java Mission Control","quote":"Java Mission Control analyzes Flight Recorder data through timelines, event views, automated rules, and profiling dashboards.","explanation":"","image":"images/part-02/jvm__jit_and_performance__java_mission_control.png","doc":"docs/part-02/jvm__jit_and_performance__java_mission_control.md"},{"title":"Async profiler","quote":"Async-profiler is a low-overhead profiler for CPU, allocations, locks, and native stacks. It commonly produces flame graphs.","explanation":"","image":"images/part-02/jvm__jit_and_performance__async_profiler.png","doc":"docs/part-02/jvm__jit_and_performance__async_profiler.md"},{"title":"CPU profiling","quote":"CPU profiling identifies where execution time is spent. Sampling profilers are usually safer for production than heavy instrumentation.","explanation":"","image":"images/part-02/jvm__jit_and_performance__cpu_profiling.png","doc":"docs/part-02/jvm__jit_and_performance__cpu_profiling.md"},{"title":"Allocation profiling","quote":"Allocation profiling shows which code creates objects and at what rate, helping find avoidable churn and GC pressure.","explanation":"","image":"images/part-02/jvm__jit_and_performance__allocation_profiling.png","doc":"docs/part-02/jvm__jit_and_performance__allocation_profiling.md"}]},{"name":"Troubleshooting","topics":[{"title":"Thread dumps","quote":"A thread dump captures all thread stacks and states at one moment. It helps diagnose deadlocks, blocking, high CPU, and thread-pool saturation.","explanation":"","image":"images/part-02/jvm__troubleshooting__thread_dumps.png","doc":"docs/part-02/jvm__troubleshooting__thread_dumps.md"},{"title":"Heap dumps","quote":"A heap dump is a snapshot of live JVM objects and references. It supports retained-memory and leak analysis.","explanation":"","image":"images/part-02/jvm__troubleshooting__heap_dumps.png","doc":"docs/part-02/jvm__troubleshooting__heap_dumps.md"},{"title":"jstack","quote":"jstack prints JVM thread stacks and can expose deadlocks, blocked threads, and current execution locations.","explanation":"","image":"images/part-02/jvm__troubleshooting__jstack.png","doc":"docs/part-02/jvm__troubleshooting__jstack.md"},{"title":"jmap","quote":"jmap can request heap information or dumps on supported JVMs, though jcmd is often preferred for modern diagnostics.","explanation":"","image":"images/part-02/jvm__troubleshooting__jmap.png","doc":"docs/part-02/jvm__troubleshooting__jmap.md"},{"title":"jcmd","quote":"jcmd sends diagnostic commands to a running JVM for thread dumps, heap dumps, GC information, Flight Recorder, and native-memory tracking.","explanation":"","image":"images/part-02/jvm__troubleshooting__jcmd.png","doc":"docs/part-02/jvm__troubleshooting__jcmd.md"},{"title":"jstat","quote":"jstat samples JVM statistics such as heap usage, class loading, and garbage-collection activity over time.","explanation":"","image":"images/part-02/jvm__troubleshooting__jstat.png","doc":"docs/part-02/jvm__troubleshooting__jstat.md"},{"title":"Analyzing deadlocks","quote":"Analyze deadlocks by examining thread dumps for cycles where threads hold one lock while waiting for another. Fix with lock ordering or reduced lock scope.","explanation":"","image":"images/part-02/jvm__troubleshooting__analyzing_deadlocks.png","doc":"docs/part-02/jvm__troubleshooting__analyzing_deadlocks.md"},{"title":"Analyzing high CPU","quote":"For high CPU, identify the busy operating-system thread, map it to the JVM thread, inspect repeated stack traces, and confirm with a profiler.","explanation":"","image":"images/part-02/jvm__troubleshooting__analyzing_high_cpu.png","doc":"docs/part-02/jvm__troubleshooting__analyzing_high_cpu.md"},{"title":"Analyzing memory leaks","quote":"Track heap growth, capture dumps near failure, compare retained objects, and follow GC-root paths to the code retaining unused data.","explanation":"","image":"images/part-02/jvm__troubleshooting__analyzing_memory_leaks.png","doc":"docs/part-02/jvm__troubleshooting__analyzing_memory_leaks.md"},{"title":"Analyzing GC pressure","quote":"High GC pressure usually comes from excessive allocation, undersized heaps, promotion, large live sets, or memory leaks. Correlate logs with allocation profiles.","explanation":"","image":"images/part-02/jvm__troubleshooting__analyzing_gc_pressure.png","doc":"docs/part-02/jvm__troubleshooting__analyzing_gc_pressure.md"},{"title":"Native memory tracking","quote":"Native Memory Tracking reports JVM native-memory categories such as class metadata, threads, code cache, GC structures, and direct allocations.","explanation":"","image":"images/part-02/jvm__troubleshooting__native_memory_tracking.png","doc":"docs/part-02/jvm__troubleshooting__native_memory_tracking.md"},{"title":"Safepoints","quote":"A safepoint is a JVM state where threads can be paused safely for operations such as GC, deoptimization, or certain diagnostics.","explanation":"","image":"images/part-02/jvm__troubleshooting__safepoints.png","doc":"docs/part-02/jvm__troubleshooting__safepoints.md"},{"title":"Container-aware JVM settings","quote":"Modern JVMs detect container CPU and memory limits. Heap percentages, processor count, and native memory still require production validation.","explanation":"","image":"images/part-02/jvm__troubleshooting__container_aware_jvm_settings.png","doc":"docs/part-02/jvm__troubleshooting__container_aware_jvm_settings.md"}]}]},{"name":"Spring AOP","groups":[{"name":"AOP Fundamentals","topics":[{"title":"Join point","quote":"A join point is a point in program execution where aspect behavior could apply. In Spring AOP, it is primarily a method execution.","explanation":"","image":"images/part-02/spring_aop__aop_fundamentals__join_point.png","doc":"docs/part-02/spring_aop__aop_fundamentals__join_point.md"},{"title":"Weaving","quote":"Weaving combines aspect logic with target code. It can happen at compile time, load time, or runtime through proxies.","explanation":"","image":"images/part-02/spring_aop__aop_fundamentals__weaving.png","doc":"docs/part-02/spring_aop__aop_fundamentals__weaving.md"},{"title":"AOP proxy","quote":"An AOP proxy wraps a target object and intercepts eligible method calls to apply advice such as transactions, security, or logging.","explanation":"","image":"images/part-02/spring_aop__aop_fundamentals__aop_proxy.png","doc":"docs/part-02/spring_aop__aop_fundamentals__aop_proxy.md"},{"title":"JDK dynamic proxy","quote":"Spring uses JDK dynamic proxies when the target exposes interfaces. The proxy implements those interfaces.","explanation":"","image":"images/part-02/spring_aop__aop_fundamentals__jdk_dynamic_proxy.png","doc":"docs/part-02/spring_aop__aop_fundamentals__jdk_dynamic_proxy.md"},{"title":"CGLIB proxy","quote":"CGLIB creates a runtime subclass of the target class. Final classes and final methods cannot be advised this way.","explanation":"","image":"images/part-02/spring_aop__aop_fundamentals__cglib_proxy.png","doc":"docs/part-02/spring_aop__aop_fundamentals__cglib_proxy.md"},{"title":"Around advice","quote":"Around advice controls whether and when the target method executes and can modify arguments, results, timing, or exceptions.","explanation":"","image":"images/part-02/spring_aop__aop_fundamentals__around_advice.png","doc":"docs/part-02/spring_aop__aop_fundamentals__around_advice.md"},{"title":"Before advice","quote":"Before advice runs immediately before the target method but cannot directly replace its result.","explanation":"","image":"images/part-02/spring_aop__aop_fundamentals__before_advice.png","doc":"docs/part-02/spring_aop__aop_fundamentals__before_advice.md"},{"title":"After returning advice","quote":"After-returning advice runs only when the target method completes successfully.","explanation":"","image":"images/part-02/spring_aop__aop_fundamentals__after_returning_advice.png","doc":"docs/part-02/spring_aop__aop_fundamentals__after_returning_advice.md"},{"title":"After throwing advice","quote":"After-throwing advice runs when the target method exits with a matching exception.","explanation":"","image":"images/part-02/spring_aop__aop_fundamentals__after_throwing_advice.png","doc":"docs/part-02/spring_aop__aop_fundamentals__after_throwing_advice.md"},{"title":"Self-invocation problem","quote":"A call from one method to another method on the same object bypasses the Spring proxy, so proxy-based advice may not run.","explanation":"","image":"images/part-02/spring_aop__aop_fundamentals__self_invocation_problem.png","doc":"docs/part-02/spring_aop__aop_fundamentals__self_invocation_problem.md"},{"title":"Aspect ordering","quote":"When several aspects apply, ordering controls nesting and execution sequence. Use explicit order only where behavior depends on it.","explanation":"","image":"images/part-02/spring_aop__aop_fundamentals__aspect_ordering.png","doc":"docs/part-02/spring_aop__aop_fundamentals__aspect_ordering.md"},{"title":"Custom annotations with AOP","quote":"A custom annotation can mark methods or classes for an aspect pointcut, creating reusable declarative behavior.","explanation":"","image":"images/part-02/spring_aop__aop_fundamentals__custom_annotations_with_aop.png","doc":"docs/part-02/spring_aop__aop_fundamentals__custom_annotations_with_aop.md"}]}]},{"name":"Spring Boot","groups":[{"name":"Boot Fundamentals","topics":[{"title":"Spring Boot auto-configuration","quote":"Spring Boot auto-configuration creates sensible beans based on the classpath, existing beans, properties, and application type.","explanation":"","image":"images/part-02/spring_boot__boot_fundamentals__spring_boot_auto_configuration.png","doc":"docs/part-02/spring_boot__boot_fundamentals__spring_boot_auto_configuration.md"},{"title":"Starter dependencies","quote":"Starters are curated dependency groups for a capability, such as web, data JPA, security, or testing.","explanation":"","image":"images/part-02/spring_boot__boot_fundamentals__starter_dependencies.png","doc":"docs/part-02/spring_boot__boot_fundamentals__starter_dependencies.md"},{"title":"Embedded servers","quote":"Spring Boot can package web applications with embedded servers such as Tomcat, Jetty, or Undertow, removing the need for external deployment.","explanation":"","image":"images/part-02/spring_boot__boot_fundamentals__embedded_servers.png","doc":"docs/part-02/spring_boot__boot_fundamentals__embedded_servers.md"},{"title":"SpringApplication","quote":"SpringApplication bootstraps a Spring Boot application by preparing the environment, creating the context, and running startup callbacks.","explanation":"","image":"images/part-02/spring_boot__boot_fundamentals__springapplication.png","doc":"docs/part-02/spring_boot__boot_fundamentals__springapplication.md"},{"title":"Application runners","quote":"ApplicationRunner and CommandLineRunner execute code after the application context is ready.","explanation":"","image":"images/part-02/spring_boot__boot_fundamentals__application_runners.png","doc":"docs/part-02/spring_boot__boot_fundamentals__application_runners.md"},{"title":"CommandLineRunner","quote":"CommandLineRunner receives raw command-line arguments as a String array and runs after startup.","explanation":"","image":"images/part-02/spring_boot__boot_fundamentals__commandlinerunner.png","doc":"docs/part-02/spring_boot__boot_fundamentals__commandlinerunner.md"},{"title":"Auto-configuration report","quote":"The auto-configuration report explains which configurations matched or did not match and why. It is useful for diagnosing Boot behavior.","explanation":"","image":"images/part-02/spring_boot__boot_fundamentals__auto_configuration_report.png","doc":"docs/part-02/spring_boot__boot_fundamentals__auto_configuration_report.md"},{"title":"Spring Boot configuration precedence","quote":"Spring Boot resolves configuration from ordered property sources, with higher-precedence sources overriding lower ones.","explanation":"","image":"images/part-02/spring_boot__boot_fundamentals__spring_boot_configuration_precedence.png","doc":"docs/part-02/spring_boot__boot_fundamentals__spring_boot_configuration_precedence.md"},{"title":"Custom starter","quote":"A custom starter packages reusable dependencies, auto-configuration, metadata, and defaults for organization-specific capabilities.","explanation":"","image":"images/part-02/spring_boot__boot_fundamentals__custom_starter.png","doc":"docs/part-02/spring_boot__boot_fundamentals__custom_starter.md"},{"title":"Spring Boot banner","quote":"The Spring Boot banner is the startup text displayed before the application context initializes. It can be customized or disabled.","explanation":"","image":"images/part-02/spring_boot__boot_fundamentals__spring_boot_banner.png","doc":"docs/part-02/spring_boot__boot_fundamentals__spring_boot_banner.md"},{"title":"DevTools","quote":"Spring Boot DevTools improves local development with automatic restart, LiveReload support, and development-friendly defaults.","explanation":"","image":"images/part-02/spring_boot__boot_fundamentals__devtools.png","doc":"docs/part-02/spring_boot__boot_fundamentals__devtools.md"}]},{"name":"Configuration and Operations","topics":[{"title":"application.properties","quote":"application.properties stores flat key-value configuration using dotted names.","explanation":"","image":"images/part-02/spring_boot__configuration_and_operations__application_properties.png","doc":"docs/part-02/spring_boot__configuration_and_operations__application_properties.md"},{"title":"application.yml","quote":"application.yml stores hierarchical configuration in YAML. It is compact but sensitive to indentation.","explanation":"","image":"images/part-02/spring_boot__configuration_and_operations__application_yml.png","doc":"docs/part-02/spring_boot__configuration_and_operations__application_yml.md"},{"title":"Profile-specific configuration","quote":"Files such as application-prod.yml add or override configuration when a matching profile is active.","explanation":"","image":"images/part-02/spring_boot__configuration_and_operations__profile_specific_configuration.png","doc":"docs/part-02/spring_boot__configuration_and_operations__profile_specific_configuration.md"},{"title":"ConfigurationProperties validation","quote":"ConfigurationProperties classes can use Jakarta Bean Validation so invalid or missing configuration fails fast during startup.","explanation":"","image":"images/part-02/spring_boot__configuration_and_operations__configurationproperties_validation.png","doc":"docs/part-02/spring_boot__configuration_and_operations__configurationproperties_validation.md"},{"title":"Actuator","quote":"Spring Boot Actuator exposes production-oriented endpoints for health, metrics, environment, mappings, loggers, and diagnostics.","explanation":"","image":"images/part-02/spring_boot__configuration_and_operations__actuator.png","doc":"docs/part-02/spring_boot__configuration_and_operations__actuator.md"},{"title":"Health indicators","quote":"HealthIndicator components report the status of dependencies and contribute to the application\u0027s health endpoint.","explanation":"","image":"images/part-02/spring_boot__configuration_and_operations__health_indicators.png","doc":"docs/part-02/spring_boot__configuration_and_operations__health_indicators.md"},{"title":"Metrics endpoints","quote":"Actuator metrics expose measurements through Micrometer, including JVM, HTTP, datasource, cache, and custom application metrics.","explanation":"","image":"images/part-02/spring_boot__configuration_and_operations__metrics_endpoints.png","doc":"docs/part-02/spring_boot__configuration_and_operations__metrics_endpoints.md"},{"title":"Custom actuator endpoints","quote":"Custom Actuator endpoints expose controlled management operations using endpoint annotations. They should be secured and narrowly scoped.","explanation":"","image":"images/part-02/spring_boot__configuration_and_operations__custom_actuator_endpoints.png","doc":"docs/part-02/spring_boot__configuration_and_operations__custom_actuator_endpoints.md"},{"title":"Graceful shutdown","quote":"Graceful shutdown stops accepting new work, lets in-flight requests finish within a timeout, closes resources, and then terminates cleanly.","explanation":"","image":"images/part-02/spring_boot__configuration_and_operations__graceful_shutdown.png","doc":"docs/part-02/spring_boot__configuration_and_operations__graceful_shutdown.md"},{"title":"Startup probes","quote":"A startup probe checks whether an application has completed initialization. Until it succeeds, liveness failures should not restart a slow-starting service.","explanation":"","image":"images/part-02/spring_boot__configuration_and_operations__startup_probes.png","doc":"docs/part-02/spring_boot__configuration_and_operations__startup_probes.md"},{"title":"Liveness probes","quote":"A liveness probe answers whether the process is still functioning. Failure should trigger restart, so it must not depend on optional external systems.","explanation":"","image":"images/part-02/spring_boot__configuration_and_operations__liveness_probes.png","doc":"docs/part-02/spring_boot__configuration_and_operations__liveness_probes.md"},{"title":"Readiness probes","quote":"A readiness probe answers whether the application can currently serve traffic. Failure removes the instance from load balancing without necessarily restarting it.","explanation":"","image":"images/part-02/spring_boot__configuration_and_operations__readiness_probes.png","doc":"docs/part-02/spring_boot__configuration_and_operations__readiness_probes.md"}]}]},{"name":"Spring MVC","groups":[{"name":"Web Fundamentals","topics":[{"title":"HandlerMapping","quote":"HandlerMapping selects the controller method or handler that should process an incoming Spring MVC request.","explanation":"","image":"images/part-02/spring_mvc__web_fundamentals__handlermapping.png","doc":"docs/part-02/spring_mvc__web_fundamentals__handlermapping.md"},{"title":"HandlerAdapter","quote":"HandlerAdapter invokes the selected handler using the correct calling strategy and converts its result into the MVC processing flow.","explanation":"","image":"images/part-02/spring_mvc__web_fundamentals__handleradapter.png","doc":"docs/part-02/spring_mvc__web_fundamentals__handleradapter.md"},{"title":"ViewResolver","quote":"ViewResolver maps a logical view name to a concrete rendering technology such as Thymeleaf, JSP, or another view implementation.","explanation":"","image":"images/part-02/spring_mvc__web_fundamentals__viewresolver.png","doc":"docs/part-02/spring_mvc__web_fundamentals__viewresolver.md"},{"title":"Controller","quote":"@Controller marks a Spring MVC component that handles web requests and may return logical view names.","explanation":"","image":"images/part-02/spring_mvc__web_fundamentals__controller.png","doc":"docs/part-02/spring_mvc__web_fundamentals__controller.md"},{"title":"RestController","quote":"@RestController combines @Controller and @ResponseBody so method return values are written directly to the HTTP response body.","explanation":"","image":"images/part-02/spring_mvc__web_fundamentals__restcontroller.png","doc":"docs/part-02/spring_mvc__web_fundamentals__restcontroller.md"},{"title":"RequestMapping","quote":"@RequestMapping maps HTTP paths, methods, headers, parameters, and media types to controller methods or classes.","explanation":"","image":"images/part-02/spring_mvc__web_fundamentals__requestmapping.png","doc":"docs/part-02/spring_mvc__web_fundamentals__requestmapping.md"},{"title":"GetMapping","quote":"@GetMapping is a specialized shortcut for handling HTTP GET requests.","explanation":"","image":"images/part-02/spring_mvc__web_fundamentals__getmapping.png","doc":"docs/part-02/spring_mvc__web_fundamentals__getmapping.md"},{"title":"PostMapping","quote":"@PostMapping is a specialized shortcut for handling HTTP POST requests.","explanation":"","image":"images/part-02/spring_mvc__web_fundamentals__postmapping.png","doc":"docs/part-02/spring_mvc__web_fundamentals__postmapping.md"},{"title":"PathVariable","quote":"@PathVariable binds a value from the URI path, such as /orders/{id}, to a controller method parameter.","explanation":"","image":"images/part-02/spring_mvc__web_fundamentals__pathvariable.png","doc":"docs/part-02/spring_mvc__web_fundamentals__pathvariable.md"},{"title":"RequestParam","quote":"@RequestParam binds a query parameter or form value to a controller method parameter.","explanation":"","image":"images/part-02/spring_mvc__web_fundamentals__requestparam.png","doc":"docs/part-02/spring_mvc__web_fundamentals__requestparam.md"},{"title":"RequestBody","quote":"@RequestBody asks Spring to deserialize the HTTP request body into a Java object through an HTTP message converter.","explanation":"","image":"images/part-02/spring_mvc__web_fundamentals__requestbody.png","doc":"docs/part-02/spring_mvc__web_fundamentals__requestbody.md"},{"title":"ResponseEntity","quote":"ResponseEntity gives explicit control over the response body, status code, and headers.","explanation":"","image":"images/part-02/spring_mvc__web_fundamentals__responseentity.png","doc":"docs/part-02/spring_mvc__web_fundamentals__responseentity.md"},{"title":"Content negotiation","quote":"Content negotiation selects the response representation, such as JSON or XML, based on request headers and server capabilities.","explanation":"","image":"images/part-02/spring_mvc__web_fundamentals__content_negotiation.png","doc":"docs/part-02/spring_mvc__web_fundamentals__content_negotiation.md"},{"title":"HTTP message converters","quote":"HTTP message converters serialize controller return values and deserialize request bodies for media types such as JSON, XML, text, and binary data.","explanation":"","image":"images/part-02/spring_mvc__web_fundamentals__http_message_converters.png","doc":"docs/part-02/spring_mvc__web_fundamentals__http_message_converters.md"},{"title":"Data binding","quote":"Data binding maps request values into Java object properties. It should be constrained carefully to avoid unintended field updates.","explanation":"","image":"images/part-02/spring_mvc__web_fundamentals__data_binding.png","doc":"docs/part-02/spring_mvc__web_fundamentals__data_binding.md"}]},{"name":"Validation and Errors","topics":[{"title":"Bean Validation","quote":"Bean Validation uses annotations such as @NotNull, @Size, and @Pattern to declare reusable validation rules on Java objects.","explanation":"","image":"images/part-02/spring_mvc__validation_and_errors__bean_validation.png","doc":"docs/part-02/spring_mvc__validation_and_errors__bean_validation.md"},{"title":"Valid annotation","quote":"@Valid triggers validation and cascades into nested objects marked for validation.","explanation":"","image":"images/part-02/spring_mvc__validation_and_errors__valid_annotation.png","doc":"docs/part-02/spring_mvc__validation_and_errors__valid_annotation.md"},{"title":"Validated annotation","quote":"@Validated is Spring\u0027s variant that supports validation groups and method-level validation.","explanation":"","image":"images/part-02/spring_mvc__validation_and_errors__validated_annotation.png","doc":"docs/part-02/spring_mvc__validation_and_errors__validated_annotation.md"},{"title":"Custom validators","quote":"A custom validator combines a constraint annotation with a ConstraintValidator implementation for domain-specific validation rules.","explanation":"","image":"images/part-02/spring_mvc__validation_and_errors__custom_validators.png","doc":"docs/part-02/spring_mvc__validation_and_errors__custom_validators.md"},{"title":"ControllerAdvice","quote":"@ControllerAdvice applies shared exception handling, binding, and model configuration across controllers.","explanation":"","image":"images/part-02/spring_mvc__validation_and_errors__controlleradvice.png","doc":"docs/part-02/spring_mvc__validation_and_errors__controlleradvice.md"},{"title":"ExceptionHandler","quote":"@ExceptionHandler maps specified exceptions to a controller or global handler method.","explanation":"","image":"images/part-02/spring_mvc__validation_and_errors__exceptionhandler.png","doc":"docs/part-02/spring_mvc__validation_and_errors__exceptionhandler.md"},{"title":"Problem Details","quote":"Problem Details is a standard HTTP error format containing fields such as type, title, status, detail, and instance.","explanation":"","image":"images/part-02/spring_mvc__validation_and_errors__problem_details.png","doc":"docs/part-02/spring_mvc__validation_and_errors__problem_details.md"},{"title":"Validation error response design","quote":"A useful validation response includes a stable error code, field name, human-readable message, rejected context when safe, and correlation information.","explanation":"","image":"images/part-02/spring_mvc__validation_and_errors__validation_error_response_design.png","doc":"docs/part-02/spring_mvc__validation_and_errors__validation_error_response_design.md"},{"title":"Global error handling","quote":"Global error handling centralizes exception translation, logging, HTTP status mapping, and consistent response formatting.","explanation":"","image":"images/part-02/spring_mvc__validation_and_errors__global_error_handling.png","doc":"docs/part-02/spring_mvc__validation_and_errors__global_error_handling.md"},{"title":"ErrorController","quote":"ErrorController handles Spring Boot\u0027s fallback error path when no more specific exception handler produces a response.","explanation":"","image":"images/part-02/spring_mvc__validation_and_errors__errorcontroller.png","doc":"docs/part-02/spring_mvc__validation_and_errors__errorcontroller.md"}]},{"name":"Advanced Web","topics":[{"title":"Servlet filters","quote":"Servlet filters run before and after the servlet and can inspect or modify requests and responses. They are suitable for cross-cutting HTTP concerns.","explanation":"","image":"images/part-02/spring_mvc__advanced_web__servlet_filters.png","doc":"docs/part-02/spring_mvc__advanced_web__servlet_filters.md"},{"title":"Handler interceptors","quote":"Handler interceptors run around controller invocation and can inspect handler metadata. They are useful for authorization checks, timing, and request context.","explanation":"","image":"images/part-02/spring_mvc__advanced_web__handler_interceptors.png","doc":"docs/part-02/spring_mvc__advanced_web__handler_interceptors.md"},{"title":"CORS","quote":"Cross-Origin Resource Sharing controls whether browser code from one origin may access resources on another origin.","explanation":"","image":"images/part-02/spring_mvc__advanced_web__cors.png","doc":"docs/part-02/spring_mvc__advanced_web__cors.md"},{"title":"Multipart uploads","quote":"Multipart requests carry files and form fields in separate body parts. Applications should enforce size, type, storage, and security limits.","explanation":"","image":"images/part-02/spring_mvc__advanced_web__multipart_uploads.png","doc":"docs/part-02/spring_mvc__advanced_web__multipart_uploads.md"},{"title":"Streaming responses","quote":"Streaming responses write data incrementally instead of building the entire body in memory, which helps with large downloads or generated content.","explanation":"","image":"images/part-02/spring_mvc__advanced_web__streaming_responses.png","doc":"docs/part-02/spring_mvc__advanced_web__streaming_responses.md"},{"title":"Server-sent events","quote":"Server-sent events provide a one-way HTTP stream from server to browser using the text/event-stream format.","explanation":"","image":"images/part-02/spring_mvc__advanced_web__server_sent_events.png","doc":"docs/part-02/spring_mvc__advanced_web__server_sent_events.md"},{"title":"Async request processing","quote":"Async request processing releases the servlet thread while work continues and resumes response handling when the result becomes available.","explanation":"","image":"images/part-02/spring_mvc__advanced_web__async_request_processing.png","doc":"docs/part-02/spring_mvc__advanced_web__async_request_processing.md"},{"title":"WebMvcConfigurer","quote":"WebMvcConfigurer customizes Spring MVC behavior such as formatters, CORS, interceptors, resource handling, and message converters.","explanation":"","image":"images/part-02/spring_mvc__advanced_web__webmvcconfigurer.png","doc":"docs/part-02/spring_mvc__advanced_web__webmvcconfigurer.md"},{"title":"Static resources","quote":"Spring MVC can serve static files such as CSS, JavaScript, and images from configured classpath or filesystem locations.","explanation":"","image":"images/part-02/spring_mvc__advanced_web__static_resources.png","doc":"docs/part-02/spring_mvc__advanced_web__static_resources.md"},{"title":"Locale resolution","quote":"Locale resolution determines the user\u0027s locale from headers, cookies, sessions, or custom rules for internationalized messages.","explanation":"","image":"images/part-02/spring_mvc__advanced_web__locale_resolution.png","doc":"docs/part-02/spring_mvc__advanced_web__locale_resolution.md"}]}]},{"name":"Spring WebFlux","groups":[{"name":"Reactive Web","topics":[{"title":"Reactive programming","quote":"Reactive programming models asynchronous data flows with non-blocking execution, composition, and backpressure.","explanation":"","image":"images/part-02/spring_webflux__reactive_web__reactive_programming.png","doc":"docs/part-02/spring_webflux__reactive_web__reactive_programming.md"},{"title":"Mono","quote":"Mono represents an asynchronous sequence containing zero or one element, followed by completion or error.","explanation":"","image":"images/part-02/spring_webflux__reactive_web__mono.png","doc":"docs/part-02/spring_webflux__reactive_web__mono.md"},{"title":"Flux","quote":"Flux represents an asynchronous sequence containing zero to many elements, followed by completion or error.","explanation":"","image":"images/part-02/spring_webflux__reactive_web__flux.png","doc":"docs/part-02/spring_webflux__reactive_web__flux.md"},{"title":"Reactive streams","quote":"Reactive Streams defines Publisher, Subscriber, Subscription, and Processor contracts for asynchronous streams with non-blocking backpressure.","explanation":"","image":"images/part-02/spring_webflux__reactive_web__reactive_streams.png","doc":"docs/part-02/spring_webflux__reactive_web__reactive_streams.md"},{"title":"Backpressure","quote":"Backpressure lets a consumer control how much data a producer sends, preventing unbounded buffering and overload.","explanation":"","image":"images/part-02/spring_webflux__reactive_web__backpressure.png","doc":"docs/part-02/spring_webflux__reactive_web__backpressure.md"},{"title":"WebClient","quote":"WebClient is Spring\u0027s non-blocking HTTP client with reactive request, response, streaming, and filter support.","explanation":"","image":"images/part-02/spring_webflux__reactive_web__webclient.png","doc":"docs/part-02/spring_webflux__reactive_web__webclient.md"},{"title":"Reactive controllers","quote":"Reactive controllers return Mono, Flux, or other reactive types so request processing can remain non-blocking.","explanation":"","image":"images/part-02/spring_webflux__reactive_web__reactive_controllers.png","doc":"docs/part-02/spring_webflux__reactive_web__reactive_controllers.md"},{"title":"Functional endpoints","quote":"Functional endpoints define routing and handling through RouterFunction and HandlerFunction instead of annotation-based controllers.","explanation":"","image":"images/part-02/spring_webflux__reactive_web__functional_endpoints.png","doc":"docs/part-02/spring_webflux__reactive_web__functional_endpoints.md"},{"title":"Reactor operators","quote":"Reactor operators transform, combine, filter, retry, buffer, and observe Mono and Flux pipelines.","explanation":"","image":"images/part-02/spring_webflux__reactive_web__reactor_operators.png","doc":"docs/part-02/spring_webflux__reactive_web__reactor_operators.md"},{"title":"Schedulers","quote":"Reactor Schedulers control where reactive work executes. Choosing the wrong scheduler can cause blocking, starvation, or unnecessary context switching.","explanation":"","image":"images/part-02/spring_webflux__reactive_web__schedulers.png","doc":"docs/part-02/spring_webflux__reactive_web__schedulers.md"},{"title":"Blocking detection","quote":"Blocking detection identifies calls that occupy non-blocking event-loop threads. Tools such as BlockHound can expose accidental blocking.","explanation":"","image":"images/part-02/spring_webflux__reactive_web__blocking_detection.png","doc":"docs/part-02/spring_webflux__reactive_web__blocking_detection.md"},{"title":"Context propagation","quote":"Reactive context propagation carries request-scoped metadata such as correlation IDs across asynchronous boundaries without ThreadLocal assumptions.","explanation":"","image":"images/part-02/spring_webflux__reactive_web__context_propagation.png","doc":"docs/part-02/spring_webflux__reactive_web__context_propagation.md"},{"title":"R2DBC","quote":"R2DBC provides reactive, non-blocking access to relational databases through drivers designed for asynchronous execution.","explanation":"","image":"images/part-02/spring_webflux__reactive_web__r2dbc.png","doc":"docs/part-02/spring_webflux__reactive_web__r2dbc.md"}]}]},{"name":"Spring Security","groups":[{"name":"Security Fundamentals","topics":[{"title":"SecurityFilterChain","quote":"SecurityFilterChain defines which Spring Security filters apply to matching requests and how authentication and authorization are configured.","explanation":"","image":"images/part-02/spring_security__security_fundamentals__securityfilterchain.png","doc":"docs/part-02/spring_security__security_fundamentals__securityfilterchain.md"},{"title":"PasswordEncoder","quote":"PasswordEncoder hashes and verifies passwords using adaptive algorithms such as BCrypt, PBKDF2, scrypt, or Argon2.","explanation":"","image":"images/part-02/spring_security__security_fundamentals__passwordencoder.png","doc":"docs/part-02/spring_security__security_fundamentals__passwordencoder.md"},{"title":"UserDetailsService","quote":"UserDetailsService loads user identity, password hash, status, and authorities for username-based authentication.","explanation":"","image":"images/part-02/spring_security__security_fundamentals__userdetailsservice.png","doc":"docs/part-02/spring_security__security_fundamentals__userdetailsservice.md"},{"title":"AuthenticationProvider","quote":"AuthenticationProvider performs a specific authentication strategy and returns a fully authenticated token when successful.","explanation":"","image":"images/part-02/spring_security__security_fundamentals__authenticationprovider.png","doc":"docs/part-02/spring_security__security_fundamentals__authenticationprovider.md"},{"title":"SecurityContext","quote":"SecurityContext stores the current Authentication for the request or execution context.","explanation":"","image":"images/part-02/spring_security__security_fundamentals__securitycontext.png","doc":"docs/part-02/spring_security__security_fundamentals__securitycontext.md"},{"title":"Anonymous authentication","quote":"Anonymous authentication gives unauthenticated requests a consistent Authentication object with an anonymous identity.","explanation":"","image":"images/part-02/spring_security__security_fundamentals__anonymous_authentication.png","doc":"docs/part-02/spring_security__security_fundamentals__anonymous_authentication.md"},{"title":"Method security","quote":"Method security protects service methods using annotations such as @PreAuthorize, @PostAuthorize, and @Secured.","explanation":"","image":"images/part-02/spring_security__security_fundamentals__method_security.png","doc":"docs/part-02/spring_security__security_fundamentals__method_security.md"},{"title":"Role vs authority","quote":"An authority is a granted permission string. A role is a conventionally prefixed authority, often beginning with ROLE_.","explanation":"","image":"images/part-02/spring_security__security_fundamentals__role_vs_authority.png","doc":"docs/part-02/spring_security__security_fundamentals__role_vs_authority.md"}]},{"name":"Web Security","topics":[{"title":"CSRF","quote":"Cross-Site Request Forgery tricks a browser into sending an authenticated state-changing request. CSRF tokens protect cookie-based sessions.","explanation":"","image":"images/part-02/spring_security__web_security__csrf.png","doc":"docs/part-02/spring_security__web_security__csrf.md"},{"title":"CORS security","quote":"CORS should allow only trusted origins, methods, and headers. It is a browser policy and does not replace server-side authorization.","explanation":"","image":"images/part-02/spring_security__web_security__cors_security.png","doc":"docs/part-02/spring_security__web_security__cors_security.md"},{"title":"Session management","quote":"Session management controls creation, fixation protection, concurrency limits, timeout, and invalidation of authenticated sessions.","explanation":"","image":"images/part-02/spring_security__web_security__session_management.png","doc":"docs/part-02/spring_security__web_security__session_management.md"},{"title":"Remember-me authentication","quote":"Remember-me authentication restores a user identity from a persistent token after the normal session expires. Tokens must be protected and revocable.","explanation":"","image":"images/part-02/spring_security__web_security__remember_me_authentication.png","doc":"docs/part-02/spring_security__web_security__remember_me_authentication.md"},{"title":"Form login","quote":"Form login authenticates browser users through an HTML login form and usually establishes an HTTP session.","explanation":"","image":"images/part-02/spring_security__web_security__form_login.png","doc":"docs/part-02/spring_security__web_security__form_login.md"},{"title":"HTTP Basic","quote":"HTTP Basic sends Base64-encoded credentials on every request and must always be protected by TLS.","explanation":"","image":"images/part-02/spring_security__web_security__http_basic.png","doc":"docs/part-02/spring_security__web_security__http_basic.md"},{"title":"Logout handling","quote":"Logout should clear the security context, invalidate the session, remove relevant cookies, and optionally revoke tokens.","explanation":"","image":"images/part-02/spring_security__web_security__logout_handling.png","doc":"docs/part-02/spring_security__web_security__logout_handling.md"},{"title":"Security headers","quote":"Security headers reduce browser attacks through controls such as Content-Security-Policy, HSTS, X-Content-Type-Options, and frame restrictions.","explanation":"","image":"images/part-02/spring_security__web_security__security_headers.png","doc":"docs/part-02/spring_security__web_security__security_headers.md"},{"title":"RequestMatcher","quote":"RequestMatcher decides whether a request matches a security rule based on path, method, headers, or custom logic.","explanation":"","image":"images/part-02/spring_security__web_security__requestmatcher.png","doc":"docs/part-02/spring_security__web_security__requestmatcher.md"},{"title":"ExceptionTranslationFilter","quote":"ExceptionTranslationFilter converts authentication and authorization exceptions into login entry points or access-denied responses.","explanation":"","image":"images/part-02/spring_security__web_security__exceptiontranslationfilter.png","doc":"docs/part-02/spring_security__web_security__exceptiontranslationfilter.md"}]},{"name":"Token Security","topics":[{"title":"JWT authentication","quote":"JWT authentication validates a signed token, extracts claims, and builds an authenticated security context without server-side session lookup.","explanation":"","image":"images/part-02/spring_security__token_security__jwt_authentication.png","doc":"docs/part-02/spring_security__token_security__jwt_authentication.md"},{"title":"JWT filter","quote":"A JWT filter reads the token, validates signature and expiry, loads or derives authorities, and populates the SecurityContext.","explanation":"","image":"images/part-02/spring_security__token_security__jwt_filter.png","doc":"docs/part-02/spring_security__token_security__jwt_filter.md"},{"title":"Access tokens","quote":"An access token is a short-lived credential presented to APIs to authorize requests within a defined scope.","explanation":"","image":"images/part-02/spring_security__token_security__access_tokens.png","doc":"docs/part-02/spring_security__token_security__access_tokens.md"},{"title":"Refresh tokens","quote":"A refresh token is a longer-lived credential used to obtain new access tokens without asking the user to authenticate again.","expla
