nd policy. Kubelet then starts the assigned workload.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__kubernetes_scheduling.png","doc":"docs/part-01/containers_and_orchestration__original_outline__kubernetes_scheduling.md"},{"title":"Kubernetes Pods and Deployments","quote":"A Pod is the smallest deployable unit, while a Deployment manages replicated Pods and rolling updates. Applications usually create Deployments rather than standalone Pods.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__kubernetes_pods_and_deployments.png","doc":"docs/part-01/containers_and_orchestration__original_outline__kubernetes_pods_and_deployments.md"},{"title":"What is a Pod?","quote":"A Pod groups one or more tightly coupled containers that share networking, storage volumes, and lifecycle. Containers inside a Pod communicate through localhost.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__what_is_a_pod.png","doc":"docs/part-01/containers_and_orchestration__original_outline__what_is_a_pod.md"},{"title":"Pod Lifecycle","quote":"A Pod moves through phases such as Pending, Running, Succeeded, Failed, or Unknown. Readiness, liveness, and startup probes describe container health separately.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__pod_lifecycle.png","doc":"docs/part-01/containers_and_orchestration__original_outline__pod_lifecycle.md"},{"title":"Deploying Pods in Kubernetes","quote":"Pods are deployed from YAML or API objects, but production workloads normally use controllers such as Deployments, Jobs, StatefulSets, or DaemonSets.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__deploying_pods_in_kubernetes.png","doc":"docs/part-01/containers_and_orchestration__original_outline__deploying_pods_in_kubernetes.md"},{"title":"Managing Deployments","quote":"Deployments manage replica count, Pod templates, revisions, rollouts, and rollback. Updating the Pod template creates a new ReplicaSet and controlled replacement.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__managing_deployments.png","doc":"docs/part-01/containers_and_orchestration__original_outline__managing_deployments.md"},{"title":"Scaling Pods","quote":"Pods can be scaled manually or automatically. Horizontal Pod Autoscaler adjusts replica count from metrics, while cluster autoscaling adds or removes nodes.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__scaling_pods.png","doc":"docs/part-01/containers_and_orchestration__original_outline__scaling_pods.md"},{"title":"Rolling Updates in Kubernetes","quote":"A rolling update gradually replaces old Pods with new ones while preserving availability. Strategy settings control surge capacity and unavailable replicas.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__rolling_updates_in_kubernetes.png","doc":"docs/part-01/containers_and_orchestration__original_outline__rolling_updates_in_kubernetes.md"},{"title":"Helm for Kubernetes","quote":"Helm packages Kubernetes manifests into reusable, configurable charts. It simplifies installation, upgrades, rollback, and versioned application releases.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__helm_for_kubernetes.png","doc":"docs/part-01/containers_and_orchestration__original_outline__helm_for_kubernetes.md"},{"title":"What is Helm?","quote":"Helm is a package manager for Kubernetes. It renders templates with values and stores release history so deployments can be upgraded or rolled back.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__what_is_helm.png","doc":"docs/part-01/containers_and_orchestration__original_outline__what_is_helm.md"},{"title":"Helm Architecture","quote":"Modern Helm uses a client that renders charts and communicates directly with the Kubernetes API. Release metadata is stored inside the cluster.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__helm_architecture.png","doc":"docs/part-01/containers_and_orchestration__original_outline__helm_architecture.md"},{"title":"Helm Charts","quote":"A Helm chart is a versioned package containing templates, default values, metadata, and optional dependencies for a Kubernetes application.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__helm_charts.png","doc":"docs/part-01/containers_and_orchestration__original_outline__helm_charts.md"},{"title":"Installing and Using Helm","quote":"Helm installs a chart as a named release. Values can be overridden from files or command-line settings to customize the rendered Kubernetes resources.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__installing_and_using_helm.png","doc":"docs/part-01/containers_and_orchestration__original_outline__installing_and_using_helm.md"},{"title":"Helm Release Management","quote":"Helm tracks each installed release and its revisions. Commands support listing, upgrading, rolling back, testing, and uninstalling releases.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__helm_release_management.png","doc":"docs/part-01/containers_and_orchestration__original_outline__helm_release_management.md"},{"title":"Deploying Applications with Helm","quote":"A Helm deployment renders chart templates with environment-specific values and applies the resulting resources. Safe usage requires reviewing output and managing secrets carefully.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__deploying_applications_with_helm.png","doc":"docs/part-01/containers_and_orchestration__original_outline__deploying_applications_with_helm.md"},{"title":"Container Orchestration","quote":"Container orchestration coordinates container placement, scaling, networking, recovery, configuration, and rollout across multiple machines.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__container_orchestration.png","doc":"docs/part-01/containers_and_orchestration__original_outline__container_orchestration.md"},{"title":"What is Container Orchestration?","quote":"Container orchestration is the automated management of containerized workloads in a cluster. It keeps actual runtime state aligned with declared desired state.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__what_is_container_orchestration.png","doc":"docs/part-01/containers_and_orchestration__original_outline__what_is_container_orchestration.md"},{"title":"Why Use Container Orchestration?","quote":"Orchestration is needed when applications span many containers and hosts. It handles scheduling, failover, service discovery, scaling, and controlled deployments.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__why_use_container_orchestration.png","doc":"docs/part-01/containers_and_orchestration__original_outline__why_use_container_orchestration.md"},{"title":"Benefits of Container Orchestration","quote":"Benefits include self-healing, efficient placement, automated scaling, declarative deployment, service discovery, and repeatable operations.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__benefits_of_container_orchestration.png","doc":"docs/part-01/containers_and_orchestration__original_outline__benefits_of_container_orchestration.md"},{"title":"Kubernetes as a Container Orchestrator","quote":"Kubernetes uses declarative APIs and controllers to manage containers at scale. Its ecosystem supports networking, storage, security, observability, and deployment automation.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__kubernetes_as_a_container_orchestrator.png","doc":"docs/part-01/containers_and_orchestration__original_outline__kubernetes_as_a_container_orchestrator.md"},{"title":"Docker Swarm vs Kubernetes","quote":"Docker Swarm is simpler and tightly integrated with Docker, while Kubernetes offers broader capabilities and ecosystem support. Kubernetes has a steeper operational learning curve.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__docker_swarm_vs_kubernetes.png","doc":"docs/part-01/containers_and_orchestration__original_outline__docker_swarm_vs_kubernetes.md"},{"title":"Container Orchestration Challenges","quote":"Challenges include cluster complexity, networking, storage, security, observability, upgrades, capacity planning, and debugging failures across layers.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__container_orchestration_challenges.png","doc":"docs/part-01/containers_and_orchestration__original_outline__container_orchestration_challenges.md"}]}]},{"name":"DevOps Practices","groups":[{"name":"Original outline","topics":[{"title":"Introduction to DevOps","quote":"DevOps combines culture, practices, and automation to shorten delivery cycles while improving reliability. It connects development, operations, security, and feedback.","explanation":"","image":"images/part-01/devops_practices__original_outline__introduction_to_devops.png","doc":"docs/part-01/devops_practices__original_outline__introduction_to_devops.md"},{"title":"What is DevOps?","quote":"DevOps is a collaborative operating model where teams jointly own software from design through production. Automation and fast feedback enable frequent, safer changes.","explanation":"","image":"images/part-01/devops_practices__original_outline__what_is_devops.png","doc":"docs/part-01/devops_practices__original_outline__what_is_devops.md"},{"title":"DevOps Culture and Principles","quote":"DevOps values shared ownership, small changes, automation, observability, continuous learning, and reducing handoffs. Culture matters more than any individual tool.","explanation":"","image":"images/part-01/devops_practices__original_outline__devops_culture_and_principles.png","doc":"docs/part-01/devops_practices__original_outline__devops_culture_and_principles.md"},{"title":"DevOps Lifecycle","quote":"The DevOps lifecycle includes planning, coding, building, testing, releasing, deploying, operating, monitoring, and feeding production learning back into development.","explanation":"","image":"images/part-01/devops_practices__original_outline__devops_lifecycle.png","doc":"docs/part-01/devops_practices__original_outline__devops_lifecycle.md"},{"title":"DevOps Tools Ecosystem","quote":"DevOps tools support source control, build, testing, artifact management, infrastructure automation, containers, deployment, monitoring, and collaboration.","explanation":"","image":"images/part-01/devops_practices__original_outline__devops_tools_ecosystem.png","doc":"docs/part-01/devops_practices__original_outline__devops_tools_ecosystem.md"},{"title":"CI/CD Pipelines","quote":"CI/CD pipelines automate the journey from source change to tested and deployable software. They enforce repeatable checks and reduce manual release risk.","explanation":"","image":"images/part-01/devops_practices__original_outline__ci_cd_pipelines.png","doc":"docs/part-01/devops_practices__original_outline__ci_cd_pipelines.md"},{"title":"What are CI/CD Pipelines?","quote":"A CI/CD pipeline is a sequence of automated stages that build, test, validate, package, and deploy software. Failures stop promotion until corrected.","explanation":"","image":"images/part-01/devops_practices__original_outline__what_are_ci_cd_pipelines.png","doc":"docs/part-01/devops_practices__original_outline__what_are_ci_cd_pipelines.md"},{"title":"Continuous Integration (CI)","quote":"Continuous Integration means developers merge small changes frequently and validate them with automated builds and tests. It exposes integration problems early.","explanation":"","image":"images/part-01/devops_practices__original_outline__continuous_integration_ci.png","doc":"docs/part-01/devops_practices__original_outline__continuous_integration_ci.md"},{"title":"Continuous Delivery (CD)","quote":"Continuous Delivery keeps software in a releasable state through automated validation and deployment preparation. Production release may still require a deliberate approval.","explanation":"","image":"images/part-01/devops_practices__original_outline__continuous_delivery_cd.png","doc":"docs/part-01/devops_practices__original_outline__continuous_delivery_cd.md"},{"title":"CI/CD Tools and Platforms","quote":"CI/CD tools automate source integration, builds, tests, artifact creation, approvals, and deployment. Common choices include Jenkins, GitHub Actions, GitLab CI, Azure DevOps, CircleCI, and AWS CodePipeline.","explanation":"","image":"images/part-01/devops_practices__original_outline__ci_cd_tools_and_platforms.png","doc":"docs/part-01/devops_practices__original_outline__ci_cd_tools_and_platforms.md"},{"title":"Setting Up CI/CD Pipelines","quote":"A CI/CD pipeline should define clear stages for checkout, build, test, security checks, packaging, and deployment. Keep it version-controlled, repeatable, fast, and fail early on meaningful errors.","explanation":"","image":"images/part-01/devops_practices__original_outline__setting_up_ci_cd_pipelines.png","doc":"docs/part-01/devops_practices__original_outline__setting_up_ci_cd_pipelines.md"},{"title":"Jenkins for Automation","quote":"Jenkins automates software delivery tasks through jobs, pipelines, plugins, and distributed agents. It is flexible and mature, but requires active maintenance, security hardening, and plugin governance.","explanation":"","image":"images/part-01/devops_practices__original_outline__jenkins_for_automation.png","doc":"docs/part-01/devops_practices__original_outline__jenkins_for_automation.md"},{"title":"What is Jenkins?","quote":"Jenkins is an open-source automation server used to build, test, and deploy software. It turns delivery steps into repeatable jobs or pipelines triggered by code changes or schedules.","explanation":"","image":"images/part-01/devops_practices__original_outline__what_is_jenkins.png","doc":"docs/part-01/devops_practices__original_outline__what_is_jenkins.md"},{"title":"Jenkins Architecture","quote":"Jenkins uses a controller to manage jobs, configuration, and scheduling, while agents execute build workloads. Separating execution from the controller improves scalability and isolation.","explanation":"","image":"images/part-01/devops_practices__original_outline__jenkins_architecture.png","doc":"docs/part-01/devops_practices__original_outline__jenkins_architecture.md"},{"title":"Setting Up Jenkins","quote":"A production Jenkins setup needs secure installation, authentication, role-based access, agents, credential management, backup, plugin control, and pipeline-as-code.","explanation":"","image":"images/part-01/devops_practices__original_outline__setting_up_jenkins.png","doc":"docs/part-01/devops_practices__original_outline__setting_up_jenkins.md"},{"title":"Jenkins Pipelines","quote":"A Jenkins Pipeline defines delivery stages as code, usually in a Jenkinsfile. Declarative pipelines are simpler, while scripted pipelines offer more flexibility.","explanation":"","image":"images/part-01/devops_practices__original_outline__jenkins_pipelines.png","doc":"docs/part-01/devops_practices__original_outline__jenkins_pipelines.md"},{"title":"Integrating Jenkins with CI/CD","quote":"Jenkins integrates with source control, build tools, test frameworks, artifact repositories, containers, cloud platforms, and deployment systems to automate an end-to-end delivery flow.","explanation":"","image":"images/part-01/devops_practices__original_outline__integrating_jenkins_with_ci_cd.png","doc":"docs/part-01/devops_practices__original_outline__integrating_jenkins_with_ci_cd.md"},{"title":"Infrastructure as Code (IaC)","quote":"Infrastructure as Code manages infrastructure through versioned definitions instead of manual console changes. It makes environments repeatable, reviewable, testable, and automatable.","explanation":"","image":"images/part-01/devops_practices__original_outline__infrastructure_as_code_iac.png","doc":"docs/part-01/devops_practices__original_outline__infrastructure_as_code_iac.md"},{"title":"What is Infrastructure as Code?","quote":"IaC is the practice of defining networks, servers, permissions, databases, and other infrastructure in code. Tools apply those definitions to create or update real environments.","explanation":"","image":"images/part-01/devops_practices__original_outline__what_is_infrastructure_as_code.png","doc":"docs/part-01/devops_practices__original_outline__what_is_infrastructure_as_code.md"},{"title":"IaC Benefits","quote":"IaC improves consistency, speed, auditability, disaster recovery, and collaboration. It also reduces configuration drift and enables repeatable environment creation.","explanation":"","image":"images/part-01/devops_practices__original_outline__iac_benefits.png","doc":"docs/part-01/devops_practices__original_outline__iac_benefits.md"},{"title":"Popular IaC Tools","quote":"Popular IaC tools include Terraform, AWS CloudFormation, Pulumi, Azure Bicep, Ansible, and Crossplane. They differ in language, state management, and target platforms.","explanation":"","image":"images/part-01/devops_practices__original_outline__popular_iac_tools.png","doc":"docs/part-01/devops_practices__original_outline__popular_iac_tools.md"},{"title":"Writing Infrastructure Code","quote":"Good infrastructure code is modular, parameterized, idempotent, environment-aware, and reviewed like application code. Avoid duplication and hidden manual prerequisites.","explanation":"","image":"images/part-01/devops_practices__original_outline__writing_infrastructure_code.png","doc":"docs/part-01/devops_practices__original_outline__writing_infrastructure_code.md"},{"title":"Version Control for IaC","quote":"IaC should be stored in version control so every change is reviewable, traceable, and reversible. Pull requests, automated plans, and protected branches reduce infrastructure risk.","explanation":"","image":"images/part-01/devops_practices__original_outline__version_control_for_iac.png","doc":"docs/part-01/devops_practices__original_outline__version_control_for_iac.md"},{"title":"Monitoring and Logging","quote":"Monitoring tracks system health through metrics and alerts, while logging records detailed events and context. Together they support detection, diagnosis, and operational learning.","explanation":"","image":"images/part-01/devops_practices__original_outline__monitoring_and_logging.png","doc":"docs/part-01/devops_practices__original_outline__monitoring_and_logging.md"},{"title":"What is Monitoring in DevOps?","quote":"Monitoring continuously observes applications and infrastructure using metrics, health checks, traces, and alerts. Its purpose is to detect user-impacting problems early.","explanation":"","image":"images/part-01/devops_practices__original_outline__what_is_monitoring_in_devops.png","doc":"docs/part-01/devops_practices__original_outline__what_is_monitoring_in_devops.md"},{"title":"Logging Best Practices","quote":"Use structured logs with timestamps, severity, correlation IDs, and meaningful context. Avoid secrets, reduce noise, centralize retention, and make logs searchable.","explanation":"","image":"images/part-01/devops_practices__original_outline__logging_best_practices.png","doc":"docs/part-01/devops_practices__original_outline__logging_best_practices.md"},{"title":"Monitoring Tools and Platforms","quote":"Monitoring platforms include Prometheus, Grafana, Datadog, New Relic, CloudWatch, and Azure Monitor. The best choice depends on telemetry sources and operational needs.","explanation":"","image":"images/part-01/devops_practices__original_outline__monitoring_tools_and_platforms.png","doc":"docs/part-01/devops_practices__original_outline__monitoring_tools_and_platforms.md"},{"title":"Logging Tools","quote":"Common logging tools include Elasticsearch, Logstash, Kibana, Fluent Bit, Fluentd, Loki, Splunk, and cloud-native log services.","explanation":"","image":"images/part-01/devops_practices__original_outline__logging_tools.png","doc":"docs/part-01/devops_practices__original_outline__logging_tools.md"},{"title":"Centralized Logging and Monitoring","quote":"Centralization brings logs and metrics from many services into shared systems. It enables cross-service search, dashboards, alerting, and faster incident investigation.","explanation":"","image":"images/part-01/devops_practices__original_outline__centralized_logging_and_monitoring.png","doc":"docs/part-01/devops_practices__original_outline__centralized_logging_and_monitoring.md"},{"title":"Ansible for Configuration Management","quote":"Ansible automates server configuration and application setup using agentless SSH or WinRM connections. It describes desired changes in readable YAML playbooks.","explanation":"","image":"images/part-01/devops_practices__original_outline__ansible_for_configuration_management.png","doc":"docs/part-01/devops_practices__original_outline__ansible_for_configuration_management.md"},{"title":"What is Ansible?","quote":"Ansible is an automation tool for configuration management, provisioning, deployment, and orchestration. It is agentless and typically controls remote systems from a central node.","explanation":"","image":"images/part-01/devops_practices__original_outline__what_is_ansible.png","doc":"docs/part-01/devops_practices__original_outline__what_is_ansible.md"},{"title":"Ansible Architecture","quote":"Ansible uses a control node, inventory, modules, playbooks, roles, and plugins. Tasks execute remotely and are designed to be idempotent.","explanation":"","image":"images/part-01/devops_practices__original_outline__ansible_architecture.png","doc":"docs/part-01/devops_practices__original_outline__ansible_architecture.md"},{"title":"Setting Up Ansible","quote":"Setup involves installing Ansible on a control node, defining inventory, configuring secure connectivity, and validating access before running playbooks.","explanation":"","image":"images/part-01/devops_practices__original_outline__setting_up_ansible.png","doc":"docs/part-01/devops_practices__original_outline__setting_up_ansible.md"},{"title":"Ansible Playbooks and Roles","quote":"Playbooks describe ordered tasks for hosts, while roles organize reusable tasks, variables, templates, and handlers into a standard structure.","explanation":"","image":"images/part-01/devops_practices__original_outline__ansible_playbooks_and_roles.png","doc":"docs/part-01/devops_practices__original_outline__ansible_playbooks_and_roles.md"},{"title":"Automating Infrastructure with Ansible","quote":"Ansible can install packages, configure services, deploy files, manage users, and orchestrate infrastructure changes. Repeatability depends on idempotent tasks and controlled variables.","explanation":"","image":"images/part-01/devops_practices__original_outline__automating_infrastructure_with_ansible.png","doc":"docs/part-01/devops_practices__original_outline__automating_infrastructure_with_ansible.md"},{"title":"Docker in DevOps","quote":"Docker supports DevOps by packaging applications consistently across development, testing, and deployment. It reduces environment differences and simplifies CI/CD artifact handling.","explanation":"","image":"images/part-01/devops_practices__original_outline__docker_in_devops.png","doc":"docs/part-01/devops_practices__original_outline__docker_in_devops.md"},{"title":"What is Docker in DevOps?","quote":"In DevOps, Docker provides a portable build and runtime unit. The same image can move through pipeline stages and environments with fewer configuration differences.","explanation":"","image":"images/part-01/devops_practices__original_outline__what_is_docker_in_devops.png","doc":"docs/part-01/devops_practices__original_outline__what_is_docker_in_devops.md"},{"title":"Docker Containers in CI/CD","quote":"CI/CD pipelines use containers to isolate build tools, run tests, package applications, and publish immutable images. This improves reproducibility and cleanup.","explanation":"","image":"images/part-01/devops_practices__original_outline__docker_containers_in_ci_cd.png","doc":"docs/part-01/devops_practices__original_outline__docker_containers_in_ci_cd.md"},{"title":"Docker for Development and Production","quote":"Docker provides consistent local environments and deployable production images. Production usage still requires secure images, resource limits, health checks, and orchestration.","explanation":"","image":"images/part-01/devops_practices__original_outline__docker_for_development_and_production.png","doc":"docs/part-01/devops_practices__original_outline__docker_for_development_and_production.md"},{"title":"Dockerizing Applications","quote":"Dockerizing means creating an image that contains the application and required runtime dependencies. A good image is small, secure, deterministic, and configurable at runtime.","explanation":"","image":"images/part-01/devops_practices__original_outline__dockerizing_applications.png","doc":"docs/part-01/devops_practices__original_outline__dockerizing_applications.md"},{"title":"Docker Compose in DevOps","quote":"Compose is useful for local integration environments, test stacks, and simple automation involving multiple services. It is not a replacement for full production orchestration.","explanation":"","image":"images/part-01/devops_practices__original_outline__docker_compose_in_devops.png","doc":"docs/part-01/devops_practices__original_outline__docker_compose_in_devops.md"},{"title":"Automated Testing","quote":"Automated testing uses executable checks to verify software behavior repeatedly. It reduces regression risk and enables rapid feedback in delivery pipelines.","explanation":"","image":"images/part-01/devops_practices__original_outline__automated_testing.png","doc":"docs/part-01/devops_practices__original_outline__automated_testing.md"},{"title":"What is Automated Testing?","quote":"Automated testing is the practice of running test cases through tools instead of manual execution. It is most valuable when tests are reliable, fast, and maintainable.","explanation":"","image":"images/part-01/devops_practices__original_outline__what_is_automated_testing.png","doc":"docs/part-01/devops_practices__original_outline__what_is_automated_testing.md"},{"title":"Types of Automated Testing","quote":"Common automated tests include unit, integration, component, contract, API, UI, performance, security, and end-to-end tests. Each covers a different risk boundary.","explanation":"","image":"images/part-01/devops_practices__original_outline__types_of_automated_testing.png","doc":"docs/part-01/devops_practices__original_outline__types_of_automated_testing.md"},{"title":"Automated Testing Frameworks","quote":"Frameworks such as JUnit, Mockito, Testcontainers, Selenium, Cypress, Playwright, and REST Assured provide structure and tooling for automated tests.","explanation":"","image":"images/part-01/devops_practices__original_outline__automated_testing_frameworks.png","doc":"docs/part-01/devops_practices__original_outline__automated_testing_frameworks.md"},{"title":"Integrating Automated Tests in CI/CD","quote":"Tests should run at suitable pipeline stages, with fast checks early and slower tests later. Failed critical tests must block promotion.","explanation":"","image":"images/part-01/devops_practices__original_outline__integrating_automated_tests_in_ci_cd.png","doc":"docs/part-01/devops_practices__original_outline__integrating_automated_tests_in_ci_cd.md"},{"title":"Test-Driven Development (TDD) in DevOps","quote":"TDD writes a failing test before implementation, then makes it pass and refactors. It supports DevOps by producing fast feedback and safer continuous change.","explanation":"","image":"images/part-01/devops_practices__original_outline__test_driven_development_tdd_in_devops.png","doc":"docs/part-01/devops_practices__original_outline__test_driven_development_tdd_in_devops.md"}]}]},{"name":"Relational Databases","groups":[{"name":"Original outline","topics":[{"title":"What are Relational Databases?","quote":"Relational databases store data in tables linked by keys and queried with SQL. They are strong when structured schemas, transactions, and relationships matter.","explanation":"","image":"images/part-01/relational_databases__original_outline__what_are_relational_databases.png","doc":"docs/part-01/relational_databases__original_outline__what_are_relational_databases.md"},{"title":"Key Features of Relational Databases","quote":"Key features include tables, schemas, constraints, joins, indexes, transactions, and declarative SQL. These support integrity and complex queries.","explanation":"","image":"images/part-01/relational_databases__original_outline__key_features_of_relational_databases.png","doc":"docs/part-01/relational_databases__original_outline__key_features_of_relational_databases.md"},{"title":"ACID Properties in Relational Databases","quote":"ACID means Atomicity, Consistency, Isolation, and Durability. Together they ensure transactions behave reliably even during concurrency or failure.","explanation":"","image":"images/part-01/relational_databases__original_outline__acid_properties_in_relational_databases.png","doc":"docs/part-01/relational_databases__original_outline__acid_properties_in_relational_databases.md"},{"title":"Relational Database Management Systems (RDBMS)","quote":"An RDBMS is software that stores and manages relational data, enforces constraints, executes SQL, and provides transaction and recovery mechanisms.","explanation":"","image":"images/part-01/relational_databases__original_outline__relational_database_management_systems_rdbms.png","doc":"docs/part-01/relational_databases__original_outline__relational_database_management_systems_rdbms.md"},{"title":"Popular Relational Databases","quote":"Popular relational databases include PostgreSQL, MySQL, Oracle Database, SQL Server, MariaDB, and cloud-native engines such as Aurora.","explanation":"","image":"images/part-01/relational_databases__original_outline__popular_relational_databases.png","doc":"docs/part-01/relational_databases__original_outline__popular_relational_databases.md"},{"title":"Normalization and Denormalization","quote":"Normalization reduces duplication and update anomalies by splitting data into related tables. Denormalization intentionally duplicates or combines data to improve read performance.","explanation":"","image":"images/part-01/relational_databases__original_outline__normalization_and_denormalization.png","doc":"docs/part-01/relational_databases__original_outline__normalization_and_denormalization.md"},{"title":"Schema Design in Relational Databases","quote":"Good schema design models entities, relationships, constraints, indexes, and expected access patterns. It balances integrity, clarity, and query performance.","explanation":"","image":"images/part-01/relational_databases__original_outline__schema_design_in_relational_databases.png","doc":"docs/part-01/relational_databases__original_outline__schema_design_in_relational_databases.md"}]}]},{"name":"SQL vs NoSQL","groups":[{"name":"Original outline","topics":[{"title":"What is SQL?","quote":"SQL is the language used to define, query, modify, and control relational data. It supports selection, joins, aggregation, transactions, and schema operations.","explanation":"","image":"images/part-01/sql_vs_nosql__original_outline__what_is_sql.png","doc":"docs/part-01/sql_vs_nosql__original_outline__what_is_sql.md"},{"title":"What is NoSQL?","quote":"NoSQL describes non-relational databases optimized for flexible schemas, horizontal scaling, or specialized access patterns such as key-value, document, graph, or column-family.","explanation":"","image":"images/part-01/sql_vs_nosql__original_outline__what_is_nosql.png","doc":"docs/part-01/sql_vs_nosql__original_outline__what_is_nosql.md"},{"title":"Key Differences Between SQL and NoSQL","quote":"SQL databases emphasize relational models, schemas, joins, and transactions. NoSQL systems often prioritize scale, flexible structures, and access-pattern-specific models.","explanation":"","image":"images/part-01/sql_vs_nosql__original_outline__key_differences_between_sql_and_nosql.png","doc":"docs/part-01/sql_vs_nosql__original_outline__key_differences_between_sql_and_nosql.md"},{"title":"When to Use SQL vs NoSQL","quote":"Use SQL for strong relationships, transactions, and complex queries. Use NoSQL when access patterns are simple, scale is extreme, or flexible data models are central.","explanation":"","image":"images/part-01/sql_vs_nosql__original_outline__when_to_use_sql_vs_nosql.png","doc":"docs/part-01/sql_vs_nosql__original_outline__when_to_use_sql_vs_nosql.md"},{"title":"Advantages and Disadvantages of SQL","quote":"SQL offers mature transactions, constraints, joins, and tooling. Its challenges include rigid schemas and scaling some workloads horizontally.","explanation":"","image":"images/part-01/sql_vs_nosql__original_outline__advantages_and_disadvantages_of_sql.png","doc":"docs/part-01/sql_vs_nosql__original_outline__advantages_and_disadvantages_of_sql.md"},{"title":"Advantages and Disadvantages of NoSQL","quote":"NoSQL can scale horizontally and model data flexibly, but may sacrifice joins, strong consistency, standard querying, or operational simplicity.","explanation":"","image":"images/part-01/sql_vs_nosql__original_outline__advantages_and_disadvantages_of_nosql.png","doc":"docs/part-01/sql_vs_nosql__original_outline__advantages_and_disadvantages_of_nosql.md"}]}]},{"name":"NoSQL Databases","groups":[{"name":"Original outline","topics":[{"title":"Introduction to NoSQL Databases","quote":"NoSQL databases use data models other than traditional relational tables. They are usually designed around specific access patterns and distributed scale.","explanation":"","image":"images/part-01/nosql_databases__original_outline__introduction_to_nosql_databases.png","doc":"docs/part-01/nosql_databases__original_outline__introduction_to_nosql_databases.md"},{"title":"Types of NoSQL Databases","quote":"Major NoSQL categories are document, key-value, column-family, and graph databases. Each optimizes a different style of data access.","explanation":"","image":"images/part-01/nosql_databases__original_outline__types_of_nosql_databases.png","doc":"docs/part-01/nosql_databases__original_outline__types_of_nosql_databases.md"},{"title":"Document-based NoSQL Databases","quote":"Document databases store self-contained JSON-like records. They suit flexible domain objects and queries over document fields.","explanation":"","image":"images/part-01/nosql_databases__original_outline__document_based_nosql_databases.png","doc":"docs/part-01/nosql_databases__original_outline__document_based_nosql_databases.md"},{"title":"Key-Value Stores","quote":"Key-value stores retrieve values using unique keys. They are simple, fast, and useful for caching, sessions, counters, and lookup-heavy workloads.","explanation":"","image":"images/part-01/nosql_databases__original_outline__key_value_stores.png","doc":"docs/part-01/nosql_databases__original_outline__key_value_stores.md"},{"title":"Column-family Stores","quote":"Column-family databases organize sparse data by row keys and column groups. They support large distributed workloads with predictable access patterns.","explanation":"","image":"images/part-01/nosql_databases__original_outline__column_family_stores.png","doc":"docs/part-01/nosql_databases__original_outline__column_family_stores.md"},{"title":"Graph Databases","quote":"Graph databases model entities as nodes and relationships as edges. They excel at traversals such as recommendations, fraud networks, and social connections.","explanation":"","image":"images/part-01/nosql_databases__original_outline__graph_databases.png","doc":"docs/part-01/nosql_databases__original_outline__graph_databases.md"},{"title":"Popular NoSQL Databases","quote":"Popular NoSQL systems include MongoDB, DynamoDB, Cassandra, Redis, Couchbase, Neo4j, and HBase.","explanation":"","image":"images/part-01/nosql_databases__original_outline__popular_nosql_databases.png","doc":"docs/part-01/nosql_databases__original_outline__popular_nosql_databases.md"},{"title":"CAP Theorem in NoSQL","quote":"CAP states that during a network partition, a distributed system must choose between consistent responses and always-available responses. Partition tolerance is unavoidable in distributed systems.","explanation":"","image":"images/part-01/nosql_databases__original_outline__cap_theorem_in_nosql.png","doc":"docs/part-01/nosql_databases__original_outline__cap_theorem_in_nosql.md"},{"title":"Consistency vs Availability vs Partition Tolerance","quote":"Consistency returns the same latest value to clients, availability returns a response, and partition tolerance continues despite network splits. Trade-offs appear most clearly during partitions.","explanation":"","image":"images/part-01/nosql_databases__original_outline__consistency_vs_availability_vs_partition_tolerance.png","doc":"docs/part-01/nosql_databases__original_outline__consistency_vs_availability_vs_partition_tolerance.md"}]}]},{"name":"Database Design","groups":[{"name":"Original outline","topics":[{"title":"Principles of Database Design","quote":"Database design should reflect business rules, data integrity, access patterns, lifecycle, scale, and security. Model first, then optimize with evidence.","explanation":"","image":"images/part-01/database_design__original_outline__principles_of_database_design.png","doc":"docs/part-01/database_design__original_outline__principles_of_database_design.md"},{"title":"Entity-Relationship (ER) Modeling","quote":"ER modeling represents entities, attributes, and relationships before physical schema creation. It helps clarify business structure and cardinality.","explanation":"","image":"images/part-01/database_design__original_outline__entity_relationship_er_modeling.png","doc":"docs/part-01/database_design__original_outline__entity_relationship_er_modeling.md"},{"title":"Normalization Process","quote":"Normalization progressively restructures tables to reduce redundancy and dependency anomalies. Common stages are first, second, and third normal form.","explanation":"","image":"images/part-01/database_design__original_outline__normalization_process.png","doc":"docs/part-01/database_design__original_outline__normalization_process.md"},{"title":"Denormalization and Its Use Cases","quote":"Denormalization duplicates or pre-joins data to speed reads. It is useful for analytics and high-read systems but increases write and consistency complexity.","explanation":"","image":"images/part-01/database_design__original_outline__denormalization_and_its_use_cases.png","doc":"docs/part-01/database_design__original_outline__denormalization_and_its_use_cases.md"},{"title":"Database Constraints","quote":"Constraints enforce valid data at the database boundary. Examples include primary keys, foreign keys, unique constraints, checks, and not-null rules.","explanation":"","image":"images/part-01/database_design__original_outline__database_constraints.png","doc":"docs/part-01/database_design__original_outline__database_constraints.md"},{"title":"Primary Key","quote":"A primary key uniquely identifies each row and cannot be null. It should be stable and efficient for references and indexes.","explanation":"","image":"images/part-01/database_design__original_outline__primary_key.png","doc":"docs/part-01/database_design__original_outline__primary_key.md"},{"title":"Foreign Key","quote":"A foreign key requires values to reference an existing row in another table. It protects referential integrity between related entities.","explanation":"","image":"images/part-01/database_design__original_outline__foreign_key.png","doc":"docs/part-01/database_design__original_outline__foreign_key.md"},{"title":"Unique Key","quote":"A unique constraint prevents duplicate values in one or more columns. Unlike a primary key, a table may have multiple unique constraints.","explanation":"","image":"images/part-01/database_design__original_outline__unique_key.png","doc":"docs/part-01/database_design__original_outline__unique_key.md"},{"title":"Check and Not Null Constraints","quote":"NOT NULL requires a value, while CHECK validates a condition such as a range or status set. Both prevent invalid data from entering the table.","explanation":"","image":"images/part-01/database_design__original_outline__check_and_not_null_constraints.png","doc":"docs/part-01/database_design__original_outline__check_and_not_null_constraints.md"},{"title":"Indexes in Database Design","quote":"Indexes accelerate lookups and sorting by maintaining additional data structures. They improve reads but consume storage and add write overhead.","explanation":"","image":"images/part-01/database_design__original_outline__indexes_in_database_design.png","doc":"docs/part-01/database_design__original_outline__indexes_in_database_design.md"},{"title":"Handling Relationships in Databases","quote":"Relationships are modeled using keys and junction tables. The design should reflect one-to-one, one-to-many, or many-to-many cardinality accurately.","explanation":"","image":"images/part-01/database_design__original_outline__handling_relationships_in_databases.png","doc":"docs/part-01/database_design__original_outline__handling_relationships_in_databases.md"},{"title":"One-to-One","quote":"A one-to-one relationship means one row corresponds to at most one row in another table. It is often enforced with a unique foreign key.","explanation":"","image":"images/part-01/database_design__original_outline__one_to_one.png","doc":"docs/part-01/database_design__original_outline__one_to_one.md"},{"title":"One-to-Many","quote":"A one-to-many relationship stores the foreign key on the many side. It is the most common relational pattern.","explanation":"","image":"images/part-01/database_design__original_outline__one_to_many.png","doc":"docs/part-01/database_design__original_outline__one_to_many.md"},{"title":"Many-to-Many","quote":"A many-to-many relationship uses a junction table containing foreign keys to both entities. The junction may also store relationship attributes.","explanation":"","image":"images/part-01/database_design__original_outline__many_to_many.png","doc":"docs/part-01/database_design__original_outline__many_to_many.md"}]}]},{"name":"Indexing and Query Optimization","groups":[{"name":"Original outline","topics":[{"title":"What is Indexing in Databases?","quote":"Indexing creates auxiliary structures that help the database locate rows without scanning every record. Effective indexes follow real query patterns.","explanation":"","image":"images/part-01/indexing_and_query_optimization__original_outline__what_is_indexing_in_databases.png","doc":"docs/part-01/indexing_and_query_optimization__original_outline__what_is_indexing_in_databases.md"},{"title":"Types of Indexes","quote":"Common index types include B-tree, hash, bitmap, full-text, spatial, composite, clustered, and covering indexes.","explanation":"","image":"images/part-01/indexing_and_query_optimization__original_outline__types_of_indexes.png","doc":"docs/part-01/indexing_and_query_optimization__original_outline__types_of_indexes.md"},{"title":"B-tree Indexes","quote":"B-tree indexes keep ordered keys and support equality, range, prefix, and sorting operations. They are the default index type in many databases.","explanation":"","image":"images/part-01/indexing_and_query_optimization__original_outline__b_tree_indexes.png","doc":"docs/part-01/indexing_and_query_optimization__original_outline__b_tree_indexes.md"},{"title":"Hash Indexes","quote":"Hash indexes map keys to locations and are efficient for exact equality lookups. They generally do not support range searches or ordering.","explanation":"","image":"images/part-01/indexing_and_query_optimization__original_outline__hash_indexes.png","doc":"docs/part-01/indexing_and_query_optimization__original_outline__hash_indexes.md"},{"title":"Bitmap Indexes","quote":"Bitmap indexes represent values with bit arrays and work well for low-cardinality analytical columns. They are less suitable for heavy concurrent updates.","explanation":"","image":"images/part-01/indexing_and_query_optimization__original_outline__bitmap_indexes.png","doc":"docs/part-01/indexing_and_query_optimization__original_outline__bitmap_indexes.md"},{"title":"Full-Text Indexes","quote":"Full-text indexes tokenize and rank natural-language content for word and phrase searches. They provide more than simple LIKE matching.","explanation":"","image":"images/part-01/indexing_and_query_optimization__original_outline__full_text_indexes.png","doc":"docs/part-01/indexing_and_query_optimization__original_outline__full_text_indexes.md"},{"title":"Query Optimization Techniques","quote":"Query optimization includes selecting proper indexes, reducing scanned data, avoiding unnecessary joins, using selective predicates, and examining execution plans.","explanation":"","image":"images/part-01/indexing_and_query_optimization__original_outline__query_optimization_techniques.png","doc":"docs/part-01/indexing_and_query_optimization__original_outline__query_optimization_techniques.md"},{"title":"Using Indexes for Query Optimization","quote":"Indexes help when they match filtering, joining, or ordering columns. Poorly chosen indexes may be ignored or make writes slower.","explanation":"","image":"images/part-01/indexing_and_query_optimization__original_outline__using_indexes_for_query_optimization.png","doc":"docs/part-01/indexing_and_query_optimization__original_outline__using_indexes_for_query_optimization.md"},{"title":"Query Execution Plan","quote":"An execution plan shows how the database intends to run a query, including scans, joins, sorts, and estimated costs. It is the primary tool for diagnosing SQL performance.","explanation":"","image":"images/part-01/indexing_and_query_optimization__original_outline__query_execution_plan.png","doc":"docs/part-01/indexing_and_query_optimization__original_outline__query_execution_plan.md"},{"title":"Avoiding Full Table Scans","quote":"Full scans can be reduced with selective predicates, suitable indexes, partition pruning, and avoiding functions that hide indexed columns. A full scan is not always bad for small or broad queries.","explanation":"","image":"images/part-01/indexing_and_query_optimization__original_outline__avoiding_full_table_scans.png","doc":"docs/part-01/indexing_and_query_optimization__original_outline__avoiding_full_table_scans.md"},{"title":"Joins and Their Impact on Query Performance","quote":"Joins can be efficient when keys are indexed and result sets are selective. Poor join order, large intermediate results, or mismatched data types can be expensive.","explanation":"","image":"images/part-01/indexing_and_query_optimization__original_outline__joins_and_their_impact_on_query_performance.png","doc":"docs/part-01/indexing_and_query_optimization__original_outline__joins_and_their_impact_on_query_performance.md"},{"title":"Database Statistics and Optimization","quote":"Database statistics describe data distribution and cardinality so the optimizer can choose efficient plans. Stale statistics often lead to poor estimates.","explanation":"","image":"images/part-01/indexing_and_query_optimization__original_outline__database_statistics_and_optimization.png","doc":"docs/part-01/indexing_and_query_optimization__original_outline__database_statistics_and_optimization.md"},{"title":"Best Practices for Query Performance","quote":"Select only needed columns, filter early, index carefully, avoid N+1 access, review plans, paginate large results, and measure with realistic data.","explanation":"","image":"images/part-01/indexing_and_query_optimization__original_outline__best_practices_for_query_performance.png","doc":"docs/part-01/indexing_and_query_optimization__original_outline__best_practices_for_query_performance.md"}]}]},{"name":"Database Replication","groups":[{"name":"Original outline","topics":[{"title":"What is Database Replication?","quote":"Replication copies data from one database node to others for availability, read scaling, disaster recovery, or geographic distribution.","explanation":"","image":"images/part-01/database_replication__original_outline__what_is_database_replication.png","doc":"docs/part-01/database_replication__original_outline__what_is_database_replication.md"},{"title":"Types of Database Replication","quote":"Replication may be primary-replica, multi-primary, peer-to-peer, synchronous, asynchronous, logical, or physical.","explanation":"","image":"images/part-01/database_replication__original_outline__types_of_database_replication.png","doc":"docs/part-01/database_replication__original_outline__types_of_database_replication.md"},{"title":"Master-Slave Replication","quote":"Primary-replica replication sends writes to one primary and copies changes to read replicas. It simplifies conflict handling but makes primary availability important.","explanation":"","image":"images/part-01/database_replication__original_outline__master_slave_replication.png","doc":"docs/part-01/database_replication__original_outline__master_slave_replication.md"},{"title":"Master-Master Replication","quote":"Multi-primary replication allows writes on multiple nodes. It improves locality and availability but introduces conflict detection and resolution complexity.","explanation":"","image":"images/part-01/database_replication__original_outline__master_master_replication.png","doc":"docs/part-01/database_replication__original_outline__master_master_replication.md"},{"title":"Peer-to-Peer Replication","quote":"Peer-to-peer replication lets nodes exchange changes without a single permanent primary. It requires careful conflict and consistency handling.","explanation":"","image":"images/part-01/database_replication__original_outline__peer_to_peer_replication.png","doc":"docs/part-01/database_replication__original_outline__peer_to_peer_replication.md"},{"title":"Replication Strategies","quote":"A replication strategy defines topology, timing, conflict policy, failover, and read routing. It should match recovery and consistency requirements.","explanation":"","image":"images/part-01/database_replication__original_outline__replication_strategies.png","doc":"docs/part-01/database_replication__original_outline__replication_strategies.md"},{"title":"Synchronous Replication","quote":"Synchronous replication confirms a write only after replicas acknowledge it. It improves durability and consistency but increases latency and sensitivity to replica failures.","explanation":"","image":"images/part-01/database_replication__original_outline__synchronous_replication.png","doc":"docs/part-01/database_replication__original_outline__synchronous_replication.md"},{"title":"Asynchronous Replication","quote":"Asynchronous replication acknowledges writes before replicas catch up. It reduces latency but allows replication lag and possible data loss during failover.","explanation":"","image":"images/part-01/database_replication__original_outline__asynchronous_replication.png","doc":"docs/part-01/database_replication__original_outline__asynchronous_replication.md"},{"title":"Database Consistency in Replication","quote":"Replicated databases may provide strong, eventual, session, or read-after-write consistency. Applications must understand what a read from a replica can return.","explanation":"","image":"images/part-01/database_replication__original_outline__database_consistency_in_replication.png","doc":"docs/part-01/database_replication__original_outline__database_consistency_in_replication.md"},{"title":"Challenges of Database Replication","quote":"Challenges include lag, split brain, conflicts, failover, duplicate events, schema changes, monitoring, and recovery after divergence.","explanation":"","image":"images/part-01/database_replication__original_outline__challenges_of_database_replication.png","doc":"docs/part-01/database_replication__original_outline__challenges_of_database_replication.md"},{"title":"Use Cases for Database Replication","quote":"Replication supports high availability, read scaling, disaster recovery, reporting, data locality, and zero-downtime migration.","explanation":"","image":"images/part-01/database_replication__original_outline__use_cases_for_database_replication.png","doc":"docs/part-01/database_replication__original_outline__use_cases_for_database_replication.md"}]}]},{"name":"Data Sharding","groups":[{"name":"Original outline","topics":[{"title":"What is Data Sharding?","quote":"Sharding splits rows across independent database nodes using a shard key. Each shard owns only part of the total dataset.","explanation":"","image":"images/part-01/data_sharding__original_outline__what_is_data_sharding.png","doc":"docs/part-01/data_sharding__original_outline__what_is_data_sharding.md"},{"title":"Sharding vs Partitioning","quote":"Partitioning divides data into logical pieces, often within one database system. Sharding distributes those pieces across separate database nodes or clusters.","explanation":"","image":"images/part-01/data_sharding__original_outline__sharding_vs_partitioning.png","doc":"docs/part-01/data_sharding__original_outline__sharding_vs_partitioning.md"},{"title":"Sharding Key Selection","quote":"A sharding key decides how rows are distributed across shards. A good key spreads traffic evenly, supports common queries, and avoids hot partitions.","explanation":"","image":"images/part-01/data_sharding__original_outline__sharding_key_selection.png","doc":"docs/part-01/data_sharding__original_outline__sharding_key_selection.md"},{"title":"Horizontal vs Vertical Sharding","quote":"Horizontal sharding splits rows across databases, while vertical sharding separates columns or functional areas. Horizontal sharding scales data volume; vertical sharding isolates responsibilities.","explanation":"","image":"images/part-01/data_sharding__original_outline__horizontal_vs_vertical_sharding.png","doc":"docs/part-01/data_sharding__original_outline__horizontal_vs_vertical_sharding.md"},{"title":"Sharding Strategies","quote":"Common sharding strategies include range, hash, directory, geographic, and tenant-based distribution. The choice should follow access patterns, growth, and rebalancing needs.","explanation":"","image":"images/part-01/data_sharding__original_outline__sharding_strategies.png","doc":"docs/part-01/data_sharding__original_outline__sharding_strategies.md"},{"title":"Range-Based Sharding","quote":"Range sharding assigns contiguous key ranges to different shards. It supports range queries well but can create hotspots when new data grows in one range.","explanation":"","image":"images/part-01/data_sharding__original_outline__range_based_sharding.png","doc":"docs/part-01/data_sharding__original_outline__range_based_sharding.md"},{"title":"Hash-Based Sharding","quote":"Hash sharding applies a hash function to the shard key to distribute records evenly. It reduces hotspots but makes range queries and resharding harder.","explanation":"","image":"images/part-01/data_sharding__original_outline__hash_based_sharding.png","doc":"docs/part-01/data_sharding__original_outline__hash_based_sharding.md"},{"title":"Directory-Based Sharding","quote":"Directory sharding uses a lookup service that maps each key or tenant to a shard. It offers flexibility but adds a metadata dependency.","explanation":"","image":"images/part-01/data_sharding__original_outline__directory_based_sharding.png","doc":"docs/part-01/data_sharding__original_outline__directory_based_sharding.md"},{"title":"Challenges of Data Sharding","quote":"Sharding complicates joins, transactions, rebalancing, global indexes, backups, and operational troubleshooting. Poor shard keys can create severe hotspots.","explanation":"","image":"images/part-01/data_sharding__original_outline__challenges_of_data_sharding.png","doc":"docs/part-01/data_sharding__original_outline__challenges_of_data_sharding.md"},{"title":"Sharded Databases and Their Management","quote":"Managing sharded databases requires routing, health monitoring, schema consistency, capacity balancing, backup coordination, and controlled resharding.","explanation":"","image":"images/part-01/data_sharding__original_outline__sharded_databases_and_their_management.png","doc":"docs/part-01/data_sharding__original_outline__sharded_databases_and_their_management.md"},{"title":"Handling Data Consistency in Sharded Databases","quote":"Cross-shard consistency may require distributed transactions, sagas, idempotency, or eventual consistency. Keeping operations within one shard is usually simpler and faster.","explanation":"","image":"images/part-01/data_sharding__original_outline__handling_data_consistency_in_sharded_databases.png","doc":"docs/part-01/data_sharding__original_outline__handling_data_consistency_in_sharded_databases.md"},{"title":"Sharding in NoSQL vs SQL Databases","quote":"Many NoSQL systems provide built-in sharding, while SQL systems often need explicit partitioning or middleware. SQL sharding is harder when joins and transactions span shards.","explanation":"","image":"images/part-01/data_sharding__original_outline__sharding_in_nosql_vs_sql_databases.png","doc":"docs/part-01/data_sharding__original_outline__sharding_in_nosql_vs_sql_databases.md"}]}]},{"name":"Testing \u0026 Best Practices","groups":[{"name":"Original outline","topics":[{"title":"Unit Testing with JUnit","quote":"JUnit is the standard Java framework for unit tests. It runs isolated checks, reports failures, and integrates with build tools and IDEs.","explanation":"","image":"images/part-01/testing_best_practices__original_outline__unit_testing_with_junit.png","doc":"docs/part-01/testing_best_practices__original_outline__unit_testing_with_junit.md"},{"title":"What is Unit Testing?","quote":"Unit testing verifies a small piece of behavior in isolation, usually one class or method. Good unit tests are fast, deterministic, and focused.","explanation":"","image":"images/part-01/testing_best_practices__original_outline__what_is_unit_testing.png","doc":"docs/part-01/testing_best_practices__original_outline__what_is_unit_testing.md"},{"title":"JUnit Framework Overview","quote":"JUnit provides test discovery, lifecycle hooks, assertions, parameterized tests, extensions, and reporting. JUnit 5 separates platform, engine, and API.","explanation":"","image":"images/part-01/testing_best_practices__original_outline__junit_framework_overview.png","doc":"docs/part-01/testing_best_practices__original_outline__junit_framework_overview.md"},{"title":"Writing Unit Tests with JUnit","quote":"A JUnit test arranges inputs, invokes behavior, and asserts the result. Keep tests readable and name them after the behavior being verified.","explanation":"","image":"images/part-01/testing_best_practices__original_outline__writing_unit_tests_with_junit.png","doc":"docs/part-01/testing_best_practices__original_outline__writing_unit_tests_with_junit.md"},{"title":"Assertions in JUnit","quote":"Assertions compare actual outcomes with expectations. Common examples include assertEquals, assertTrue, assertThrows, and assertAll.","explanation":"","image":"images/part-01/testing_best_practices__original_outline__assertions_in_junit.png","doc":"docs/part-01/testing_best_practices__original_outline__assertions_in_junit.md"},{"title":"JUnit Annotations","quote":"JUnit annotations such as @Test, @BeforeEach, @AfterEach, @ParameterizedTest, and @Disabled control test lifecycle and execution.","explanation":"","image":"images/part-01/testing_best_practices__original_outline__junit_annotations.png","doc":"docs/part-01/testing_best_practices__original_outline__junit_annotations.md"},{"title":"Handling Exceptions in Unit Tests","quote":"Use assertThrows to verify both the exception type and relevant message or state. Avoid broad try-catch blocks that can hide failures.","explanation":"","image":"images/part-01/testing_best_practices__original_outline__handling_exceptions_in_unit_tests.png","doc":"docs/part-01/testing_best_practices__original_outline__handling_exceptions_in_unit_tests.md"},{"title":"Mocking with Mockito for Unit Tests","quote":"Mockito replaces dependencies with controllable test doubles. It helps isolate the class under test, but over-mocking can make tests brittle.","explanation":"","image":"images/part-01/testing_best_practices__original_outline__mocking_with_mockito_for_unit_tests.png","doc":"docs/part-01/testing_best_practices__original_outline__mocking_with_mockito_for_unit_tests.md"},{"title":"Integration Testing","quote":"Integration testing verifies that multiple components work together, such as services, databases, queues, or external APIs.","explanation":"","image":"images/part-01/testing_best_practices__original_outline__integration_testing.png","doc":"docs/part-01/testing_best_practices__original_outline__integration_testing.md"},{"title":"What is Integration Testing?","quote":"Integration testing checks real collaboration across boundaries that unit tests intentionally isolate. It is slower but catches wiring and configuration issues.","explanation":"","image":"images/part-01/testing_best_practices__original_outline__what_is_integration_testing.png","doc":"docs/part-01/testing_best_practices__original_outline__what_is_integration_testing.md"},{"title":"Importance of Integration Testing","quote":"Integration tests reveal problems in serialization, persistence, transactions, networking, and framework configuration that unit tests cannot detect.","explanation":"","image":"images/part-01/testing_best_practices__original_outline__importance_of_integration_testing.png","doc":"docs/part-01/testing_best_practices__original_outline__importance_of_integration_testing.md"},{"title":"Tools for Integration Testing","quote":"Common tools include Spring Boot Test, Testcontainers, WireMock, REST Assured, embedded brokers, and dedicated test environments.","explanation":"","image":"images/part-01/testing_best_practices__original_outline__tools_for_integration_testing.png","doc":"docs/part-01/testing_best_practices__original_outline__tools_for_integration_testing.md"},{"title":"Writing Integration Tests","quote":"Integration tests should exercise realistic boundaries, manage test data carefully, isolate runs, and clean up resources afterward.","explanation":"","image":"images/part-01/testing_best_practices__original_outline__writing_integration_tests.png","doc":"docs/part-01/testing_best_practices__original_outline__writing_integration_tests.md"},{"title":"Database Integration Testing","quote":"Database integration tests verify mappings, queries, transactions, constraints, and migrations against a real or containerized database.","explanation":"","image":"images/part-01/testing_best_practices__original_outline__database_integration_testing.png","doc":"docs/part-01/testing_best_practices__original_outline__database_integration_testing.md"},{"title":"Test-Driven Development (TDD)","quote":"TDD develops software through a repeating cycle of failing test, minimal implementation, and refactoring. Tests drive design decisions incrementally.","explanation":"","image":"images/part-01/testing_best_practices__original_outline__test_driven_development_tdd.png","doc":"docs/part-01/testing_best_practices__original_outline__test_driven_development_tdd.md"},{"title":"What is TDD?","quote":"Test-Driven Development means writing a test before production code, then implementing only enough behavior to make the test pass.","explanation":"","image":"images/part-01/testing_best_practices__original_outline__what_is_tdd.png","doc":"docs/part-01/testing_best_practices__original_outline__what_is_tdd.md"},{"title":"TDD Cycle","quote":"The TDD cycle is Red, Green, Refactor: write a failing test, make it pass, then improve the design without changing behavior.","explanation":"","image":"images/part-01/testing_best_practices__original_outline__tdd_cycle.png","doc":"docs/part-01/testing_best_practices__original_outline__tdd_cycle.md"},{"title":"Writing Tests Before Code","quote":"Writing the test first forces the developer to define expected behavior and API shape before implementation details take over.","explanation":"","image":"images/part-01/testing_best_practices__original_outline__writing_tests_before_code.png","doc":"docs/part-01/testing_best_practices__original_outline__writing_tests_before_code.md"},{"title":"Benefits of TDD","quote":"TDD can improve design feedback, regression safety, confidence, and refactorability. It is most effective when tests focus on behavior rather than internals.","explanation":"","image":"images/part-01/testing_best_practices__original_outline__benefits_of_tdd.png","doc":"docs/part-01/testing_best_practices__original_outline__benefits_of_tdd.md"},{"title":"Challenges with TDD","quote":"TDD can feel slower initially, is difficult around legacy or highly integrated code, and can produce brittle tests when implementation details are mocked.","explanation":"","image":"images/part-01/testing_best_practices__original_outline__challenges_with_tdd.png","doc":"docs/part-01/testing_best_practices__original_outline__challenges_with_tdd.md"},{"title":"Mocking with Mockito","quote":"Mockito creates mocks, stubs responses, captures arguments, and verifies interactions. Use it mainly for external collaborators, not every object.","explanation":"","image":"images/part-01/testing_best_practices__original_outline__mocking_with_mockito.png","doc":"docs/part-01/testing_best_practices__original_outline__mocking_with_mockito.md"},{"title":"What is Mocking?","quote":"Mocking replaces a real dependency with a controllable test double. It lets a test simulate responses and verify interactions.","explanation":"","image":"images/part-01/testing_best_practices__original_outline__what_is_mocking.png","doc":"docs/part-01/testing_best_practices__original_outline__what_is_mocking.md"},{"title":"Introduction to Mockito","quote":"Mockito is a Java mocking framework with a fluent API for stubbing and verification. It integrates naturally with JUnit.","explanation":"","image":"images/part-01/testing_best_practices__original_outline__introduction_to_mockito.png","doc":"docs/part-01/testing_best_practices__original_outline__introduction_to_mockito.md"},{"title":"Creating Mocks and Stubs","quote":"Mocks can be created with mock() or annotations. Stubbing defines what a method should return or throw for a given input.","explanation":"","image":"images/part-01/testing_best_practices__original_outline__creating_mocks_and_stubs.png","doc":"docs/part-01/testing_best_practices__original_outline__creating_mocks_and_stubs.md"},{"title":"Mockito Annotations","quote":"@Mock creates mocks, @InjectMocks creates the class under test and injects mocks, and @Captor creates argument captors.","explanation":"","image":"images/part-01/testing_best_practices__original_outline__mockito_annotations.png","doc":"docs/part-01/testing_best_practices__original_outline__mockito_annotations.md"},{"title":"Verifying Mock Behavior","quote":"verify checks whether a collaborator was called with expected arguments and frequency. Verify only interactions that matter to behavior.","explanation":"","image":"images/part-01/testing_best_practices__original_outline__verifying_mock_behavior.png","doc":"docs/part-01/testing_best_practices__original_outline__verifying_mock_behavior.md"},{"title":"Using Argument Matchers in Mockito","quote":"Argument matchers such as any(), eq(), and argThat() make stubbing and verification flexible. Use matchers consistently within one method call.","explanation":"","image":"images/part-01/testing_best_practices__original_outline__using_argument_matchers_in_mockito.png","doc":"docs/part-01/testing_best_practices__original_outline__using_argument_matchers_in_mockito.md"},{"title":"Mocking Void Methods and Exceptions","quote":"Void methods are stubbed with doNothing, doThrow, or doAnswer. This is useful for simulating failures or side effects.","explanation":"","image":"images/part-01/testing_best_practices__original_outline__mocking_void_methods_and_exceptions.png","doc":"docs/part-01/testing_best_practices__original_outline__mocking_void_methods_and_exceptions.md"},{"title":"Code Quality Best Practices","quote":"Code quality comes from clarity, small cohesive units, meaningful names, tests, review, simple design, and continuous refactoring.","explanation":"","image":"images/part-01/testing_best_practices__original_outline__code_quality_best_practices.png","doc":"docs/part-01/testing_best_practices__original_outline__code_quality_best_practices.md"},{"title":"Writing Clean and Maintainable Code","quote":"Maintainable code expresses intent, limits responsibility, avoids hidden side effects, and remains easy to test and change.","explanation":"","image":"images/part-01/testing_best_practices__original_outline__writing_clean_and_maintainable_code.png","doc":"docs/part-01/testing_best_practices__original_outline__writing_clean_and_maintainable_code.md"},{"title":"Adhering to Coding Standards","quote":"Coding standards improve consistency in naming, formatting, error handling, and structure. Automation should enforce what tools can check.","explanation":"","image":"images/part-01/testing_best_practices__original_outline__adhering_to_coding_standards.png","doc":"docs/part-01/testing_best_practices__original_outline__adhering_to_coding_standards.md"},{"title":"Refactoring Techniques","quote":"Common refactorings include extracting methods, renaming, simplifying conditionals, removing duplication, and introducing clear abstractions.","explanation":"","image":"images/part-01/testing_best_practices__original_outline__refactoring_techniques.png","doc":"docs/part-01/testing_best_practices__original_outline__refactoring_techniques.md"},{"title":"Code Reviews","quote":"Code reviews improve correctness, design, security, and shared understanding. Effective reviews focus on risk and intent, not personal preference.","explanation":"","image":"images/part-01/testing_best_practices__original_outline__code_reviews.png","doc":"docs/part-01/testing_best_practices__original_outline__code_reviews.md"},{"title":"Avoiding Code Duplication","quote":"Duplication increases maintenance cost and inconsistency. Remove repeated knowledge when it is truly the same concept, not merely similar-looking code.","explanation":"","image":"images/part-01/testing_best_practices__original_outline__avoiding_code_duplication.png","doc":"docs/part-01/testing_best_practices__original_outline__avoiding_code_duplication.md"},{"title":"SOLID Principles","quote":"SOLID promotes maintainable object-oriented design through single responsibility, open-closed, Liskov substitution, interface segregation, and dependency inversion.","explanation":"","image":"images/part-01/testing_best_practices__original_outline__solid_principles.png","doc":"docs/part-01/testing_best_practices__original_outline__solid_principles.md"}]}]},{"name":"Core Java","groups":[{"name":"Language Foundations","topics":[{"title":"Java platform architecture","quote":"The Java platform consists of source code, compiler, bytecode, class loaders, runtime libraries, and the JVM. This separation enables portability.","explanation":"","image":"images/part-01/core_java__language_foundations__java_platform_architecture.png","doc":"docs/part-01/core_java__language_foundations__java_platform_architecture.md"},{"title":"JDK vs JRE vs JVM","quote":"The JVM executes bytecode, the JRE provides the runtime and libraries, and the JDK adds development tools such as javac, javadoc, and debuggers.","explanation":"","image":"images/part-01/core_java__language_foundations__jdk_vs_jre_vs_jvm.png","doc":"docs/part-01/core_java__language_foundations__jdk_vs_jre_vs_jvm.md"},{"title":"Java compilation process","quote":"javac compiles .java source into .class bytecode. The JVM then loads, verifies, interprets, and JIT-compiles frequently executed code.","explanation":"","image":"images/part-01/core_java__language_foundations__java_compilation_process.png","doc":"docs/part-01/core_java__language_foundations__java_compilation_process.md"},{"title":"Bytecode and class files","quote":"Bytecode is the platform-neutral instruction set stored in .class files. The JVM validates and executes it on the target machine.","explanation":"","image":"images/part-01/core_java__language_foundations__bytecode_and_class_files.png","doc":"docs/part-01/core_java__language_foundations__bytecode_and_class_files.md"},{"title":"Java source file structure","quote":"A Java source file may contain a package declaration, imports, and type definitions. At most one public top-level type must match the filename.","explanation":"","image":"images/part-01/core_java__language_foundations__java_source_file_structure.png","doc":"docs/part-01/core_java__language_foundations__java_source_file_structure.md"},{"title":"Packages and imports","quote":"Packages organize types and control namespace access. Imports let code use simple type names without changing where classes belong.","explanation":"","image":"images/part-01/core_java__language_foundations__packages_and_imports.png","doc":"docs/part-01/core_java__language_foundations__packages_and_imports.md"},{"title":"Primitive data types","quote":"Java has eight primitives: byte, short, int, long, float, double, char, and boolean. They store values directly and are not objects.","explanation":"","image":"images/part-01/core_java__language_foundations__primitive_data_types.png","doc":"docs/part-01/core_java__language_foundations__primitive_data_types.md"},{"title":"Reference data types","quote":"Reference types include classes, arrays, interfaces, enums, and records. Variables store references to objects rather than the object data itself.","explanation":"","image":"images/part-01/core_java__language_foundations__reference_data_types.png","doc":"docs/part-01/core_java__language_foundations__reference_data_types.md"},{"title":"Type conversion and casting","quote":"Widening conversions are usually automatic, while narrowing conversions require an explicit cast and may lose information.","explanation":"","image":"images/part-01/core_java__language_foundations__type_conversion_and_casting.png","doc":"docs/part-01/core_java__language_foundations__type_conversion_and_casting.md"},{"title":"Variable scope and lifetime","quote":"Scope defines where a variable can be accessed; lifetime defines how long its storage exists. Local variables, fields, and static fields differ.","explanation":"","image":"images/part-01/core_java__language_foundations__variable_scope_and_lifetime.png","doc":"docs/part-01/core_java__language_foundations__variable_scope_and_lifetime.md"},{"title":"Operators and precedence","quote":"Operators perform arithmetic, comparison, assignment, logical, bitwise, and other operations. Precedence determines evaluation order unless parentheses override it.","explanation":"","image":"images/part-01/core_java__language_foundations__operators_and_precedence.png","doc":"docs/part-01/core_java__language_foundations__operators_and_precedence.md"},{"title":"Control flow statements","quote":"Java control flow includes if, switch, loops, break, continue, and return. These determine which statements execute and in what order.","explanation":"","image":"images/part-01/core_java__language_foundations__control_flow_statements.png","doc":"docs/part-01/core_java__language_foundations__control_flow_statements.md"},{"title":"Enhanced for loop","quote":"The enhanced for loop iterates over arrays or Iterable objects without exposing an index. It is clear but unsuitable when modification or position is required.","explanation":"","image":"images/part-01/core_java__language_foundations__enhanced_for_loop.png","doc":"docs/part-01/core_java__language_foundations__enhanced_for_loop.md"},{"title":"Var keyword","quote":"var enables local variable type inference while preserving static typing. It can only be used for initialized local variables, not fields or method parameters.","explanation":"","image":"images/part-01/core_java__language_foundations__var_keyword.png","doc":"docs/part-01/core_java__language_foundations__var_keyword.md"},{"title":"Enums","quote":"An enum defines a fixed set of named instances and can contain fields, methods, constructors, and interface implementations.","explanation":"","image":"images/part-01/core_java__language_foundations__enums.png","doc":"docs/part-01/core_java__language_foundations__enums.md"},{"title":"Records","quote":"Records are concise immutable data carriers that automatically provide accessors, equals, hashCode, and toString based on their components.","explanation":"","image":"images/part-01/core_java__language_foundations__records.png","doc":"docs/part-01/core_java__language_foundations__records.md"},{"title":"Sealed classes","quote":"Sealed classes restrict which types may extend or implement them. They make closed hierarchies explicit and improve exhaustive pattern handling.","explanation":"","image":"images/part-01/core_java__language_foundations__sealed_classes.png","doc":"docs/part-01/core_java__language_foundations__sealed_classes.md"},{"title":"Annotations","quote":"Annotations attach metadata to code for compilers, frameworks, tools, or runtime reflection. They do not execute behavior by themselves.","explanation":"","image":"images/part-01/core_java__language_foundations__annotations.png","doc":"docs/part-01/core_java__language_foundations__annotations.md"},{"title":"Java naming conventions","quote":"Classes use PascalCase, methods and variables use camelCase, constants use UPPER_SNAKE_CASE, and packages use lowercase names.","explanation":"","image":"images/part-01/core_java__language_foundations__java_naming_conventions.png","doc":"docs/part-01/core_java__language_foundations__java_naming_conventions.md"},{"title":"Immutability in Java","quote":"An immutable object cannot change after construction. Use final fields, defensive copies, no mutating methods, and controlled construction.","explanation":"","image":"images/part-01/core_java__language_foundations__immutability_in_java.png","doc":"docs/part-01/core_java__language_foundations__immutability_in_java.md"}]},{"name":"Object-Oriented Design","topics":[{"title":"Constructors","quote":"Constructors initialize new objects and have the same name as the class with no return type. They can be overloaded.","explanation":"","image":"images/part-01/core_java__object_oriented_design__constructors.png","doc":"docs/part-01/core_java__object_oriented_design__constructors.md"},{"title":"Constructor chaining","quote":"Constructor chaining uses this() within a class or super() to invoke a parent constructor. The call must be the first statement.","explanation":"","image":"images/part-01/core_java__object_oriented_design__constructor_chaining.png","doc":"docs/part-01/core_java__object_oriented_design__constructor_chaining.md"},{"title":"Static members","quote":"Static members belong to the class rather than an instance. They are shared and should not depend on per-object state.","explanation":"","image":"images/part-02/core_java__object_oriented_design__static_members.png","doc":"docs/part-02/core_java__object_oriented_design__static_members.md"},{"title":"Instance members","quote":"Instance members belong to individual objects and can access that object\u0027s fields and methods through this.","explanation":"","image":"images/part-02/core_java__object_oriented_desi
