<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Living Library</title>
<style>
:root{
  --rail:166px;
  --menu-h:142px;
  --map-w:15%;
  --paper:#f6f3ec;
  --panel:#fffdf8;
  --ink:#26363d;
  --muted:#6d787d;
  --line:rgba(70,61,47,.13);
  --green:#216a56;
  --blue:#356d98;
  --gold:#8a631f;
  --danger:#9b3d31;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{
  overflow:hidden;
  color:var(--ink);
  background:var(--paper);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.workspace{
  position:fixed;
  inset:0;
  display:grid;
  grid-template-columns:minmax(150px,var(--map-w)) 18px minmax(0,1fr);
  grid-template-rows:auto minmax(0,1fr);
  padding-right:var(--rail);
  overflow:hidden;
}
.topic-map{
  grid-column:1;
  grid-row:1 / 3;
  min-width:0;
  display:grid;
  grid-template-rows:auto auto minmax(0,1fr);
  background:#f1eee7;
  border-right:1px solid var(--line);
  overflow:hidden;
}
.map-head{
  height:48px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:0 10px;
  border-bottom:1px solid var(--line);
}
.map-head strong{
  font-size:.72rem;
  letter-spacing:.1em;
  text-transform:uppercase;
}
.map-actions{display:flex;gap:5px}
.icon-btn{
  width:29px;height:29px;padding:0;
  display:grid;place-items:center;
  border:1px solid var(--line);
  border-radius:9px;
  color:var(--ink);
  background:#fff;
  font-weight:900;
}
.icon-btn:hover{border-color:rgba(33,106,86,.35);color:var(--green)}
.edit-only{display:none!important}
body.edit-mode .edit-only{display:grid!important}
.map-search{
  position:relative;
  padding:8px;
  border-bottom:1px solid var(--line);
}
.map-search input{
  width:100%;
  height:36px;
  padding:0 34px 0 10px;
  border:1px solid rgba(63,70,72,.15);
  border-radius:10px;
  outline:none;
  color:var(--ink);
  background:#fff;
}
.map-search input:focus{
  border-color:rgba(33,106,86,.45);
  box-shadow:0 0 0 3px rgba(33,106,86,.08);
}
.map-search button{
  position:absolute;
  top:12px;right:12px;
  width:28px;height:28px;padding:0;
  border:0;background:transparent;color:#7b8589;
}
.map-tree{
  min-height:0;
  overflow:auto;
  padding:6px 6px 24px;
  scrollbar-width:thin;
}
.section{
  margin:0 0 5px;
  border:1px solid rgba(65,57,45,.09);
  border-radius:11px;
  background:rgba(255,255,255,.52);
  overflow:hidden;
}
.section-head,.group-head{
  width:100%;
  border:0;
  display:grid;
  grid-template-columns:16px minmax(0,1fr) auto;
  align-items:center;
  gap:6px;
  text-align:left;
  color:var(--ink);
  background:transparent;
}
.section-head{min-height:38px;padding:6px 8px;font-weight:850}
.group-head{min-height:33px;padding:5px 7px;font-size:.72rem;font-weight:800}
.section-head:hover,.group-head:hover{background:rgba(255,255,255,.72)}
.chev{font-size:.62rem;transition:transform .15s}
.section.open>.section-head .chev,.group.open>.group-head .chev{transform:rotate(90deg)}
.section-body,.group-topics{display:none}
.section.open>.section-body,.group.open>.group-topics{display:block}
.section-body{padding:0 5px 6px}
.group{margin:3px 0;border-radius:9px;background:rgba(239,237,231,.7)}
.group-topics{padding:2px 5px 6px}
.topic{
  width:100%;
  min-height:29px;
  margin:1px 0;
  padding:5px 7px 5px 10px;
  border:0;
  border-radius:7px;
  text-align:left;
  color:#435159;
  background:transparent;
  font-size:.68rem;
  line-height:1.25;
}
.topic:hover{background:#fff;color:#1e5d4e}
.topic.active{
  color:#155b48;
  background:#dfeee8;
  font-weight:850;
}
.count{
  min-width:22px;
  padding:2px 5px;
  border-radius:999px;
  color:#738087;
  background:rgba(255,255,255,.8);
  font-size:.56rem;
  text-align:center;
}
.splitter{
  grid-column:2;
  grid-row:1 / 3;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:8px;
  cursor:col-resize;
  touch-action:none;
  user-select:none;
  background:
    linear-gradient(90deg,transparent 0 7px,rgba(83,73,57,.18) 7px 10px,transparent 10px);
}
.splitter.dragging{
  background:
    linear-gradient(90deg,transparent 0 6px,rgba(33,106,86,.55) 6px 11px,transparent 11px);
}
.splitter .grip{
  width:5px;height:50px;border-radius:999px;
  background:radial-gradient(circle,rgba(70,70,66,.55) 1px,transparent 1.5px) center/5px 7px repeat-y;
}
.splitter button{
  width:25px;height:25px;padding:0;
  display:grid;place-items:center;
  border:1px solid rgba(33,106,86,.18);
  border-radius:50%;
  color:var(--green);
  background:#fff;
  font-weight:950;
}
.content-head{
  grid-column:3;
  grid-row:1;
  min-width:0;
  min-height:72px;
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  padding:17px 28px 12px;
  border-bottom:1px solid var(--line);
  background:rgba(255,253,248,.88);
}
.breadcrumb{
  margin:0 0 4px;
  color:#7b8589;
  font-size:.61rem;
  font-weight:800;
  letter-spacing:.04em;
}
.content-head h1{
  margin:0;
  color:#24343d;
  font-size:clamp(1.1rem,1.7vw,1.65rem);
  line-height:1.12;
}
.edit-toolbar{
  display:none;
  align-items:center;
  gap:6px;
  flex:0 0 auto;
}
body.edit-mode .edit-toolbar{display:flex}
.edit-toolbar button{
  width:36px;height:36px;padding:0;
  display:grid;place-items:center;
  border:1px solid var(--line);
  border-radius:11px;
  background:#fff;
  font-size:1rem;
}


.edit-toolbar .delete{color:var(--danger);background:#fae9e5}

.content{
  touch-action:pan-y;
  grid-column:3;
  grid-row:2;
  min-width:0;
  min-height:0;
  overflow:auto;
  padding:28px clamp(26px,4vw,64px) 60px;
  background:var(--panel);
  color:#3c4448;
  font-size:clamp(.95rem,1.1vw,1.13rem);
  line-height:1.68;
}
.content p:first-child{margin-top:0}
.content h2,.content h3{color:#24343d}
.editor{
  display:none;
  grid-column:3;
  grid-row:2;
  width:100%;height:100%;
  resize:none;
  border:0;outline:0;
  padding:28px clamp(26px,4vw,64px) 60px;
  color:#32454e;
  background:#fffdf8;
  font:1rem/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
body.editing .content{display:none}
body.editing .editor{display:block}
body.editing .topic-map,
body.editing .splitter,
body.editing .explore{pointer-events:none;opacity:.58}
.right-menu{
  position:fixed;
  z-index:20;
  top:0;right:0;
  width:var(--rail);
  height:var(--menu-h);
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  grid-template-rows:repeat(2,minmax(0,1fr));
  border-left:1px solid var(--line);
  border-bottom:1px solid var(--line);
  background:#ece8df;
}
.menu-btn{
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:7px 3px;
  border:0;
  border-right:1px solid rgba(75,65,48,.1);
  border-bottom:1px solid rgba(75,65,48,.1);
  color:#33434a;
  background:transparent;
}
.menu-btn:nth-child(even){border-right:0}
.menu-btn:nth-last-child(-n+2){border-bottom:0}
.menu-btn:hover{background:rgba(255,255,255,.58)}
.menu-icon{
  width:34px;height:34px;
  display:grid;place-items:center;
  border-radius:11px;
  background:#fff;
  box-shadow:0 3px 10px rgba(45,39,31,.08);
  font-size:1.04rem;
}
.menu-label{font-size:.64rem;font-weight:850;white-space:nowrap}
#discover{color:#76531a;background:rgba(245,222,171,.28)}
#discover .menu-icon{background:#fff3cf}
#download{color:#315d83;background:rgba(201,225,245,.27)}
#download .menu-icon{background:#e8f4fd}
#mode{color:#24634f;background:rgba(199,232,220,.28)}
#mode .menu-icon{background:#e2f4ed}
#saveMenu{color:#376b3a;background:rgba(207,235,205,.25)}
#saveMenu .menu-icon{background:#e8f6e6}
#saveMenu:disabled{opacity:.38;cursor:not-allowed}
#saveMenu.ready{background:#d7efd9}
.explore{
  position:fixed;
  z-index:19;
  right:0;bottom:0;
  width:var(--rail);
  height:calc(100vh - var(--menu-h));
  display:flex;
  flex-direction:column;
  border-left:1px solid var(--line);
  background:#f3f1ec;
  overflow:hidden;
}
.explore h2{
  flex:0 0 24px;
  height:24px;
  margin:0;
  padding:0 5px;
  display:flex;
  align-items:center;
  color:#846b49;
  font-size:.66rem;
  line-height:1;
  font-weight:900;
  letter-spacing:.13em;
  text-transform:uppercase;
}
.explore-list{
  min-height:0;
  display:flex;
  flex-direction:column;
  overflow:hidden;
}
.explore-link{
  min-height:24px;
  flex:1 1 24px;
  display:grid;
  grid-template-columns:22px minmax(0,1fr);
  align-items:center;
  gap:5px;
  padding:0 4px;
  border:0;
  border-top:1px solid rgba(77,66,49,.07);
  color:#445157;
  background:transparent;
  text-align:left;
}
.explore-link:hover{background:#fff}
.explore-icon{
  width:21px;height:21px;
  display:grid;place-items:center;
  border-radius:7px;
  background:#fff;
  font-size:.61rem;
  font-weight:900;
}
.explore-link strong{
  min-width:0;
  font-size:.64rem;
  line-height:1;
  white-space:nowrap;
  overflow:hidden;
}
.dialog{
  position:fixed;
  z-index:100;
  inset:0;
  display:none;
  place-items:center;
  padding:20px;
  background:rgba(26,30,31,.38);
}
.dialog.open{display:grid}
.dialog-card{
  width:min(620px,100%);
  max-height:90vh;
  overflow:auto;
  padding:20px;
  border-radius:18px;
  background:#fffdf8;
  box-shadow:0 24px 70px rgba(0,0,0,.24);
}
.dialog-head{
  display:flex;justify-content:space-between;gap:12px;
  margin-bottom:16px;
}
.dialog-head h2{margin:0}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid label{display:grid;gap:5px;font-size:.72rem;font-weight:800}
.form-grid .wide{grid-column:1 / -1}
.form-grid input,.form-grid select,.form-grid textarea{
  width:100%;
  border:1px solid rgba(64,70,72,.16);
  border-radius:10px;
  padding:9px;
  outline:0;
  background:#fff;
}
.form-grid textarea{min-height:150px;resize:vertical}
.dialog-actions{
  margin-top:16px;
  display:flex;
  justify-content:flex-end;
  gap:8px;
}
.dialog-actions button{
  min-height:38px;padding:8px 14px;
  border:0;border-radius:10px;font-weight:850;
}
.primary{color:#fff;background:var(--green)}
.secondary{color:#405057;background:#ecefea}
.toast{
  position:fixed;
  z-index:120;
  left:50%;bottom:18px;
  transform:translate(-50%,20px);
  padding:9px 13px;
  border-radius:10px;
  color:#fff;
  background:rgba(32,44,48,.94);
  font-size:.7rem;
  font-weight:800;
  opacity:0;
  pointer-events:none;
  transition:.18s;
}
.toast.show{opacity:1;transform:translate(-50%,0)}


:root{--map-w:28%;--rail:166px;--menu-h:142px}
body{background:linear-gradient(180deg,#f8f5ef,#f3efe7)}
.workspace{grid-template-columns:minmax(150px,var(--map-w)) 18px minmax(0,1fr)}
.topic-map{container-type:inline-size;background:linear-gradient(180deg,#f1eee7,#ebe7de)}
.library-title{
  border:0;margin:0;padding:4px 6px;display:inline-flex;align-items:center;gap:4px;
  border-radius:7px;color:#284b5a;background:transparent;font-weight:950;
  letter-spacing:.08em;text-transform:uppercase
}
.library-title:hover,.library-title:focus-visible{color:#1f6b56;background:rgba(255,255,255,.72);outline:0}
.library-name{position:relative}
.library-name::after{
  content:"";position:absolute;left:0;right:0;bottom:-5px;height:2px;
  border-radius:999px;background:linear-gradient(90deg,#2c765f,#5c8ba3)
}
.map-tree{padding:3px 4px 10px}
.section{margin-bottom:1px;border-radius:9px;background:rgba(255,255,255,.48);content-visibility:auto;contain-intrinsic-size:0 32px}
.group-topics{contain:layout style}
.topic{contain:layout style paint;will-change:auto}
.section-head,.group-head{font-size:.86rem;line-height:1}
.section-head{
  min-height:30px;height:30px;padding:2px 5px;color:#294755;font-weight:950;
  text-transform:uppercase;letter-spacing:.035em;
  background:linear-gradient(90deg,rgba(49,95,122,.055),transparent 72%)
}
.group{margin:0;background:rgba(244,240,231,.78)}
.group-head{
  min-height:26px;height:26px;padding:1px 4px;color:#5b4a31;font-weight:880;
  background:linear-gradient(90deg,rgba(138,106,42,.045),transparent 75%)
}
.section-body{padding:0 2px 2px}
.group-topics{display:none;grid-template-columns:repeat(1,minmax(0,1fr));gap:1px;padding:1px 2px 2px}
.group.open>.group-topics{display:grid}
.topic{
  height:25px;min-height:25px;max-height:25px;margin:0;padding:2px 4px;
  font-size:.78rem;line-height:1;font-weight:800;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;color:#40535d;background:rgba(255,255,255,.34)
}
.topic:hover{color:#1d5f4d;background:#f5fbf8}
.topic.active{color:#fff;background:linear-gradient(90deg,#2f765f,#397f69);font-weight:900}
.topic.keyboard-focus{outline:2px solid rgba(49,95,122,.55);outline-offset:1px;background:#eef5fb}
@container (min-width:240px){.group-topics{grid-template-columns:repeat(2,minmax(0,1fr))}}
@container (min-width:390px){.group-topics{grid-template-columns:repeat(3,minmax(0,1fr))}}
@container (min-width:610px){.group-topics{grid-template-columns:repeat(4,minmax(0,1fr))}}
@container (min-width:760px){.group-topics{grid-template-columns:repeat(5,minmax(0,1fr))}}
@container (min-width:900px){.group-topics{grid-template-columns:repeat(6,minmax(0,1fr))}}
@container (min-width:1180px){.group-topics{grid-template-columns:repeat(7,minmax(0,1fr))}.topic{font-size:.76rem}}
.breadcrumb{font-size:.72rem;line-height:1.2;font-weight:850;letter-spacing:.025em;color:#718086}
.content-head{background:linear-gradient(180deg,rgba(255,253,248,.98),rgba(250,247,240,.96))}
.content{background:linear-gradient(180deg,#fffdf9,#fbf8f2)}
.right-menu{background:linear-gradient(180deg,#eee9df,#e8e2d7)}
.explore{background:linear-gradient(180deg,#f3f0e9,#ece7de)}
.mobile-topbar{display:none}

@media(max-width:1024px) and (orientation:portrait){
  :root{--rail:0px;--mobile-top:50px;--mobile-explore:70px}
  body{padding-top:var(--mobile-top);padding-bottom:var(--mobile-explore)}
  .workspace{
    inset:var(--mobile-top) 0 var(--mobile-explore);grid-template-columns:1fr;
    grid-template-rows:auto minmax(0,1fr);padding-right:0
  }
  .mobile-topbar{
    position:fixed;z-index:80;top:0;left:0;right:0;height:var(--mobile-top);
    padding:0 5px;display:grid;grid-template-columns:minmax(92px,1fr) auto auto;
    align-items:center;gap:4px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(248,245,239,.98),rgba(240,235,226,.98))
  }
  .mobile-map-button{
    min-width:0;height:38px;padding:0 8px;display:flex;align-items:center;gap:5px;
    border:1px solid var(--line);border-radius:9px;color:#2c5968;background:#fff;font-weight:850
  }
  .mobile-map-button strong{min-width:0;font-size:.66rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mobile-map-tools{display:none;grid-template-columns:34px;gap:3px}
  body.map-open .mobile-map-tools{display:grid}
  .mobile-top-actions{display:grid;grid-template-columns:repeat(4,34px);gap:3px}
  .mobile-map-tools button,.mobile-top-actions button{
    width:34px;min-width:34px;height:34px;min-height:34px;padding:0;display:grid;
    place-items:center;border:1px solid rgba(71,64,53,.12);border-radius:9px;background:#fff;font-weight:900
  }
  #mobileDiscover{color:#805a18;background:#fff4d4}
  #mobileMode{color:#216450;background:#e4f3ed}
  #mobileMode.active{color:#fff;background:#28725d}
  #mobileSave{color:#36723f;background:#e7f5e7}
  #mobileSave:disabled{opacity:.38}
  #mobileDownload{color:#315f88;background:#e9f4fd}
  .topic-map{
    position:fixed;z-index:70;top:var(--mobile-top);left:0;right:0;bottom:var(--mobile-explore);
    width:100%;grid-template-rows:auto minmax(0,1fr);transform:translateX(-105%);
    transition:transform .18s ease;border-right:0
  }
  body.map-open .topic-map{transform:translateX(0)}
  .topic-map .map-head{display:none}
  .map-search{padding:4px 6px}
  .map-search input{height:31px;min-height:31px;padding:0 29px 0 8px;border-radius:8px;font-size:.68rem}
  .map-search button{top:6px;right:8px;width:27px;height:27px}
  .map-tree{padding:3px 6px 16px}
  .section{margin-bottom:2px}
  .section-head{min-height:33px;height:33px;padding:3px 7px;font-size:.72rem}
  .section-body{padding:0 3px 3px}
  .group{margin:1px 0}
  .group-head{min-height:29px;height:29px;padding:2px 6px;font-size:.67rem}
  .group-topics{grid-template-columns:repeat(2,minmax(0,1fr));gap:2px;padding:2px 3px 3px}
  .topic{height:27px;min-height:27px;max-height:27px;padding:3px 6px;font-size:.62rem}
  .splitter,.right-menu{display:none!important}
  .content-head,.content,.editor{grid-column:1}
  .content-head{grid-row:1;min-height:68px;padding:12px 14px 10px}
  .content-head h1{font-size:1.05rem}
  .breadcrumb{font-size:.57rem}
  .content{grid-row:2;padding:20px 17px 36px;font-size:.94rem;line-height:1.62}
  .editor{grid-row:2;padding:18px 15px 40px;font-size:.88rem;line-height:1.55}
  .explore{
    position:fixed;z-index:82;left:0;right:0;bottom:0;top:auto;width:100%;
    height:var(--mobile-explore);min-height:var(--mobile-explore);max-height:var(--mobile-explore);
    display:block;padding:4px 5px 5px;border:0;border-top:1px solid var(--line);overflow:hidden
  }
  .explore h2{display:none}
  .explore-list{
    width:100%;height:100%;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));
    grid-template-rows:repeat(2,minmax(0,1fr));gap:3px;padding:0;overflow:hidden
  }
  .explore-link{
    width:100%;min-width:0;height:100%;min-height:0;display:grid;grid-template-columns:1fr;
    place-items:center;padding:0;border:1px solid rgba(75,65,48,.09);border-radius:8px;background:#fff
  }
  .explore-link strong{display:none}
  .explore-icon{width:100%;height:100%;display:grid;place-items:center;background:transparent;font-size:.56rem}
}
@media(min-width:540px) and (max-width:1024px) and (orientation:portrait){
  .group-topics{grid-template-columns:repeat(3,minmax(0,1fr))}
  .topic{font-size:.60rem}
}


@media(max-width:1024px) and (orientation:portrait){
  :root{
    --mobile-top:54px !important;
    --mobile-explore:76px !important;
  }

  .mobile-topbar{
    height:var(--mobile-top) !important;
    padding:0 7px !important;
    gap:5px !important;
  }

  .mobile-map-button{
    height:40px !important;
    padding:0 10px !important;
    border-radius:10px !important;
  }

  .mobile-map-button strong{
    font-size:.76rem !important;
    line-height:1 !important;
    font-weight:900 !important;
    letter-spacing:.01em !important;
  }

  .mobile-map-tools{
    grid-template-columns:36px !important;
  }

  .mobile-top-actions{
    grid-template-columns:repeat(4,36px) !important;
    gap:4px !important;
  }

  .mobile-map-tools button,

:root{
  --ctx-a:#315c72;
  --ctx-b:#6d4d78;
  --ctx-c:#a2604f;
  --ctx-soft-a:rgba(49,92,114,.18);
  --ctx-soft-b:rgba(109,77,120,.15);
  --ctx-soft-c:rgba(162,96,79,.13);
  --ctx-paper-a:rgba(49,92,114,.075);
  --ctx-paper-b:rgba(109,77,120,.055);
  --ctx-paper-c:rgba(162,96,79,.045);
  --ctx-ink:#213740;
  --ctx-on:#fffdf9;
}
body.context-themed .topic-map,
body.context-themed .content-head,
body.context-themed .right-menu,
body.context-themed .explore,
body.context-themed .mobile-topbar{
  transition:background .42s ease,color .42s ease,border-color .42s ease;
}
body.context-themed .content{
  position:relative;
  isolation:isolate;
  background:
    radial-gradient(circle at 9% 8%,var(--ctx-paper-a),transparent 34%),
    radial-gradient(circle at 92% 17%,var(--ctx-paper-b),transparent 38%),
    radial-gradient(circle at 48% 104%,var(--ctx-paper-c),transparent 42%),
    linear-gradient(145deg,
      color-mix(in srgb,var(--ctx-paper-a) 58%,transparent),
      transparent 34%,
      color-mix(in srgb,var(--ctx-paper-b) 54%,transparent) 68%,
      color-mix(in srgb,var(--ctx-paper-c) 52%,transparent)),
    linear-gradient(180deg,#fffdf9,#fbf7f0)!important;
  transition:background .46s ease;
}
body.context-themed .content::before{
  content:"";
  position:absolute;
  z-index:-1;
  left:-8%;
  right:42%;
  top:8px;
  height:46px;
  pointer-events:none;
  opacity:.26;
  transform:rotate(-1.1deg);
  background:
    radial-gradient(ellipse at 15% 52%,var(--ctx-paper-a) 0 20%,transparent 22%),
    radial-gradient(ellipse at 45% 43%,var(--ctx-paper-b) 0 24%,transparent 26%),
    radial-gradient(ellipse at 76% 55%,var(--ctx-paper-c) 0 21%,transparent 23%);
  border-radius:48% 52% 42% 58% / 60% 44% 56% 40%;
}
body.context-themed .content::after{
  content:"";
  position:absolute;
  z-index:-1;
  right:-10%;
  bottom:5%;
  width:52%;
  height:70px;
  pointer-events:none;
  opacity:.20;
  transform:rotate(1.4deg);
  background:linear-gradient(
    102deg,
    transparent,
    var(--ctx-paper-b),
    var(--ctx-paper-a),
    transparent
  );
  clip-path:polygon(
    0 43%,12% 25%,25% 37%,39% 18%,
    53% 34%,69% 16%,84% 35%,100% 24%,
    96% 68%,82% 57%,67% 78%,51% 61%,
    34% 81%,18% 63%,4% 76%
  );
}
body.context-themed .content-head{
  position:relative;
  overflow:hidden;
  background:
    linear-gradient(112deg,var(--ctx-soft-a),var(--ctx-soft-b) 52%,var(--ctx-soft-c)),
    linear-gradient(180deg,rgba(255,253,248,.98),rgba(249,244,235,.97))!important;
  border-bottom-color:color-mix(in srgb,var(--ctx-a) 24%,transparent)!important;
}
body.context-themed .content-head::before{
  content:"";
  position:absolute;
  left:-4%;right:26%;bottom:-20px;height:34px;
  pointer-events:none;
  opacity:.48;
  transform:rotate(-1.2deg);
  filter:blur(.2px);
  background:
    radial-gradient(ellipse at 16% 44%,var(--ctx-a) 0 17%,transparent 19%),
    radial-gradient(ellipse at 43% 54%,var(--ctx-b) 0 22%,transparent 24%),
    radial-gradient(ellipse at 73% 45%,var(--ctx-c) 0 20%,transparent 22%);
  border-radius:45% 54% 41% 58% / 62% 40% 60% 38%;
}

}

body.context-themed .right-menu{

    linear-gradient(145deg,var(--ctx-soft-a),transparent 47%),

/* Always show map header add button & toolbar */

/* Chalkboard Diagram Stage */
.topic-diagram-stage {
  margin-bottom: 1.5rem;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 2px 8px rgba(0,0,0,0.04);
}

.diagram-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 14px;
  background: rgba(0,0,0,0.03);
  border-bottom: 1px solid var(--line);
  font-size: 0.78rem;
}

.diagram-tag {
  font-weight: 700;
  color: var(--muted);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.btn-copy-filename {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 9px;
  font-size: 0.75rem;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 4px;
  color: var(--ink);
  cursor: pointer;
  transition: all 0.15s ease;
}

.btn-copy-filename:hover {
  background: var(--blue);
  color: #fff;
  border-color: var(--blue);
}

.diagram-frame {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #182226;
  min-height: 200px;
  max-height: 380px;
  overflow: hidden;
  cursor: zoom-in;
}

.diagram-img {
  max-width: 100%;
  max-height: 380px;
  width: auto;
  height: auto;
  object-fit: contain;
  display: block;
  transition: transform 0.2s ease;
}

.diagram-frame:hover .diagram-img {
  transform: scale(1.015);
}

.diagram-overlay {
  position: absolute;
  bottom: 8px;
  right: 12px;
  background: rgba(0,0,0,0.65);
  color: #fff;
  padding: 3px 8px;
  border-radius: 4px;
  font-size: 0.72rem;
  opacity: 0;
  transition: opacity 0.2s;
  pointer-events: none;
}

.diagram-frame:hover .diagram-overlay {
  opacity: 1;
}

.diagram-caption {
  padding: 8px 14px;
  font-size: 0.75rem;
  color: var(--muted);
  background: rgba(0,0,0,0.015);
  border-top: 1px solid var(--line);
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px;
}

.diagram-caption code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  background: rgba(0,0,0,0.05);
  padding: 1px 5px;
  border-radius: 3px;
  color: var(--ink);
}

.diagram-hint {
  color: var(--muted);
}

/* Lightbox Modal with Pinch/Scroll Zoom & Pan */
.lightbox-modal {
  position: fixed;
  inset: 0;
  z-index: 10000;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 16px;
  touch-action: none;
}

.lightbox-modal.active {
  display: flex;
}

.lightbox-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(8, 12, 18, 0.92);
  backdrop-filter: blur(8px);
  cursor: pointer;
}

.lightbox-content {
  position: relative;
  z-index: 1;
  max-width: 96vw;
  max-height: 94vh;
  width: 96vw;
  height: 92vh;
  display: flex;
  flex-direction: column;
  background: #111827;
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 10px;
  overflow: hidden;
  box-shadow: 0 25px 60px rgba(0,0,0,0.7);
}

.lightbox-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 18px;
  background: #0f172a;
  color: #f1f5f9;
  border-bottom: 1px solid rgba(255,255,255,0.1);
  font-size: 0.88rem;
  flex-shrink: 0;
}

.lightbox-title {
  font-weight: 600;
  letter-spacing: 0.02em;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.lightbox-tools {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: 12px;
}

.lightbox-btn {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  color: #e2e8f0;
  font-size: 0.95rem;
  padding: 4px 10px;
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.15s ease;
  user-select: none;
}

.lightbox-btn:hover {
  background: rgba(255,255,255,0.18);
  color: #fff;
}

.lightbox-zoom-val {
  font-size: 0.8rem;
  color: #94a3b8;
  font-family: monospace;
  min-width: 44px;
  text-align: center;
}

.lightbox-close {
  background: #dc2626;
  border: none;
  color: #fff;
  font-size: 1.2rem;
  line-height: 1;
  cursor: pointer;
  padding: 5px 12px;
  border-radius: 6px;
  font-weight: bold;
  transition: background 0.15s ease;
}

.lightbox-close:hover {
  background: #b91c1c;
}

.lightbox-body {
  flex: 1;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #090d16;
  touch-action: none;
  cursor: grab;
}

.lightbox-img-wrapper {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  height: 100%;
}

.lightbox-body img {
  max-width: 92%;
  max-height: 90%;
  object-fit: contain;
  border-radius: 6px;
  transition: transform 0.08s ease-out;
  transform-origin: center center;
  user-select: none;
  -webkit-user-drag: none;
}

.lightbox-footer-hint {
  padding: 6px 16px;
  background: #0f172a;
  border-top: 1px solid rgba(255,255,255,0.06);
  font-size: 0.75rem;
  color: #64748b;
  text-align: center;
  flex-shrink: 0;
}

/* Chalkboard Screen / Black Screen for Missing Images */

  width: 100%;

  background: #090d16;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px dashed rgba(255, 255, 255, 0.1);
  user-select: none;
}

<script>

/* ── Compact Markdown Parser ─────────────────────────────────── */
function mdInline(text){
  const codeBlocks = [];
  let s = String(text || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');

  // Allow safe inline sub and small tags for footnotes and AI update notes
  s = s.replace(/&lt;sub&gt;([\s\S]*?)&lt;\/sub&gt;/gi, '<sub class="ai-update-note">$1</sub>');
  s = s.replace(/&lt;small&gt;([\s\S]*?)&lt;\/small&gt;/gi, '<small class="ai-update-note">$1</small>');

  // Protect inline code spans so filenames with underscores or asterisks remain untouched
  s = s.replace(/`([^`]+)`/g, (_, code) => {
    codeBlocks.push(code);
    return `\x00CODE${codeBlocks.length - 1}\x00`;
  });

  // Images and links
  s = s.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" style="max-width:100%">');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

  // Bold and italics
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/__([^_]+)__/g, '<strong>$1</strong>');
  s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  s = s.replace(/\b_([^_]+)_\b/g, '<em>$1</em>');

  // Restore inline code spans
  s = s.replace(/\x00CODE(\d+)\x00/g, (_, idx) => `<code>${codeBlocks[idx]}</code>`);

  return s;
}

function getTopicQuote(topic) {
  if (!topic) return '// Quote goes here';
  if (topic.quote && String(topic.quote).trim()) {
    return String(topic.quote).replace(/<sub[\s\S]*?<\/sub>/gi, '').trim();
  }
  // Fallback: extract quote from topic.explanation if not separate yet
  if (topic.explanation) {
    const raw = String(topic.explanation);
    const m = raw.match(/>\s*\*\*([\s\S]*?)\*\*/s) || raw.match(/>\s*([\s\S]*?)(?:\n|$)/);
    if (m) {
      return m[1].replace(/<sub[\s\S]*?<\/sub>/gi, '').trim();
    }
  }
  return '// Quote goes here';
}

function getTopicExplanation(topic) {
  if (!topic) return '';
  if (topic.quote !== undefined && topic.quote !== null) {
    // Topic already has separated quote: topic.explanation is purely explanation
    const raw = String(topic.explanation || '');
    return raw.replace(/<sub[\s\S]*?<\/sub>/gi, '').trim();
  }
  // Fallback: strip quote and footnote out of combined string
  const raw = String(topic.explanation || '');
  const m = raw.match(/>\s*\*\*([\s\S]*?)\*\*/s) || raw.match(/>\s*([\s\S]*?)(?:\n|$)/);
  let rem = raw;
  if (m) {
    rem = rem.replace(m[0], '');
  }
  return rem.replace(/<sub[\s\S]*?<\/sub>/gi, '').trim();
}

function getTopicMdContent(topic) {
  const q = getTopicQuote(topic);
  const e = getTopicExplanation(topic);
  let md = `> **${q}**\n`;
  if (e) {
    md += `\n${e}\n`;
  }
  return md;
}

function parseMd(src){
  if(!src) return '<p>Explanation not added yet.</p>';
  const clean = String(src).replace(/\r\n/g, '\n').replace(/\r/g, '\n').trim();
  // Pass through pre-existing custom rich HTML
  if(/^<(?:section|div|p|h[1-6]|ul|ol|table|pre|blockquote|details|article|header|nav|aside|figure|dl)/i.test(clean)){
    return clean;
  }

  const lines = clean.split('\n');
  let html = '';
  let i = 0;

  while(i < lines.length){
    const rawLine = lines[i];
    const trimLine = rawLine.trim();

    if(!trimLine){
      i++;
      continue;
    }

    // Fenced code block (```lang ... ```)
    if(trimLine.startsWith('```')){
      const lang = trimLine.slice(3).trim();
      let code = '';
      i++;
      while(i < lines.length && !lines[i].trim().startsWith('```')){
        code += lines[i].replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') + '\n';
        i++;
      }
      if(i < lines.length) i++; // skip closing ```
      html += `<pre><code${lang ? ' class="language-' + lang + '"' : ''}>${code}</code></pre>\n`;
      continue;
    }

    // Heading (# to ######)
    const hm = rawLine.match(/^(#{1,6})\s+(.*)/);
    if(hm){
      const level = hm[1].length;
      html += `<h${level}>${mdInline(hm[2].trim())}</h${level}>\n`;
      i++;
      continue;
    }

    // Horizontal Rule (---, ***, ___)
    if(/^[-*_]{3,}\s*$/.test(trimLine)){
      html += '<hr>\n';
      i++;
      continue;
    }

    // Blockquote (> ...)
    if(trimLine.startsWith('>')){
      let q = '';
      while(i < lines.length && lines[i].trim().startsWith('>')){
        q += lines[i].trim().replace(/^>\s?/, '') + '\n';
        i++;
      }
      html += `<blockquote>${parseMd(q.trim())}</blockquote>\n`;
      continue;
    }

    // Table (| Col 1 | Col 2 |)
    if(trimLine.startsWith('|') && trimLine.endsWith('|')){
      const tableLines = [];
      while(i < lines.length && lines[i].trim().startsWith('|') && lines[i].trim().endsWith('|')){
        tableLines.push(lines[i].trim());
        i++;
      }
      if(tableLines.length >= 2){
        let tableHtml = '<table>\n';
        const headers = tableLines[0].split('|').slice(1, -1).map(c => c.trim());
        tableHtml += '<thead><tr>' + headers.map(h => `<th>${mdInline(h)}</th>`).join('') + '</tr></thead>\n';
        tableHtml += '<tbody>\n';
        for(let r = 2; r < tableLines.length; r++){
          const cells = tableLines[r].split('|').slice(1, -1).map(c => c.trim());
          tableHtml += '<tr>' + cells.map(c => `<td>${mdInline(c)}</td>`).join('') + '</tr>\n';
        }
        tableHtml += '</tbody></table>\n';
        html += tableHtml;
        continue;
      }
    }

    // Unordered List (- item or * item)
    if(/^[-*+]\s/.test(trimLine)){
      html += '<ul>\n';
      while(i < lines.length && /^[-*+]\s/.test(lines[i].trim())){
        html += `<li>${mdInline(lines[i].trim().replace(/^[-*+]\s+/, ''))}</li>\n`;
        i++;
      }
      html += '</ul>\n';
      continue;
    }

    // Ordered List (1. item)
    if(/^\d+\.\s/.test(trimLine)){
      html += '<ol>\n';
      while(i < lines.length && /^\d+\.\s/.test(lines[i].trim())){
        html += `<li>${mdInline(lines[i].trim().replace(/^\d+\.\s+/, ''))}</li>\n`;
        i++;
      }
      html += '</ol>\n';
      continue;
    }

    // Paragraph
    let para = '';
    while(i < lines.length && lines[i].trim() &&
      !lines[i].match(/^#{1,6}\s/) &&
      !lines[i].trim().startsWith('```') &&
      !lines[i].trim().startsWith('>') &&
      !/^[-*+]\s/.test(lines[i].trim()) &&
      !/^\d+\.\s/.test(lines[i].trim()) &&
      !/^[-*_]{3,}\s*$/.test(lines[i].trim()) &&
      !(lines[i].trim().startsWith('|') && lines[i].trim().endsWith('|'))){
      para += (para ? ' ' : '') + lines[i].trim();
      i++;
    }
    html += `<p>${mdInline(para)}</p>\n`;
  }

  return html;
}

const INITIAL_LIBRARY=[{"name":"Core Java Concepts","groups":[{"name":"Original outline","topics":[{"title":"What is Core Java?","quote":"Core Java is the foundational Java language and standard library used to build general-purpose applications. It includes syntax, OOP, collections, exceptions, streams, concurrency, I/O, and JVM fundamentals.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__what_is_core_java.png","doc":"docs/part-01/core_java_concepts__original_outline__what_is_core_java.md"},{"title":"Definition and Overview","quote":"Java is a strongly typed, object-oriented language compiled into bytecode that runs on the JVM. Its main strengths are portability, a rich ecosystem, automatic memory management, and mature tooling.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__definition_and_overview.png","doc":"docs/part-01/core_java_concepts__original_outline__definition_and_overview.md"},{"title":"Java Basics","quote":"Java basics cover how a program is written and executed: classes, the main method, variables, data types, operators, conditions, loops, and methods. These are the building blocks for every larger Java application.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__java_basics.png","doc":"docs/part-01/core_java_concepts__original_outline__java_basics.md"},{"title":"Data Types","quote":"Java has primitive types such as int, long, double, boolean, and char, plus reference types such as String, arrays, and objects. The chosen type controls what values can be stored and how much memory and precision are used.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__data_types.png","doc":"docs/part-01/core_java_concepts__original_outline__data_types.md"},{"title":"Variables","quote":"A variable is a named storage location whose value can be read or changed during program execution. In Java, every variable has a declared type, scope, lifetime, and initialization rule.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__variables.png","doc":"docs/part-01/core_java_concepts__original_outline__variables.md"},{"title":"Operators","quote":"Operators perform actions on values, such as arithmetic, comparison, assignment, logical checks, and bit manipulation. Operator precedence decides the evaluation order, so parentheses are useful when clarity matters.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__operators.png","doc":"docs/part-01/core_java_concepts__original_outline__operators.md"},{"title":"Object-Oriented Programming (OOP)","quote":"OOP organizes software around objects that combine state and behavior. Java uses encapsulation, inheritance, polymorphism, and abstraction to create reusable and maintainable designs.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__object_oriented_programming_oop.png","doc":"docs/part-01/core_java_concepts__original_outline__object_oriented_programming_oop.md"},{"title":"Classes and Objects","quote":"A class is a blueprint that defines fields and methods, while an object is a runtime instance of that class. Multiple objects can share the same structure but hold different state.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__classes_and_objects.png","doc":"docs/part-01/core_java_concepts__original_outline__classes_and_objects.md"},{"title":"Inheritance","quote":"Inheritance lets one class reuse and extend the behavior of another class through an is-a relationship. It can reduce duplication, but composition is often safer when the relationship is not truly hierarchical.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__inheritance.png","doc":"docs/part-01/core_java_concepts__original_outline__inheritance.md"},{"title":"Polymorphism","quote":"Polymorphism allows the same interface or parent reference to represent different concrete implementations. The method that runs is selected at runtime based on the actual object.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__polymorphism.png","doc":"docs/part-01/core_java_concepts__original_outline__polymorphism.md"},{"title":"Encapsulation","quote":"Encapsulation keeps an object\u0027s data and behavior together while controlling access through methods. It protects invariants, reduces accidental misuse, and allows the internal implementation to change safely.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__encapsulation.png","doc":"docs/part-01/core_java_concepts__original_outline__encapsulation.md"},{"title":"Abstraction","quote":"Abstraction exposes what an object can do while hiding unnecessary implementation details. In Java, interfaces and abstract classes help callers depend on stable contracts instead of concrete internals.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__abstraction.png","doc":"docs/part-01/core_java_concepts__original_outline__abstraction.md"},{"title":"Exception Handling in Java","quote":"Exception handling separates normal business flow from error recovery. Java uses try, catch, finally, throw, and throws so failures can be handled, translated, logged, or propagated intentionally.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__exception_handling_in_java.png","doc":"docs/part-01/core_java_concepts__original_outline__exception_handling_in_java.md"},{"title":"Try-Catch Block","quote":"A try block contains code that may fail, while catch handles a matching exception. Catch only errors you can meaningfully recover from or translate; otherwise let them propagate.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__try_catch_block.png","doc":"docs/part-01/core_java_concepts__original_outline__try_catch_block.md"},{"title":"Custom Exceptions","quote":"Custom exceptions express domain-specific failures such as InvalidOrderException or InsufficientBalanceException. They make error handling clearer and help callers distinguish business problems from technical failures.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__custom_exceptions.png","doc":"docs/part-01/core_java_concepts__original_outline__custom_exceptions.md"},{"title":"Finally Block","quote":"A finally block runs after try and catch whether an exception occurs or not, so it is useful for cleanup. For closeable resources, try-with-resources is usually safer and clearer.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__finally_block.png","doc":"docs/part-01/core_java_concepts__original_outline__finally_block.md"},{"title":"Collections Framework","quote":"The Java Collections Framework provides reusable data structures and algorithms for storing, retrieving, grouping, sorting, and processing objects. Its main abstractions include List, Set, Queue, and Map.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__collections_framework.png","doc":"docs/part-01/core_java_concepts__original_outline__collections_framework.md"},{"title":"Overview of Collections Framework","quote":"Collections are organized around interfaces, implementations, and utility algorithms. Choosing the right collection depends on ordering, uniqueness, lookup speed, insertion cost, concurrency, and memory needs.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__overview_of_collections_framework.png","doc":"docs/part-01/core_java_concepts__original_outline__overview_of_collections_framework.md"},{"title":"Collection Interfaces","quote":"Collection interfaces define behavior without fixing implementation details. Programming to List, Set, Queue, or Map makes code easier to replace, test, and optimize later.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__collection_interfaces.png","doc":"docs/part-01/core_java_concepts__original_outline__collection_interfaces.md"},{"title":"List Interface","quote":"List stores elements in insertion order and allows duplicates and index-based access. Common implementations are ArrayList for fast random access and LinkedList for frequent end insertions or deque operations.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__list_interface.png","doc":"docs/part-01/core_java_concepts__original_outline__list_interface.md"},{"title":"Set Interface","quote":"Set stores unique elements and does not allow duplicates according to equals and hashCode. HashSet favors fast lookup, LinkedHashSet preserves insertion order, and TreeSet keeps elements sorted.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__set_interface.png","doc":"docs/part-01/core_java_concepts__original_outline__set_interface.md"},{"title":"Queue Interface","quote":"Queue models elements waiting to be processed, usually in FIFO order, though priority queues are different. Methods such as offer, poll, and peek are preferred because they handle empty or full conditions cleanly.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__queue_interface.png","doc":"docs/part-01/core_java_concepts__original_outline__queue_interface.md"},{"title":"Collection Classes","quote":"Collection classes are concrete implementations of collection interfaces. Their internal data structure determines performance, ordering, duplicate handling, thread safety, and memory behavior.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__collection_classes.png","doc":"docs/part-01/core_java_concepts__original_outline__collection_classes.md"},{"title":"ArrayList","quote":"ArrayList uses a resizable array, giving fast indexed reads and efficient appends. Insertions or removals in the middle are more expensive because later elements must be shifted.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__arraylist.png","doc":"docs/part-01/core_java_concepts__original_outline__arraylist.md"},{"title":"HashSet","quote":"HashSet stores unique elements using a HashMap internally. Average add, remove, and contains operations are constant time when hashCode and equals are implemented correctly.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__hashset.png","doc":"docs/part-01/core_java_concepts__original_outline__hashset.md"},{"title":"PriorityQueue","quote":"PriorityQueue retrieves elements according to priority rather than insertion order. Java implements it as a heap, so peek is fast while insertion and removal are logarithmic.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__priorityqueue.png","doc":"docs/part-01/core_java_concepts__original_outline__priorityqueue.md"},{"title":"Iterators and Iteration","quote":"Iteration is the controlled traversal of collection elements. Iterators hide internal structure and provide a consistent way to read or safely remove elements while traversing.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__iterators_and_iteration.png","doc":"docs/part-01/core_java_concepts__original_outline__iterators_and_iteration.md"},{"title":"Iterator Interface","quote":"Iterator provides hasNext, next, and optional remove operations for forward traversal. Most standard collection iterators are fail-fast and may throw ConcurrentModificationException after structural modification.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__iterator_interface.png","doc":"docs/part-01/core_java_concepts__original_outline__iterator_interface.md"},{"title":"ListIterator Interface","quote":"ListIterator extends Iterator with bidirectional traversal, index awareness, and element replacement or insertion. It is available only for List implementations.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__listiterator_interface.png","doc":"docs/part-01/core_java_concepts__original_outline__listiterator_interface.md"},{"title":"Sorting Collections","quote":"Collections can be sorted using natural ordering or an explicit comparator. Sorting requires a consistent comparison rule and generally costs O(n log n).","explanation":"","image":"images/part-01/core_java_concepts__original_outline__sorting_collections.png","doc":"docs/part-01/core_java_concepts__original_outline__sorting_collections.md"},{"title":"Comparable Interface","quote":"Comparable defines a class\u0027s natural ordering through compareTo. Use it when one primary order is intrinsic to the type, such as chronological order for dates.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__comparable_interface.png","doc":"docs/part-01/core_java_concepts__original_outline__comparable_interface.md"},{"title":"Comparator Interface","quote":"Comparator defines external or alternative ordering without changing the class. Comparators can be chained to sort by multiple fields and reversed for descending order.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__comparator_interface.png","doc":"docs/part-01/core_java_concepts__original_outline__comparator_interface.md"},{"title":"Java Streams","quote":"Java Streams provide a declarative pipeline for transforming and aggregating data. A stream does not store data; it processes elements from a source using lazy intermediate operations and a terminal operation.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__java_streams.png","doc":"docs/part-01/core_java_concepts__original_outline__java_streams.md"},{"title":"Introduction to Java Streams","quote":"Streams let you describe what result you want through operations such as filter, map, and collect. They reduce loop boilerplate but should remain readable and free of hidden side effects.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__introduction_to_java_streams.png","doc":"docs/part-01/core_java_concepts__original_outline__introduction_to_java_streams.md"},{"title":"Stream API","quote":"The Stream API builds pipelines from a source, zero or more intermediate operations, and one terminal operation. Streams are single-use and usually evaluated lazily.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__stream_api.png","doc":"docs/part-01/core_java_concepts__original_outline__stream_api.md"},{"title":"Stream Creation","quote":"Streams can be created from collections, arrays, values, files, generators, or builders. Choose a finite source unless the pipeline includes a limiting operation.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__stream_creation.png","doc":"docs/part-01/core_java_concepts__original_outline__stream_creation.md"},{"title":"Intermediate Operations","quote":"Intermediate operations such as filter, map, flatMap, distinct, and sorted return another stream. They are lazy and run only when a terminal operation requests results.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__intermediate_operations.png","doc":"docs/part-01/core_java_concepts__original_outline__intermediate_operations.md"},{"title":"Terminal Operations","quote":"Terminal operations such as collect, reduce, count, forEach, and findFirst trigger stream execution. After a terminal operation, the stream cannot be reused.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__terminal_operations.png","doc":"docs/part-01/core_java_concepts__original_outline__terminal_operations.md"},{"title":"Stream Collectors","quote":"Collectors define how stream elements are accumulated into lists, maps, groups, summaries, or custom results. They package supplier, accumulator, combiner, and finishing behavior.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__stream_collectors.png","doc":"docs/part-01/core_java_concepts__original_outline__stream_collectors.md"},{"title":"Collector Interface","quote":"Collector is the contract behind collect operations. It describes how to create a result container, add elements, combine partial results, and optionally transform the final result.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__collector_interface.png","doc":"docs/part-01/core_java_concepts__original_outline__collector_interface.md"},{"title":"Joining Collector","quote":"Collectors.joining combines stream elements into one String, optionally with a delimiter, prefix, and suffix. It is ideal for readable output such as comma-separated names without manual StringBuilder logic.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__joining_collector.png","doc":"docs/part-01/core_java_concepts__original_outline__joining_collector.md"},{"title":"Parallel Streams","quote":"A parallel stream splits work across the ForkJoin common pool and combines partial results. It can help CPU-heavy, independent operations on large data sets, but it is not automatically faster.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__parallel_streams.png","doc":"docs/part-01/core_java_concepts__original_outline__parallel_streams.md"},{"title":"When to Use Parallel Streams","quote":"Use parallel streams when work is CPU-bound, stateless, associative, sufficiently large, and easy to split. Avoid them for blocking I/O, small collections, shared mutable state, or latency-sensitive server code.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__when_to_use_parallel_streams.png","doc":"docs/part-01/core_java_concepts__original_outline__when_to_use_parallel_streams.md"},{"title":"Benefits and Drawbacks","quote":"Parallel processing can reduce execution time with minimal code changes, but adds coordination cost, ordering overhead, shared-pool contention, and harder debugging. Measure with realistic benchmarks before adopting it.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__benefits_and_drawbacks.png","doc":"docs/part-01/core_java_concepts__original_outline__benefits_and_drawbacks.md"},{"title":"Functional Interfaces","quote":"A functional interface has exactly one abstract method and can be implemented with a lambda or method reference. Default and static methods do not affect its functional status.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__functional_interfaces.png","doc":"docs/part-01/core_java_concepts__original_outline__functional_interfaces.md"},{"title":"What are Functional Interfaces?","quote":"Functional interfaces represent behavior as values, allowing methods to receive, return, and compose logic. Examples include Predicate, Function, Consumer, Supplier, Runnable, and Callable.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__what_are_functional_interfaces.png","doc":"docs/part-01/core_java_concepts__original_outline__what_are_functional_interfaces.md"},{"title":"Common Functional Interfaces","quote":"Java provides standard functional interfaces for testing values, transforming data, consuming inputs, supplying results, and combining values. Reusing them avoids unnecessary custom interfaces.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__common_functional_interfaces.png","doc":"docs/part-01/core_java_concepts__original_outline__common_functional_interfaces.md"},{"title":"Runnable","quote":"Runnable represents an action with no input and no return value through run(). It is commonly submitted to threads or executors when only execution matters.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__runnable.png","doc":"docs/part-01/core_java_concepts__original_outline__runnable.md"},{"title":"Supplier","quote":"Supplier produces a value without receiving an argument. It is useful for lazy creation, factories, defaults, deferred computation, and dependency providers.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__supplier.png","doc":"docs/part-01/core_java_concepts__original_outline__supplier.md"},{"title":"Consumer","quote":"Consumer accepts a value and returns nothing. It is suited to side-effecting work such as logging, sending, storing, or updating an external target.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__consumer.png","doc":"docs/part-01/core_java_concepts__original_outline__consumer.md"},{"title":"Function","quote":"Function transforms an input of type T into an output of type R. Functions can be chained with compose and andThen to build readable transformation pipelines.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__function.png","doc":"docs/part-01/core_java_concepts__original_outline__function.md"},{"title":"Lambda Expressions with Functional Interfaces","quote":"A lambda provides a compact implementation of a functional interface\u0027s single abstract method. The compiler infers the target interface from the surrounding assignment or method parameter.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__lambda_expressions_with_functional_interfaces.png","doc":"docs/part-01/core_java_concepts__original_outline__lambda_expressions_with_functional_interfaces.md"},{"title":"Syntax and Structure","quote":"Lambda syntax is parameters, an arrow, and either an expression or block body. Parentheses, parameter types, and return statements may be omitted when Java can infer them safely.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__syntax_and_structure.png","doc":"docs/part-01/core_java_concepts__original_outline__syntax_and_structure.md"},{"title":"Examples","quote":"Typical lambda examples include filtering with Predicate, transforming with Function, printing with Consumer, and creating values with Supplier. Good lambdas stay short, clear, and side-effect aware.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__examples.png","doc":"docs/part-01/core_java_concepts__original_outline__examples.md"},{"title":"Method References","quote":"Method references are concise lambdas that call an existing method, such as String::trim or System.out::println. They improve readability when the lambda only forwards its arguments.","explanation":"","image":"images/part-01/core_java_concepts__original_outline__method_references.png","doc":"docs/part-01/core_java_concepts__original_outline__method_references.md"}]}]},{"name":"Spring Framework","groups":[{"name":"Original outline","topics":[{"title":"Introduction to Spring","quote":"Spring is a Java application framework centered on dependency injection, modular infrastructure, and declarative programming. It reduces boilerplate while keeping business code loosely coupled and testable.","explanation":"","image":"images/part-01/spring_framework__original_outline__introduction_to_spring.png","doc":"docs/part-01/spring_framework__original_outline__introduction_to_spring.md"},{"title":"What is Spring?","quote":"Spring is an ecosystem for building Java applications with managed objects, web frameworks, data access, transactions, security, messaging, and cloud integrations. Its container creates and connects application components.","explanation":"","image":"images/part-01/spring_framework__original_outline__what_is_spring.png","doc":"docs/part-01/spring_framework__original_outline__what_is_spring.md"},{"title":"Key Features of Spring","quote":"Spring\u0027s major strengths include IoC, dependency injection, AOP, transaction management, MVC, data integration, security, testing support, and a large modular ecosystem.","explanation":"","image":"images/part-01/spring_framework__original_outline__key_features_of_spring.png","doc":"docs/part-01/spring_framework__original_outline__key_features_of_spring.md"},{"title":"Spring Boot Basics","quote":"Spring Boot accelerates Spring development through auto-configuration, starter dependencies, embedded servers, and production-ready defaults. It removes much of the manual setup needed for a deployable application.","explanation":"","image":"images/part-01/spring_framework__original_outline__spring_boot_basics.png","doc":"docs/part-01/spring_framework__original_outline__spring_boot_basics.md"},{"title":"What is Spring Boot?","quote":"Spring Boot is an opinionated layer on Spring that creates standalone, production-ready applications quickly. It configures common infrastructure automatically based on dependencies and properties.","explanation":"","image":"images/part-01/spring_framework__original_outline__what_is_spring_boot.png","doc":"docs/part-01/spring_framework__original_outline__what_is_spring_boot.md"},{"title":"Features of Spring Boot","quote":"Spring Boot offers starters, auto-configuration, embedded servers, externalized configuration, Actuator, profiles, executable JARs, and sensible defaults that remain customizable.","explanation":"","image":"images/part-01/spring_framework__original_outline__features_of_spring_boot.png","doc":"docs/part-01/spring_framework__original_outline__features_of_spring_boot.md"},{"title":"Dependency Injection in Spring","quote":"Spring Dependency Injection means the container creates application objects and supplies their dependencies. This removes manual construction from business code and improves substitution, testing, and lifecycle management.","explanation":"","image":"images/part-01/spring_framework__original_outline__dependency_injection_in_spring.png","doc":"docs/part-01/spring_framework__original_outline__dependency_injection_in_spring.md"},{"title":"What is Dependency Injection?","quote":"Dependency Injection provides an object\u0027s collaborators from outside instead of letting the object create them. The object focuses on its responsibility while wiring is handled separately.","explanation":"","image":"images/part-01/spring_framework__original_outline__what_is_dependency_injection.png","doc":"docs/part-01/spring_framework__original_outline__what_is_dependency_injection.md"},{"title":"Types of Dependency Injection","quote":"The common DI styles are constructor, setter, and field injection. Constructor injection is preferred for required dependencies, while setters suit optional or reconfigurable dependencies.","explanation":"","image":"images/part-01/spring_framework__original_outline__types_of_dependency_injection.png","doc":"docs/part-01/spring_framework__original_outline__types_of_dependency_injection.md"},{"title":"Constructor Injection","quote":"Constructor injection supplies all required dependencies when an object is created. It supports immutability, exposes mandatory collaborators clearly, and makes unit testing straightforward.","explanation":"","image":"images/part-01/spring_framework__original_outline__constructor_injection.png","doc":"docs/part-01/spring_framework__original_outline__constructor_injection.md"},{"title":"Setter Injection","quote":"Setter injection provides a dependency after object creation through a setter method. It is useful for optional dependencies but permits partially configured mutable objects.","explanation":"","image":"images/part-01/spring_framework__original_outline__setter_injection.png","doc":"docs/part-01/spring_framework__original_outline__setter_injection.md"},{"title":"Field Injection","quote":"Field injection writes dependencies directly into fields through reflection. It is concise, but hides requirements, complicates plain unit tests, and should generally be avoided in production design.","explanation":"","image":"images/part-01/spring_framework__original_outline__field_injection.png","doc":"docs/part-01/spring_framework__original_outline__field_injection.md"},{"title":"Benefits of Dependency Injection","quote":"DI reduces coupling, centralizes object creation, improves testability, supports alternate implementations, and clarifies component boundaries. It also lets the framework manage lifecycle and cross-cutting infrastructure.","explanation":"","image":"images/part-01/spring_framework__original_outline__benefits_of_dependency_injection.png","doc":"docs/part-01/spring_framework__original_outline__benefits_of_dependency_injection.md"},{"title":"Spring MVC","quote":"Spring MVC is Spring\u0027s servlet-based web framework for HTTP applications and REST APIs. It maps requests to controllers, binds inputs, validates data, and converts responses through a configurable pipeline.","explanation":"","image":"images/part-01/spring_framework__original_outline__spring_mvc.png","doc":"docs/part-01/spring_framework__original_outline__spring_mvc.md"},{"title":"What is Spring MVC?","quote":"Spring MVC follows the Model-View-Controller pattern and is built around DispatcherServlet. It supports both server-rendered views and REST endpoints using annotations and message converters.","explanation":"","image":"images/part-01/spring_framework__original_outline__what_is_spring_mvc.png","doc":"docs/part-01/spring_framework__original_outline__what_is_spring_mvc.md"},{"title":"Key Components of Spring MVC","quote":"Core components include DispatcherServlet, handler mappings, handler adapters, controllers, argument resolvers, validators, message converters, exception resolvers, and view resolvers.","explanation":"","image":"images/part-01/spring_framework__original_outline__key_components_of_spring_mvc.png","doc":"docs/part-01/spring_framework__original_outline__key_components_of_spring_mvc.md"},{"title":"DispatcherServlet","quote":"DispatcherServlet is the front controller for Spring MVC. It receives requests, locates the matching handler, invokes it through an adapter, and coordinates response rendering or body conversion.","explanation":"","image":"images/part-01/spring_framework__original_outline__dispatcherservlet.png","doc":"docs/part-01/spring_framework__original_outline__dispatcherservlet.md"},{"title":"Controllers","quote":"Controllers receive web requests, validate and delegate work to services, then return views or response bodies. They should remain thin and avoid owning business or persistence logic.","explanation":"","image":"images/part-01/spring_framework__original_outline__controllers.png","doc":"docs/part-01/spring_framework__original_outline__controllers.md"},{"title":"ModelAndView","quote":"ModelAndView carries both a logical view name and model data for server-side rendering. It is useful in traditional MVC applications but is uncommon in REST controllers.","explanation":"","image":"images/part-01/spring_framework__original_outline__modelandview.png","doc":"docs/part-01/spring_framework__original_outline__modelandview.md"},{"title":"Spring MVC Annotations","quote":"Spring MVC annotations declare controllers, routes, parameters, request bodies, response bodies, validation, status codes, and exception handling. They replace most XML-based request mapping configuration.","explanation":"","image":"images/part-01/spring_framework__original_outline__spring_mvc_annotations.png","doc":"docs/part-01/spring_framework__original_outline__spring_mvc_annotations.md"},{"title":"@Controller","quote":"@Controller marks a class as an MVC web component whose methods may return view names. Add @ResponseBody, or use @RestController, when methods should write data directly to the HTTP response.","explanation":"","image":"images/part-01/spring_framework__original_outline__controller.png","doc":"docs/part-01/spring_framework__original_outline__controller.md"},{"title":"@RequestMapping","quote":"@RequestMapping maps requests by path, HTTP method, headers, parameters, content type, or accepted response type. It can define a common route at class level and narrower routes on methods.","explanation":"","image":"images/part-01/spring_framework__original_outline__requestmapping.png","doc":"docs/part-01/spring_framework__original_outline__requestmapping.md"},{"title":"@GetMapping","quote":"@GetMapping is a specialized RequestMapping for HTTP GET. Use it for safe, read-oriented operations that should not modify server state.","explanation":"","image":"images/part-01/spring_framework__original_outline__getmapping.png","doc":"docs/part-01/spring_framework__original_outline__getmapping.md"},{"title":"@PostMapping","quote":"@PostMapping maps HTTP POST requests, commonly used for creating resources or submitting commands. Request validation and idempotency strategy should match the business operation.","explanation":"","image":"images/part-01/spring_framework__original_outline__postmapping.png","doc":"docs/part-01/spring_framework__original_outline__postmapping.md"},{"title":"Spring MVC Configuration","quote":"Spring MVC configuration customizes formatters, converters, interceptors, CORS, content negotiation, argument resolvers, static resources, and view handling. Spring Boot supplies defaults that can be extended.","explanation":"","image":"images/part-01/spring_framework__original_outline__spring_mvc_configuration.png","doc":"docs/part-01/spring_framework__original_outline__spring_mvc_configuration.md"},{"title":"Java-based Configuration","quote":"Java configuration uses @Configuration classes and @Bean methods to define application components explicitly. It is type-safe, refactor-friendly, and the preferred modern alternative to XML.","explanation":"","image":"images/part-01/spring_framework__original_outline__java_based_configuration.png","doc":"docs/part-01/spring_framework__original_outline__java_based_configuration.md"},{"title":"XML-based Configuration","quote":"XML configuration declares beans and wiring outside compiled code. It remains useful in legacy systems, but is more verbose and less refactor-safe than annotations or Java configuration.","explanation":"","image":"images/part-01/spring_framework__original_outline__xml_based_configuration.png","doc":"docs/part-01/spring_framework__original_outline__xml_based_configuration.md"},{"title":"Spring Security","quote":"Spring Security provides authentication, authorization, exploit protection, and security-context management for Java applications. Its filter chain evaluates every web request before controller execution.","explanation":"","image":"images/part-01/spring_framework__original_outline__spring_security.png","doc":"docs/part-01/spring_framework__original_outline__spring_security.md"},{"title":"What is Spring Security?","quote":"Spring Security is a customizable security framework for web applications, APIs, and method calls. It supports sessions, JWT, OAuth 2.0, OpenID Connect, password encoding, and policy enforcement.","explanation":"","image":"images/part-01/spring_framework__original_outline__what_is_spring_security.png","doc":"docs/part-01/spring_framework__original_outline__what_is_spring_security.md"},{"title":"Key Features of Spring Security","quote":"Major features include authentication providers, request and method authorization, security filters, password hashing, session protection, CSRF defense, OAuth integration, and secure default headers.","explanation":"","image":"images/part-01/spring_framework__original_outline__key_features_of_spring_security.png","doc":"docs/part-01/spring_framework__original_outline__key_features_of_spring_security.md"},{"title":"Authentication","quote":"Authentication establishes who the caller is by validating credentials or tokens. On success, Spring stores an Authentication object containing identity and granted authorities in the SecurityContext.","explanation":"","image":"images/part-01/spring_framework__original_outline__authentication.png","doc":"docs/part-01/spring_framework__original_outline__authentication.md"},{"title":"Authorization","quote":"Authorization decides whether an authenticated identity may perform an action. Spring can enforce access at URL, controller, service method, or domain-policy level.","explanation":"","image":"images/part-01/spring_framework__original_outline__authorization.png","doc":"docs/part-01/spring_framework__original_outline__authorization.md"},{"title":"CSRF Protection","quote":"CSRF protection prevents a malicious site from causing a browser to submit an authenticated state-changing request. It is essential for cookie-based sessions and often unnecessary for stateless bearer-token APIs.","explanation":"","image":"images/part-01/spring_framework__original_outline__csrf_protection.png","doc":"docs/part-01/spring_framework__original_outline__csrf_protection.md"},{"title":"Spring Security Authentication Flow","quote":"A request enters the security filter chain, credentials are extracted, an AuthenticationManager delegates to a provider, and successful authentication is stored in the SecurityContext before authorization continues.","explanation":"","image":"images/part-01/spring_framework__original_outline__spring_security_authentication_flow.png","doc":"docs/part-01/spring_framework__original_outline__spring_security_authentication_flow.md"},{"title":"Spring Data JPA","quote":"Spring Data JPA reduces persistence boilerplate by generating repository implementations over JPA. It supports CRUD, pagination, derived queries, specifications, projections, auditing, and custom queries.","explanation":"","image":"images/part-01/spring_framework__original_outline__spring_data_jpa.png","doc":"docs/part-01/spring_framework__original_outline__spring_data_jpa.md"},{"title":"What is Spring Data JPA?","quote":"Spring Data JPA is a repository abstraction built on the JPA specification, usually backed by Hibernate. It simplifies data access without replacing entity mapping, transactions, or persistence-context behavior.","explanation":"","image":"images/part-01/spring_framework__original_outline__what_is_spring_data_jpa.png","doc":"docs/part-01/spring_framework__original_outline__what_is_spring_data_jpa.md"},{"title":"Configuring Spring Data JPA","quote":"Configuration typically includes a datasource, JPA provider, entity scanning, repositories, transaction management, and database properties. Spring Boot auto-configures most of this from dependencies and settings.","explanation":"","image":"images/part-01/spring_framework__original_outline__configuring_spring_data_jpa.png","doc":"docs/part-01/spring_framework__original_outline__configuring_spring_data_jpa.md"},{"title":"Repository Layer","quote":"The repository layer expresses persistence operations and hides query mechanics from business services. It should expose domain-meaningful operations rather than leaking every database detail upward.","explanation":"","image":"images/part-01/spring_framework__original_outline__repository_layer.png","doc":"docs/part-01/spring_framework__original_outline__repository_layer.md"},{"title":"Custom Queries","quote":"Custom queries handle cases that derived method names cannot express clearly. Spring Data supports JPQL, native SQL, named queries, specifications, Query by Example, and custom repository implementations.","explanation":"","image":"images/part-01/spring_framework__original_outline__custom_queries.png","doc":"docs/part-01/spring_framework__original_outline__custom_queries.md"},{"title":"Advantages of Spring Data JPA","quote":"It reduces repetitive DAO code, standardizes repository behavior, integrates pagination and auditing, and speeds development. The trade-off is that developers still need strong JPA and SQL knowledge for performance.","explanation":"","image":"images/part-01/spring_framework__original_outline__advantages_of_spring_data_jpa.png","doc":"docs/part-01/spring_framework__original_outline__advantages_of_spring_data_jpa.md"},{"title":"Spring Cloud","quote":"Spring Cloud provides patterns and integrations for distributed systems, including configuration, discovery, routing, resilience, messaging, and service-to-service concerns.","explanation":"","image":"images/part-01/spring_framework__original_outline__spring_cloud.png","doc":"docs/part-01/spring_framework__original_outline__spring_cloud.md"},{"title":"What is Spring Cloud?","quote":"Spring Cloud is a collection of projects that extends Spring Boot for cloud-native and microservice architectures. It integrates with registries, config stores, gateways, circuit breakers, and messaging platforms.","explanation":"","image":"images/part-01/spring_framework__original_outline__what_is_spring_cloud.png","doc":"docs/part-01/spring_framework__original_outline__what_is_spring_cloud.md"},{"title":"Key Features of Spring Cloud","quote":"Key capabilities include centralized configuration, service discovery, API gateways, load balancing, resilience, distributed messaging, tracing integration, and cloud-provider adapters.","explanation":"","image":"images/part-01/spring_framework__original_outline__key_features_of_spring_cloud.png","doc":"docs/part-01/spring_framework__original_outline__key_features_of_spring_cloud.md"},{"title":"Service Discovery with Eureka","quote":"Eureka lets service instances register their location and discover other services dynamically. Clients query the registry instead of depending on fixed hostnames and ports.","explanation":"","image":"images/part-01/spring_framework__original_outline__service_discovery_with_eureka.png","doc":"docs/part-01/spring_framework__original_outline__service_discovery_with_eureka.md"},{"title":"Spring Cloud Config","quote":"Spring Cloud Config serves externalized application settings from a central source, commonly Git. It enables environment-specific configuration and controlled updates across many services.","explanation":"","image":"images/part-01/spring_framework__original_outline__spring_cloud_config.png","doc":"docs/part-01/spring_framework__original_outline__spring_cloud_config.md"},{"title":"Circuit Breaker with Hystrix","quote":"Hystrix was a Netflix circuit-breaker library that stopped repeated calls to failing dependencies and provided fallbacks. It is now in maintenance mode; Resilience4j is the preferred modern alternative in Spring applications.","explanation":"","image":"images/part-01/spring_framework__original_outline__circuit_breaker_with_hystrix.png","doc":"docs/part-01/spring_framework__original_outline__circuit_breaker_with_hystrix.md"},{"title":"Spring Cloud Microservices","quote":"Spring Cloud helps microservices handle shared distributed concerns such as configuration, discovery, routing, resilience, and messaging. It complements Spring Boot rather than replacing service design fundamentals.","explanation":"","image":"images/part-01/spring_framework__original_outline__spring_cloud_microservices.png","doc":"docs/part-01/spring_framework__original_outline__spring_cloud_microservices.md"},{"title":"Spring AOP","quote":"Spring AOP applies cross-cutting behavior such as logging, security, metrics, and transactions around Spring-managed method calls. It is proxy-based, so only calls that pass through the proxy are intercepted.","explanation":"","image":"images/part-01/spring_framework__original_outline__spring_aop.png","doc":"docs/part-01/spring_framework__original_outline__spring_aop.md"},{"title":"What is Spring AOP?","quote":"Spring AOP is a lightweight aspect-oriented framework that separates repeated infrastructure concerns from business logic. It mainly intercepts method execution on Spring beans.","explanation":"","image":"images/part-01/spring_framework__original_outline__what_is_spring_aop.png","doc":"docs/part-01/spring_framework__original_outline__what_is_spring_aop.md"},{"title":"Key Concepts in AOP","quote":"AOP is built from aspects, advice, pointcuts, join points, and proxies. Together they define what cross-cutting logic runs, where it runs, and when it runs.","explanation":"","image":"images/part-01/spring_framework__original_outline__key_concepts_in_aop.png","doc":"docs/part-01/spring_framework__original_outline__key_concepts_in_aop.md"},{"title":"Aspect","quote":"An aspect groups a cross-cutting concern and the rules that decide where it applies. For example, one aspect may contain logging advice for all service methods.","explanation":"","image":"images/part-01/spring_framework__original_outline__aspect.png","doc":"docs/part-01/spring_framework__original_outline__aspect.md"},{"title":"Advice","quote":"Advice is the code executed before, after, around, or when a matched method throws an exception. Around advice is the most powerful because it controls whether and how the method proceeds.","explanation":"","image":"images/part-01/spring_framework__original_outline__advice.png","doc":"docs/part-01/spring_framework__original_outline__advice.md"},{"title":"Pointcut","quote":"A pointcut is an expression that selects the methods where advice should run. Good pointcuts are narrow, intention-revealing, and avoid accidentally intercepting unrelated code.","explanation":"","image":"images/part-01/spring_framework__original_outline__pointcut.png","doc":"docs/part-01/spring_framework__original_outline__pointcut.md"},{"title":"Joinpoint","quote":"A join point is a location where an aspect can be applied. In Spring AOP, the supported join points are primarily method executions on Spring-managed objects.","explanation":"","image":"images/part-01/spring_framework__original_outline__joinpoint.png","doc":"docs/part-01/spring_framework__original_outline__joinpoint.md"},{"title":"Configuring AOP","quote":"AOP can be enabled through annotations or XML, then applied using aspect classes and pointcut expressions. Proxy behavior and self-invocation limitations must be understood.","explanation":"","image":"images/part-01/spring_framework__original_outline__configuring_aop.png","doc":"docs/part-01/spring_framework__original_outline__configuring_aop.md"},{"title":"XML Configuration","quote":"XML AOP configuration declares aspects, advice, and pointcuts outside Java code. It is mostly found in legacy applications and is more verbose than an
