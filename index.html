notation-based configuration.","explanation":"","image":"images/part-01/spring_framework__original_outline__xml_configuration.png","doc":"docs/part-01/spring_framework__original_outline__xml_configuration.md"},{"title":"Annotation-based Configuration","quote":"Annotation-based AOP uses @Aspect with advice annotations such as @Around and @Before. It is concise, readable, and the standard approach in modern Spring applications.","explanation":"","image":"images/part-01/spring_framework__original_outline__annotation_based_configuration.png","doc":"docs/part-01/spring_framework__original_outline__annotation_based_configuration.md"}]},{"name":"Core Container","topics":[{"title":"Spring IoC container","quote":"The Spring IoC container creates, configures, wires, and manages application objects called beans.","explanation":"","image":"images/part-01/spring_framework__core_container__spring_ioc_container.png","doc":"docs/part-01/spring_framework__core_container__spring_ioc_container.md"},{"title":"ApplicationContext","quote":"ApplicationContext is Spring\u0027s full-featured container, adding events, resources, internationalization, environment support, and automatic post-processing.","explanation":"","image":"images/part-01/spring_framework__core_container__applicationcontext.png","doc":"docs/part-01/spring_framework__core_container__applicationcontext.md"},{"title":"BeanFactory","quote":"BeanFactory is Spring\u0027s basic dependency-injection container. ApplicationContext builds on it with richer enterprise features.","explanation":"","image":"images/part-01/spring_framework__core_container__beanfactory.png","doc":"docs/part-01/spring_framework__core_container__beanfactory.md"},{"title":"Bean definition","quote":"A bean definition is metadata describing how Spring should create and configure a bean, including class, scope, dependencies, and lifecycle settings.","explanation":"","image":"images/part-01/spring_framework__core_container__bean_definition.png","doc":"docs/part-01/spring_framework__core_container__bean_definition.md"},{"title":"Bean scopes","quote":"Bean scope controls how many instances Spring creates and how long they live, such as singleton, prototype, request, or session.","explanation":"","image":"images/part-01/spring_framework__core_container__bean_scopes.png","doc":"docs/part-01/spring_framework__core_container__bean_scopes.md"},{"title":"Singleton scope","quote":"Spring singleton scope creates one bean instance per ApplicationContext, not one instance per JVM.","explanation":"","image":"images/part-01/spring_framework__core_container__singleton_scope.png","doc":"docs/part-01/spring_framework__core_container__singleton_scope.md"},{"title":"Prototype scope","quote":"Prototype scope creates a new bean each time it is requested. Spring does not manage the full destruction lifecycle afterward.","explanation":"","image":"images/part-01/spring_framework__core_container__prototype_scope.png","doc":"docs/part-01/spring_framework__core_container__prototype_scope.md"},{"title":"Request scope","quote":"Request scope creates one bean instance per HTTP request and requires a web-aware application context.","explanation":"","image":"images/part-01/spring_framework__core_container__request_scope.png","doc":"docs/part-01/spring_framework__core_container__request_scope.md"},{"title":"Session scope","quote":"Session scope creates one bean instance per HTTP session and is useful for session-specific state.","explanation":"","image":"images/part-01/spring_framework__core_container__session_scope.png","doc":"docs/part-01/spring_framework__core_container__session_scope.md"},{"title":"Bean lifecycle","quote":"A bean typically goes through instantiation, dependency injection, aware callbacks, post-processing, initialization, use, and destruction.","explanation":"","image":"images/part-01/spring_framework__core_container__bean_lifecycle.png","doc":"docs/part-01/spring_framework__core_container__bean_lifecycle.md"},{"title":"BeanPostProcessor","quote":"BeanPostProcessor can inspect or wrap bean instances before and after initialization. Spring uses it for proxies and annotation processing.","explanation":"","image":"images/part-01/spring_framework__core_container__beanpostprocessor.png","doc":"docs/part-01/spring_framework__core_container__beanpostprocessor.md"},{"title":"BeanFactoryPostProcessor","quote":"BeanFactoryPostProcessor modifies bean definitions before bean instances are created.","explanation":"","image":"images/part-01/spring_framework__core_container__beanfactorypostprocessor.png","doc":"docs/part-01/spring_framework__core_container__beanfactorypostprocessor.md"},{"title":"FactoryBean","quote":"FactoryBean is a bean that creates another object. Retrieving its name returns the product, while prefixing with \u0026 returns the factory itself.","explanation":"","image":"images/part-01/spring_framework__core_container__factorybean.png","doc":"docs/part-01/spring_framework__core_container__factorybean.md"},{"title":"Aware interfaces","quote":"Aware interfaces let beans receive Spring infrastructure objects such as BeanName, ApplicationContext, or Environment. Prefer ordinary dependency injection when possible.","explanation":"","image":"images/part-01/spring_framework__core_container__aware_interfaces.png","doc":"docs/part-01/spring_framework__core_container__aware_interfaces.md"},{"title":"Lazy initialization","quote":"Lazy initialization delays bean creation until first use. It can improve startup but may move configuration failures into runtime.","explanation":"","image":"images/part-01/spring_framework__core_container__lazy_initialization.png","doc":"docs/part-01/spring_framework__core_container__lazy_initialization.md"}]},{"name":"Dependency Injection","topics":[{"title":"Autowiring by type","quote":"Autowiring by type asks Spring to resolve a dependency from beans compatible with the required type.","explanation":"","image":"images/part-01/spring_framework__dependency_injection__autowiring_by_type.png","doc":"docs/part-01/spring_framework__dependency_injection__autowiring_by_type.md"},{"title":"Qualifier","quote":"@Qualifier narrows dependency resolution when multiple beans share the same type.","explanation":"","image":"images/part-01/spring_framework__dependency_injection__qualifier.png","doc":"docs/part-01/spring_framework__dependency_injection__qualifier.md"},{"title":"Primary bean","quote":"@Primary marks the preferred bean when several candidates match a dependency.","explanation":"","image":"images/part-01/spring_framework__dependency_injection__primary_bean.png","doc":"docs/part-01/spring_framework__dependency_injection__primary_bean.md"},{"title":"Optional dependencies","quote":"Optional dependencies can use Optional, ObjectProvider, nullable injection, or conditional configuration. Use them only when absence is truly valid.","explanation":"","image":"images/part-01/spring_framework__dependency_injection__optional_dependencies.png","doc":"docs/part-01/spring_framework__dependency_injection__optional_dependencies.md"},{"title":"Circular dependencies","quote":"A circular dependency occurs when beans depend on each other. Constructor cycles fail immediately and usually indicate poor separation of responsibilities.","explanation":"","image":"images/part-01/spring_framework__dependency_injection__circular_dependencies.png","doc":"docs/part-01/spring_framework__dependency_injection__circular_dependencies.md"},{"title":"Dependency inversion","quote":"Dependency inversion means high-level code depends on abstractions rather than concrete details. Spring injects implementations behind those abstractions.","explanation":"","image":"images/part-01/spring_framework__dependency_injection__dependency_inversion.png","doc":"docs/part-01/spring_framework__dependency_injection__dependency_inversion.md"},{"title":"ConfigurationProperties","quote":"@ConfigurationProperties binds structured external configuration into typed Java objects.","explanation":"","image":"images/part-01/spring_framework__dependency_injection__configurationproperties.png","doc":"docs/part-01/spring_framework__dependency_injection__configurationproperties.md"},{"title":"Value injection","quote":"@Value injects individual property or expression values. It is convenient for small cases but less maintainable than typed configuration objects.","explanation":"","image":"images/part-01/spring_framework__dependency_injection__value_injection.png","doc":"docs/part-01/spring_framework__dependency_injection__value_injection.md"},{"title":"Profile-based beans","quote":"Profile-based beans are activated only when specified Spring profiles are active, allowing environment-specific implementations.","explanation":"","image":"images/part-01/spring_framework__dependency_injection__profile_based_beans.png","doc":"docs/part-01/spring_framework__dependency_injection__profile_based_beans.md"}]},{"name":"Configuration","topics":[{"title":"Java configuration","quote":"Java configuration defines beans with @Configuration classes and @Bean methods instead of XML.","explanation":"","image":"images/part-01/spring_framework__configuration__java_configuration.png","doc":"docs/part-01/spring_framework__configuration__java_configuration.md"},{"title":"Component scanning","quote":"Component scanning finds annotated classes such as @Component, @Service, @Repository, and @Controller and registers them as beans.","explanation":"","image":"images/part-01/spring_framework__configuration__component_scanning.png","doc":"docs/part-01/spring_framework__configuration__component_scanning.md"},{"title":"Conditional beans","quote":"Conditional beans are registered only when conditions match, such as a class, property, bean, resource, or platform being present.","explanation":"","image":"images/part-01/spring_framework__configuration__conditional_beans.png","doc":"docs/part-01/spring_framework__configuration__conditional_beans.md"},{"title":"Profiles","quote":"Spring profiles group environment-specific configuration and beans. Keep profile usage simple to avoid hidden combinations.","explanation":"","image":"images/part-01/spring_framework__configuration__profiles.png","doc":"docs/part-01/spring_framework__configuration__profiles.md"},{"title":"Property sources","quote":"Property sources provide configuration values from files, environment variables, system properties, command-line arguments, and custom sources.","explanation":"","image":"images/part-01/spring_framework__configuration__property_sources.png","doc":"docs/part-01/spring_framework__configuration__property_sources.md"},{"title":"Environment abstraction","quote":"Spring\u0027s Environment exposes active profiles and resolved property values across multiple property sources.","explanation":"","image":"images/part-01/spring_framework__configuration__environment_abstraction.png","doc":"docs/part-01/spring_framework__configuration__environment_abstraction.md"},{"title":"Import annotation","quote":"@Import adds configuration classes, selectors, or registrars to an application context.","explanation":"","image":"images/part-01/spring_framework__configuration__import_annotation.png","doc":"docs/part-01/spring_framework__configuration__import_annotation.md"},{"title":"Bean method proxying","quote":"Full @Configuration classes proxy @Bean method calls so repeated inter-bean calls return managed singleton instances rather than new objects.","explanation":"","image":"images/part-01/spring_framework__configuration__bean_method_proxying.png","doc":"docs/part-01/spring_framework__configuration__bean_method_proxying.md"},{"title":"Externalized configuration","quote":"Externalized configuration keeps environment-specific values outside application code so the same artifact can run in different environments.","explanation":"","image":"images/part-01/spring_framework__configuration__externalized_configuration.png","doc":"docs/part-01/spring_framework__configuration__externalized_configuration.md"}]}]},{"name":"Microservices Architecture","groups":[{"name":"Original outline","topics":[{"title":"What is Microservices?","quote":"Microservices is an architecture where a system is split into independently deployable services aligned to business capabilities. Each service owns its logic, runtime, and usually its data boundary.","explanation":"","image":"images/part-01/microservices_architecture__original_outline__what_is_microservices.png","doc":"docs/part-01/microservices_architecture__original_outline__what_is_microservices.md"},{"title":"Definition of Microservices","quote":"A microservice is a small autonomous application that exposes a clear contract and can be developed, deployed, and scaled independently. Small refers to responsibility, not a fixed code size.","explanation":"","image":"images/part-01/microservices_architecture__original_outline__definition_of_microservices.png","doc":"docs/part-01/microservices_architecture__original_outline__definition_of_microservices.md"},{"title":"Key Characteristics of Microservices","quote":"Key traits include bounded ownership, independent deployment, decentralized data, automation, observability, fault isolation, and lightweight communication through APIs or events.","explanation":"","image":"images/part-01/microservices_architecture__original_outline__key_characteristics_of_microservices.png","doc":"docs/part-01/microservices_architecture__original_outline__key_characteristics_of_microservices.md"},{"title":"Monolithic vs Microservices Architecture","quote":"A monolith deploys the application as one unit, while microservices split it into independently deployable services. Microservices improve autonomy and scaling but add network, data, and operational complexity.","explanation":"","image":"images/part-01/microservices_architecture__original_outline__monolithic_vs_microservices_architecture.png","doc":"docs/part-01/microservices_architecture__original_outline__monolithic_vs_microservices_architecture.md"},{"title":"Microservices with Spring Boot","quote":"Spring Boot is commonly used to build microservices because it provides fast setup, embedded servers, configuration, Actuator, and integration with Spring Cloud and messaging tools.","explanation":"","image":"images/part-01/microservices_architecture__original_outline__microservices_with_spring_boot.png","doc":"docs/part-01/microservices_architecture__original_outline__microservices_with_spring_boot.md"},{"title":"Spring Boot Overview","quote":"Spring Boot provides conventions and auto-configuration for creating standalone Spring applications quickly. It is especially useful for services that need consistent startup, configuration, and operational endpoints.","explanation":"","image":"images/part-01/microservices_architecture__original_outline__spring_boot_overview.png","doc":"docs/part-01/microservices_architecture__original_outline__spring_boot_overview.md"},{"title":"Creating Microservices with Spring Boot","quote":"A Spring Boot microservice typically defines a bounded responsibility, API or event contract, service layer, persistence boundary, validation, observability, and independent deployment configuration.","explanation":"","image":"images/part-01/microservices_architecture__original_outline__creating_microservices_with_spring_boot.png","doc":"docs/part-01/microservices_architecture__original_outline__creating_microservices_with_spring_boot.md"},{"title":"Best Practices in Microservices with Spring Boot","quote":"Keep services cohesive, APIs version-tolerant, calls time-bounded, operations observable, and data ownership explicit. Avoid turning Spring annotations into a substitute for sound service boundaries.","explanation":"","image":"images/part-01/microservices_architecture__original_outline__best_practices_in_microservices_with_spring_boot.png","doc":"docs/part-01/microservices_architecture__original_outline__best_practices_in_microservices_with_spring_boot.md"},{"title":"Service Discovery","quote":"Service discovery lets applications locate available service instances dynamically instead of using fixed addresses. It supports scaling, instance replacement, and changing network locations.","explanation":"","image":"images/part-01/microservices_architecture__original_outline__service_discovery.png","doc":"docs/part-01/microservices_architecture__original_outline__service_discovery.md"},{"title":"What is Service Discovery?","quote":"Service discovery is the mechanism by which a client or router finds healthy instances of a named service. Discovery may be client-side, server-side, or built into the platform.","explanation":"","image":"images/part-01/microservices_architecture__original_outline__what_is_service_discovery.png","doc":"docs/part-01/microservices_architecture__original_outline__what_is_service_discovery.md"},{"title":"Eureka for Service Discovery","quote":"Eureka is a registry where services register themselves and clients retrieve instance lists. It was designed for resilient discovery in dynamic cloud environments.","explanation":"","image":"images/part-01/microservices_architecture__original_outline__eureka_for_service_discovery.png","doc":"docs/part-01/microservices_architecture__original_outline__eureka_for_service_discovery.md"},{"title":"Configuring Eureka Server and Clients","quote":"A Eureka server hosts the registry, while clients register their metadata and periodically renew leases. Clients use the registry to resolve logical service names into reachable instances.","explanation":"","image":"images/part-01/microservices_architecture__original_outline__configuring_eureka_server_and_clients.png","doc":"docs/part-01/microservices_architecture__original_outline__configuring_eureka_server_and_clients.md"},{"title":"Benefits of Service Discovery","quote":"Discovery removes hard-coded endpoints, supports elastic scaling and failover, and simplifies dynamic environments. It must still be paired with health checks and load balancing.","explanation":"","image":"images/part-01/microservices_architecture__original_outline__benefits_of_service_discovery.png","doc":"docs/part-01/microservices_architecture__original_outline__benefits_of_service_discovery.md"},{"title":"API Gateway","quote":"An API gateway is the controlled entry point to backend services. It handles routing and shared edge concerns such as authentication, rate limiting, headers, logging, and protocol adaptation.","explanation":"","image":"images/part-01/microservices_architecture__original_outline__api_gateway.png","doc":"docs/part-01/microservices_architecture__original_outline__api_gateway.md"},{"title":"What is API Gateway?","quote":"An API gateway receives client requests and forwards them to the correct service while applying common policies. It hides internal topology and simplifies client integration.","explanation":"","image":"images/part-01/microservices_architecture__original_outline__what_is_api_gateway.png","doc":"docs/part-01/microservices_architecture__original_outline__what_is_api_gateway.md"},{"title":"API Gateway Patterns","quote":"Common patterns include a single edge gateway, backend-for-frontend gateways, routing aggregation, protocol translation, and gateway-enforced security or rate limiting.","explanation":"","image":"images/part-01/microservices_architecture__original_outline__api_gateway_patterns.png","doc":"docs/part-01/microservices_architecture__original_outline__api_gateway_patterns.md"},{"title":"Implementing API Gateway with Spring Cloud Gateway","quote":"Spring Cloud Gateway defines routes and reactive filters for forwarding requests. It supports predicates, header transformation, retries, circuit breakers, and custom edge policies.","explanation":"","image":"images/part-01/microservices_architecture__original_outline__implementing_api_gateway_with_spring_cloud_gateway.png","doc":"docs/part-01/microservices_architecture__original_outline__implementing_api_gateway_with_spring_cloud_gateway.md"},{"title":"Advantages of API Gateway","quote":"A gateway centralizes cross-cutting edge behavior, reduces client knowledge of internal services, and enables controlled routing. Too much business logic in the gateway becomes a bottleneck and coupling point.","explanation":"","image":"images/part-01/microservices_architecture__original_outline__advantages_of_api_gateway.png","doc":"docs/part-01/microservices_architecture__original_outline__advantages_of_api_gateway.md"},{"title":"Inter-Service Communication","quote":"Services communicate synchronously through APIs or asynchronously through messaging. The choice affects latency, coupling, consistency, resilience, and operational complexity.","explanation":"","image":"images/part-01/microservices_architecture__original_outline__inter_service_communication.png","doc":"docs/part-01/microservices_architecture__original_outline__inter_service_communication.md"},{"title":"Synchronous Communication (REST)","quote":"REST calls provide an immediate request-response interaction and are easy to understand. They also create temporal coupling, so timeouts, retries, circuit breakers, and idempotency are essential.","explanation":"","image":"images/part-01/microservices_architecture__original_outline__synchronous_communication_rest.png","doc":"docs/part-01/microservices_architecture__original_outline__synchronous_communication_rest.md"},{"title":"Asynchronous Communication (Messaging)","quote":"Messaging decouples producers from consumers in time and absorbs traffic spikes. It introduces eventual consistency, duplicate delivery, ordering, and failure-handling responsibilities.","explanation":"","image":"images/part-01/microservices_architecture__original_outline__asynchronous_communication_messaging.png","doc":"docs/part-01/microservices_architecture__original_outline__asynchronous_communication_messaging.md"},{"title":"RESTful APIs and HTTP Communication","quote":"RESTful APIs model resources using HTTP methods, status codes, headers, and representations. Good APIs are predictable, idempotent where appropriate, and backward compatible.","explanation":"","image":"images/part-01/microservices_architecture__original_outline__restful_apis_and_http_communication.png","doc":"docs/part-01/microservices_architecture__original_outline__restful_apis_and_http_communication.md"},{"title":"Messaging Systems (Kafka, RabbitMQ)","quote":"Kafka is optimized for durable ordered event streams and replay, while RabbitMQ excels at flexible queue routing and work distribution. Selection should follow delivery and consumption needs.","explanation":"","image":"images/part-01/microservices_architecture__original_outline__messaging_systems_kafka_rabbitmq.png","doc":"docs/part-01/microservices_architecture__original_outline__messaging_systems_kafka_rabbitmq.md"},{"title":"gRPC for Communication Between Services","quote":"gRPC uses Protocol Buffers and HTTP/2 for strongly typed, efficient service calls and streaming. It works well for internal communication but requires schema governance and tooling.","explanation":"","image":"images/part-01/microservices_architecture__original_outline__grpc_for_communication_between_services.png","doc":"docs/part-01/microservices_architecture__original_outline__grpc_for_communication_between_services.md"},{"title":"Circuit Breaker (Resilience4j)","quote":"Resilience4j CircuitBreaker tracks failures and temporarily rejects calls when a dependency is unhealthy. After a wait period, limited test calls determine whether normal traffic can resume.","explanation":"","image":"images/part-01/microservices_architecture__original_outline__circuit_breaker_resilience4j.png","doc":"docs/part-01/microservices_architecture__original_outline__circuit_breaker_resilience4j.md"},{"title":"What is a Circuit Breaker?","quote":"A circuit breaker prevents repeated calls to a failing dependency. It moves through closed, open, and half-open states to protect resources and allow controlled recovery.","explanation":"","image":"images/part-01/microservices_architecture__original_outline__what_is_a_circuit_breaker.png","doc":"docs/part-01/microservices_architecture__original_outline__what_is_a_circuit_breaker.md"},{"title":"Why Use Circuit Breakers?","quote":"Circuit breakers reduce cascading failures, protect thread pools and connections, and provide faster failure responses. They complement, rather than replace, sensible timeouts and capacity controls.","explanation":"","image":"images/part-01/microservices_architecture__original_outline__why_use_circuit_breakers.png","doc":"docs/part-01/microservices_architecture__original_outline__why_use_circuit_breakers.md"},{"title":"Configuring Resilience4j for Circuit Breaking","quote":"Important settings include sliding-window size, failure-rate threshold, minimum calls, open-state duration, half-open permitted calls, and which exceptions count as failures.","explanation":"","image":"images/part-01/microservices_architecture__original_outline__configuring_resilience4j_for_circuit_breaking.png","doc":"docs/part-01/microservices_architecture__original_outline__configuring_resilience4j_for_circuit_breaking.md"},{"title":"Advantages of Using Circuit Breakers","quote":"Circuit breakers isolate dependency failures, shorten response time during outages, and support graceful degradation. Poor thresholds or broad fallbacks can hide real problems.","explanation":"","image":"images/part-01/microservices_architecture__original_outline__advantages_of_using_circuit_breakers.png","doc":"docs/part-01/microservices_architecture__original_outline__advantages_of_using_circuit_breakers.md"},{"title":"Event-Driven Microservices","quote":"Event-driven microservices publish facts about completed changes and react asynchronously. This reduces direct coupling but requires strong event contracts, idempotency, and observability.","explanation":"","image":"images/part-01/microservices_architecture__original_outline__event_driven_microservices.png","doc":"docs/part-01/microservices_architecture__original_outline__event_driven_microservices.md"},{"title":"What is Event-Driven Architecture?","quote":"Event-driven architecture organizes systems around producing, transporting, and consuming events. An event represents something that already happened and should be treated as immutable.","explanation":"","image":"images/part-01/microservices_architecture__original_outline__what_is_event_driven_architecture.png","doc":"docs/part-01/microservices_architecture__original_outline__what_is_event_driven_architecture.md"},{"title":"Advantages of Event-Driven Microservices","quote":"Benefits include loose coupling, independent scaling, spike absorption, extensibility, and replayable workflows. Costs include eventual consistency and more difficult debugging.","explanation":"","image":"images/part-01/microservices_architecture__original_outline__advantages_of_event_driven_microservices.png","doc":"docs/part-01/microservices_architecture__original_outline__advantages_of_event_driven_microservices.md"},{"title":"Event Sourcing and CQRS","quote":"Event sourcing stores state changes as an event history, while CQRS separates write commands from read models. They solve specific audit and complexity needs, not every application.","explanation":"","image":"images/part-01/microservices_architecture__original_outline__event_sourcing_and_cqrs.png","doc":"docs/part-01/microservices_architecture__original_outline__event_sourcing_and_cqrs.md"},{"title":"Implementing Event-Driven Microservices with Spring Cloud Stream","quote":"Spring Cloud Stream connects business functions to messaging middleware through bindings. It simplifies producer and consumer setup while still requiring deliberate event design and delivery handling.","explanation":"","image":"images/part-01/microservices_architecture__original_outline__implementing_event_driven_microservices_with_spring_cloud_stream.png","doc":"docs/part-01/microservices_architecture__original_outline__implementing_event_driven_microservices_with_spring_cloud_stream.md"}]}]},{"name":"Cloud Computing with AWS","groups":[{"name":"Original outline","topics":[{"title":"Introduction to Cloud Computing","quote":"Cloud computing provides on-demand infrastructure and managed services over a network. It shifts capacity from owned hardware to elastic, metered resources.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__introduction_to_cloud_computing.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__introduction_to_cloud_computing.md"},{"title":"What is Cloud Computing?","quote":"Cloud computing is the delivery of compute, storage, databases, networking, and software as remotely managed services. Users provision resources through APIs and pay according to consumption or commitment.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__what_is_cloud_computing.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__what_is_cloud_computing.md"},{"title":"Types of Cloud Computing Models","quote":"Cloud models are commonly described by ownership—public, private, or hybrid—and by service level—IaaS, PaaS, or SaaS. Each changes who manages which layers.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__types_of_cloud_computing_models.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__types_of_cloud_computing_models.md"},{"title":"Public Cloud","quote":"A public cloud provides shared provider-managed infrastructure to many customers with logical isolation. It offers broad services, rapid provisioning, elasticity, and global reach.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__public_cloud.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__public_cloud.md"},{"title":"Private Cloud","quote":"A private cloud is dedicated to one organization and offers cloud-like automation and self-service. It provides control but requires more ownership, capacity planning, and operational effort.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__private_cloud.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__private_cloud.md"},{"title":"Hybrid Cloud","quote":"Hybrid cloud connects private infrastructure with public cloud services. It supports gradual migration and regulatory needs but adds networking, identity, governance, and operational complexity.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__hybrid_cloud.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__hybrid_cloud.md"},{"title":"Cloud Computing Deployment Models","quote":"Deployment models describe where cloud resources run and who controls them. Public, private, hybrid, and multi-cloud approaches trade convenience, control, portability, and cost.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__cloud_computing_deployment_models.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__cloud_computing_deployment_models.md"},{"title":"IaaS (Infrastructure as a Service)","quote":"IaaS provides virtual machines, networks, and storage while the customer manages the operating system and application stack. It offers flexibility with significant operational responsibility.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__iaas_infrastructure_as_a_service.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__iaas_infrastructure_as_a_service.md"},{"title":"PaaS (Platform as a Service)","quote":"PaaS manages the runtime platform, deployment environment, and much of the infrastructure. Developers focus on applications but accept platform constraints and less low-level control.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__paas_platform_as_a_service.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__paas_platform_as_a_service.md"},{"title":"SaaS (Software as a Service)","quote":"SaaS delivers a complete application managed by the provider and accessed through a browser or API. Customers configure and use it rather than operate the underlying stack.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__saas_software_as_a_service.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__saas_software_as_a_service.md"},{"title":"Introduction to AWS","quote":"AWS is a public cloud platform offering compute, storage, networking, databases, security, analytics, and managed application services across global regions.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__introduction_to_aws.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__introduction_to_aws.md"},{"title":"What is AWS?","quote":"Amazon Web Services is a pay-as-you-go cloud platform where resources are provisioned through consoles, APIs, command-line tools, or infrastructure-as-code templates.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__what_is_aws.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__what_is_aws.md"},{"title":"AWS Global Infrastructure","quote":"AWS infrastructure is organized into Regions, Availability Zones, and edge locations. This structure supports fault isolation, low latency, and geographically distributed architectures.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__aws_global_infrastructure.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__aws_global_infrastructure.md"},{"title":"AWS Regions and Availability Zones","quote":"A Region is a geographic area containing multiple isolated Availability Zones. Multi-AZ deployment protects against individual data-center failures within a Region.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__aws_regions_and_availability_zones.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__aws_regions_and_availability_zones.md"},{"title":"Benefits of AWS Cloud","quote":"AWS provides elastic capacity, global reach, managed services, automation, security controls, and multiple pricing models. Benefits depend on disciplined architecture and cost governance.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__benefits_of_aws_cloud.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__benefits_of_aws_cloud.md"},{"title":"AWS Compute Services","quote":"AWS compute options range from virtual machines and containers to serverless functions and managed application platforms. The right choice depends on control, scaling, startup, and operational needs.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__aws_compute_services.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__aws_compute_services.md"},{"title":"Amazon EC2 (Elastic Compute Cloud)","quote":"EC2 provides resizable virtual servers with configurable CPU, memory, storage, networking, and operating systems. Customers manage the instance software and patching.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__amazon_ec2_elastic_compute_cloud.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__amazon_ec2_elastic_compute_cloud.md"},{"title":"EC2 Instance Types","quote":"EC2 instance families are optimized for general purpose, compute, memory, storage, accelerated computing, or burstable workloads. Selection should follow measured resource usage.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__ec2_instance_types.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__ec2_instance_types.md"},{"title":"EC2 Key Pairs","quote":"An EC2 key pair uses public-key cryptography for secure instance login, especially SSH. The private key must be protected because AWS does not retain a recoverable copy.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__ec2_key_pairs.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__ec2_key_pairs.md"},{"title":"EC2 Security Groups","quote":"Security groups are stateful virtual firewalls attached to network interfaces. They define allowed inbound and outbound traffic and should follow least privilege.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__ec2_security_groups.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__ec2_security_groups.md"},{"title":"AWS Lambda","quote":"AWS Lambda runs functions in response to events without managing servers. AWS handles provisioning and scaling, while charges are based largely on requests and execution duration.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__aws_lambda.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__aws_lambda.md"},{"title":"What is AWS Lambda?","quote":"Lambda is a serverless compute service that executes code inside short-lived managed environments. It is well suited to event handlers, APIs, automation, and bursty workloads.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__what_is_aws_lambda.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__what_is_aws_lambda.md"},{"title":"Benefits of AWS Lambda","quote":"Lambda offers automatic scaling, no server administration, fine-grained billing, and direct integration with AWS events. Constraints include cold starts, execution limits, and stateless design.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__benefits_of_aws_lambda.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__benefits_of_aws_lambda.md"},{"title":"Amazon Lightsail","quote":"Lightsail packages compute, storage, networking, and predictable pricing into a simplified service. It targets smaller applications that do not need the full flexibility of EC2.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__amazon_lightsail.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__amazon_lightsail.md"},{"title":"What is Amazon Lightsail?","quote":"Amazon Lightsail is an easy-to-use VPS platform with preconfigured instance plans and simple management. It is useful for small websites, prototypes, and basic hosted applications.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__what_is_amazon_lightsail.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__what_is_amazon_lightsail.md"},{"title":"AWS Storage Services","quote":"AWS storage includes object storage, block volumes, shared file systems, archive tiers, and hybrid gateways. Each model serves different access, durability, latency, and sharing requirements.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__aws_storage_services.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__aws_storage_services.md"},{"title":"Amazon S3 (Simple Storage Service)","quote":"Amazon S3 is highly durable object storage accessed through APIs. It stores objects inside buckets and supports versioning, lifecycle rules, encryption, replication, and event notifications.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__amazon_s3_simple_storage_service.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__amazon_s3_simple_storage_service.md"},{"title":"S3 Buckets","quote":"An S3 bucket is the top-level container for objects and configuration such as access policies, versioning, encryption, and lifecycle rules. Bucket names are globally unique.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__s3_buckets.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__s3_buckets.md"},{"title":"S3 Versioning","quote":"S3 Versioning preserves multiple versions of an object, protecting against accidental overwrite or deletion. It improves recovery but increases storage usage until old versions are removed.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__s3_versioning.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__s3_versioning.md"},{"title":"S3 Lifecycle Policies","quote":"Lifecycle rules automatically transition objects to cheaper storage classes or expire them based on age or other criteria. They reduce cost when retention requirements are understood.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__s3_lifecycle_policies.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__s3_lifecycle_policies.md"},{"title":"Amazon EBS (Elastic Block Store)","quote":"EBS provides persistent block storage volumes for EC2 instances. It behaves like a virtual disk and supports snapshots, encryption, resizing, and multiple performance tiers.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__amazon_ebs_elastic_block_store.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__amazon_ebs_elastic_block_store.md"},{"title":"EBS Volumes","quote":"An EBS volume is network-attached block storage designed for low-latency instance access. Volume type, size, IOPS, and throughput should match workload characteristics.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__ebs_volumes.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__ebs_volumes.md"},{"title":"EBS Snapshots","quote":"EBS snapshots are incremental point-in-time backups stored by AWS. They support volume recovery, cloning, cross-account sharing, and regional disaster-recovery workflows.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__ebs_snapshots.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__ebs_snapshots.md"},{"title":"Amazon EFS (Elastic File System)","quote":"EFS is a managed elastic NFS file system that can be mounted by multiple Linux instances. It scales automatically and is useful when applications need shared files.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__amazon_efs_elastic_file_system.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__amazon_efs_elastic_file_system.md"},{"title":"AWS Networking Services","quote":"AWS networking services provide isolated networks, routing, DNS, load balancing, content delivery, private connectivity, and traffic security for cloud workloads.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__aws_networking_services.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__aws_networking_services.md"},{"title":"Amazon VPC (Virtual Private Cloud)","quote":"A VPC is a logically isolated AWS network with chosen IP ranges, subnets, routes, gateways, and security controls. It forms the network boundary for most AWS workloads.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__amazon_vpc_virtual_private_cloud.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__amazon_vpc_virtual_private_cloud.md"},{"title":"VPC Components","quote":"Core VPC components include CIDR ranges, subnets, route tables, internet and NAT gateways, security groups, NACLs, endpoints, and peering or transit connections.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__vpc_components.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__vpc_components.md"},{"title":"Subnets","quote":"A subnet is an IP range inside one Availability Zone. Public or private behavior is determined by routing, not by a special subnet type.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__subnets.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__subnets.md"},{"title":"Security Groups and NACLs","quote":"Security groups are stateful controls attached to resources, while NACLs are stateless rules applied at subnet boundaries. Security groups are normally the primary access control.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__security_groups_and_nacls.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__security_groups_and_nacls.md"},{"title":"Elastic Load Balancing (ELB)","quote":"Elastic Load Balancing distributes traffic across healthy targets and Availability Zones. It improves availability and supports managed health checks and scaling.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__elastic_load_balancing_elb.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__elastic_load_balancing_elb.md"},{"title":"Types of Load Balancers","quote":"AWS offers Application Load Balancer for HTTP routing, Network Load Balancer for high-performance TCP/UDP, and Gateway Load Balancer for virtual network appliances.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__types_of_load_balancers.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__types_of_load_balancers.md"},{"title":"Amazon Route 53","quote":"Route 53 is AWS\u0027s managed DNS and domain-routing service. It maps names to endpoints and can use health checks and routing policies for traffic control.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__amazon_route_53.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__amazon_route_53.md"},{"title":"What is Route 53?","quote":"Route 53 provides authoritative DNS, domain registration, and health-aware routing. Its name refers to TCP and UDP port 53 used by DNS.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__what_is_route_53.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__what_is_route_53.md"},{"title":"Route 53 Routing Policies","quote":"Routing policies include simple, weighted, latency, failover, geolocation, geoproximity, and multivalue routing. The policy determines how DNS answers direct clients.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__route_53_routing_policies.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__route_53_routing_policies.md"},{"title":"AWS Database Services","quote":"AWS provides managed relational, key-value, document, graph, time-series, cache, and warehouse databases. Selection should follow access patterns and consistency requirements.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__aws_database_services.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__aws_database_services.md"},{"title":"Amazon RDS (Relational Database Service)","quote":"RDS manages relational database provisioning, backups, patching, monitoring, and optional high availability. Customers still own schema, queries, indexes, and application-level performance.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__amazon_rds_relational_database_service.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__amazon_rds_relational_database_service.md"},{"title":"Supported Databases","quote":"RDS supports engines including PostgreSQL, MySQL, MariaDB, Oracle, SQL Server, and Amazon Aurora. Features and licensing differ by engine.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__supported_databases.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__supported_databases.md"},{"title":"RDS Backup and Restore","quote":"RDS supports automated backups, transaction-log retention, point-in-time recovery, and manual snapshots. Recovery planning must include restore time and cross-region requirements.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__rds_backup_and_restore.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__rds_backup_and_restore.md"},{"title":"Amazon DynamoDB","quote":"DynamoDB is a managed key-value and document database designed for predictable low-latency access at scale. Its performance depends heavily on partition-key and access-pattern design.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__amazon_dynamodb.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__amazon_dynamodb.md"},{"title":"What is DynamoDB?","quote":"DynamoDB is a serverless NoSQL database that automatically handles partitioning, replication, and scaling. Applications query by primary keys or explicitly designed indexes.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__what_is_dynamodb.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__what_is_dynamodb.md"},{"title":"DynamoDB Tables and Indexes","quote":"A DynamoDB table uses a partition key and optional sort key. Global and local secondary indexes support additional access patterns but add storage and write cost.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__dynamodb_tables_and_indexes.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__dynamodb_tables_and_indexes.md"},{"title":"Amazon Redshift","quote":"Amazon Redshift is a managed columnar data warehouse optimized for analytical SQL over large datasets. It uses distributed processing and compression for scan-heavy workloads.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__amazon_redshift.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__amazon_redshift.md"},{"title":"What is Amazon Redshift?","quote":"Redshift is AWS\u0027s cloud data warehouse for business intelligence and analytics. It is designed for complex aggregations rather than high-volume transactional operations.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__what_is_amazon_redshift.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__what_is_amazon_redshift.md"},{"title":"Redshift Data Warehouse Architecture","quote":"Redshift distributes data and query work across compute nodes using columnar storage and parallel execution. Distribution and sort choices strongly affect performance.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__redshift_data_warehouse_architecture.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__redshift_data_warehouse_architecture.md"},{"title":"AWS Security and Identity Services","quote":"AWS security services control identity, permissions, encryption, threat protection, and auditability. Core tools include IAM, KMS, Shield, WAF, GuardDuty, Security Hub, and CloudTrail.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__aws_security_and_identity_services.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__aws_security_and_identity_services.md"},{"title":"IAM (Identity and Access Management)","quote":"IAM controls who can access AWS and what actions they can perform. It manages users, groups, roles, policies, and permission boundaries across an AWS account.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__iam_identity_and_access_management.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__iam_identity_and_access_management.md"},{"title":"IAM Roles and Policies","quote":"An IAM role is an assumable identity with temporary credentials, while a policy is a JSON document that grants or denies actions on resources. Roles are preferred for applications and AWS services.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__iam_roles_and_policies.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__iam_roles_and_policies.md"},{"title":"IAM Users and Groups","quote":"IAM users represent long-lived human or system identities, while groups collect users and attach shared permissions. Modern designs minimize user access keys and prefer federation or roles.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__iam_users_and_groups.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__iam_users_and_groups.md"},{"title":"AWS KMS (Key Management Service)","quote":"AWS KMS creates and controls encryption keys used by AWS services and applications. It integrates with IAM, records key usage, and performs cryptographic operations without exposing key material.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__aws_kms_key_management_service.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__aws_kms_key_management_service.md"},{"title":"KMS Encryption Keys","quote":"KMS keys are logical key resources used to encrypt data keys, sign data, or perform direct cryptographic operations. Access depends on both key policies and IAM permissions.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__kms_encryption_keys.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__kms_encryption_keys.md"},{"title":"AWS Shield","quote":"AWS Shield protects applications from distributed denial-of-service attacks. Standard protection is automatic, while Shield Advanced adds stronger detection, support, and cost-protection features.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__aws_shield.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__aws_shield.md"},{"title":"What is AWS Shield?","quote":"AWS Shield is a managed DDoS protection service for AWS resources such as CloudFront, Route 53, and load balancers. It helps absorb and mitigate malicious traffic floods.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__what_is_aws_shield.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__what_is_aws_shield.md"},{"title":"Types of AWS Shield","quote":"Shield Standard provides baseline DDoS protection at no extra charge. Shield Advanced adds enhanced detection, near-real-time visibility, response support, and financial safeguards.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__types_of_aws_shield.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__types_of_aws_shield.md"},{"title":"AWS Monitoring and Management Services","quote":"AWS monitoring and management services provide metrics, logs, tracing, audit history, configuration tracking, automation, and operational visibility. CloudWatch, CloudTrail, Config, and Systems Manager are central examples.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__aws_monitoring_and_management_services.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__aws_monitoring_and_management_services.md"},{"title":"Amazon CloudWatch","quote":"CloudWatch collects metrics, logs, and events from AWS resources and applications. It supports dashboards, alarms, log analysis, and automated responses to operational conditions.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__amazon_cloudwatch.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__amazon_cloudwatch.md"},{"title":"CloudWatch Metrics","quote":"CloudWatch metrics are time-series measurements such as CPU usage, latency, request count, or custom business values. Metrics are organized by namespace and dimensions.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__cloudwatch_metrics.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__cloudwatch_metrics.md"},{"title":"CloudWatch Alarms","quote":"CloudWatch alarms evaluate metrics against thresholds and can notify, scale, or trigger automation. Good alarms focus on user impact and actionable conditions rather than raw noise.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__cloudwatch_alarms.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__cloudwatch_alarms.md"},{"title":"AWS CloudTrail","quote":"CloudTrail records AWS API activity, including who made a request, what action occurred, from where, and when. It is essential for auditing, investigation, and compliance.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__aws_cloudtrail.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__aws_cloudtrail.md"},{"title":"What is CloudTrail?","quote":"CloudTrail is AWS\u0027s account-level audit service. It captures management events by default and can also record data events and Insights events when configured.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__what_is_cloudtrail.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__what_is_cloudtrail.md"},{"title":"AWS Config","quote":"AWS Config records resource configurations and how they change over time. It helps answer what changed, when it changed, and whether resources comply with expected rules.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__aws_config.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__aws_config.md"},{"title":"AWS Config Rules","quote":"Config Rules evaluate resource configurations against desired standards. Rules may be AWS-managed or custom and can trigger remediation for noncompliant resources.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__aws_config_rules.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__aws_config_rules.md"},{"title":"AWS Deployment and Automation Services","quote":"AWS deployment services automate infrastructure provisioning, application delivery, and release workflows. CloudFormation, Elastic Beanstalk, CodePipeline, CodeBuild, and CodeDeploy cover different layers.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__aws_deployment_and_automation_services.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__aws_deployment_and_automation_services.md"},{"title":"AWS CloudFormation","quote":"CloudFormation provisions AWS infrastructure from declarative templates. It creates, updates, and deletes related resources as a managed stack.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__aws_cloudformation.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__aws_cloudformation.md"},{"title":"CloudFormation Templates","quote":"A CloudFormation template defines resources, parameters, outputs, mappings, and conditions in YAML or JSON. Templates make infrastructure repeatable, reviewable, and version-controlled.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__cloudformation_templates.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__cloudformation_templates.md"},{"title":"Stack and StackSets","quote":"A stack is one deployed instance of a CloudFormation template. StackSets deploy the same stack across multiple AWS accounts and Regions from a central definition.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__stack_and_stacksets.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__stack_and_stacksets.md"},{"title":"AWS Elastic Beanstalk","quote":"Elastic Beanstalk deploys and manages applications while AWS handles much of the environment setup, scaling, health monitoring, and platform maintenance.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__aws_elastic_beanstalk.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__aws_elastic_beanstalk.md"},{"title":"Elastic Beanstalk Overview","quote":"Elastic Beanstalk is a managed application platform for deploying code to environments built from EC2, load balancers, scaling groups, and supporting services.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__elastic_beanstalk_overview.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__elastic_beanstalk_overview.md"},{"title":"Elastic Beanstalk Environments","quote":"An Elastic Beanstalk environment is a running application version with provisioned infrastructure. Common types are web server environments and worker environments.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__elastic_beanstalk_environments.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__elastic_beanstalk_environments.md"},{"title":"AWS CodePipeline","quote":"CodePipeline orchestrates software delivery stages such as source, build, test, approval, and deployment. It connects AWS and third-party tools into an automated release flow.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__aws_codepipeline.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__aws_codepipeline.md"},{"title":"CodePipeline Stages","quote":"A pipeline stage groups one or more actions, such as fetching source, running a build, or deploying. Artifacts move between stages and failures stop downstream execution.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__codepipeline_stages.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__codepipeline_stages.md"},{"title":"AWS Cost and Billing","quote":"AWS cost tools help understand usage, forecast spend, set budgets, allocate charges, and optimize resources. Effective cost management requires tagging, ownership, and regular review.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__aws_cost_and_billing.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__aws_cost_and_billing.md"},{"title":"AWS Pricing Models","quote":"AWS pricing includes On-Demand, Reserved or committed-use discounts, Spot, Savings Plans, and service-specific tiers. The best mix depends on predictability and interruption tolerance.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__aws_pricing_models.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__aws_pricing_models.md"},{"title":"On-Demand Pricing","quote":"On-Demand pricing charges for resources as they are used without a long-term commitment. It offers flexibility but usually costs more for steady workloads.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__on_demand_pricing.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__on_demand_pricing.md"},{"title":"Reserved Pricing","quote":"Reserved pricing provides discounts in exchange for a one- or three-year commitment. It is best for predictable baseline usage and requires careful capacity planning.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__reserved_pricing.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__reserved_pricing.md"},{"title":"Spot Instances","quote":"Spot Instances use spare EC2 capacity at large discounts but may be interrupted with little notice. They suit fault-tolerant, flexible, and retryable workloads.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__spot_instances.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__spot_instances.md"},{"title":"AWS Cost Explorer","quote":"Cost Explorer visualizes historical and forecasted AWS spending. It helps filter costs by service, account, tag, Region, and usage type.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__aws_cost_explorer.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__aws_cost_explorer.md"},{"title":"AWS Budgets","quote":"AWS Budgets monitors cost, usage, reservation coverage, or Savings Plans utilization against thresholds. It can send alerts and trigger selected actions.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__aws_budgets.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__aws_budgets.md"},{"title":"Best Practices in AWS","quote":"AWS best practices emphasize least privilege, automation, observability, fault isolation, backup, encryption, tagging, cost ownership, and designing for failure.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__best_practices_in_aws.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__best_practices_in_aws.md"},{"title":"Well-Architected Framework","quote":"The AWS Well-Architected Framework evaluates systems across operational excellence, security, reliability, performance efficiency, cost optimization, and sustainability.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__well_architected_framework.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__well_architected_framework.md"},{"title":"Operational Excellence","quote":"Operational excellence focuses on running, monitoring, and improving systems through automation, observability, small changes, and learning from failures.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__operational_excellence.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__operational_excellence.md"},{"title":"Security","quote":"The security pillar protects data, systems, and identities through least privilege, traceability, layered defenses, encryption, and automated security controls.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__security.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__security.md"},{"title":"Reliability","quote":"Reliability means a workload can perform its function consistently and recover from failures. It relies on redundancy, tested recovery, scaling, and change management.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__reliability.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__reliability.md"},{"title":"Performance Efficiency","quote":"Performance efficiency uses computing resources effectively as demand and technology change. It emphasizes measurement, suitable service choices, and continuous optimization.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__performance_efficiency.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__performance_efficiency.md"},{"title":"Cost Optimization","quote":"Cost optimization delivers business value at the lowest practical cost. It requires visibility, right-sizing, eliminating waste, commitment planning, and ownership.","explanation":"","image":"images/part-01/cloud_computing_with_aws__original_outline__cost_optimization.png","doc":"docs/part-01/cloud_computing_with_aws__original_outline__cost_optimization.md"}]}]},{"name":"Containers and Orchestration","groups":[{"name":"Original outline","topics":[{"title":"Introduction to Containers","quote":"Containers package an application with its runtime dependencies into a portable isolated unit. They make execution more consistent across development, testing, and production.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__introduction_to_containers.png","doc":"docs/part-01/containers_and_orchestration__original_outline__introduction_to_containers.md"},{"title":"What are Containers?","quote":"A container is an isolated process that shares the host operating-system kernel while using its own filesystem, network, and resource limits.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__what_are_containers.png","doc":"docs/part-01/containers_and_orchestration__original_outline__what_are_containers.md"},{"title":"Benefits of Containers","quote":"Containers provide fast startup, portability, efficient resource use, reproducible environments, and easier deployment. They still require secure images and operational discipline.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__benefits_of_containers.png","doc":"docs/part-01/containers_and_orchestration__original_outline__benefits_of_containers.md"},{"title":"Container vs Virtual Machines","quote":"Virtual machines emulate complete machines with separate operating systems, while containers share the host kernel. Containers are lighter; VMs provide stronger isolation boundaries.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__container_vs_virtual_machines.png","doc":"docs/part-01/containers_and_orchestration__original_outline__container_vs_virtual_machines.md"},{"title":"Containerization Concepts","quote":"Containerization relies on images, registries, runtimes, namespaces, control groups, writable layers, networking, volumes, and immutable deployment practices.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__containerization_concepts.png","doc":"docs/part-01/containers_and_orchestration__original_outline__containerization_concepts.md"},{"title":"Docker Basics","quote":"Docker provides tools to build images, run containers, manage networks and volumes, and publish images to registries. It popularized the modern container workflow.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__docker_basics.png","doc":"docs/part-01/containers_and_orchestration__original_outline__docker_basics.md"},{"title":"What is Docker?","quote":"Docker is a platform for packaging and running applications as containers. It includes an image format, command-line tools, an engine, and registry integration.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__what_is_docker.png","doc":"docs/part-01/containers_and_orchestration__original_outline__what_is_docker.md"},{"title":"Docker Architecture","quote":"Docker uses a client-server design. The client sends commands to the Docker daemon, which manages images, containers, networks, and volumes through a container runtime.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__docker_architecture.png","doc":"docs/part-01/containers_and_orchestration__original_outline__docker_architecture.md"},{"title":"Docker Images","quote":"A Docker image is an immutable layered template containing an application and its dependencies. Containers are running instances created from images.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__docker_images.png","doc":"docs/part-01/containers_and_orchestration__original_outline__docker_images.md"},{"title":"Docker Containers","quote":"A Docker container is an isolated process launched from an image with a small writable layer. Its lifecycle is independent from the image used to create it.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__docker_containers.png","doc":"docs/part-01/containers_and_orchestration__original_outline__docker_containers.md"},{"title":"Running a Docker Container","quote":"Running a container creates an isolated process from an image and applies options such as ports, environment variables, volumes, limits, and restart behavior.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__running_a_docker_container.png","doc":"docs/part-01/containers_and_orchestration__original_outline__running_a_docker_container.md"},{"title":"Dockerfile","quote":"A Dockerfile is a sequence of instructions used to build an image. Good Dockerfiles use small bases, deterministic dependencies, multi-stage builds, and minimal layers.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__dockerfile.png","doc":"docs/part-01/containers_and_orchestration__original_outline__dockerfile.md"},{"title":"Managing Docker Containers","quote":"Container management includes starting, stopping, inspecting, logging, updating, removing, and monitoring containers. Persistent data should live outside the writable container layer.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__managing_docker_containers.png","doc":"docs/part-01/containers_and_orchestration__original_outline__managing_docker_containers.md"},{"title":"Docker Networking","quote":"Docker networking lets containers communicate with each other, the host, and external systems. Networks provide DNS-based discovery and configurable isolation.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__docker_networking.png","doc":"docs/part-01/containers_and_orchestration__original_outline__docker_networking.md"},{"title":"Docker Networks","quote":"A Docker network is a virtual communication boundary for containers. Containers on the same user-defined network can usually discover one another by name.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__docker_networks.png","doc":"docs/part-01/containers_and_orchestration__original_outline__docker_networks.md"},{"title":"Types of Docker Networks","quote":"Common Docker network drivers are bridge, host, none, overlay, macvlan, and ipvlan. Each serves different isolation and connectivity requirements.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__types_of_docker_networks.png","doc":"docs/part-01/containers_and_orchestration__original_outline__types_of_docker_networks.md"},{"title":"Connecting Containers","quote":"Containers should connect through user-defined networks and service names rather than fixed IP addresses. This keeps communication stable as containers are recreated.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__connecting_containers.png","doc":"docs/part-01/containers_and_orchestration__original_outline__connecting_containers.md"},{"title":"Port Mapping and Exposing Ports","quote":"EXPOSE documents an intended container port, while port publishing maps a host port to a container port. Publishing is what makes the service reachable from outside the Docker network.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__port_mapping_and_exposing_ports.png","doc":"docs/part-01/containers_and_orchestration__original_outline__port_mapping_and_exposing_ports.md"},{"title":"Docker Compose","quote":"Docker Compose defines and runs multi-container applications from a YAML file. It coordinates services, networks, volumes, dependencies, and configuration.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__docker_compose.png","doc":"docs/part-01/containers_and_orchestration__original_outline__docker_compose.md"},{"title":"What is Docker Compose?","quote":"Docker Compose is a tool for describing related containers as one application. A single command can build, start, stop, and recreate the full environment.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__what_is_docker_compose.png","doc":"docs/part-01/containers_and_orchestration__original_outline__what_is_docker_compose.md"},{"title":"Compose File Format","quote":"A Compose file defines services, images, builds, ports, volumes, networks, environment variables, health checks, and dependencies in YAML.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__compose_file_format.png","doc":"docs/part-01/containers_and_orchestration__original_outline__compose_file_format.md"},{"title":"Defining Multi-Container Applications","quote":"A multi-container application separates responsibilities such as API, database, cache, and message broker into services connected by declared networks and volumes.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__defining_multi_container_applications.png","doc":"docs/part-01/containers_and_orchestration__original_outline__defining_multi_container_applications.md"},{"title":"Running Multi-Container Environments","quote":"Compose creates the required networks and volumes, then starts services according to configuration. Health checks are more reliable than startup order alone.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__running_multi_container_environments.png","doc":"docs/part-01/containers_and_orchestration__original_outline__running_multi_container_environments.md"},{"title":"Scaling with Docker Compose","quote":"Compose can run multiple instances of a stateless service, but local Compose is not a full production orchestrator. Scaling also requires load balancing and external state management.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__scaling_with_docker_compose.png","doc":"docs/part-01/containers_and_orchestration__original_outline__scaling_with_docker_compose.md"},{"title":"Kubernetes Basics","quote":"Kubernetes automates deployment, scaling, networking, and recovery of containerized applications. Users declare desired state and controllers continually reconcile the cluster toward it.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__kubernetes_basics.png","doc":"docs/part-01/containers_and_orchestration__original_outline__kubernetes_basics.md"},{"title":"What is Kubernetes?","quote":"Kubernetes is a container orchestration platform that manages workloads across a cluster of machines. It provides scheduling, service discovery, rollout, scaling, and self-healing.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__what_is_kubernetes.png","doc":"docs/part-01/containers_and_orchestration__original_outline__what_is_kubernetes.md"},{"title":"Kubernetes Architecture","quote":"A Kubernetes cluster contains a control plane and worker nodes. The control plane stores desired state and makes decisions, while nodes run application workloads.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__kubernetes_architecture.png","doc":"docs/part-01/containers_and_orchestration__original_outline__kubernetes_architecture.md"},{"title":"Kubernetes Master and Node Components","quote":"Control-plane components include the API server, scheduler, controller manager, and etcd. Node components include kubelet, kube-proxy, and the container runtime.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__kubernetes_master_and_node_components.png","doc":"docs/part-01/containers_and_orchestration__original_outline__kubernetes_master_and_node_components.md"},{"title":"Kubernetes Control Plane","quote":"The control plane exposes the API, stores cluster state, schedules Pods, and runs controllers. It is the decision-making layer of Kubernetes.","explanation":"","image":"images/part-01/containers_and_orchestration__original_outline__kubernetes_control_plane.png","doc":"docs/part-01/containers_and_orchestration__original_outline__kubernetes_control_plane.md"},{"title":"Kubernetes Scheduling","quote":"The scheduler assigns unscheduled Pods to nodes based on resources, constraints, affinity, taints, topology, a
