als__producer_retries.png","doc":"docs/part-03/apache_kafka__producer_internals__producer_retries.md"},{"title":"Delivery timeout","quote":"delivery.timeout.ms limits the total time a producer may spend batching, sending, and retrying a record before failing it.","explanation":"","image":"images/part-03/apache_kafka__producer_internals__delivery_timeout.png","doc":"docs/part-03/apache_kafka__producer_internals__delivery_timeout.md"},{"title":"Buffer memory","quote":"buffer.memory limits producer memory used for records waiting to be batched and sent. When full, send calls may block up to max.block.ms.","explanation":"","image":"images/part-03/apache_kafka__producer_internals__buffer_memory.png","doc":"docs/part-03/apache_kafka__producer_internals__buffer_memory.md"},{"title":"Producer throughput tuning","quote":"Producer throughput improves with larger batches, modest linger, compression, enough buffer memory, and parallel partitions, while latency and durability requirements set limits.","explanation":"","image":"images/part-03/apache_kafka__producer_internals__producer_throughput_tuning.png","doc":"docs/part-03/apache_kafka__producer_internals__producer_throughput_tuning.md"}]},{"name":"Consumer Internals","topics":[{"title":"Consumer polling","quote":"A Kafka consumer repeatedly calls poll to fetch records, send heartbeats, and participate in group management.","explanation":"","image":"images/part-03/apache_kafka__consumer_internals__consumer_polling.png","doc":"docs/part-03/apache_kafka__consumer_internals__consumer_polling.md"},{"title":"Offset commits","quote":"Offset commits record the next position a consumer should read after restart or rebalance.","explanation":"","image":"images/part-03/apache_kafka__consumer_internals__offset_commits.png","doc":"docs/part-03/apache_kafka__consumer_internals__offset_commits.md"},{"title":"Auto commit","quote":"Auto commit periodically commits offsets in the background. It is simple but can commit records before processing finishes.","explanation":"","image":"images/part-03/apache_kafka__consumer_internals__auto_commit.png","doc":"docs/part-03/apache_kafka__consumer_internals__auto_commit.md"},{"title":"Manual commit","quote":"Manual commit lets the application commit only after successful processing, giving better delivery control.","explanation":"","image":"images/part-03/apache_kafka__consumer_internals__manual_commit.png","doc":"docs/part-03/apache_kafka__consumer_internals__manual_commit.md"},{"title":"Commit sync vs async","quote":"Synchronous commit waits for broker confirmation and is reliable but slower; asynchronous commit avoids blocking but requires careful failure handling.","explanation":"","image":"images/part-03/apache_kafka__consumer_internals__commit_sync_vs_async.png","doc":"docs/part-03/apache_kafka__consumer_internals__commit_sync_vs_async.md"},{"title":"Consumer rebalance","quote":"A rebalance redistributes partitions among consumer-group members when membership or subscribed partitions change.","explanation":"","image":"images/part-03/apache_kafka__consumer_internals__consumer_rebalance.png","doc":"docs/part-03/apache_kafka__consumer_internals__consumer_rebalance.md"},{"title":"Cooperative rebalancing","quote":"Cooperative rebalancing moves only necessary partitions incrementally, reducing stop-the-world disruption compared with eager rebalancing.","explanation":"","image":"images/part-03/apache_kafka__consumer_internals__cooperative_rebalancing.png","doc":"docs/part-03/apache_kafka__consumer_internals__cooperative_rebalancing.md"},{"title":"Static membership","quote":"Static membership gives a consumer a stable group identity so brief restarts may avoid unnecessary partition reassignment.","explanation":"","image":"images/part-03/apache_kafka__consumer_internals__static_membership.png","doc":"docs/part-03/apache_kafka__consumer_internals__static_membership.md"},{"title":"Consumer lag","quote":"Consumer lag is the distance between the latest partition offset and the consumer\u0027s committed or processed offset.","explanation":"","image":"images/part-03/apache_kafka__consumer_internals__consumer_lag.png","doc":"docs/part-03/apache_kafka__consumer_internals__consumer_lag.md"},{"title":"Max poll interval","quote":"max.poll.interval.ms is the longest allowed time between poll calls before the consumer is considered failed and partitions are reassigned.","explanation":"","image":"images/part-03/apache_kafka__consumer_internals__max_poll_interval.png","doc":"docs/part-03/apache_kafka__consumer_internals__max_poll_interval.md"},{"title":"Fetch settings","quote":"Consumer fetch settings control how much data brokers return and how long they wait, balancing throughput, latency, and memory.","explanation":"","image":"images/part-03/apache_kafka__consumer_internals__fetch_settings.png","doc":"docs/part-03/apache_kafka__consumer_internals__fetch_settings.md"},{"title":"Consumer parallelism","quote":"Kafka consumer parallelism is bounded by partition count because one partition is assigned to only one consumer within a group.","explanation":"","image":"images/part-03/apache_kafka__consumer_internals__consumer_parallelism.png","doc":"docs/part-03/apache_kafka__consumer_internals__consumer_parallelism.md"},{"title":"Poison pill handling","quote":"A poison pill is a record that repeatedly fails deserialization or processing. Handle it with controlled retries, diagnostics, and dead-letter routing.","explanation":"","image":"images/part-03/apache_kafka__consumer_internals__poison_pill_handling.png","doc":"docs/part-03/apache_kafka__consumer_internals__poison_pill_handling.md"}]},{"name":"Reliability and Design","topics":[{"title":"At-most-once delivery","quote":"At-most-once delivery may lose records but avoids duplicate processing, usually by committing before processing.","explanation":"","image":"images/part-03/apache_kafka__reliability_and_design__at_most_once_delivery.png","doc":"docs/part-03/apache_kafka__reliability_and_design__at_most_once_delivery.md"},{"title":"At-least-once delivery","quote":"At-least-once delivery avoids loss by committing after processing, but retries or crashes can produce duplicates.","explanation":"","image":"images/part-03/apache_kafka__reliability_and_design__at_least_once_delivery.png","doc":"docs/part-03/apache_kafka__reliability_and_design__at_least_once_delivery.md"},{"title":"Ordering guarantees","quote":"Kafka preserves record order only within one partition, not across an entire topic.","explanation":"","image":"images/part-03/apache_kafka__reliability_and_design__ordering_guarantees.png","doc":"docs/part-03/apache_kafka__reliability_and_design__ordering_guarantees.md"},{"title":"Dead-letter topics","quote":"A dead-letter topic stores records that cannot be processed after retry policy is exhausted.","explanation":"","image":"images/part-03/apache_kafka__reliability_and_design__dead_letter_topics.png","doc":"docs/part-03/apache_kafka__reliability_and_design__dead_letter_topics.md"},{"title":"Retry topics","quote":"Retry topics delay reprocessing by routing failed records through dedicated topics with staged backoff.","explanation":"","image":"images/part-03/apache_kafka__reliability_and_design__retry_topics.png","doc":"docs/part-03/apache_kafka__reliability_and_design__retry_topics.md"},{"title":"Schema Registry","quote":"A Schema Registry stores and validates message schemas and compatibility rules for producers and consumers.","explanation":"","image":"images/part-03/apache_kafka__reliability_and_design__schema_registry.png","doc":"docs/part-03/apache_kafka__reliability_and_design__schema_registry.md"},{"title":"Avro","quote":"Avro is a compact binary serialization format with writer and reader schemas, making it well suited for schema evolution.","explanation":"","image":"images/part-03/apache_kafka__reliability_and_design__avro.png","doc":"docs/part-03/apache_kafka__reliability_and_design__avro.md"},{"title":"Protobuf","quote":"Protocol Buffers define strongly typed messages with numbered fields and compact binary encoding.","explanation":"","image":"images/part-03/apache_kafka__reliability_and_design__protobuf.png","doc":"docs/part-03/apache_kafka__reliability_and_design__protobuf.md"},{"title":"JSON schema","quote":"JSON Schema defines the structure, types, required fields, and validation rules for JSON documents.","explanation":"","image":"images/part-03/apache_kafka__reliability_and_design__json_schema.png","doc":"docs/part-03/apache_kafka__reliability_and_design__json_schema.md"},{"title":"Schema evolution","quote":"Schema evolution changes message formats while preserving compatibility with existing producers, consumers, and retained data.","explanation":"","image":"images/part-03/apache_kafka__reliability_and_design__schema_evolution.png","doc":"docs/part-03/apache_kafka__reliability_and_design__schema_evolution.md"},{"title":"Compaction","quote":"Kafka log compaction retains the latest value for each key while preserving tombstones long enough to represent deletion.","explanation":"","image":"images/part-03/apache_kafka__reliability_and_design__compaction.png","doc":"docs/part-03/apache_kafka__reliability_and_design__compaction.md"},{"title":"Retention policies","quote":"Kafka retention removes old segments based on time, size, or compaction rules independently of consumer progress.","explanation":"","image":"images/part-03/apache_kafka__reliability_and_design__retention_policies.png","doc":"docs/part-03/apache_kafka__reliability_and_design__retention_policies.md"},{"title":"Tiered storage","quote":"Tiered storage moves older Kafka log segments to cheaper remote storage while keeping recent data locally for fast access.","explanation":"","image":"images/part-03/apache_kafka__reliability_and_design__tiered_storage.png","doc":"docs/part-03/apache_kafka__reliability_and_design__tiered_storage.md"}]},{"name":"Streams and Connect","topics":[{"title":"Kafka Streams","quote":"Kafka Streams is a Java library for building stateful or stateless stream-processing applications directly on Kafka.","explanation":"","image":"images/part-03/apache_kafka__streams_and_connect__kafka_streams.png","doc":"docs/part-03/apache_kafka__streams_and_connect__kafka_streams.md"},{"title":"KStream","quote":"A KStream represents an unbounded stream of independent records where multiple records may share the same key.","explanation":"","image":"images/part-03/apache_kafka__streams_and_connect__kstream.png","doc":"docs/part-03/apache_kafka__streams_and_connect__kstream.md"},{"title":"KTable","quote":"A KTable represents the latest value for each key as a continuously updated changelog-backed table.","explanation":"","image":"images/part-03/apache_kafka__streams_and_connect__ktable.png","doc":"docs/part-03/apache_kafka__streams_and_connect__ktable.md"},{"title":"GlobalKTable","quote":"A GlobalKTable replicates the full table to every application instance, enabling local lookups without repartitioning.","explanation":"","image":"images/part-03/apache_kafka__streams_and_connect__globalktable.png","doc":"docs/part-03/apache_kafka__streams_and_connect__globalktable.md"},{"title":"State stores","quote":"Kafka Streams state stores hold local materialized state for aggregations, joins, and lookups and are backed by changelog topics.","explanation":"","image":"images/part-03/apache_kafka__streams_and_connect__state_stores.png","doc":"docs/part-03/apache_kafka__streams_and_connect__state_stores.md"},{"title":"Windowing","quote":"Windowing groups records by time boundaries such as tumbling, hopping, sliding, or session windows.","explanation":"","image":"images/part-03/apache_kafka__streams_and_connect__windowing.png","doc":"docs/part-03/apache_kafka__streams_and_connect__windowing.md"},{"title":"Joins","quote":"Kafka Streams supports stream-stream, stream-table, and table-table joins with different timing and state requirements.","explanation":"","image":"images/part-03/apache_kafka__streams_and_connect__joins.png","doc":"docs/part-03/apache_kafka__streams_and_connect__joins.md"},{"title":"Repartition topics","quote":"Repartition topics redistribute records by a new key so downstream grouped or joined operations receive matching keys together.","explanation":"","image":"images/part-03/apache_kafka__streams_and_connect__repartition_topics.png","doc":"docs/part-03/apache_kafka__streams_and_connect__repartition_topics.md"},{"title":"Exactly-once processing","quote":"Kafka exactly-once processing atomically commits consumed offsets and produced records so failures do not create duplicate visible results.","explanation":"","image":"images/part-03/apache_kafka__streams_and_connect__exactly_once_processing.png","doc":"docs/part-03/apache_kafka__streams_and_connect__exactly_once_processing.md"},{"title":"Kafka Connect","quote":"Kafka Connect moves data between Kafka and external systems through reusable source and sink connectors.","explanation":"","image":"images/part-03/apache_kafka__streams_and_connect__kafka_connect.png","doc":"docs/part-03/apache_kafka__streams_and_connect__kafka_connect.md"},{"title":"Source connectors","quote":"A source connector reads data from an external system and publishes it to Kafka topics.","explanation":"","image":"images/part-03/apache_kafka__streams_and_connect__source_connectors.png","doc":"docs/part-03/apache_kafka__streams_and_connect__source_connectors.md"},{"title":"Sink connectors","quote":"A sink connector consumes Kafka records and writes them to an external destination.","explanation":"","image":"images/part-03/apache_kafka__streams_and_connect__sink_connectors.png","doc":"docs/part-03/apache_kafka__streams_and_connect__sink_connectors.md"},{"title":"Debezium","quote":"Debezium captures database changes from transaction logs and publishes ordered change events to Kafka.","explanation":"","image":"images/part-03/apache_kafka__streams_and_connect__debezium.png","doc":"docs/part-03/apache_kafka__streams_and_connect__debezium.md"}]}]},{"name":"Messaging","groups":[{"name":"RabbitMQ","topics":[{"title":"RabbitMQ architecture","quote":"RabbitMQ routes messages from publishers through exchanges and bindings into queues consumed by applications.","explanation":"","image":"images/part-03/messaging__rabbitmq__rabbitmq_architecture.png","doc":"docs/part-03/messaging__rabbitmq__rabbitmq_architecture.md"},{"title":"Exchanges","quote":"An exchange receives messages and routes them to queues according to its type and bindings.","explanation":"","image":"images/part-03/messaging__rabbitmq__exchanges.png","doc":"docs/part-03/messaging__rabbitmq__exchanges.md"},{"title":"Queues","quote":"A RabbitMQ queue stores messages until consumers acknowledge or remove them.","explanation":"","image":"images/part-03/messaging__rabbitmq__queues.png","doc":"docs/part-03/messaging__rabbitmq__queues.md"},{"title":"Bindings","quote":"A binding connects an exchange to a queue and may include a routing rule.","explanation":"","image":"images/part-03/messaging__rabbitmq__bindings.png","doc":"docs/part-03/messaging__rabbitmq__bindings.md"},{"title":"Routing keys","quote":"A routing key is message metadata used by direct and topic exchanges to decide which bindings match.","explanation":"","image":"images/part-03/messaging__rabbitmq__routing_keys.png","doc":"docs/part-03/messaging__rabbitmq__routing_keys.md"},{"title":"Direct exchange","quote":"A direct exchange routes a message to queues whose binding key exactly matches the routing key.","explanation":"","image":"images/part-03/messaging__rabbitmq__direct_exchange.png","doc":"docs/part-03/messaging__rabbitmq__direct_exchange.md"},{"title":"Topic exchange","quote":"A topic exchange routes using dot-separated patterns with wildcards such as * and #.","explanation":"","image":"images/part-03/messaging__rabbitmq__topic_exchange.png","doc":"docs/part-03/messaging__rabbitmq__topic_exchange.md"},{"title":"Fanout exchange","quote":"A fanout exchange broadcasts every message to all bound queues and ignores routing keys.","explanation":"","image":"images/part-03/messaging__rabbitmq__fanout_exchange.png","doc":"docs/part-03/messaging__rabbitmq__fanout_exchange.md"},{"title":"Headers exchange","quote":"A headers exchange routes messages by matching header values rather than a routing key.","explanation":"","image":"images/part-03/messaging__rabbitmq__headers_exchange.png","doc":"docs/part-03/messaging__rabbitmq__headers_exchange.md"},{"title":"Publisher confirms","quote":"Publisher confirms asynchronously tell producers whether RabbitMQ accepted and persisted or routed a message according to configuration.","explanation":"","image":"images/part-03/messaging__rabbitmq__publisher_confirms.png","doc":"docs/part-03/messaging__rabbitmq__publisher_confirms.md"},{"title":"Dead-letter exchanges","quote":"A dead-letter exchange receives messages rejected, expired, or discarded from a queue.","explanation":"","image":"images/part-03/messaging__rabbitmq__dead_letter_exchanges.png","doc":"docs/part-03/messaging__rabbitmq__dead_letter_exchanges.md"},{"title":"Prefetch","quote":"Prefetch limits how many unacknowledged messages RabbitMQ sends to a consumer, balancing throughput and fairness.","explanation":"","image":"images/part-03/messaging__rabbitmq__prefetch.png","doc":"docs/part-03/messaging__rabbitmq__prefetch.md"},{"title":"Quorum queues","quote":"Quorum queues replicate messages through Raft for stronger durability and predictable failover.","explanation":"","image":"images/part-03/messaging__rabbitmq__quorum_queues.png","doc":"docs/part-03/messaging__rabbitmq__quorum_queues.md"},{"title":"RabbitMQ clustering","quote":"RabbitMQ clustering shares metadata across nodes, while queue replication strategy determines message availability during node failure.","explanation":"","image":"images/part-03/messaging__rabbitmq__rabbitmq_clustering.png","doc":"docs/part-03/messaging__rabbitmq__rabbitmq_clustering.md"}]},{"name":"General Messaging Patterns","topics":[{"title":"Message broker","quote":"A message broker accepts, routes, stores, and delivers messages between producers and consumers.","explanation":"","image":"images/part-03/messaging__general_messaging_patterns__message_broker.png","doc":"docs/part-03/messaging__general_messaging_patterns__message_broker.md"},{"title":"Work queue","quote":"A work queue distributes independent tasks among consumers so only one consumer processes each message.","explanation":"","image":"images/part-03/messaging__general_messaging_patterns__work_queue.png","doc":"docs/part-03/messaging__general_messaging_patterns__work_queue.md"},{"title":"Competing consumers","quote":"Competing consumers read from the same queue and share work, improving throughput and resilience.","explanation":"","image":"images/part-03/messaging__general_messaging_patterns__competing_consumers.png","doc":"docs/part-03/messaging__general_messaging_patterns__competing_consumers.md"},{"title":"Request-reply messaging","quote":"Request-reply messaging sends a request with a correlation ID and reply destination, then waits for a matching response.","explanation":"","image":"images/part-03/messaging__general_messaging_patterns__request_reply_messaging.png","doc":"docs/part-03/messaging__general_messaging_patterns__request_reply_messaging.md"},{"title":"Dead letter queue","quote":"A dead letter queue isolates messages that cannot be processed successfully for later inspection or replay.","explanation":"","image":"images/part-03/messaging__general_messaging_patterns__dead_letter_queue.png","doc":"docs/part-03/messaging__general_messaging_patterns__dead_letter_queue.md"},{"title":"Delayed messages","quote":"Delayed messages become available only after a configured delay, useful for retries, scheduling, or expiry workflows.","explanation":"","image":"images/part-03/messaging__general_messaging_patterns__delayed_messages.png","doc":"docs/part-03/messaging__general_messaging_patterns__delayed_messages.md"},{"title":"Message deduplication","quote":"Message deduplication records stable identifiers or uses idempotent writes so repeated deliveries do not repeat business effects.","explanation":"","image":"images/part-03/messaging__general_messaging_patterns__message_deduplication.png","doc":"docs/part-03/messaging__general_messaging_patterns__message_deduplication.md"},{"title":"Message ordering","quote":"Message ordering usually depends on one queue or partition and can be broken by concurrency, retries, or redelivery.","explanation":"","image":"images/part-03/messaging__general_messaging_patterns__message_ordering.png","doc":"docs/part-03/messaging__general_messaging_patterns__message_ordering.md"},{"title":"Message TTL","quote":"Message TTL defines how long a message may remain before expiring or being dead-lettered.","explanation":"","image":"images/part-03/messaging__general_messaging_patterns__message_ttl.png","doc":"docs/part-03/messaging__general_messaging_patterns__message_ttl.md"},{"title":"Poison message handling","quote":"Poison messages need bounded retries, diagnostic context, dead-letter routing, and an operator-controlled recovery path.","explanation":"","image":"images/part-03/messaging__general_messaging_patterns__poison_message_handling.png","doc":"docs/part-03/messaging__general_messaging_patterns__poison_message_handling.md"},{"title":"Rate-limited consumers","quote":"Rate-limited consumers control processing speed with permits, delayed retries, bounded concurrency, or broker prefetch settings.","explanation":"","image":"images/part-03/messaging__general_messaging_patterns__rate_limited_consumers.png","doc":"docs/part-03/messaging__general_messaging_patterns__rate_limited_consumers.md"}]}]},{"name":"Databases","groups":[{"name":"Relational Fundamentals","topics":[{"title":"Relational model","quote":"The relational model represents data as relations, commonly implemented as tables with rows, columns, keys, and constraints.","explanation":"","image":"images/part-03/databases__relational_fundamentals__relational_model.png","doc":"docs/part-03/databases__relational_fundamentals__relational_model.md"},{"title":"Tables and rows","quote":"A table defines a structured set of columns, while each row represents one record following that structure.","explanation":"","image":"images/part-03/databases__relational_fundamentals__tables_and_rows.png","doc":"docs/part-03/databases__relational_fundamentals__tables_and_rows.md"},{"title":"Primary keys","quote":"A primary key uniquely and non-nullably identifies each row in a table.","explanation":"","image":"images/part-03/databases__relational_fundamentals__primary_keys.png","doc":"docs/part-03/databases__relational_fundamentals__primary_keys.md"},{"title":"Foreign keys","quote":"A foreign key requires values to reference a valid candidate key in another or the same table.","explanation":"","image":"images/part-03/databases__relational_fundamentals__foreign_keys.png","doc":"docs/part-03/databases__relational_fundamentals__foreign_keys.md"},{"title":"Unique constraints","quote":"A unique constraint prevents duplicate combinations of one or more columns.","explanation":"","image":"images/part-03/databases__relational_fundamentals__unique_constraints.png","doc":"docs/part-03/databases__relational_fundamentals__unique_constraints.md"},{"title":"Check constraints","quote":"A check constraint enforces a Boolean condition on inserted or updated rows.","explanation":"","image":"images/part-03/databases__relational_fundamentals__check_constraints.png","doc":"docs/part-03/databases__relational_fundamentals__check_constraints.md"},{"title":"Normalization","quote":"Normalization restructures data to reduce redundancy and prevent insert, update, and delete anomalies.","explanation":"","image":"images/part-03/databases__relational_fundamentals__normalization.png","doc":"docs/part-03/databases__relational_fundamentals__normalization.md"},{"title":"First normal form","quote":"First normal form requires each column value to be atomic and each row-column intersection to contain one value.","explanation":"","image":"images/part-03/databases__relational_fundamentals__first_normal_form.png","doc":"docs/part-03/databases__relational_fundamentals__first_normal_form.md"},{"title":"Second normal form","quote":"Second normal form requires first normal form and removes partial dependency of non-key attributes on part of a composite key.","explanation":"","image":"images/part-03/databases__relational_fundamentals__second_normal_form.png","doc":"docs/part-03/databases__relational_fundamentals__second_normal_form.md"},{"title":"Third normal form","quote":"Third normal form requires second normal form and removes transitive dependency of non-key attributes on other non-key attributes.","explanation":"","image":"images/part-03/databases__relational_fundamentals__third_normal_form.png","doc":"docs/part-03/databases__relational_fundamentals__third_normal_form.md"},{"title":"BCNF","quote":"Boyce-Codd Normal Form requires every determinant to be a candidate key, strengthening third normal form.","explanation":"","image":"images/part-03/databases__relational_fundamentals__bcnf.png","doc":"docs/part-03/databases__relational_fundamentals__bcnf.md"},{"title":"Denormalization","quote":"Denormalization intentionally duplicates or combines data to reduce joins and improve read performance.","explanation":"","image":"images/part-03/databases__relational_fundamentals__denormalization.png","doc":"docs/part-03/databases__relational_fundamentals__denormalization.md"},{"title":"Referential integrity","quote":"Referential integrity ensures relationships remain valid so foreign-key values point to existing rows or are appropriately null.","explanation":"","image":"images/part-03/databases__relational_fundamentals__referential_integrity.png","doc":"docs/part-03/databases__relational_fundamentals__referential_integrity.md"}]},{"name":"SQL","topics":[{"title":"SELECT queries","quote":"SELECT retrieves data and may include filtering, projection, joins, grouping, ordering, and pagination.","explanation":"","image":"images/part-03/databases__sql__select_queries.png","doc":"docs/part-03/databases__sql__select_queries.md"},{"title":"JOIN types","quote":"Join types determine which matching and nonmatching rows appear when combining tables.","explanation":"","image":"images/part-03/databases__sql__join_types.png","doc":"docs/part-03/databases__sql__join_types.md"},{"title":"INNER JOIN","quote":"INNER JOIN returns only rows with matching join conditions on both sides.","explanation":"","image":"images/part-03/databases__sql__inner_join.png","doc":"docs/part-03/databases__sql__inner_join.md"},{"title":"LEFT JOIN","quote":"LEFT JOIN returns every left-side row and matching right-side rows, using nulls when no match exists.","explanation":"","image":"images/part-03/databases__sql__left_join.png","doc":"docs/part-03/databases__sql__left_join.md"},{"title":"RIGHT JOIN","quote":"RIGHT JOIN returns every right-side row and matching left-side rows, using nulls when no match exists.","explanation":"","image":"images/part-03/databases__sql__right_join.png","doc":"docs/part-03/databases__sql__right_join.md"},{"title":"FULL OUTER JOIN","quote":"FULL OUTER JOIN returns matching rows plus unmatched rows from both sides.","explanation":"","image":"images/part-03/databases__sql__full_outer_join.png","doc":"docs/part-03/databases__sql__full_outer_join.md"},{"title":"GROUP BY","quote":"GROUP BY forms groups of rows so aggregate functions can calculate one result per group.","explanation":"","image":"images/part-03/databases__sql__group_by.png","doc":"docs/part-03/databases__sql__group_by.md"},{"title":"HAVING","quote":"HAVING filters grouped results after aggregation, while WHERE filters rows before grouping.","explanation":"","image":"images/part-03/databases__sql__having.png","doc":"docs/part-03/databases__sql__having.md"},{"title":"Window functions","quote":"Window functions calculate values across related rows without collapsing them into one row per group.","explanation":"","image":"images/part-03/databases__sql__window_functions.png","doc":"docs/part-03/databases__sql__window_functions.md"},{"title":"Common table expressions","quote":"A common table expression names a temporary query result for use within one SQL statement, improving readability and composition.","explanation":"","image":"images/part-03/databases__sql__common_table_expressions.png","doc":"docs/part-03/databases__sql__common_table_expressions.md"},{"title":"Recursive CTE","quote":"A recursive CTE repeatedly applies a recursive query to model hierarchies, graphs, or generated sequences.","explanation":"","image":"images/part-03/databases__sql__recursive_cte.png","doc":"docs/part-03/databases__sql__recursive_cte.md"},{"title":"Subqueries","quote":"A subquery is a query nested inside another statement and may return a scalar, row, set, or derived table.","explanation":"","image":"images/part-03/databases__sql__subqueries.png","doc":"docs/part-03/databases__sql__subqueries.md"},{"title":"Correlated subqueries","quote":"A correlated subquery references columns from the outer query and may execute logically once per outer row.","explanation":"","image":"images/part-03/databases__sql__correlated_subqueries.png","doc":"docs/part-03/databases__sql__correlated_subqueries.md"},{"title":"UNION vs UNION ALL","quote":"UNION combines results and removes duplicates, while UNION ALL preserves duplicates and is usually faster.","explanation":"","image":"images/part-03/databases__sql__union_vs_union_all.png","doc":"docs/part-03/databases__sql__union_vs_union_all.md"},{"title":"MERGE statement","quote":"MERGE conditionally inserts, updates, or deletes target rows based on matches with a source dataset.","explanation":"","image":"images/part-03/databases__sql__merge_statement.png","doc":"docs/part-03/databases__sql__merge_statement.md"}]},{"name":"Transactions","topics":[{"title":"ACID","quote":"ACID means Atomicity, Consistency, Isolation, and Durability, the core guarantees of reliable transactions.","explanation":"","image":"images/part-03/databases__transactions__acid.png","doc":"docs/part-03/databases__transactions__acid.md"},{"title":"Transaction isolation levels","quote":"Transaction isolation levels control how much one transaction can observe concurrent changes made by others.","explanation":"","image":"images/part-03/databases__transactions__transaction_isolation_levels.png","doc":"docs/part-03/databases__transactions__transaction_isolation_levels.md"},{"title":"Dirty reads","quote":"A dirty read occurs when a transaction reads uncommitted data that may later be rolled back.","explanation":"","image":"images/part-03/databases__transactions__dirty_reads.png","doc":"docs/part-03/databases__transactions__dirty_reads.md"},{"title":"Non-repeatable reads","quote":"A non-repeatable read occurs when the same row is read twice and returns different committed values because another transaction updated it.","explanation":"","image":"images/part-03/databases__transactions__non_repeatable_reads.png","doc":"docs/part-03/databases__transactions__non_repeatable_reads.md"},{"title":"Phantom reads","quote":"A phantom read occurs when repeating a range query returns new or missing rows because another transaction inserted or deleted matching records.","explanation":"","image":"images/part-03/databases__transactions__phantom_reads.png","doc":"docs/part-03/databases__transactions__phantom_reads.md"},{"title":"Lost updates","quote":"A lost update occurs when two transactions read the same value and later one write overwrites the other\u0027s change.","explanation":"","image":"images/part-03/databases__transactions__lost_updates.png","doc":"docs/part-03/databases__transactions__lost_updates.md"},{"title":"Optimistic concurrency control","quote":"Optimistic concurrency control allows concurrent work and detects conflicts at update time, commonly through version columns or compare-and-set conditions.","explanation":"","image":"images/part-03/databases__transactions__optimistic_concurrency_control.png","doc":"docs/part-03/databases__transactions__optimistic_concurrency_control.md"},{"title":"MVCC","quote":"Multi-Version Concurrency Control keeps multiple row versions so readers can see a consistent snapshot without blocking writers.","explanation":"","image":"images/part-03/databases__transactions__mvcc.png","doc":"docs/part-03/databases__transactions__mvcc.md"},{"title":"Deadlocks","quote":"A database deadlock occurs when transactions wait in a cycle for locks held by one another. The database usually aborts one transaction.","explanation":"","image":"images/part-03/databases__transactions__deadlocks.png","doc":"docs/part-03/databases__transactions__deadlocks.md"},{"title":"Two-phase locking","quote":"Two-phase locking first acquires locks and then releases them, ensuring serializability when followed strictly but increasing blocking risk.","explanation":"","image":"images/part-03/databases__transactions__two_phase_locking.png","doc":"docs/part-03/databases__transactions__two_phase_locking.md"},{"title":"Write skew","quote":"Write skew occurs when concurrent transactions read the same condition, update different rows, and together violate a business rule.","explanation":"","image":"images/part-03/databases__transactions__write_skew.png","doc":"docs/part-03/databases__transactions__write_skew.md"},{"title":"Serializable isolation","quote":"Serializable isolation makes concurrent transactions behave as if executed one at a time, offering the strongest isolation at higher coordination cost.","explanation":"","image":"images/part-03/databases__transactions__serializable_isolation.png","doc":"docs/part-03/databases__transactions__serializable_isolation.md"}]},{"name":"Indexing","topics":[{"title":"Composite indexes","quote":"A composite index contains multiple columns in a defined order. Queries benefit most when predicates match the leftmost prefix.","explanation":"","image":"images/part-03/databases__indexing__composite_indexes.png","doc":"docs/part-03/databases__indexing__composite_indexes.md"},{"title":"Covering indexes","quote":"A covering index contains all columns needed by a query, allowing the database to answer it without visiting the base table...","explanation":"","image":"images/part-03/databases__indexing__covering_indexes.png","doc":"docs/part-03/databases__indexing__covering_indexes.md"},{"title":"Clustered indexes","quote":"A clustered index determines the physical or primary storage order of table rows. A table usually has only one.","explanation":"","image":"images/part-03/databases__indexing__clustered_indexes.png","doc":"docs/part-03/databases__indexing__clustered_indexes.md"},{"title":"Nonclustered indexes","quote":"A nonclustered index stores indexed keys separately with row locators pointing back to the table data.","explanation":"","image":"images/part-03/databases__indexing__nonclustered_indexes.png","doc":"docs/part-03/databases__indexing__nonclustered_indexes.md"},{"title":"Partial indexes","quote":"A partial index includes only rows matching a predicate, reducing size and improving selective query performance.","explanation":"","image":"images/part-03/databases__indexing__partial_indexes.png","doc":"docs/part-03/databases__indexing__partial_indexes.md"},{"title":"Function-based indexes","quote":"A function-based index stores the result of an expression so queries using the same expression can avoid full scans.","explanation":"","image":"images/part-03/databases__indexing__function_based_indexes.png","doc":"docs/part-03/databases__indexing__function_based_indexes.md"},{"title":"Index selectivity","quote":"Index selectivity measures how narrowly an indexed value identifies rows. Highly selective indexes are generally more useful.","explanation":"","image":"images/part-03/databases__indexing__index_selectivity.png","doc":"docs/part-03/databases__indexing__index_selectivity.md"},{"title":"Index cardinality","quote":"Index cardinality is the number of distinct indexed values. Higher cardinality often improves filtering efficiency.","explanation":"","image":"images/part-03/databases__indexing__index_cardinality.png","doc":"docs/part-03/databases__indexing__index_cardinality.md"},{"title":"Index-only scans","quote":"An index-only scan returns query results entirely from the index when visibility rules and required columns allow it.","explanation":"","image":"images/part-03/databases__indexing__index_only_scans.png","doc":"docs/part-03/databases__indexing__index_only_scans.md"},{"title":"Index maintenance costs","quote":"Indexes consume storage and add work to inserts, updates, deletes, vacuuming, and statistics maintenance.","explanation":"","image":"images/part-03/databases__indexing__index_maintenance_costs.png","doc":"docs/part-03/databases__indexing__index_maintenance_costs.md"}]},{"name":"Query Optimization","topics":[{"title":"Query execution plans","quote":"A query execution plan shows the operators, access paths, join order, and estimates chosen to run a query.","explanation":"","image":"images/part-03/databases__query_optimization__query_execution_plans.png","doc":"docs/part-03/databases__query_optimization__query_execution_plans.md"},{"title":"Cost-based optimizer","quote":"A cost-based optimizer compares possible plans using statistics and estimated CPU, IO, memory, and row counts.","explanation":"","image":"images/part-03/databases__query_optimization__cost_based_optimizer.png","doc":"docs/part-03/databases__query_optimization__cost_based_optimizer.md"},{"title":"Table scans","quote":"A table scan reads most or all table pages. It can be efficient for small tables or queries returning a large percentage of rows.","explanation":"","image":"images/part-03/databases__query_optimization__table_scans.png","doc":"docs/part-03/databases__query_optimization__table_scans.md"},{"title":"Index scans","quote":"An index scan traverses an index to locate matching rows, sometimes followed by lookups into the base table.","explanation":"","image":"images/part-03/databases__query_optimization__index_scans.png","doc":"docs/part-03/databases__query_optimization__index_scans.md"},{"title":"Join algorithms","quote":"Databases commonly use nested loop, hash, and merge joins. The optimizer chooses based on size, ordering, indexes, and estimates.","explanation":"","image":"images/part-03/databases__query_optimization__join_algorithms.png","doc":"docs/part-03/databases__query_optimization__join_algorithms.md"},{"title":"Nested loop join","quote":"A nested loop join scans one input and probes the other for each row. It works well when the outer side is small and the inner side is indexed.","explanation":"","image":"images/part-03/databases__query_optimization__nested_loop_join.png","doc":"docs/part-03/databases__query_optimization__nested_loop_join.md"},{"title":"Hash join","quote":"A hash join builds a hash table from one input and probes it with the other. It is efficient for large equality joins.","explanation":"","image":"images/part-03/databases__query_optimization__hash_join.png","doc":"docs/part-03/databases__query_optimization__hash_join.md"},{"title":"Merge join","quote":"A merge join walks two inputs sorted by the join key. It is efficient when both sides are already ordered.","explanation":"","image":"images/part-03/databases__query_optimization__merge_join.png","doc":"docs/part-03/databases__query_optimization__merge_join.md"},{"title":"Statistics","quote":"Database statistics describe row counts, distinct values, distributions, and correlations used by the optimizer.","explanation":"","image":"images/part-03/databases__query_optimization__statistics.png","doc":"docs/part-03/databases__query_optimization__statistics.md"},{"title":"Cardinality estimation","quote":"Cardinality estimation predicts how many rows each plan operator will produce. Poor estimates often lead to poor plans.","explanation":"","image":"images/part-03/databases__query_optimization__cardinality_estimation.png","doc":"docs/part-03/databases__query_optimization__cardinality_estimation.md"},{"title":"Parameter sniffing","quote":"Parameter sniffing occurs when a cached plan is optimized for one parameter value but performs badly for others.","explanation":"","image":"images/part-03/databases__query_optimization__parameter_sniffing.png","doc":"docs/part-03/databases__query_optimization__parameter_sniffing.md"},{"title":"Query plan caching","quote":"Plan caching reuses compiled execution plans to reduce optimization overhead, but stale or parameter-sensitive plans can hurt performance.","explanation":"","image":"images/part-03/databases__query_optimization__query_plan_caching.png","doc":"docs/part-03/databases__query_optimization__query_plan_caching.md"},{"title":"Slow query analysis","quote":"Slow query analysis combines timing, execution plans, waits, row counts, indexes, and realistic parameters to find the true bottleneck.","explanation":"","image":"images/part-03/databases__query_optimization__slow_query_analysis.png","doc":"docs/part-03/databases__query_optimization__slow_query_analysis.md"}]},{"name":"Replication and Scaling","topics":[{"title":"Primary-replica","quote":"Primary-replica replication directs writes to one primary and copies changes to replicas that can serve reads or fail over.","explanation":"","image":"images/part-03/databases__replication_and_scaling__primary_replica.png","doc":"docs/part-03/databases__replication_and_scaling__primary_replica.md"},{"title":"Multi-primary replication","quote":"Multi-primary replication allows writes on multiple nodes and therefore requires conflict detection and resolution.","explanation":"","image":"images/part-03/databases__replication_and_scaling__multi_primary_replication.png","doc":"docs/part-03/databases__replication_and_scaling__multi_primary_replication.md"},{"title":"Replication lag","quote":"Replication lag is the delay between a change on the primary and its application on a replica.","explanation":"","image":"images/part-03/databases__replication_and_scaling__replication_lag.png","doc":"docs/part-03/databases__replication_and_scaling__replication_lag.md"},{"title":"Failover","quote":"Failover promotes a healthy replica or standby when the active database becomes unavailable.","explanation":"","image":"images/part-03/databases__replication_and_scaling__failover.png","doc":"docs/part-03/databases__replication_and_scaling__failover.md"},{"title":"Range sharding","quote":"Range sharding assigns contiguous key ranges to shards. It supports range queries but can create hotspots at growing ranges.","explanation":"","image":"images/part-03/databases__replication_and_scaling__range_sharding.png","doc":"docs/part-03/databases__replication_and_scaling__range_sharding.md"},{"title":"Hash sharding","quote":"Hash sharding distributes rows using a hash of the shard key, usually improving balance but complicating range access.","explanation":"","image":"images/part-03/databases__replication_and_scaling__hash_sharding.png","doc":"docs/part-03/databases__replication_and_scaling__hash_sharding.md"},{"title":"Rebalancing shards","quote":"Shard rebalancing moves data and traffic when capacity or distribution changes. It must minimize downtime, duplication, and inconsistency.","explanation":"","image":"images/part-03/databases__replication_and_scaling__rebalancing_shards.png","doc":"docs/part-03/databases__replication_and_scaling__rebalancing_shards.md"},{"title":"Hot shards","quote":"A hot shard receives disproportionate load because of skewed keys, popular tenants, or time-based writes.","explanation":"","image":"images/part-03/databases__replication_and_scaling__hot_shards.png","doc":"docs/part-03/databases__replication_and_scaling__hot_shards.md"}]}]},{"name":"NoSQL","groups":[{"name":"NoSQL Fundamentals","topics":[{"title":"Document databases","quote":"Document databases store self-contained JSON-like records and support flexible nested structures and field-based queries.","explanation":"","image":"images/part-03/nosql__nosql_fundamentals__document_databases.png","doc":"docs/part-03/nosql__nosql_fundamentals__document_databases.md"},{"title":"Column-family databases","quote":"Column-family databases group related columns and are designed for large-scale distributed workloads with predictable key-based access.","explanation":"","image":"images/part-03/nosql__nosql_fundamentals__column_family_databases.png","doc":"docs/part-03/nosql__nosql_fundamentals__column_family_databases.md"},{"title":"Wide-column stores","quote":"Wide-column stores support sparse rows with many dynamic columns, commonly organized by partition and clustering keys.","explanation":"","image":"images/part-03/nosql__nosql_fundamentals__wide_column_stores.png","doc":"docs/part-03/nosql__nosql_fundamentals__wide_column_stores.md"},{"title":"NoSQL consistency models","quote":"NoSQL systems may offer strong, eventual, causal, session, or tunable consistency depending on replication and read-write settings.","explanation":"","image":"images/part-03/nosql__nosql_fundamentals__nosql_consistency_models.png","doc":"docs/part-03/nosql__nosql_fundamentals__nosql_consistency_models.md"},{"title":"Tunable consistency","quote":"Tunable consistency lets clients choose read and write acknowledgement levels per operation, balancing latency and consistency.","explanation":"","image":"images/part-03/nosql__nosql_fundamentals__tunable_consistency.png","doc":"docs/part-03/nosql__nosql_fundamentals__tunable_consistency.md"},{"title":"Data modeling for NoSQL","quote":"NoSQL models should be designed around access patterns, duplication, partition distribution, and expected consistency rather than normalization alone.","explanation":"","image":"images/part-03/nosql__nosql_fundamentals__data_modeling_for_nosql.png","doc":"docs/part-03/nosql__nosql_fundamentals__data_modeling_for_nosql.md"}]},{"name":"MongoDB","topics":[{"title":"MongoDB documents","quote":"MongoDB stores BSON documents with nested objects and arrays, allowing flexible aggregate-oriented models.","explanation":"","image":"images/part-03/nosql__mongodb__mongodb_documents.png","doc":"docs/part-03/nosql__mongodb__mongodb_documents.md"},{"title":"Collections","quote":"A MongoDB collection groups related documents and is roughly analogous to a table, though documents may have varying shapes.","explanation":"","image":"images/part-03/nosql__mongodb__collections.png","doc":"docs/part-03/nosql__mongodb__collections.md"},{"title":"ObjectId","quote":"ObjectId is MongoDB\u0027s common 12-byte identifier containing timestamp and uniqueness components.","explanation":"","image":"images/part-03/nosql__mongodb__objectid.png","doc":"docs/part-03/nosql__mongodb__objectid.md"},{"title":"MongoDB indexes","quote":"MongoDB supports single-field, compound, multikey, text, geospatial, hashed, wildcard, and partial indexes.","explanation":"","image":"images/part-03/nosql__mongodb__mongodb_indexes.png","doc":"docs/part-03/nosql__mongodb__mongodb_indexes.md"},{"title":"Aggregation pipeline","quote":"The MongoDB aggregation pipeline processes documents through stages such as match, project, group, sort, unwind, and lookup.","explanation":"","image":"images/part-03/nosql__mongodb__aggregation_pipeline.png","doc":"docs/part-03/nosql__mongodb__aggregation_pipeline.md"},{"title":"Replica sets","quote":"A MongoDB replica set contains one primary and secondary members for redundancy, failover, and read scaling.","explanation":"","image":"images/part-03/nosql__mongodb__replica_sets.png","doc":"docs/part-03/nosql__mongodb__replica_sets.md"},{"title":"Change streams","quote":"MongoDB change streams expose real-time insert, update, replace, and delete events from the replication log.","explanation":"","image":"images/part-03/nosql__mongodb__change_streams.png","doc":"docs/part-03/nosql__mongodb__change_streams.md"},{"title":"Transactions in MongoDB","quote":"MongoDB supports multi-document ACID transactions, though good document modeling should keep most operations within one document.","explanation":"","image":"images/part-03/nosql__mongodb__transactions_in_mongodb.png","doc":"docs/part-03/nosql__mongodb__transactions_in_mongodb.md"},{"title":"Schema validation","quote":"MongoDB schema validation enforces document structure and value rules using JSON Schema-like validators.","explanation":"","image":"images/part-03/nosql__mongodb__schema_validation.png","doc":"docs/part-03/nosql__mongodb__schema_validation.md"},{"title":"Read preference","quote":"Read preference controls which replica-set members may serve reads, such as primary, secondary, nearest, or preferred variants.","explanation":"","image":"images/part-03/nosql__mongodb__read_preference.png","doc":"docs/part-03/nosql__mongodb__read_preference.md"},{"title":"Write concern","quote":"Write concern defines how many acknowledgements and durability guarantees a MongoDB write requires.","explanation":"","image":"images/part-03/nosql__mongodb__write_concern.png","doc":"docs/part-03/nosql__mongodb__write_concern.md"}]},{"name":"Redis","topics":[{"title":"Redis data types","quote":"Redis supports strings, hashes, lists, sets, sorted sets, streams, bitmaps, HyperLogLogs, and geospatial values.","explanation":"","image":"images/part-03/nosql__redis__redis_data_types.png","doc":"docs/part-03/nosql__redis__redis_data_types.md"},{"title":"Strings","quote":"Redis strings store binary-safe values and support counters, ranges, expiration, and atomic updates.","explanation":"","image":"images/part-03/nosql__redis__strings.png","doc":"docs/part-03/nosql__redis__strings.md"},{"title":"Hashes","quote":"Redis hashes store field-value pairs under one key and are useful for compact object-like data.","explanation":"","image":"images/part-03/nosql__redis__hashes.png","doc":"docs/part-03/nosql__redis__hashes.md"},{"title":"Lists","quote":"Redis lists are linked sequences supporting pushes, pops, ranges, and blocking queue operations.","explanation":"","image":"images/part-03/nosql__redis__lists.png","doc":"docs/part-03/nosql__redis__lists.md"},{"title":"Sets","quote":"Redis sets store unique unordered members and support union, intersection, and difference.","explanation":"","image":"images/part-03/nosql__redis__sets.png","doc":"docs/part-03/nosql__redis__sets.md"},{"title":"Sorted sets","quote":"Redis sorted sets store unique members ordered by numeric scores, making them useful for rankings and time-based indexes.","explanation":"","image":"images/part-03/nosql__redis__sorted_sets.png","doc":"docs/part-03/nosql__redis__sorted_sets.md"},{"title":"Streams","quote":"Redis Streams provide append-only event logs with IDs, consumer groups, acknowledgements, and pending-entry tracking.","explanation":"","image":"images/part-03/nosql__redis__streams.png","doc":"docs/part-03/nosql__redis__streams.md"},{"title":"Pub/Sub","quote":"Redis Pub/Sub broadcasts messages to current subscribers but does not persist them for offline consumers.","explanation":"","image":"images/part-03/nosql__redis__pub_sub.png","doc":"docs/part-03/nosql__redis__pub_sub.md"},{"title":"Redis transactions","quote":"Redis transactions queue commands with MULTI and execute them atomically with EXEC, though they do not provide rollback.","explanation":"","image":"images/part-03/nosql__redis__redis_transactions.png","doc":"docs/part-03/nosql__redis__redis_transactions.md"},{"title":"Lua scripting","quote":"Redis Lua scripts execute atomically on the server, allowing multi-step logic without race conditions.","explanation":"","image":"images/part-03/nosql__redis__lua_scripting.png","doc":"docs/part-03/nosql__redis__lua_scripting.md"},{"title":"Persistence RDB","quote":"RDB persistence creates point-in-time snapshots of Redis data. It is compact and fast to restore but may lose recent changes.","explanation":"","image":"images/part-03/nosql__redis__persistence_rdb.png","doc":"docs/part-03/nosql__redis__persistence_rdb.md"},{"title":"Persistence AOF","quote":"AOF persistence logs write commands and can provide stronger durability at the cost of larger files and more IO.","explanation":"","image":"images/part-03/nosql__redis__persistence_aof.png","doc":"docs/part-03/nosql__redis__persistence_aof.md"},{"title":"Redis replication","quote":"Redis replication asynchronously copies data from a primary to replicas for read scaling and failover.","explanation":"","image":"images/part-03/nosql__redis__redis_replication.png","doc":"docs/part-03/nosql__redis__redis_replication.md"},{"title":"Redis Sentinel","quote":"Redis Sentinel monitors primary and replica nodes, performs failover, and helps clients discover the current primary.","explanation":"","image":"images/part-03/nosql__redis__redis_sentinel.png","doc":"docs/part-03/nosql__redis__redis_sentinel.md"},{"title":"Redis Cluster","quote":"Redis Cluster partitions keys across nodes using hash slots and provides distributed failover.","explanation":"","image":"images/part-03/nosql__redis__redis_cluster.png","doc":"docs/part-03/nosql__redis__redis_cluster.md"},{"title":"Cache eviction policies","quote":"Redis eviction policies decide which keys to remove when memory is full, such as LRU, LFU, TTL-based, random, or no eviction.","explanation":"","image":"images/part-03/nosql__redis__cache_eviction_policies.png","doc":"docs/part-03/nosql__redis__cache_eviction_policies.md"},{"title":"Distributed locks with Redis","quote":"A Redis lock usually uses SET with NX, expiry, and a unique token. Correctness-sensitive use cases also need fencing or stronger coordination.","explanation":"","image":"images/part-03/nosql__redis__distributed_locks_with_redis.png","doc":"docs/part-03/nosql__redis__distributed_locks_with_redis.md"}]},{"name":"Cassandra and DynamoDB","topics":[{"title":"Cassandra architecture","quote":"Cassandra is a peer-to-peer distributed wide-column database with no single primary and tunable consistency.","explanation":"","image":"images/part-03/nosql__cassandra_and_dynamodb__cassandra_architecture.png","doc":"docs/part-03/nosql__cassandra_and_dynamodb__cassandra_architecture.md"},{"title":"Partition keys","quote":"A Cassandra partition key determines the node placement and groups rows that are stored together.","explanation":"","image":"images/part-03/nosql__cassandra_and_dynamodb__partition_keys.png","doc":"docs/part-03/nosql__cassandra_and_dynamodb__partition_keys.md"},{"title":"Clustering keys","quote":"Clustering keys order rows within a Cassandra partition and define supported range queries.","explanation":"","image":"images/part-03/nosql__cassandra_and_dynamodb__clustering_keys.png","doc":"docs/part-03/nosql__cassandra_and_dynamodb__clustering_keys.md"},{"title":"Consistency levels","quote":"Cassandra consistency levels control how many replicas must acknowledge reads or writes, such as ONE, QUORUM, or ALL.","explanation":"","image":"images/part-03/nosql__cassandra_and_dynamodb__consistency_levels.png","doc":"docs/part-03/nosql__cassandra_and_dynamodb__consistency_levels.md"},{"title":"Compaction strategies","quote":"Cassandra compaction merges SSTables, removes obsolete data, and is tuned for write, read, or time-series patterns.","explanation":"","image":"images/part-03/nosql__cassandra_and_dynamodb__compaction_strategies.png","doc":"docs/part-03/nosql__cassandra_and_dynamodb__compaction_strategies.md"},{"title":"Tombstones","quote":"Cassandra tombstones mark deletions until compaction safely removes old values across replicas. Excess tombstones degrade reads.","explanation":"","image":"images/part-03/nosql__cassandra_and_dynamodb__tombstones.png","doc":"docs/part-03/nosql__cassandra_and_dynamodb__tombstones.md"},{"title":"DynamoDB partition keys","quote":"A DynamoDB partition key is hashed to distribute items across physical partitions.","explanation":"","image":"images/part-03/nosql__cassandra_and_dynamodb__dynamodb_partition_keys.png","doc":"docs/part-03/nosql__cassandra_and_dynamodb__dynamodb_partition_keys.md"},{"title":"Sort keys","quote":"A DynamoDB sort key orders items sharing the same partition key and enables range queries within that group.","explanation":"","image":"images/part-03/nosql__cassandra_and_dynamodb__sort_keys.png","doc":"docs/part-03/nosql__cassandra_and_dynamodb__sort_keys.md"},{"title":"Global secondary indexes","quote":"A global secondary index uses an alternative partition and optional sort key and is maintained separately from the base table.","explanation":"","image":"images/part-03/nosql__cassandra_and_dynamodb__global_secondary_indexes.png","doc":"docs/part-03/nosql__cassandra_and_dynamodb__global_secondary_indexes.md"},{"title":"Local secondary indexes","quote":"A local secondary index shares the base table\u0027s partition key but uses a different sort key and must be created with the table.","explanation":"","image":"images/part-03/nosql__cassandra_and_dynamodb__local_secondary_indexes.png","doc":"docs/part-03/nosql__cassandra_and_dynamodb__local_secondary_indexes.md"},{"title":"DynamoDB streams","quote":"DynamoDB Streams capture ordered item-level changes for each partition and can trigger downstream processing.","explanation":"","image":"images/part-03/nosql__cassandra_and_dynamodb__dynamodb_streams.png","doc":"docs/part-03/nosql__cassandra_and_dynamodb__dynamodb_streams.md"},{"title":"Conditional writes","quote":"Conditional writes apply a change only when an expression matches, enabling optimistic concurrency and uniqueness checks.","explanation":"","image":"images/part-03/nosql__cassandra_and_dynamodb__conditional_writes.png","doc":"docs/part-03/nosql__cassandra_and_dynamodb__conditional_writes.md"},{"title":"Single-table design","quote":"Single-table design stores multiple entity types together and models access patterns through composite keys and indexes.","explanation":"","image":"images/part-03/nosql__cassandra_and_dynamodb__single_table_design.png","doc":"docs/part-03/nosql__cassandra_and_dynamodb__single_table_design.md"},{"title":"Hot partition avoidance","quote":"Avoid hot DynamoDB partitions by choosing high-cardinality keys, spreading traffic, and sharding bursty write patterns.","explanation":"","image":"images/part-03/nosql__cassandra_and_dynamodb__hot_partition_avoidance.png","doc":"docs/part-03/nosql__cassandra_and_dynamodb__hot_partition_avoidance.md"}]}]},{"name":"Data Engineering","groups":[{"name":"Data Processing","topics":[{"title":"ETL vs ELT","quote":"ETL transforms data before loading it into the target, while ELT loads raw data first and transforms it inside the destination platform.","explanation":"","image":"images/part-03/data_engineering__data_processing__etl_vs_elt.png","doc":"docs/part-03/data_engineering__data_processing__etl_vs_elt.md"},{"title":"Batch processing","quote":"Batch processing handles bounded datasets on a schedule or when enough data accumulates.","explanation":"","image":"images/part-03/data_engineering__data_processing__batch_processing.png","doc":"docs/part-03/data_engineering__data_processing__batch_processing.md"},{"title":"Stream processing","quote":"Stream processing handles events continuously as they arrive, usually with low latency and stateful operators.","explanation":"","image":"images/part-03/data_engineering__data_processing__stream_processing.png","doc":"docs/part-03/data_engineering__data_processing__stream_processing.md"},{"title":"Data pipelines","quote":"A data pipeline moves and transforms data through ingestion, validation, storage, processing, and serving stages.","explanation":"","image":"images/part-03/data_engineering__data_processing__data_pipelines.png","doc":"docs/part-03/data_engineering__data_processing__data_pipelines.md"},{"title":"Data quality","quote":"Data quality covers accuracy, completeness, consistency, freshness, validity, and uniqueness.","explanation":"","image":"images/part-03/data_engineering__data_processing__data_quality.png","doc":"docs/part-03/data_engineering__data_processing__data_quality.md"},{"title":"Watermarks","quote":"A watermark represents progress in event time and helps stream processors decide when windows can be evaluated despite delayed events.","explanation":"","image":"images/part-03/data_engineering__data_processing__watermarks.png","doc":"docs/part-03/data_engineering__data_processing__watermarks.md"},{"title":"Late arriving data","quote":"Late-arriving data reaches the system after its expected event-time window and requires update, correction, or discard policies.","explanation":"","image":"images/part-03/data_engineering__data_processing__late_arriving_data.png","doc":"docs/part-03/data_engineering__data_processing__late_arriving_data.md"},{"title":"Idempotent pipelines","quote":"An idempotent pipeline can safely rerun the same input without creating duplicate outputs or repeated side effects.","explanation":"","image":"images/part-03/data_engineering__data_processing__idempotent_pipelines.png","doc":"docs/part-03/data_engineering__data_processing__idempotent_pipelines.md"},{"title":"Data lineage","quote":"Data lineage records where data came from, how it changed, and where it was consumed.","explanation":"","image":"images/part-03/data_engineering__data_processing__data_lineage.png","doc":"docs/part-03/data_engineering__data_processing__data_lineage.md"},{"title":"Data contracts","quote":"A data contract defines schema, semantics, ownership, quality, compatibility, and delivery expectations between producers and consumers.","explanation":"","image":"images/part-03/data_engineering__data_processing__data_contracts.png","doc":"docs/part-03/data_engineering__data_processing__data_contracts.md"}]},{"name":"Big Data","topics":[{"title":"Hadoop ecosystem","quote":"The Hadoop ecosystem includes distributed storage and processing tools such as HDFS, MapReduce, YARN, Hive, and related projects.","explanation":"","image":"images/part-03/data_engineering__big_data__hadoop_ecosystem.png","doc":"docs/part-03/data_engineering__big_data__hadoop_ecosystem.md"},{"title":"HDFS","quote":"HDFS stores large files across cluster nodes in replicated blocks and is optimized for high-throughput sequential access.","explanation":"","image":"images/part-03/data_engineering__big_data__hdfs.png","doc":"docs/part-03/data_engineering__big_data__hdfs.md"},{"title":"MapReduce","quote":"MapReduce processes large datasets through parallel map tasks followed by shuffle, sort, and reduce stages.","explanation":"","image":"images/part-03/data_engineering__big_data__mapreduce.png","doc":"docs/part-03/data_engineering__big_data__mapreduce.md"},{"title":"Apache Spark","quote":"Apache Spark is a distributed processing engine for large-scale batch, SQL, machine-learning, graph, and streaming workloads.","explanation":"","image":"images/part-03/data_engineering__big_data__apache_spark.png","doc":"docs/part-03/data_engineering__big_data__apache_spark.md"},{"title":"Spark DataFrames","quote":"A Spark DataFrame is a distributed table with named columns and a schema. Spark optimizes DataFrame operations through Catalyst and Tungsten.","explanation":"","image":"images/part-03/data_engineering__big_data__spark_dataframes.png","doc":"docs/part-03/data_engineering__big_data__spark_dataframes.md"},{"title":"Spark SQL","quote":"Spark SQL lets applications query structured data with SQL or DataFrame APIs and supports sources such as Hive, Parquet, JSON, and JDBC.","explanation":"","image":"images/part-03/data_engineering__big_data__spark_sql.png","doc":"docs/part-03/data_engineering__big_data__spark_sql.md"},{"title":"Spark partitions","quote":"Spark partitions are the units of parallel processing. Too few limit concurrency, while too many increase scheduling and shuffle overhead.","explanation":"","image":"images/part-03/data_engineering__big_data__spark_partitions.png","doc":"docs/part-03/data_engineering__big_data__spark_partitions.md"},{"title":"Spark shuffles","quote":"A shuffle redistributes data across executors for operations such as joins, grouping, sorting, and repartitioning. It is network- and disk-intensive.","explanation":"","image":"images/part-03/data_engineering__big_data__spark_shuffles.png","doc":"docs/part-03/data_engineering__big_data__spark_shuffles.md"},{"title":"Spark caching","quote":"Spark caching keeps reused datasets in memory or on disk to avoid recomputation. Cache only data that is reused enough to justify the memory cost.","explanation":"","image":"images/part-03/data_engineering__big_data__spark_caching.png","doc":"docs/part-03/data_engineering__big_data__spark_caching.md"},{"title":"Spark joins","quote":"Spark supports broadcast, sort-merge, shuffle-hash, and nested-loop joins. Data size, partitioning, skew, and statistics influence the chosen strategy.","explanation":"","image":"images/part-03/data_engineering__big_data__spark_joins.png","doc":"docs/part-03/data_engineering__big_data__spark_joins.md"},{"title":"Spark streaming","quote":"Spark Structured Streaming processes continuous data with DataFrame-style APIs, checkpoints, event-time windows, and configurable output modes.","explanation":"","image":"images/part-03/data_engineering__big_data__spark_streaming.png","doc":"docs/part-03/data_engineering__big_data__spark_streaming.md"},{"title":"Hive","quote":"Apache Hive provides SQL-style querying over large datasets stored in distributed files and commonly uses a metastore for table definitions.","explanation":"","image":"images/part-03/data_engineering__big_data__hive.png","doc":"docs/part-03/data_engineering__big_data__hive.md"},{"title":"Parquet","quote":"Parquet is a columnar file format with compression, predicate pushdown, and efficient selective reads for analytics.","explanation":"","image":"images/part-03/data_engineering__big_data__parquet.png","doc":"docs/part-03/data_engineering__big_data__parquet.md"},{"title":"ORC","quote":"ORC is a columnar storage format optimized for analytics with compression, indexes, statistics, and predicate pushdown.","explanation":"","image":"images/part-03/data_engineering__big_data__orc.png","doc":"docs/part-03/data_engineering__big_data__orc.md"},{"title":"Delta Lake","quote":"Delta Lake adds ACID transactions, schema enforcement, time travel, and reliable batch-stream processing to data-lake storage.","explanation":"","image":"images/part-03/data_engineering__big_data__delta_lake.png","doc":"docs/part-03/data_engineering__big_data__delta_lake.md"},{"title":"Data lakehouse","quote":"A data lakehouse combines low-cost open data-lake storage with warehouse features such as transactions, governance, and SQL performance.","explanation":"","image":"images/part-03/data_engineering__big_data__data_lakehouse.png","doc":"docs/part-03/data_engineering__big_data__data_lakehouse.md"}]}]},{"name":"Cloud Computing","groups":[{"name":"Cloud Fundamentals","topics":[{"title":"Cloud computing","quote":"Cloud computing delivers compute, storage, networking, databases, and software as on-demand services with metered usage.","explanation":"","image":"images/part-03/cloud_computing__cloud_fundamentals__cloud_computing.png","doc":"docs/part-03/cloud_computing__cloud_fundamentals__cloud_computing.md"},{"title":"IaaS","quote":"Infrastructure as a Service provides virtual machines, networks, and storage while the customer manages the operating system and applications.","explanation":"","image":"images/part-03/cloud_computing__cloud_fundamentals__iaas.png","doc":"docs/part-03/cloud_computing__cloud_fundamentals__iaas.md"},{"title":"PaaS","quote":"Platform as a Service manages more of the runtime, scaling, and deployment platform so developers focus mainly on application code.","explanation":"","image":"images/part-03/cloud_computing__cloud_fundamentals__paas.png","doc":"docs/part-03/cloud_computing__cloud_fundamentals__paas.md"},{"title":"SaaS","quote":"Software as a Service delivers a complete application managed by the provider and accessed through a browser, API, or client.","explanation":"","image":"images/part-03/cloud_computing__cloud_fundamentals__saas.png","doc":"docs/part-03/cloud_computing__cloud_fundamentals__saas.md"},{"title":"Multi-cloud","quote":"Multi-cloud uses services from more than one cloud provider for business, resilience, regulatory, or capability reasons, but increases operational complexity.","explanation":"","image":"images/part-03/cloud_computing__cloud_fundamentals__multi_cloud.png","doc":"docs/part-03/cloud_computing__cloud_fundamentals__multi_cloud.md"},{"title":"Shared responsibility model","quote":"The cloud provider secures the underlying cloud, while customers secure their data, identities, configurations, workloads, and access according to the service model.","explanation":"","image":"images/part-03/cloud_computing__cloud_fundamentals__shared_responsibility_model.png","doc":"docs/part-03/cloud_computing__cloud_fundamentals__shared_responsibility_model.md"},{"title":"Elasticity","quote":"Elasticity automatically adds or removes resources as demand changes, ideally matching capacity closely to current load.","explanation":"","image":"images/part-03/cloud_computing__cloud_fundamentals__elasticity.png","doc":"docs/part-03/cloud_computing__cloud_fundamentals__elasticity.md"},{"title":"Scalability","quote":"Scalability is a system\u0027s ability to handle growth by increasing resources vertically or horizontally.","explanation":"","image":"images/part-03/cloud_computing__cloud_fundamentals__scalability.png","doc":"docs/part-03/cloud_computing__cloud_fundamentals__scalability.md"},{"title":"High availability","quote":"High availability keeps a service accessible despite expected component failures through redundancy, health checks, and failover.","explanation":"","image":"images/part-03/cloud_computing__cloud_fundamentals__high_availability.png","doc":"docs/part-03/cloud_computing__cloud_fundamentals__high_availability.md"},{"title":"Fault tolerance","quote":"Fault tolerance lets a system continue operating correctly even when components fail, often through replication and automatic recovery.","explanation":"","image":"images/part-03/cloud_computing__cloud_fundamentals__fault_tolerance.png","doc":"docs/part-03/cloud_computing__cloud_fundamentals__fault_tolerance.md"},{"title":"Disaster recovery","quote":"Disaster recovery restores service after major failure using backups, replication, alternate sites, and tested recovery procedures.","explanation":"","image":"images/part-03/cloud_computing__cloud_fundamentals__disaster_recovery.png","doc":"docs/part-03/cloud_computing__cloud_fundamentals__disaster_recovery.md"},{"title":"Cloud-native architecture","quote":"Cloud-native architecture uses managed services, automation, elasticity, immutable deployment, observability, and failure-aware design.","explanation":"","image":"images/part-03/cloud_computing__cloud_fundamentals__cloud_native_architecture.png","doc":"docs/part-03/cloud_computing__cloud_fundamentals__cloud_native_architecture.md"}]}]},{"name":"AWS","groups":[{"name":"Global Infrastructure","topics":[{"title":"AWS Regions","quote":"An AWS Region is a separate geographic area containing multiple isolated Availability Zones.","explanation":"","image":"images/part-03/aws__global_infrastructure__aws_regions.png","doc":"docs/part-03/aws__global_infrastructure__aws_regions.md"},{"title":"Availability Zones","quote":"An Availability Zone is one or more isolated data centers within a Region, connected through low-latency networking.","explanation":"","image":"images/part-03/aws__global_infrastructure__availability_zones.png","doc":"docs/part-03/aws__global_infrastructure__availability_zones.md"},{"title":"Edge locations","quote":"AWS edge locations serve content and network services closer to users through offerings such as CloudFront and Route 53.","explanation":"","image":"images/part-03/aws__global_infrastructure__edge_locations.png","doc":"docs/part-03/aws__global_infrastructure__edge_locations.md"},{"title":"Local Zones","quote":"AWS Local Zones place selected compute and storage services near metropolitan areas for low-latency applications.","explanation":"","image":"images/part-03/aws__global_infrastructure__local_zones.png","doc":"docs/part-03/aws__global_infrastructure__local_zones.md"},{"title":"Wavelength Zones","quote":"Wavelength Zones place AWS infrastructure inside telecom 5G networks to reduce latency for mobile and edge applications.","explanation":"","image":"images/part-03/aws__global_infrastructure__wavelength_zones.png","doc":"docs/part-03/aws__global_infrastructure__wavelength_zones.md"},{"title":"AWS global network","quote":"The AWS global network connects Regions, Availability Zones, and edge locations through provider-managed private backbone infrastructure.","explanation":"","image":"images/part-03/aws__global_infrastructure__aws_global_network.png","doc":"docs/part-03/aws__global_infrastructure__aws_global_network.md"},{"title":"Multi-AZ design","quote":"Multi-AZ design distributes workloads across independent Availability Zones to survive data-center or zone-level failure.","explanation":"","image":"images/part-03/aws__global_infrastructure__multi_az_design.png","doc":"docs/part-03/aws__global_infrastructure__multi_az_design.md"},{"title":"Multi-region design","quote":"Multi-region design deploys across geographic Regions for disaster recovery, global latency, or regulatory needs and requires explicit data-consistency choices.","explanation":"","image":"images/part-03/aws__global_infrastructure__multi_region_design.png","doc":"docs/part-03/aws__global_infrastructure__multi_region_design.md"},{"title":"Service quotas","quote":"AWS service quotas limit resources or request rates per account and Region. Capacity planning should include monitoring and quota-increase requests.","explanation":"","image":"images/part-03/aws__global_infrastructure__service_quotas.png","doc":"docs/part-03/aws__global_infrastructure__service_quotas.md"},{"title":"AWS Organizations","quote":"AWS Organizations centrally manages multiple AWS accounts through organizational units, consolidated billing, and service control policies.","explanation":"","image":"images/part-03/aws__global_infrastructure__aws_organizations.png","doc":"docs/part-03/aws__global_infrastructure__aws_organizations.md"}]},{"name":"Compute","topics":[{"title":"Amazon EC2","quote":"Amazon EC2 provides resizable virtual machines with configurable compute, storage, networking, operating systems, and purchasing models.","explanation":"","image":"images/part-03/aws__compute__amazon_ec2.png","doc":"docs/part-03/aws__compute__amazon_ec2.md"},{"title":"EC2 instance families","quote":"EC2 instance families are optimized for general purpose, compute, memory, storage, accelerated computing, or specialized workloads.","explanation":"","image":"images/part-03/aws__compute__ec2_instance_families.png","doc":"docs/part-03/aws__compute__ec2_instance_families.md"},{"title":"EC2 purchasing options","quote":"EC2 purchasing options include On-Demand, Reserved Instances, Savings Plans, Spot Instances, Dedicated Hosts, and Capacity Reservations.","explanation":"","image":"images/part-03/aws__compute__ec2_purchasing_options.png","doc":"docs/part-03/aws__compute__ec2_purchasing_options.md"},{"title":"On-Demand Instances","quote":"On-Demand Instances provide flexible capacity without long-term commitment and are suited to variable or short-lived workloads.","explanation":"","image":"images/part-03/aws__compute__on_demand_instances.png","doc":"docs/part-03/aws__compute__on_demand_instances.md"},{"title":"Reserved Instances","quote":"Reserved Instances provide billing discounts for committed EC2 usage over one or three years, with different payment and flexibility options.","explanation":"","image":"images/part-03/aws__compute__reserved_instances.png","doc":"docs/part-03/aws__compute__reserved_instances.md"},{"title":"Savings Plans","quote":"Savings Plans reduce eligible compute costs in exchange for a committed hourly spend over one or three years.","explanation":"","image":"images/part-03/aws__compute__savings_plans.png","doc":"docs/part-03/aws__compute__savings_plans.md"},{"title":"EC2 Auto Scaling","quote":"EC2 Auto Scaling maintains desired capacity and adjusts instance count using health checks, schedules, or scaling policies.","explanation":"","image":"images/part-03/aws__compute__ec2_auto_scaling.png","doc":"docs/part-03/aws__compute__ec2_auto_scaling.md"},{"title":"Launch templates","quote":"A launch template versions EC2 configuration such as AMI, instance type, networking, storage, IAM role, and user data.","explanation":"","image":"images/part-03/aws__compute__launch_templates.png","doc":"docs/part-03/aws__compute__launch_templates.md"},{"title":"Placement groups","quote":"Placement groups influence EC2 placement for low latency, distributed fault isolation, or partitioned large-scale workloads.","explanation":"","image":"images/part-03/aws__compute__placement_groups.png","doc":"docs/part-03/aws__compute__placement_groups.md"},{"title":"Elastic Load Balancing","quote":"Elastic Load Balancing distributes traffic across healthy targets and integrates with Auto Scaling, TLS, health checks, and multiple protocols.","explanation":"","image":"images/part-03/aws__compute__elastic_load_balancing.png","doc":"docs/part-03/aws__compute__elastic_load_balancing.md"},{"title":"Application Load Balancer","quote":"An Application Load Balancer operates at Layer 7 and supports HTTP routing by host, path, headers, methods, and query values.","explanation":"","image":"images/part-03/aws__compute__application_load_balancer.png","doc":"docs/part-03/aws__compute__application_load_balancer.md"},{"title":"Network Load Balancer","quote":"A Network Load Balancer operates at Layer 4 for very high-performance TCP, UDP, and TLS traffic with static IP support.","explanation":"","image":"images/part-03/aws__compute__network_load_balancer.png","doc":"docs/part-03/aws__compute__network_load_balancer.md"},{"title":"Gateway Load Balancer","quote":"Gateway Load Balancer deploys and scales virtual network appliances such as firewalls and inspection systems transparently.","explanation":"","image":"images/part-03/aws__compute__gateway_load_balancer.png","doc":"docs/part-03/aws__compute__gateway_load_balancer.md"}]},{"name":"Serverless","topics":[{"title":"Lambda execution environment","quote":"A Lambda execution environment contains the runtime, function code, extensions, and temporary storage and may be reused across invocations.","explanation":"","image":"images/part-03/aws__serverless__lambda_execution_environment.png","doc":"docs/part-03/aws__serverless__lambda_execution_environment.md"},{"title":"Lambda cold starts","quote":"A cold start occurs when Lambda creates and initializes a new execution environment before running the handler.","explanation":"","image":"images/part-03/aws__serverless__lambda_cold_starts.png","doc":"docs/part-03/aws__serverless__lambda_cold_starts.md"},{"title":"Lambda concurrency","quote":"Lambda concurrency is the number of simultaneous function invocations. Account, reserved, and provisioned concurrency settings control capacity.","explanation":"","image":"images/part-03/aws__serverless__lambda_concurrency.png","doc":"docs/part-03/aws__serverless__lambda_concurrency.md"},{"title":"Provisioned concurrency","quote":"Provisioned concurrency keeps Lambda execution environments initialized and ready, reducing cold-start latency for predictable workloads.","explanation":"","image":"images/part-03/aws__serverless__provisioned_concurrency.png","doc":"docs/part-03/aws__serverless__provisioned_concurrency.md"},{"title":"Lambda layers","quote":"Lambda layers package shared libraries, runtimes, or utilities separately from function code.","explanation":"","image":"images/part-03/aws__serverless__lambda_layers.png","doc":"docs/part-03/aws__serverless__lambda_layers.md"},{"title":"Lambda destinations","quote":"Lambda destinations route asynchronous in
