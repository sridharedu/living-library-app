vocation results to services such as SQS, SNS, EventBridge, or another function.","explanation":"","image":"images/part-03/aws__serverless__lambda_destinations.png","doc":"docs/part-03/aws__serverless__lambda_destinations.md"},{"title":"Step Functions","quote":"AWS Step Functions orchestrates workflows using state machines with tasks, branching, retries, timeouts, parallelism, and compensation.","explanation":"","image":"images/part-03/aws__serverless__step_functions.png","doc":"docs/part-03/aws__serverless__step_functions.md"},{"title":"EventBridge","quote":"Amazon EventBridge routes events from AWS services, applications, and SaaS sources to targets using rules and event buses.","explanation":"","image":"images/part-03/aws__serverless__eventbridge.png","doc":"docs/part-03/aws__serverless__eventbridge.md"},{"title":"Serverless Application Model","quote":"AWS SAM is an infrastructure-as-code framework that simplifies defining and deploying serverless applications.","explanation":"","image":"images/part-03/aws__serverless__serverless_application_model.png","doc":"docs/part-03/aws__serverless__serverless_application_model.md"},{"title":"Serverless observability","quote":"Serverless observability combines logs, metrics, traces, structured events, cold-start visibility, and per-function or workflow diagnostics.","explanation":"","image":"images/part-03/aws__serverless__serverless_observability.png","doc":"docs/part-03/aws__serverless__serverless_observability.md"}]},{"name":"Containers","topics":[{"title":"Amazon ECS","quote":"Amazon ECS is AWS\u0027s managed container orchestrator for running tasks and services on EC2 or Fargate.","explanation":"","image":"images/part-03/aws__containers__amazon_ecs.png","doc":"docs/part-03/aws__containers__amazon_ecs.md"},{"title":"ECS task definitions","quote":"An ECS task definition describes containers, images, CPU, memory, ports, environment, volumes, IAM roles, and logging.","explanation":"","image":"images/part-03/aws__containers__ecs_task_definitions.png","doc":"docs/part-03/aws__containers__ecs_task_definitions.md"},{"title":"ECS services","quote":"An ECS service maintains a desired number of task replicas, replaces unhealthy tasks, and integrates with load balancing and deployment strategies.","explanation":"","image":"images/part-03/aws__containers__ecs_services.png","doc":"docs/part-03/aws__containers__ecs_services.md"},{"title":"ECS capacity providers","quote":"Capacity providers connect ECS workloads to Fargate or EC2 capacity and define scaling and placement strategies.","explanation":"","image":"images/part-03/aws__containers__ecs_capacity_providers.png","doc":"docs/part-03/aws__containers__ecs_capacity_providers.md"},{"title":"AWS Fargate","quote":"AWS Fargate runs ECS or EKS containers without customers managing worker servers.","explanation":"","image":"images/part-03/aws__containers__aws_fargate.png","doc":"docs/part-03/aws__containers__aws_fargate.md"},{"title":"Amazon EKS","quote":"Amazon EKS is a managed Kubernetes service where AWS operates the control plane and customers run workloads on nodes or Fargate.","explanation":"","image":"images/part-03/aws__containers__amazon_eks.png","doc":"docs/part-03/aws__containers__amazon_eks.md"},{"title":"EKS managed node groups","quote":"Managed node groups automate provisioning, updates, and lifecycle of EC2 worker nodes for EKS.","explanation":"","image":"images/part-03/aws__containers__eks_managed_node_groups.png","doc":"docs/part-03/aws__containers__eks_managed_node_groups.md"},{"title":"EKS networking","quote":"EKS networking commonly uses the Amazon VPC CNI so Pods receive VPC IP addresses and integrate with AWS routing and security.","explanation":"","image":"images/part-03/aws__containers__eks_networking.png","doc":"docs/part-03/aws__containers__eks_networking.md"},{"title":"ECR","quote":"Amazon ECR is a managed container-image registry with IAM access, scanning, lifecycle policies, and replication.","explanation":"","image":"images/part-03/aws__containers__ecr.png","doc":"docs/part-03/aws__containers__ecr.md"},{"title":"App Runner","quote":"AWS App Runner builds and runs web applications from source code or container images with managed deployment and scaling.","explanation":"","image":"images/part-03/aws__containers__app_runner.png","doc":"docs/part-03/aws__containers__app_runner.md"},{"title":"Service Connect","quote":"ECS Service Connect provides service discovery and standardized service-to-service connectivity for ECS applications.","explanation":"","image":"images/part-03/aws__containers__service_connect.png","doc":"docs/part-03/aws__containers__service_connect.md"}]},{"name":"Storage","topics":[{"title":"Amazon S3","quote":"Amazon S3 is highly durable object storage organized into buckets and objects, with versioning, lifecycle, replication, and access controls.","explanation":"","image":"images/part-03/aws__storage__amazon_s3.png","doc":"docs/part-03/aws__storage__amazon_s3.md"},{"title":"S3 storage classes","quote":"S3 storage classes trade access cost, retrieval time, resilience, and minimum duration for different usage patterns.","explanation":"","image":"images/part-03/aws__storage__s3_storage_classes.png","doc":"docs/part-03/aws__storage__s3_storage_classes.md"},{"title":"S3 lifecycle rules","quote":"S3 lifecycle rules transition objects between storage classes or expire current and previous versions automatically.","explanation":"","image":"images/part-03/aws__storage__s3_lifecycle_rules.png","doc":"docs/part-03/aws__storage__s3_lifecycle_rules.md"},{"title":"S3 replication","quote":"S3 replication asynchronously copies objects to another bucket in the same or a different Region.","explanation":"","image":"images/part-03/aws__storage__s3_replication.png","doc":"docs/part-03/aws__storage__s3_replication.md"},{"title":"S3 encryption","quote":"S3 supports server-side encryption with S3-managed, KMS-managed, or customer-provided keys, plus client-side encryption.","explanation":"","image":"images/part-03/aws__storage__s3_encryption.png","doc":"docs/part-03/aws__storage__s3_encryption.md"},{"title":"S3 presigned URLs","quote":"A presigned URL grants temporary permission to perform a specific S3 operation without exposing permanent credentials.","explanation":"","image":"images/part-03/aws__storage__s3_presigned_urls.png","doc":"docs/part-03/aws__storage__s3_presigned_urls.md"},{"title":"S3 multipart upload","quote":"Multipart upload sends a large object in independent parts that can be uploaded concurrently and retried separately.","explanation":"","image":"images/part-03/aws__storage__s3_multipart_upload.png","doc":"docs/part-03/aws__storage__s3_multipart_upload.md"},{"title":"Amazon EBS","quote":"Amazon EBS provides persistent block storage volumes for EC2 with snapshots, encryption, and multiple performance tiers.","explanation":"","image":"images/part-03/aws__storage__amazon_ebs.png","doc":"docs/part-03/aws__storage__amazon_ebs.md"},{"title":"EBS volume types","quote":"EBS volume types include general-purpose SSD, provisioned-IOPS SSD, throughput-optimized HDD, and cold HDD.","explanation":"","image":"images/part-03/aws__storage__ebs_volume_types.png","doc":"docs/part-03/aws__storage__ebs_volume_types.md"},{"title":"Amazon EFS","quote":"Amazon EFS provides elastic managed NFS file storage that can be mounted concurrently by multiple compute instances.","explanation":"","image":"images/part-03/aws__storage__amazon_efs.png","doc":"docs/part-03/aws__storage__amazon_efs.md"},{"title":"FSx","quote":"Amazon FSx provides managed file systems such as Windows File Server, Lustre, NetApp ONTAP, and OpenZFS.","explanation":"","image":"images/part-03/aws__storage__fsx.png","doc":"docs/part-03/aws__storage__fsx.md"},{"title":"Storage Gateway","quote":"AWS Storage Gateway connects on-premises environments to cloud storage through file, volume, or tape interfaces.","explanation":"","image":"images/part-03/aws__storage__storage_gateway.png","doc":"docs/part-03/aws__storage__storage_gateway.md"}]},{"name":"Networking","topics":[{"title":"Amazon VPC","quote":"Amazon VPC is a logically isolated network where customers define IP ranges, subnets, routing, gateways, and security controls.","explanation":"","image":"images/part-03/aws__networking__amazon_vpc.png","doc":"docs/part-03/aws__networking__amazon_vpc.md"},{"title":"Public subnets","quote":"A public subnet has a route to an Internet Gateway, though individual resources also need public addressing and security rules.","explanation":"","image":"images/part-03/aws__networking__public_subnets.png","doc":"docs/part-03/aws__networking__public_subnets.md"},{"title":"Private subnets","quote":"A private subnet has no direct route to an Internet Gateway and commonly uses NAT or VPC endpoints for outbound access.","explanation":"","image":"images/part-03/aws__networking__private_subnets.png","doc":"docs/part-03/aws__networking__private_subnets.md"},{"title":"Route tables","quote":"A route table maps destination CIDR ranges to network targets such as local routing, gateways, endpoints, or peering connections.","explanation":"","image":"images/part-03/aws__networking__route_tables.png","doc":"docs/part-03/aws__networking__route_tables.md"},{"title":"Internet Gateway","quote":"An Internet Gateway enables communication between a VPC and the public internet for appropriately routed and addressed resources.","explanation":"","image":"images/part-03/aws__networking__internet_gateway.png","doc":"docs/part-03/aws__networking__internet_gateway.md"},{"title":"NAT Gateway","quote":"A NAT Gateway lets resources in private subnets initiate outbound internet connections without accepting unsolicited inbound internet traffic.","explanation":"","image":"images/part-03/aws__networking__nat_gateway.png","doc":"docs/part-03/aws__networking__nat_gateway.md"},{"title":"Security groups","quote":"Security groups are stateful virtual firewalls attached to network interfaces and define allowed inbound and outbound traffic.","explanation":"","image":"images/part-03/aws__networking__security_groups.png","doc":"docs/part-03/aws__networking__security_groups.md"},{"title":"Network ACLs","quote":"Network ACLs are stateless subnet-level allow and deny rules evaluated in numbered order.","explanation":"","image":"images/part-03/aws__networking__network_acls.png","doc":"docs/part-03/aws__networking__network_acls.md"},{"title":"VPC peering","quote":"VPC peering privately connects two VPCs, but it is non-transitive and requires explicit routing.","explanation":"","image":"images/part-03/aws__networking__vpc_peering.png","doc":"docs/part-03/aws__networking__vpc_peering.md"},{"title":"Transit Gateway","quote":"AWS Transit Gateway acts as a central router connecting many VPCs, VPNs, and Direct Connect networks.","explanation":"","image":"images/part-03/aws__networking__transit_gateway.png","doc":"docs/part-03/aws__networking__transit_gateway.md"},{"title":"PrivateLink","quote":"AWS PrivateLink exposes services privately through interface endpoints without public internet routing or full network peering.","explanation":"","image":"images/part-03/aws__networking__privatelink.png","doc":"docs/part-03/aws__networking__privatelink.md"},{"title":"VPC endpoints","quote":"VPC endpoints provide private access to supported AWS services through gateway or interface endpoint types.","explanation":"","image":"images/part-03/aws__networking__vpc_endpoints.png","doc":"docs/part-03/aws__networking__vpc_endpoints.md"},{"title":"Route 53","quote":"Amazon Route 53 provides DNS registration, authoritative DNS, health checks, and routing policies.","explanation":"","image":"images/part-03/aws__networking__route_53.png","doc":"docs/part-03/aws__networking__route_53.md"},{"title":"CloudFront","quote":"Amazon CloudFront is a global content-delivery network that caches and serves content from edge locations.","explanation":"","image":"images/part-03/aws__networking__cloudfront.png","doc":"docs/part-03/aws__networking__cloudfront.md"},{"title":"Global Accelerator","quote":"AWS Global Accelerator routes traffic through the AWS global network to healthy regional endpoints using static anycast IP addresses.","explanation":"","image":"images/part-03/aws__networking__global_accelerator.png","doc":"docs/part-03/aws__networking__global_accelerator.md"}]},{"name":"Databases","topics":[{"title":"Amazon RDS","quote":"Amazon RDS manages relational database provisioning, backups, patching, monitoring, scaling, and high availability for supported engines.","explanation":"","image":"images/part-03/aws__databases__amazon_rds.png","doc":"docs/part-03/aws__databases__amazon_rds.md"},{"title":"RDS Multi-AZ","quote":"RDS Multi-AZ maintains a synchronous standby or deployment across Availability Zones for automatic failover.","explanation":"","image":"images/part-03/aws__databases__rds_multi_az.png","doc":"docs/part-03/aws__databases__rds_multi_az.md"},{"title":"RDS read replicas","quote":"RDS read replicas asynchronously copy data from a source database and serve read-heavy workloads or disaster-recovery needs.","explanation":"","image":"images/part-03/aws__databases__rds_read_replicas.png","doc":"docs/part-03/aws__databases__rds_read_replicas.md"},{"title":"Amazon Aurora","quote":"Amazon Aurora is an AWS-managed relational database compatible with MySQL and PostgreSQL, using distributed shared storage and managed replication.","explanation":"","image":"images/part-04/aws__databases__amazon_aurora.png","doc":"docs/part-04/aws__databases__amazon_aurora.md"},{"title":"Aurora Serverless","quote":"Aurora Serverless automatically adjusts database capacity for variable workloads while retaining Aurora compatibility and managed storage.","explanation":"","image":"images/part-04/aws__databases__aurora_serverless.png","doc":"docs/part-04/aws__databases__aurora_serverless.md"},{"title":"DynamoDB","quote":"Amazon DynamoDB is a fully managed key-value and document database designed for predictable low-latency performance at scale.","explanation":"","image":"images/part-04/aws__databases__dynamodb.png","doc":"docs/part-04/aws__databases__dynamodb.md"},{"title":"ElastiCache","quote":"Amazon ElastiCache provides managed Redis-compatible and Memcached-compatible in-memory caching for low-latency reads and session or transient data.","explanation":"","image":"images/part-04/aws__databases__elasticache.png","doc":"docs/part-04/aws__databases__elasticache.md"},{"title":"Amazon DocumentDB","quote":"Amazon DocumentDB is a managed document database service compatible with many MongoDB APIs and designed for JSON-like workloads.","explanation":"","image":"images/part-04/aws__databases__amazon_documentdb.png","doc":"docs/part-04/aws__databases__amazon_documentdb.md"},{"title":"Amazon Neptune","quote":"Amazon Neptune is a managed graph database supporting property graphs and RDF for highly connected data and relationship queries.","explanation":"","image":"images/part-04/aws__databases__amazon_neptune.png","doc":"docs/part-04/aws__databases__amazon_neptune.md"},{"title":"Amazon Timestream","quote":"Amazon Timestream is a managed time-series database for telemetry, IoT, operational metrics, and other timestamped data.","explanation":"","image":"images/part-04/aws__databases__amazon_timestream.png","doc":"docs/part-04/aws__databases__amazon_timestream.md"},{"title":"Database Migration Service","quote":"AWS Database Migration Service moves or replicates data between supported sources and targets with minimal downtime.","explanation":"","image":"images/part-04/aws__databases__database_migration_service.png","doc":"docs/part-04/aws__databases__database_migration_service.md"}]},{"name":"Messaging and Integration","topics":[{"title":"Amazon SQS","quote":"Amazon SQS is a managed message queue that decouples producers and consumers and absorbs traffic spikes.","explanation":"","image":"images/part-04/aws__messaging_and_integration__amazon_sqs.png","doc":"docs/part-04/aws__messaging_and_integration__amazon_sqs.md"},{"title":"Standard queues","quote":"SQS Standard queues offer very high throughput and at-least-once delivery with best-effort ordering.","explanation":"","image":"images/part-04/aws__messaging_and_integration__standard_queues.png","doc":"docs/part-04/aws__messaging_and_integration__standard_queues.md"},{"title":"FIFO queues","quote":"SQS FIFO queues preserve message order within a message group and support deduplication for exactly-once processing behavior.","explanation":"","image":"images/part-04/aws__messaging_and_integration__fifo_queues.png","doc":"docs/part-04/aws__messaging_and_integration__fifo_queues.md"},{"title":"Visibility timeout","quote":"The visibility timeout temporarily hides a received SQS message so another consumer does not process it before completion.","explanation":"","image":"images/part-04/aws__messaging_and_integration__visibility_timeout.png","doc":"docs/part-04/aws__messaging_and_integration__visibility_timeout.md"},{"title":"Amazon SNS","quote":"Amazon SNS is a managed publish-subscribe service that pushes messages to subscribers such as SQS, Lambda, HTTP endpoints, or email.","explanation":"","image":"images/part-04/aws__messaging_and_integration__amazon_sns.png","doc":"docs/part-04/aws__messaging_and_integration__amazon_sns.md"},{"title":"SNS fanout","quote":"SNS fanout publishes one event to multiple independent subscribers, commonly using separate SQS queues for isolation.","explanation":"","image":"images/part-04/aws__messaging_and_integration__sns_fanout.png","doc":"docs/part-04/aws__messaging_and_integration__sns_fanout.md"},{"title":"Amazon EventBridge","quote":"Amazon EventBridge routes events between AWS services, applications, and SaaS systems through event buses and rules.","explanation":"","image":"images/part-04/aws__messaging_and_integration__amazon_eventbridge.png","doc":"docs/part-04/aws__messaging_and_integration__amazon_eventbridge.md"},{"title":"Amazon MQ","quote":"Amazon MQ provides managed ActiveMQ and RabbitMQ brokers for applications that need traditional messaging protocols and broker semantics.","explanation":"","image":"images/part-04/aws__messaging_and_integration__amazon_mq.png","doc":"docs/part-04/aws__messaging_and_integration__amazon_mq.md"},{"title":"Kinesis Data Streams","quote":"Kinesis Data Streams ingests ordered, partitioned real-time event data for multiple consumers.","explanation":"","image":"images/part-04/aws__messaging_and_integration__kinesis_data_streams.png","doc":"docs/part-04/aws__messaging_and_integration__kinesis_data_streams.md"},{"title":"Kinesis Firehose","quote":"Kinesis Data Firehose delivers streaming data to destinations such as S3, Redshift, OpenSearch, and third-party platforms with minimal management.","explanation":"","image":"images/part-04/aws__messaging_and_integration__kinesis_firehose.png","doc":"docs/part-04/aws__messaging_and_integration__kinesis_firehose.md"},{"title":"AppFlow","quote":"Amazon AppFlow transfers data between SaaS applications and AWS services using managed flows and optional transformations.","explanation":"","image":"images/part-04/aws__messaging_and_integration__appflow.png","doc":"docs/part-04/aws__messaging_and_integration__appflow.md"}]},{"name":"Security","topics":[{"title":"AWS IAM","quote":"AWS IAM controls identities, authentication, permissions, and access to AWS resources.","explanation":"","image":"images/part-04/aws__security__aws_iam.png","doc":"docs/part-04/aws__security__aws_iam.md"},{"title":"IAM users","quote":"IAM users are long-lived identities within an AWS account. Human users should usually use federation instead of permanent access keys.","explanation":"","image":"images/part-04/aws__security__iam_users.png","doc":"docs/part-04/aws__security__iam_users.md"},{"title":"IAM groups","quote":"IAM groups collect users so shared policies can be assigned consistently.","explanation":"","image":"images/part-04/aws__security__iam_groups.png","doc":"docs/part-04/aws__security__iam_groups.md"},{"title":"IAM roles","quote":"IAM roles are assumable identities that provide temporary credentials to users, services, workloads, or external accounts.","explanation":"","image":"images/part-04/aws__security__iam_roles.png","doc":"docs/part-04/aws__security__iam_roles.md"},{"title":"IAM policies","quote":"IAM policies are JSON documents that allow or deny specific actions on specific resources under optional conditions.","explanation":"","image":"images/part-04/aws__security__iam_policies.png","doc":"docs/part-04/aws__security__iam_policies.md"},{"title":"Permission boundaries","quote":"A permission boundary sets the maximum permissions an IAM user or role can receive from identity policies.","explanation":"","image":"images/part-04/aws__security__permission_boundaries.png","doc":"docs/part-04/aws__security__permission_boundaries.md"},{"title":"Service control policies","quote":"Service control policies define permission guardrails for accounts or organizational units in AWS Organizations.","explanation":"","image":"images/part-04/aws__security__service_control_policies.png","doc":"docs/part-04/aws__security__service_control_policies.md"},{"title":"STS","quote":"AWS Security Token Service issues temporary credentials when identities assume roles or use federation.","explanation":"","image":"images/part-04/aws__security__sts.png","doc":"docs/part-04/aws__security__sts.md"},{"title":"KMS","quote":"AWS KMS manages encryption keys and cryptographic operations with policy control and audit integration.","explanation":"","image":"images/part-04/aws__security__kms.png","doc":"docs/part-04/aws__security__kms.md"},{"title":"Secrets Manager","quote":"AWS Secrets Manager stores, retrieves, and rotates sensitive values such as database passwords and API keys.","explanation":"","image":"images/part-04/aws__security__secrets_manager.png","doc":"docs/part-04/aws__security__secrets_manager.md"},{"title":"Systems Manager Parameter Store","quote":"Parameter Store provides hierarchical configuration and secret storage with versioning, IAM control, and optional KMS encryption.","explanation":"","image":"images/part-04/aws__security__systems_manager_parameter_store.png","doc":"docs/part-04/aws__security__systems_manager_parameter_store.md"},{"title":"AWS WAF","quote":"AWS WAF filters web requests using managed or custom rules for threats such as SQL injection, bots, and abusive traffic.","explanation":"","image":"images/part-04/aws__security__aws_waf.png","doc":"docs/part-04/aws__security__aws_waf.md"},{"title":"GuardDuty","quote":"Amazon GuardDuty analyzes AWS logs and activity to detect suspicious behavior and potential account or workload compromise.","explanation":"","image":"images/part-04/aws__security__guardduty.png","doc":"docs/part-04/aws__security__guardduty.md"},{"title":"Security Hub","quote":"AWS Security Hub aggregates security findings and evaluates accounts against security standards and controls.","explanation":"","image":"images/part-04/aws__security__security_hub.png","doc":"docs/part-04/aws__security__security_hub.md"},{"title":"Inspector","quote":"Amazon Inspector scans supported workloads and images for software vulnerabilities and unintended network exposure.","explanation":"","image":"images/part-04/aws__security__inspector.png","doc":"docs/part-04/aws__security__inspector.md"},{"title":"Macie","quote":"Amazon Macie discovers and classifies sensitive data in S3 and identifies risky access patterns.","explanation":"","image":"images/part-04/aws__security__macie.png","doc":"docs/part-04/aws__security__macie.md"},{"title":"CloudHSM","quote":"AWS CloudHSM provides dedicated hardware security modules that customers control for cryptographic key storage and operations.","explanation":"","image":"images/part-04/aws__security__cloudhsm.png","doc":"docs/part-04/aws__security__cloudhsm.md"}]},{"name":"Observability and Operations","topics":[{"title":"CloudWatch logs","quote":"CloudWatch Logs centralizes application and service logs for search, metrics, retention, alerts, and subscriptions.","explanation":"","image":"images/part-04/aws__observability_and_operations__cloudwatch_logs.png","doc":"docs/part-04/aws__observability_and_operations__cloudwatch_logs.md"},{"title":"CloudWatch dashboards","quote":"CloudWatch dashboards combine metrics, logs, and alarms into shared operational views.","explanation":"","image":"images/part-04/aws__observability_and_operations__cloudwatch_dashboards.png","doc":"docs/part-04/aws__observability_and_operations__cloudwatch_dashboards.md"},{"title":"CloudWatch Synthetics","quote":"CloudWatch Synthetics runs scripted canaries that test endpoints and user journeys from outside the application.","explanation":"","image":"images/part-04/aws__observability_and_operations__cloudwatch_synthetics.png","doc":"docs/part-04/aws__observability_and_operations__cloudwatch_synthetics.md"},{"title":"Systems Manager","quote":"AWS Systems Manager manages fleet inventory, patching, remote commands, automation, sessions, parameters, and operational data.","explanation":"","image":"images/part-04/aws__observability_and_operations__systems_manager.png","doc":"docs/part-04/aws__observability_and_operations__systems_manager.md"},{"title":"X-Ray","quote":"AWS X-Ray traces requests across distributed services and visualizes latency, dependencies, and errors.","explanation":"","image":"images/part-04/aws__observability_and_operations__x_ray.png","doc":"docs/part-04/aws__observability_and_operations__x_ray.md"},{"title":"AWS Health Dashboard","quote":"AWS Health Dashboard reports AWS events and account-specific service issues that may affect resources.","explanation":"","image":"images/part-04/aws__observability_and_operations__aws_health_dashboard.png","doc":"docs/part-04/aws__observability_and_operations__aws_health_dashboard.md"},{"title":"Trusted Advisor","quote":"AWS Trusted Advisor checks selected workloads for cost, performance, security, fault tolerance, and service-limit improvements.","explanation":"","image":"images/part-04/aws__observability_and_operations__trusted_advisor.png","doc":"docs/part-04/aws__observability_and_operations__trusted_advisor.md"}]},{"name":"Infrastructure as Code","topics":[{"title":"Stacks","quote":"A CloudFormation stack is one managed deployment of a template and its resources.","explanation":"","image":"images/part-04/aws__infrastructure_as_code__stacks.png","doc":"docs/part-04/aws__infrastructure_as_code__stacks.md"},{"title":"StackSets","quote":"CloudFormation StackSets deploy the same stack definition across multiple accounts and Regions.","explanation":"","image":"images/part-04/aws__infrastructure_as_code__stacksets.png","doc":"docs/part-04/aws__infrastructure_as_code__stacksets.md"},{"title":"Change sets","quote":"A CloudFormation change set previews resource additions, modifications, and removals before an update is executed.","explanation":"","image":"images/part-04/aws__infrastructure_as_code__change_sets.png","doc":"docs/part-04/aws__infrastructure_as_code__change_sets.md"},{"title":"Drift detection","quote":"Drift detection compares actual resource configuration with the expected CloudFormation template state.","explanation":"","image":"images/part-04/aws__infrastructure_as_code__drift_detection.png","doc":"docs/part-04/aws__infrastructure_as_code__drift_detection.md"},{"title":"AWS CDK","quote":"AWS CDK defines cloud infrastructure in programming languages and synthesizes the result into CloudFormation templates.","explanation":"","image":"images/part-04/aws__infrastructure_as_code__aws_cdk.png","doc":"docs/part-04/aws__infrastructure_as_code__aws_cdk.md"},{"title":"Terraform on AWS","quote":"Terraform provisions AWS resources through declarative configuration, providers, plans, and managed state.","explanation":"","image":"images/part-04/aws__infrastructure_as_code__terraform_on_aws.png","doc":"docs/part-04/aws__infrastructure_as_code__terraform_on_aws.md"},{"title":"Elastic Beanstalk","quote":"Elastic Beanstalk deploys and manages applications while AWS provisions scaling, load balancing, health monitoring, and platform infrastructure.","explanation":"","image":"images/part-04/aws__infrastructure_as_code__elastic_beanstalk.png","doc":"docs/part-04/aws__infrastructure_as_code__elastic_beanstalk.md"},{"title":"CodePipeline","quote":"AWS CodePipeline orchestrates automated release stages such as source, build, test, approval, and deployment.","explanation":"","image":"images/part-04/aws__infrastructure_as_code__codepipeline.png","doc":"docs/part-04/aws__infrastructure_as_code__codepipeline.md"},{"title":"CodeBuild","quote":"AWS CodeBuild runs managed build environments for compilation, tests, packaging, and artifact production.","explanation":"","image":"images/part-04/aws__infrastructure_as_code__codebuild.png","doc":"docs/part-04/aws__infrastructure_as_code__codebuild.md"},{"title":"CodeDeploy","quote":"AWS CodeDeploy automates application deployment to EC2, on-premises servers, Lambda, and ECS.","explanation":"","image":"images/part-04/aws__infrastructure_as_code__codedeploy.png","doc":"docs/part-04/aws__infrastructure_as_code__codedeploy.md"}]},{"name":"Cost and Architecture","topics":[{"title":"Cost Explorer","quote":"AWS Cost Explorer visualizes historical and forecasted spend and usage across services, accounts, tags, and dimensions.","explanation":"","image":"images/part-04/aws__cost_and_architecture__cost_explorer.png","doc":"docs/part-04/aws__cost_and_architecture__cost_explorer.md"},{"title":"Cost allocation tags","quote":"Cost allocation tags associate AWS spending with teams, projects, products, or environments.","explanation":"","image":"images/part-04/aws__cost_and_architecture__cost_allocation_tags.png","doc":"docs/part-04/aws__cost_and_architecture__cost_allocation_tags.md"},{"title":"AWS Well-Architected Framework","quote":"The AWS Well-Architected Framework evaluates cloud workloads across six architectural pillars and their trade-offs.","explanation":"","image":"images/part-04/aws__cost_and_architecture__aws_well_architected_framework.png","doc":"docs/part-04/aws__cost_and_architecture__aws_well_architected_framework.md"},{"title":"Operational Excellence pillar","quote":"Operational Excellence focuses on automation, observability, small changes, incident learning, and continuous improvement.","explanation":"","image":"images/part-04/aws__cost_and_architecture__operational_excellence_pillar.png","doc":"docs/part-04/aws__cost_and_architecture__operational_excellence_pillar.md"},{"title":"Security pillar","quote":"The Security pillar emphasizes identity, traceability, layered protection, data protection, and automated security practices.","explanation":"","image":"images/part-04/aws__cost_and_architecture__security_pillar.png","doc":"docs/part-04/aws__cost_and_architecture__security_pillar.md"},{"title":"Reliability pillar","quote":"The Reliability pillar focuses on recovery, redundancy, capacity management, and handling change or failure.","explanation":"","image":"images/part-04/aws__cost_and_architecture__reliability_pillar.png","doc":"docs/part-04/aws__cost_and_architecture__reliability_pillar.md"},{"title":"Performance Efficiency pillar","quote":"Performance Efficiency focuses on selecting and evolving resources that meet demand efficiently.","explanation":"","image":"images/part-04/aws__cost_and_architecture__performance_efficiency_pillar.png","doc":"docs/part-04/aws__cost_and_architecture__performance_efficiency_pillar.md"},{"title":"Cost Optimization pillar","quote":"Cost Optimization focuses on visibility, right-sizing, waste reduction, commitment planning, and value delivered per cost.","explanation":"","image":"images/part-04/aws__cost_and_architecture__cost_optimization_pillar.png","doc":"docs/part-04/aws__cost_and_architecture__cost_optimization_pillar.md"},{"title":"Sustainability pillar","quote":"The Sustainability pillar reduces the environmental impact of workloads through efficient resources, utilization, and managed services.","explanation":"","image":"images/part-04/aws__cost_and_architecture__sustainability_pillar.png","doc":"docs/part-04/aws__cost_and_architecture__sustainability_pillar.md"}]}]},{"name":"Docker","groups":[{"name":"Docker Fundamentals","topics":[{"title":"Container fundamentals","quote":"Containers isolate application processes while sharing the host kernel and packaging runtime dependencies into portable images.","explanation":"","image":"images/part-04/docker__docker_fundamentals__container_fundamentals.png","doc":"docs/part-04/docker__docker_fundamentals__container_fundamentals.md"},{"title":"Docker daemon","quote":"The Docker daemon manages images, containers, networks, volumes, and container-runtime operations.","explanation":"","image":"images/part-04/docker__docker_fundamentals__docker_daemon.png","doc":"docs/part-04/docker__docker_fundamentals__docker_daemon.md"},{"title":"Docker client","quote":"The Docker client sends commands to a Docker daemon through a local or remote API.","explanation":"","image":"images/part-04/docker__docker_fundamentals__docker_client.png","doc":"docs/part-04/docker__docker_fundamentals__docker_client.md"},{"title":"Image layers","quote":"A Docker image is built from immutable filesystem layers that can be cached and shared between images.","explanation":"","image":"images/part-04/docker__docker_fundamentals__image_layers.png","doc":"docs/part-04/docker__docker_fundamentals__image_layers.md"},{"title":"Union filesystem","quote":"A union filesystem presents multiple image layers and a writable container layer as one combined filesystem.","explanation":"","image":"images/part-04/docker__docker_fundamentals__union_filesystem.png","doc":"docs/part-04/docker__docker_fundamentals__union_filesystem.md"},{"title":"Container lifecycle","quote":"A container moves through create, start, run, pause, stop, restart, and remove states.","explanation":"","image":"images/part-04/docker__docker_fundamentals__container_lifecycle.png","doc":"docs/part-04/docker__docker_fundamentals__container_lifecycle.md"},{"title":"Docker registries","quote":"A Docker registry stores and distributes versioned container images.","explanation":"","image":"images/part-04/docker__docker_fundamentals__docker_registries.png","doc":"docs/part-04/docker__docker_fundamentals__docker_registries.md"},{"title":"Docker Hub","quote":"Docker Hub is a public and private container registry with official images, repositories, and automated integrations.","explanation":"","image":"images/part-04/docker__docker_fundamentals__docker_hub.png","doc":"docs/part-04/docker__docker_fundamentals__docker_hub.md"},{"title":"Image tags","quote":"An image tag is a mutable human-readable label pointing to an image digest. Production deployments should prefer immutable digests.","explanation":"","image":"images/part-04/docker__docker_fundamentals__image_tags.png","doc":"docs/part-04/docker__docker_fundamentals__image_tags.md"}]},{"name":"Dockerfile","topics":[{"title":"Dockerfile syntax","quote":"Dockerfile instructions define the base image, files, commands, metadata, runtime configuration, and build stages.","explanation":"","image":"images/part-04/docker__dockerfile__dockerfile_syntax.png","doc":"docs/part-04/docker__dockerfile__dockerfile_syntax.md"},{"title":"FROM","quote":"FROM selects the base image for a Docker build stage.","explanation":"","image":"images/part-04/docker__dockerfile__from.png","doc":"docs/part-04/docker__dockerfile__from.md"},{"title":"RUN","quote":"RUN executes a command while building an image and commits the resulting filesystem changes into a layer.","explanation":"","image":"images/part-04/docker__dockerfile__run.png","doc":"docs/part-04/docker__dockerfile__run.md"},{"title":"COPY","quote":"COPY transfers files or directories from the build context into the image.","explanation":"","image":"images/part-04/docker__dockerfile__copy.png","doc":"docs/part-04/docker__dockerfile__copy.md"},{"title":"ADD","quote":"ADD is similar to COPY but also supports local archive extraction and remote URLs. COPY is preferred for simple file transfer.","explanation":"","image":"images/part-04/docker__dockerfile__add.png","doc":"docs/part-04/docker__dockerfile__add.md"},{"title":"CMD","quote":"CMD provides the default command or arguments used when a container starts and can be overridden.","explanation":"","image":"images/part-04/docker__dockerfile__cmd.png","doc":"docs/part-04/docker__dockerfile__cmd.md"},{"title":"ENTRYPOINT","quote":"ENTRYPOINT defines the container\u0027s primary executable and is commonly combined with CMD for default arguments.","explanation":"","image":"images/part-04/docker__dockerfile__entrypoint.png","doc":"docs/part-04/docker__dockerfile__entrypoint.md"},{"title":"ENV","quote":"ENV defines environment variables available during later build steps and at container runtime.","explanation":"","image":"images/part-04/docker__dockerfile__env.png","doc":"docs/part-04/docker__dockerfile__env.md"},{"title":"ARG","quote":"ARG defines build-time variables that are not automatically retained in the runtime environment.","explanation":"","image":"images/part-04/docker__dockerfile__arg.png","doc":"docs/part-04/docker__dockerfile__arg.md"},{"title":"WORKDIR","quote":"WORKDIR sets the working directory for subsequent Dockerfile instructions and the container process.","explanation":"","image":"images/part-04/docker__dockerfile__workdir.png","doc":"docs/part-04/docker__dockerfile__workdir.md"},{"title":"USER","quote":"USER selects the user or UID that executes subsequent build steps and the container process.","explanation":"","image":"images/part-04/docker__dockerfile__user.png","doc":"docs/part-04/docker__dockerfile__user.md"},{"title":"EXPOSE","quote":"EXPOSE documents which port an image intends to listen on but does not publish the port to the host.","explanation":"","image":"images/part-04/docker__dockerfile__expose.png","doc":"docs/part-04/docker__dockerfile__expose.md"},{"title":"HEALTHCHECK","quote":"HEALTHCHECK defines a command Docker runs periodically to determine whether the container is healthy.","explanation":"","image":"images/part-04/docker__dockerfile__healthcheck.png","doc":"docs/part-04/docker__dockerfile__healthcheck.md"},{"title":"Multi-stage builds","quote":"Multi-stage builds use separate build and runtime stages so the final image contains only necessary artifacts.","explanation":"","image":"images/part-04/docker__dockerfile__multi_stage_builds.png","doc":"docs/part-04/docker__dockerfile__multi_stage_builds.md"},{"title":"Build cache","quote":"Docker reuses unchanged build layers from cache. Stable instruction ordering and small contexts improve cache effectiveness.","explanation":"","image":"images/part-04/docker__dockerfile__build_cache.png","doc":"docs/part-04/docker__dockerfile__build_cache.md"},{"title":"Dockerfile security","quote":"Secure Dockerfiles use trusted minimal bases, pinned dependencies, non-root users, no embedded secrets, and reduced runtime packages.","explanation":"","image":"images/part-04/docker__dockerfile__dockerfile_security.png","doc":"docs/part-04/docker__dockerfile__dockerfile_security.md"}]},{"name":"Runtime and Networking","topics":[{"title":"Docker bridge network","quote":"The bridge driver creates an isolated network on one Docker host and supports container DNS on user-defined bridges.","explanation":"","image":"images/part-04/docker__runtime_and_networking__docker_bridge_network.png","doc":"docs/part-04/docker__runtime_and_networking__docker_bridge_network.md"},{"title":"Host network","quote":"Host networking lets a container share the host\u0027s network namespace, removing port isolation.","explanation":"","image":"images/part-04/docker__runtime_and_networking__host_network.png","doc":"docs/part-04/docker__runtime_and_networking__host_network.md"},{"title":"Overlay network","quote":"Overlay networks connect containers across multiple Docker hosts, commonly in orchestrated environments.","explanation":"","image":"images/part-04/docker__runtime_and_networking__overlay_network.png","doc":"docs/part-04/docker__runtime_and_networking__overlay_network.md"},{"title":"Macvlan","quote":"Macvlan gives containers distinct MAC and IP identities on the physical network.","explanation":"","image":"images/part-04/docker__runtime_and_networking__macvlan.png","doc":"docs/part-04/docker__runtime_and_networking__macvlan.md"},{"title":"Port mapping","quote":"Port mapping publishes a container port through a host address and port.","explanation":"","image":"images/part-04/docker__runtime_and_networking__port_mapping.png","doc":"docs/part-04/docker__runtime_and_networking__port_mapping.md"},{"title":"Container DNS","quote":"Docker provides DNS-based name resolution between containers attached to the same user-defined network.","explanation":"","image":"images/part-04/docker__runtime_and_networking__container_dns.png","doc":"docs/part-04/docker__runtime_and_networking__container_dns.md"},{"title":"Volumes","quote":"Docker volumes are engine-managed persistent storage that survives container replacement.","explanation":"","image":"images/part-04/docker__runtime_and_networking__volumes.png","doc":"docs/part-04/docker__runtime_and_networking__volumes.md"},{"title":"Bind mounts","quote":"Bind mounts map an existing host file or directory directly into a container.","explanation":"","image":"images/part-04/docker__runtime_and_networking__bind_mounts.png","doc":"docs/part-04/docker__runtime_and_networking__bind_mounts.md"},{"title":"Tmpfs mounts","quote":"A tmpfs mount stores temporary container data in host memory and does not persist it to disk.","explanation":"","image":"images/part-04/docker__runtime_and_networking__tmpfs_mounts.png","doc":"docs/part-04/docker__runtime_and_networking__tmpfs_mounts.md"},{"title":"Container resource limits","quote":"CPU, memory, process, and IO limits prevent one container from consuming excessive host resources.","explanation":"","image":"images/part-04/docker__runtime_and_networking__container_resource_limits.png","doc":"docs/part-04/docker__runtime_and_networking__container_resource_limits.md"},{"title":"Container logs","quote":"Container logs usually capture standard output and error through a configured logging driver.","explanation":"","image":"images/part-04/docker__runtime_and_networking__container_logs.png","doc":"docs/part-04/docker__runtime_and_networking__container_logs.md"},{"title":"Compose profiles","quote":"Compose profiles enable optional service groups so one file can support different development or testing scenarios.","explanation":"","image":"images/part-04/docker__runtime_and_networking__compose_profiles.png","doc":"docs/part-04/docker__runtime_and_networking__compose_profiles.md"}]}]},{"name":"Kubernetes","groups":[{"name":"Architecture","topics":[{"title":"Control plane","quote":"The Kubernetes control plane stores desired state and makes cluster-wide decisions about scheduling, controllers, and APIs.","explanation":"","image":"images/part-04/kubernetes__architecture__control_plane.png","doc":"docs/part-04/kubernetes__architecture__control_plane.md"},{"title":"API server","quote":"The Kubernetes API server is the front door of the control plane and validates, authorizes, and persists API requests.","explanation":"","image":"images/part-04/kubernetes__architecture__api_server.png","doc":"docs/part-04/kubernetes__architecture__api_server.md"},{"title":"etcd","quote":"etcd is Kubernetes\u0027 strongly consistent key-value store for cluster state, configuration, and coordination. Protecting and backing it up is critical.","explanation":"","image":"images/part-04/kubernetes__architecture__etcd.png","doc":"docs/part-04/kubernetes__architecture__etcd.md"},{"title":"Scheduler","quote":"The Kubernetes scheduler assigns unscheduled Pods to suitable nodes based on resources, constraints, affinity, taints, topology, and policies.","explanation":"","image":"images/part-04/kubernetes__architecture__scheduler.png","doc":"docs/part-04/kubernetes__architecture__scheduler.md"},{"title":"Controller manager","quote":"The controller manager runs reconciliation loops that continuously move actual cluster state toward the desired state.","explanation":"","image":"images/part-04/kubernetes__architecture__controller_manager.png","doc":"docs/part-04/kubernetes__architecture__controller_manager.md"},{"title":"Cloud controller manager","quote":"The cloud controller manager integrates Kubernetes with cloud-provider services such as load balancers, routes, and node lifecycle.","explanation":"","image":"images/part-04/kubernetes__architecture__cloud_controller_manager.png","doc":"docs/part-04/kubernetes__architecture__cloud_controller_manager.md"},{"title":"Kubelet","quote":"Kubelet runs on each worker node, watches assigned Pod specifications, and ensures their containers are created and healthy.","explanation":"","image":"images/part-04/kubernetes__architecture__kubelet.png","doc":"docs/part-04/kubernetes__architecture__kubelet.md"},{"title":"Kube-proxy","quote":"Kube-proxy implements Service networking on nodes using packet-forwarding rules or supported proxy modes.","explanation":"","image":"images/part-04/kubernetes__architecture__kube_proxy.png","doc":"docs/part-04/kubernetes__architecture__kube_proxy.md"},{"title":"Container runtime","quote":"The container runtime pulls images and creates, starts, stops, and removes containers on Kubernetes nodes.","explanation":"","image":"images/part-04/kubernetes__architecture__container_runtime.png","doc":"docs/part-04/kubernetes__architecture__container_runtime.md"},{"title":"CRI","quote":"The Container Runtime Interface lets kubelet communicate with compatible runtimes through a standard API.","explanation":"","image":"images/part-04/kubernetes__architecture__cri.png","doc":"docs/part-04/kubernetes__architecture__cri.md"},{"title":"CNI","quote":"The Container Network Interface defines how plugins configure Pod network interfaces, IP addresses, and routes.","explanation":"","image":"images/part-04/kubernetes__architecture__cni.png","doc":"docs/part-04/kubernetes__architecture__cni.md"},{"title":"CSI","quote":"The Container Storage Interface standardizes how storage systems expose volumes to container orchestrators.","explanation":"","image":"images/part-04/kubernetes__architecture__csi.png","doc":"docs/part-04/kubernetes__architecture__csi.md"}]},{"name":"Workloads","topics":[{"title":"Pods","quote":"A Pod is Kubernetes\u0027 smallest deployable unit and groups one or more containers that share networking, storage, and lifecycle.","explanation":"","image":"images/part-04/kubernetes__workloads__pods.png","doc":"docs/part-04/kubernetes__workloads__pods.md"},{"title":"ReplicaSets","quote":"A ReplicaSet maintains a specified number of identical Pod replicas. Deployments usually manage ReplicaSets automatically.","explanation":"","image":"images/part-04/kubernetes__workloads__replicasets.png","doc":"docs/part-04/kubernetes__workloads__replicasets.md"},{"title":"Deployments","quote":"A Deployment manages stateless Pods through ReplicaSets and supports rolling updates, rollback, scaling, and revision history.","explanation":"","image":"images/part-04/kubernetes__workloads__deployments.png","doc":"docs/part-04/kubernetes__workloads__deployments.md"},{"title":"StatefulSets","quote":"A StatefulSet manages stateful Pods with stable names, ordered lifecycle, and persistent-volume identity.","explanation":"","image":"images/part-04/kubernetes__workloads__statefulsets.png","doc":"docs/part-04/kubernetes__workloads__statefulsets.md"},{"title":"DaemonSets","quote":"A DaemonSet runs one Pod on every matching node, commonly for logging, monitoring, networking, or security agents.","explanation":"","image":"images/part-04/kubernetes__workloads__daemonsets.png","doc":"docs/part-04/kubernetes__workloads__daemonsets.md"},{"title":"Jobs","quote":"A Job runs one or more Pods until a finite task completes successfully.","explanation":"","image":"images/part-04/kubernetes__workloads__jobs.png","doc":"docs/part-04/kubernetes__workloads__jobs.md"},{"title":"CronJobs","quote":"A CronJob creates Jobs on a schedule and is useful for recurring batch work.","explanation":"","image":"images/part-04/kubernetes__workloads__cronjobs.png","doc":"docs/part-04/kubernetes__workloads__cronjobs.md"},{"title":"Init containers","quote":"Init containers run sequentially before application containers and must finish successfully before the Pod starts normally.","explanation":"","image":"images/part-04/kubernetes__workloads__init_containers.png","doc":"docs/part-04/kubernetes__workloads__init_containers.md"},{"title":"Sidecar containers","quote":"A sidecar container runs alongside the main application to provide supporting behavior such as proxying, logging, or synchronization.","explanation":"","image":"images/part-04/kubernetes__workloads__sidecar_containers.png","doc":"docs/part-04/kubernetes__workloads__sidecar_containers.md"},{"title":"Pod phases","quote":"Pod phases summarize lifecycle state as Pending, Running, Succeeded, Failed, or Unknown.","explanation":"","image":"images/part-04/kubernetes__workloads__pod_phases.png","doc":"docs/part-04/kubernetes__workloads__pod_phases.md"},{"title":"Restart policies","quote":"Pod restart policies are Always, OnFailure, or Never and define when kubelet restarts terminated containers.","explanation":"","image":"images/part-04/kubernetes__workloads__restart_policies.png","doc":"docs/part-04/kubernetes__workloads__restart_policies.md"}]},{"name":"Networking","topics":[{"title":"Kubernetes Services","quote":"A Kubernetes Service gives a stable virtual IP and DNS name to a changing set of matching Pods.","explanation":"","image":"images/part-04/kubernetes__networking__kubernetes_services.png","doc":"docs/part-04/kubernetes__networking__kubernetes_services.md"},{"title":"ClusterIP","quote":"ClusterIP exposes a Service only inside the cluster through a stable internal address.","explanation":"","image":"images/part-04/kubernetes__networking__clusterip.png","doc":"docs/part-04/kubernetes__networking__clusterip.md"},{"title":"NodePort","quote":"NodePort exposes a Service on a static port on every node and forwards traffic to the Service.","explanation":"","image":"images/part-04/kubernetes__networking__nodeport.png","doc":"docs/part-04/kubernetes__networking__nodeport.md"},{"title":"LoadBalancer service","quote":"A LoadBalancer Service asks the infrastructure provider to create an external load balancer for the Service.","explanation":"","image":"images/part-04/kubernetes__networking__loadbalancer_service.png","doc":"docs/part-04/kubernetes__networking__loadbalancer_service.md"},{"title":"ExternalName service","quote":"ExternalName maps a Kubernetes Service name to an external DNS name without creating a proxy or endpoint.","explanation":"","image":"images/part-04/kubernetes__networking__externalname_service.png","doc":"docs/part-04/kubernetes__networking__externalname_service.md"},{"title":"Ingress","quote":"Ingress defines HTTP and HTTPS routing from outside the cluster to Services, based on host and path rules.","explanation":"","image":"images/part-04/kubernetes__networking__ingress.png","doc":"docs/part-04/kubernetes__networking__ingress.md"},{"title":"Ingress controllers","quote":"An Ingress controller watches Ingress resources and configures a real proxy or load balancer to enforce them.","explanation":"","image":"images/part-04/kubernetes__networking__ingress_controllers.png","doc":"docs/part-04/kubernetes__networking__ingress_controllers.md"},{"title":"Gateway API","quote":"Gateway API provides expressive, role-oriented traffic-routing resources that improve on many limitations of Ingress.","explanation":"","image":"images/part-04/kubernetes__networking__gateway_api.png","doc":"docs/part-04/kubernetes__networking__gateway_api.md"},{"title":"Network policies","quote":"NetworkPolicy resources define allowed Pod ingress and egress traffic when enforced by a compatible network plugin.","explanation":"","image":"images/part-04/kubernetes__networking__network_policies.png","doc":"docs/part-04/kubernetes__networking__network_policies.md"},{"title":"CoreDNS","quote":"CoreDNS provides cluster DNS resolution for Services, Pods, and external names.","explanation":"","image":"images/part-04/kubernetes__networking__coredns.png","doc":"docs/part-04/kubernetes__networking__coredns.md"},{"title":"Pod networking","quote":"Kubernetes expects each Pod to receive its own routable IP and communicate with other Pods without NAT inside the cluster.","explanation":"","image":"images/part-04/kubernetes__networking__pod_networking.png","doc":"docs/part-04/kubernetes__networking__pod_networking.md"}]},{"name":"Configuration and Storage","topics":[{"title":"ConfigMaps","quote":"ConfigMaps store non-secret configuration as key-value data or files and can be mounted or exposed as environment variables.","explanation":"","image":"images/part-04/kubernetes__configuration_and_storage__configmaps.png","doc":"docs/part-04/kubernetes__configuration_and_storage__configmaps.md"},{"title":"Secrets","quote":"Kubernetes Secrets store sensitive values, but base64 encoding alone is not encryption; access control and encryption at rest still matter.","explanation":"","image":"images/part-04/kubernetes__configuration_and_storage__secrets.png","doc":"docs/part-04/kubernetes__configuration_and_storage__secrets.md"},{"title":"Environment variables","quote":"Pods can receive environment variables directly, from ConfigMaps or Secrets, or from downward-API fields.","explanation":"","image":"images/part-04/kubernetes__configuration_and_storage__environment_variables.png","doc":"docs/part-04/kubernetes__configuration_and_storage__environment_variables.md"},{"title":"PersistentVolumes","quote":"A PersistentVolume is cluster storage provisioned independently of any one Pod.","explanation":"","image":"images/part-04/kubernetes__configuration_and_storage__persistentvolumes.png","doc":"docs/part-04/kubernetes__configuration_and_storage__persistentvolumes.md"},{"title":"PersistentVolumeClaims","quote":"A PersistentVolumeClaim is a workload\u0027s request for storage with a required size, access mode, and optional class.","explanation":"","image":"images/part-04/kubernetes__configuration_and_storage__persistentvolumeclaims.png","doc":"docs/part-04/kubernetes__configuration_and_storage__persistentvolumeclaims.md"},{"title":"StorageClasses","quote":"A StorageClass defines a storage provisioner and policies used for dynamic volume creation.","explanation":"","image":"images/part-04/kubernetes__configuration_and_storage__storageclasses.png","doc":"docs/part-04/kubernetes__configuration_and_storage__storageclasses.md"},{"title":"Dynamic provisioning","quote":"Dynamic provisioning creates a PersistentVolume automatically when a compatible claim is made.","explanation":"","image":"images/part-04/kubernetes__configuration_and_storage__dynamic_provisioning.png","doc":"docs/part-04/kubernetes__configuration_and_storage__dynamic_provisioning.md"},{"title":"Stateful storage","quote":"Stateful storage preserves data beyond Pod replacement and requires stable volume identity, backup, and recovery planning.","explanation":"","image":"images/part-04/kubernetes__configuration_and_storage__stateful_storage.png","doc":"docs/part-04/kubernetes__configuration_and_storage__stateful_storage.md"},{"title":"CSI drivers","quote":"CSI drivers connect Kubernetes to specific block or file storage systems and handle provisioning, attachment, mounting, and snapshots.","explanation":"","image":"images/part-04/kubernetes__configuration_and_storage__csi_drivers.png","doc":"docs/part-04/kubernetes__configuration_and_storage__csi_drivers.md"}]},{"name":"Scheduling and Reliability","topics":[{"title":"Labels and selectors","quote":"Labels attach searchable metadata to resources, while selectors identify matching resources for Services, controllers, and policies.","explanation":"","image":"images/part-04/kubernetes__scheduling_and_reliability__labels_and_selectors.png","doc":"docs/part-04/kubernetes__scheduling_and_reliability__labels_and_selectors.md"},{"title":"Taints and tolerations","quote":"Taints repel Pods from nodes, while tolerations allow selected Pods to be scheduled there.","explanation":"","image":"images/part-04/kubernetes__scheduling_and_reliability__taints_and_tolerations.png","doc":"docs/part-04/kubernetes__scheduling_and_reliability__taints_and_tolerations.md"},{"title":"Node affinity","quote":"Node affinity expresses preferred or required rules for placing Pods on nodes with matching labels.","explanation":"","image":"images/part-04/kubernetes__scheduling_and_reliability__node_affinity.png","doc":"docs/part-04/kubernetes__scheduling_and_reliability__node_affinity.md"},{"title":"Pod affinity","quote":"Pod affinity places Pods near other matching Pods based on topology domains.","explanation":"","image":"images/part-04/kubernetes__scheduling_and_reliability__pod_affinity.png","doc":"docs/part-04/kubernetes__scheduling_and_reliability__pod_affinity.md"},{"title":"Pod anti-affinity","quote":"Pod anti-affinity spreads Pods away from matching Pods to improve fault isolation or resource distribution.","explanation":"","image":"images/part-04/kubernetes__scheduling_and_reliability__pod_anti_affinity.png","doc":"docs/part-04/kubernetes__scheduling_and_reliability__pod_anti_affinity.md"},{"title":"Resource requests","quote":"Resource requests define the CPU and memory Kubernetes reserves for scheduling a container.","explanation":"","image":"images/part-04/kubernetes__scheduling_and_reliability__resource_requests.png","doc":"docs/part-04/kubernetes__scheduling_and_reliability__resource_requests.md"},{"title":"Resource limits","quote":"Resource limits cap container resource usage; CPU is throttled, while exceeding memory may cause termination.","explanation":"","image":"images/part-04/kubernetes__scheduling_and_reliability__resource_limits.png","doc":"docs/part-04/kubernetes__scheduling_and_reliability__resource_limits.md"},{"title":"Quality of Service classes","quote":"Kubernetes classifies Pods as Guaranteed, Burstable, or BestEffort based on resource requests and limits, influencing eviction priority.","explanation":"","image":"images/part-04/kubernetes__scheduling_and_reliability__quality_of_service_classes.png","doc":"docs/part-04/kubernetes__scheduling_and_reliability__quality_of_service_classes.md"},{"title":"Pod disruption budgets","quote":"A PodDisruptionBudget limits how many replicas may be unavailable during voluntary disruptions.","explanation":"","image":"images/part-04/kubernetes__scheduling_and_reliability__pod_disruption_budgets.png","doc":"docs/part-04/kubernetes__scheduling_and_reliability__pod_disruption_budgets.md"},{"title":"Horizontal Pod Autoscaler","quote":"The Horizontal Pod Autoscaler changes replica count based on metrics such as CPU, memory, or custom signals.","explanation":"","image":"images/part-04/kubernetes__scheduling_and_reliability__horizontal_pod_autoscaler.png","doc":"docs/part-04/kubernetes__scheduling_and_reliability__horizontal_pod_autoscaler.md"},{"title":"Vertical Pod Autoscaler","quote":"The Vertical Pod Autoscaler recommends or adjusts Pod CPU and memory requests based on observed usage.","explanation":"","image":"images/part-04/kubernetes__scheduling_and_reliability__vertical_pod_autoscaler.png","doc":"docs/part-04/kubernetes__scheduling_and_reliability__vertical_pod_autoscaler.md"},{"title":"Cluster Autoscaler","quote":"Cluster Autoscaler adds nodes for unschedulable Pods and removes underused nodes when workloads can move safely.","explanation":"","image":"images/part-04/kubernetes__scheduling_and_reliability__cluster_autoscaler.png","doc":"docs/part-04/kubernetes__scheduling_and_reliability__cluster_autoscaler.md"}]},{"name":"Security and Operations","topics":[{"title":"Namespaces","quote":"Namespaces partition names and policies within a cluster and help organize teams, environments, and quotas.","explanation":"","image":"images/part-04/kubernetes__security_and_operations__namespaces.png","doc":"docs/part-04/kubernetes__security_and_operations__namespaces.md"},{"title":"RBAC","quote":"Kubernetes RBAC grants permissions through Roles, ClusterRoles, RoleBindings, and ClusterRoleBindings.","explanation":"","image":"images/part-04/kubernetes__security_and_operations__rbac.png","doc":"docs/part-04/kubernetes__security_and_operations__rbac.md"},{"title":"Service accounts","quote":"A ServiceAccount provides an identity for Pods and can receive Kubernetes API permissions through RBAC.","explanation":"","image":"images/part-04/kubernetes__security_and_operations__service_accounts.png","doc":"docs/part-04/kubernetes__security_and_operations__service_accounts.md"},{"title":"Security contexts","quote":"Security contexts configure user IDs, privileges, capabilities, filesystem permissions, and other security settings for Pods and containers.","explanation":"","image":"images/part-04/kubernetes__security_and_operations__security_contexts.png","doc":"docs/part-04/kubernetes__security_and_operations__security_contexts.md"},{"title":"Pod Security Standards","quote":"Pod Security Standards define Privileged, Baseline, and Restricted security profiles for Pod configuration.","explanation":"","image":"images/part-04/kubernetes__security_and_operations__pod_security_standards.png","doc":"docs/part-04/kubernetes__security_and_operations__pod_security_standards.md"},{"title":"Admission controllers","quote":"Admission controllers validate or mutate API requests after authentication and authorization but before persistence.","explanation":"","image":"images/part-04/kubernetes__security_and_operations__admission_controllers.png","doc":"docs/part-04/kubernetes__security_and_operations__admission_controllers.md"},{"title":"Resource quotas","quote":"ResourceQuota limits aggregate resource consumption and object counts within a namespace.","explanation":"","image":"images/part-04/kubernetes__security_and_operations__resource_quotas.png","doc":"docs/part-04/kubernetes__security_and_operations__resource_quotas.md"},{"title":"Limit ranges","quote":"A LimitRange sets default, minimum, and maximum resource requests or limits for namespace workloads.","explanation":"","image":"images/part-04/kubernetes__security_and_operations__limit_ranges.png","doc":"docs/part-04/kubernetes__security_and_operations__limit_ranges.md"},{"title":"Audit logging","quote":"Kubernetes audit logging records API activity, including who performed an action, what resource was affected, and the result.","explanation":"","image":"images/part-04/kubernetes__security_and_operations__audit_logging.png","doc":"docs/part-04/kubernetes__security_and_operations__audit_logging.md"},{"title":"Kubernetes upgrades","quote":"Kubernetes upgrades require version-skew planning, control-plane and node sequencing, API deprecation checks, and workload validation.","explanation":"","image":"images/part-04/kubernetes__security_and_operations__kubernetes_upgrades.png","doc":"docs/part-04/kubernetes__security_and_operations__kubernetes_upgrades.md"},{"title":"Backup and restore","quote":"Kubernetes backup should cover cluster resources, persistent data, and etcd where applicable, with regular restore testing.","explanation":"","image":"images/part-04/kubernetes__security_and_operations__backup_and_restore.png","doc":"docs/part-04/kubernetes__security_and_operations__backup_and_restore.md"},{"title":"Troubleshooting CrashLoopBackOff","quote":"For CrashLoopBackOff, inspect container logs, previous logs, events, probes, commands, environment, permissions, and resource limits.","explanation":"","image":"images/part-04/kubernetes__security_and_operations__troubleshooting_crashloopbackoff.png","doc":"docs/part-04/kubernetes__security_and_operations__troubleshooting_crashloopbackoff.md"}]}]},{"name":"Helm","groups":[{"name":"Helm Package Management","topics":[{"title":"Chart templates","quote":"Helm chart templates are Go-template files that generate Kubernetes manifests from chart values and release context.","explanation":"","image":"images/part-04/helm__helm_package_management__chart_templates.png","doc":"docs/part-04/helm__helm_package_management__chart_templates.md"},{"title":"values.yaml","quote":"values.yaml provides default configuration values consumed by Helm templates.","explanation":"","image":"images/part-04/helm__helm_package_management__values_yaml.png","doc":"docs/part-04/helm__helm_package_management__values_yaml.md"},{"title":"Helm releases","quote":"A Helm release is one installed instance of a chart with its own values and revision history.","explanation":"","image":"images/part-04/helm__helm_package_management__helm_releases.png","doc":"docs/part-04/helm__helm_package_management__helm_releases.md"},{"title":"Helm hooks","quote":"Helm hooks run Kubernetes resources at selected lifecycle points such as pre-install, post-upgrade, or pre-delete.","explanation":"","image":"images/part-04/helm__helm_package_management__helm_hooks.png","doc":"docs/part-04/helm__helm_package_management__helm_hooks.md"},{"title":"Helm dependencies","quote":"Helm dependencies let one chart include and configure other charts.","explanation":"","image":"images/part-04/helm__helm_package_management__helm_dependencies.png","doc":"docs/part-04/helm__helm_package_management__helm_dependencies.md"},{"title":"Helm repositories","quote":"A Helm repository hosts packaged charts and an index that Helm clients can search and download.","explanation":"","image":"images/part-04/helm__helm_package_management__helm_repositories.png","doc":"docs/part-04/helm__helm_package_management__helm_repositories.md"},{"title":"Helm upgrades","quote":"helm upgrade renders a new chart version or values and updates the existing release.","explanation":"","image":"images/part-04/helm__helm_package_management__helm_upgrades.png","doc":"docs/part-04/helm__helm_package_management__helm_upgrades.md"},{"title":"Helm rollback","quote":"helm rollback restores an earlier stored release revision.","explanation":"","image":"images/part-04/helm__helm_package_management__helm_rollback.png","doc":"docs/part-04/helm__helm_package_management__helm_rollback.md"},{"title":"Helm testing","quote":"Helm tests run annotated Kubernetes resources to verify an installed release.","explanation":"","image":"images/part-04/helm__helm_package_management__helm_testing.png","doc":"docs/part-04/helm__helm_package_management__helm_testing.md"},{"title":"Helmfile","quote":"Helmfile declaratively coordinates multiple Helm releases, environments, repositories, and shared values.","explanation":"","image":"images/part-04/helm__helm_package_management__helmfile.png","doc":"docs/part-04/helm__helm_package_management__helmfile.md"}]}]},{"name":"DevOps","groups":[{"name":"Foundations","topics":[{"title":"DevOps culture","quote":"DevOps culture emphasizes shared ownership, collaboration, automation, feedback, learning, and reliable delivery.","explanation":"","image":"images/part-04/devops__foundations__devops_culture.png","doc":"docs/part-04/devops__foundations__devops_culture.md"},{"title":"Continuous integration","quote":"Continuous integration merges small changes frequently and validates them with automated builds and tests.","explanation":"","image":"images/part-04/devops__foundations__continuous_integration.png","doc":"docs/part-04/devops__foundations__continuous_integration.md"},{"title":"Continuous delivery","quote":"Continuous delivery keeps software deployable through automated validation while production release may remain a deliberate decision.","explanation":"","image":"images/part-04/devops__foundations__continuous_delivery.png","doc":"docs/part-04/devops__foundations__continuous_delivery.md"},{"title":"Continuous deployment","quote":"Continuous deployment automatically releases every change that passes the required pipeline checks.","explanation":"","image":"images/part-04/devops__foundations__continuous_deployment.png","doc":"docs/part-04/devops__foundations__continuous_deployment.md"},{"title":"Shift-left testing","quote":"Shift-left testing moves quality and security feedback earlier in development so defects are cheaper to fix.","explanation":"","image":"images/part-04/devops__foundations__shift_left_testing.png","doc":"docs/part-04/devops__foundations__shift_left_testing.md"},{"title":"DevSecOps","quote":"DevSecOps integrates security responsibilities, controls, and automation throughout planning, development, delivery, and operations.","explanation":"","image":"images/part-04/devops__foundations__devsecops.png","doc":"docs/part-04/devops__foundations__devsecops.md"},{"title":"Platform engineering","quote":"Platform engineering builds reusable internal products and paved paths that help development teams deliver safely with less cognitive load.","explanation":"","image":"images/part-04/devops__foundations__platform_engineering.png","doc":"docs/part-04/devops__foundations__platform_engineering.md"},{"title":"Site reliability engineering","quote":"Site reliability engineering applies software engineering to operations using service levels, automation, error budgets, and reliability practices.","explanation":"","image":"images/part-04/devops__foundations__site_reliability_engineering.png","doc":"docs/part-04/devops__foundations__site_reliability_engineering.md"},{"title":"GitOps","quote":"GitOps uses version-controlled declarative configuration as the source of truth and automated reconciliation to apply changes.","explanation":"","image":"images/part-04/devops__foundations__gitops.png","doc":"docs/part-04/devops__foundations__gitops.md"},{"title":"InnerSource","quote":"InnerSource applies open-source collaboration practices within an organization, including discoverable repositories, contribution rules, and shared ownership.","explanation":"","image":"images/part-04/devops__foundations__innersource.png","doc":"docs/part-04/devops__foundations__innersource.md"}]},{"name":"CI/CD","topics":[{"title":"Pipeline as code","quote":"Pipeline as code stores build and deployment workflows in version control so they can be reviewed, tested, and reproduced.","explanation":"","image":"images/part-04/devops__ci_cd__pipeline_as_code.png","doc":"docs/part-04/devops__ci_cd__pipeline_as_code.md"},{"title":"Build automation","quote":"Build automation compiles, tests, packages, and verifies software consistently without manual steps.","explanation":"","image":"images/part-04/devops__ci_cd__build_automation.png","doc":"docs/part-04/devops__ci_cd__build_automation.md"},{"title":"Artifact repositories","quote":"Artifact repositories store versioned build outputs such as JARs, packages, images, and metadata for controlled reuse and promotion.","explanation":"","image":"images/part-04/devops__ci_cd__artifact_repositories.png","doc":"docs/part-04/devops__ci_cd__artifact_repositories.md"},{"title":"Deployment pipelines","quote":"Deployment pipelines move a verified artifact through environments using automated checks, approvals, and rollout strategies.","explanation":"","image":"images/part-04/devops__ci_cd__deployment_pipelines.png","doc":"docs/part-04/devops__ci_cd__deployment_pipelines.md"},{"title":"Blue-green deployment","quote":"Blue-green deployment maintains two production environments and switches traffic from the old version to the new one.","explanation":"","image":"images/part-04/devops__ci_cd__blue_green_deployment.png","doc":"docs/part-04/devops__ci_cd__blue_green_deployment.md"},{"title":"Canary deployment","quote":"Canary deployment sends a small percentage of traffic to a new version before gradually expanding exposure.","explanation":"","image":"images/part-04/devops__ci_cd__canary_deployment.png","doc":"docs/part-04/devops__ci_cd__canary_deployment.md"},{"title":"Rolling deployment","quote":"Rolling deployment replaces application instances gradually while keeping part of the old version serving traffic.","explanation":"","image":"images/part-04/devops__ci_cd__rolling_deployment.png","doc":"docs/part-04/devops__ci_cd__rolling_deployment.md"},{"title":"Feature flags","quote":"Feature flags separate code deployment from feature release and allow targeted rollout or rapid disablement.","explanation":"","image":"images/part-04/devops__ci_cd__feature_flags.png","doc":"docs/part-04/devops__ci_cd__feature_flags.md"},{"title":"Rollback strategies","quote":"Rollback strategies restore a previous application version, configuration, database state, or traffic route after failure.","explanation":"","image":"images/part-04/devops__ci_cd__rollback_strategies.png","doc":"docs/part-04/devops__ci_cd__rollback_strategies.md"},{"title":"Environment promotion","quote":"Environment promotion moves the same immutable artifact through test, staging, and production with environment-specific configuration.","explanation":"","image":"images/part-04/devops__ci_cd__environment_promotion.png","doc":"docs/part-04/devops__ci_cd__environment_promotion.md"},{"title":"Pipeline security","quote":"Pipeline security protects credentials, runners, approvals, artifacts, logs, and deployment permissions from tampering or misuse.","explanation":"","image":"images/part-04/devops__ci_cd__pipeline_security.png","doc":"docs/part-04/devops__ci_cd__pipeline_security.md"},{"title":"Supply chain security","quote":"Software supply-chain security verifies source, dependencies, builds, artifacts, provenance, signatures, and deployment integrity.","explanation":"","image":"images/part-04/devops__ci_cd__supply_chain_security.png","doc":"docs/part-04/devops__ci_cd__supply_chain_security.md"}]}]},{"name":"Jenkins","groups":[{"name":"Jenkins Automation","topics":[{"title":"Controller and agents","quote":"In Jenkins, the controller manages configuration and scheduling while agents execute build workloads.","explanation":"","image":"images/part-04/jenkins__jenkins_automation__controller_and_agents.png","doc":"docs/part-04/jenkins__jenkins_automation__controller_and_agents.md"},{"title":"Freestyle jobs","quote":"Jenkins freestyle jobs configure build steps through the UI. They are simple but less portable and reviewable than pipeline code.","explanation":"","image":"images/part-04/jenkins__jenkins_automation__freestyle_jobs.png","doc":"docs/part-04/jenkins__jenkins_automation__freestyle_jobs.md"},{"title":"Declarative pipelines","quote":"Jenkins declarative pipelines define structured stages, agents, steps, conditions, and post-actions in a Jenkinsfile.","explanation":"","image":"images/part-04/jenkins__jenkins_automation__declarative_pipelines.png","doc":"docs/part-04/jenkins__jenkins_automation__declarative_pipelines.md"},{"title":"Scripted pipelines","quote":"Jenkins scripted pipelines use Groovy code for flexible control flow and dynamic behavior. They are powerful but easier to make complex than declarative pipelines.","explanation":"","image":"images/part-04/jenkins__jenkins_automation__scripted_pipelines.png","doc":"docs/part-04/jenkins__jenkins_automation__scripted_pipelines.md"},{"title":"Jenkinsfile","quote":"A Jenkinsfile stores pipeline logic in version control so build and delivery steps can be reviewed, reproduced, and changed with the application.","explanation":"","image":"images/part-04/jenkins__jenkins_automation__jenkinsfile.png","doc":"docs/part-04/jenkins__jenkins_automation__jenkinsfile.md"},{"title":"Pipeline stages","quote":"Pipeline stages group related delivery work such as build, test, security checks, packaging, approval, and deployment.","explanation":"","image":"images/part-04/jenkins__jenkins_automation__pipeline_stages.png","doc":"docs/part-04/jenkins__jenkins_automation__pipeline_stages.md"},{"title":"Shared libraries","quote":"Jenkins shared libraries package reusable pipeline steps, templates, and utilities so teams avoid duplicating delivery logic.","explanation":"","image":"images/part-04/jenkins__jenkins_automation__shared_libraries.png","doc":"docs/part-04/jenkins__jenkins_automation__shared_libraries.md"},{"title":"Credentials management","quote":"Jenkins credentials management stores secrets centrally and exposes them to jobs only through controlled bindings and scopes.","explanation":"","image":"images/part-04/jenkins__jenkins_automation__credentials_management.png","doc":"docs/part-04/jenkins__jenkins_automation__credentials_management.md"},{"title":"Parallel stages","quote":"Parallel stages run independent work at the same time, such as tests across modules or platforms, reducing pipeline duration.","explanation":"","image":"images/part-04/jenkins__jenkins_automation__parallel_stages.png","doc":"docs/part-04/jenkins__jenkins_automation__parallel_stages.md"},{"title":"Build parameters","quote":"Build parameters let users or upstream jobs supply values such as environment, version, feature flags, or deployment targets.","explanation":"","image":"images/part-04/jenkins__jenkins_automation__build_parameters.png","doc":"docs/part-04/jenkins__jenkins_automation__build_parameters.md"},{"title":"Jenkins webhooks","quote":"Webhooks trigger Jenkins when source-control events occur, enabling immediate builds without continuous polling.","explanation":"","image":"images/part-04/jenkins__jenkins_automation__jenkins_webhooks.png","doc":"docs/part-04/jenkins__jenkins_automation__jenkins_webhooks.md"},{"title":"Distributed builds","quote":"Distributed builds execute jobs on multiple agents with different labels, tools, operating systems, or capacity.","explanation":"","image":"images/part-04/jenkins__jenkins_automation__distributed_builds.png","doc":"docs/part-04/jenkins__jenkins_automation__distributed_builds.md"},{"title":"Jenkins security","quote":"Jenkins security requires authentication, authorization, credential isolation, plugin governance, controller hardening, and restricted agent trust.","explanation":"","image":"images/part-04/jenkins__jenkins_automation__jenkins_security.png","doc":"docs/part-04/jenkins__jenkins_automation__jenkins_security.md"}]}]},{"name":"Infrastructure as Code","groups":[{"name":"Terraform","topics":[{"title":"Terraform providers","quote":"Terraform providers are plugins that translate Terraform configuration into API operations for cloud platforms, SaaS tools, and other systems.","explanation":"","image":"images/part-04/infrastructure_as_code__terraform__terraform_providers.png","doc":"docs/part-04/infrastructure_as_code__terraform__terraform_providers.md"},{"title":"Terraform resources","quote":"A Terraform resource declares an infrastructure object that Terraform should create, read, update, or delete.","explanation":"","image":"images/part-04/infrastructure_as_code__terraform__terraform_resources.png","doc":"docs/part-04/infrastructure_as_code__terraform__terraform_resources.md"},{"title":"Terraform state","quote":"Terraform state maps declared resources to real infrastructure and stores attributes needed for planning and dependency tracking.","explanation":"","image":"images/part-04/infrastructure_as_code__terraform__terraform_state.png","doc":"docs/part-04/infrastructure_as_code__terraform__terraform_state.md"},{"title":"Remote state","quote":"Remote state stores Terraform state in a shared backend so teams and automation can collaborate safely.","explanation":"","image":"images/part-04/infrastructure_as_code__terraform__remote_state.png","doc":"docs/part-04/infrastructure_as_code__terraform__remote_state.md"},{"title":"State locking","quote":"State locking prevents multiple Terraform operations from modifying the same state concurrently.","explanation":"","image":"images/part-04/infrastructure_as_code__terraform__state_locking.png","doc":"docs/part-04/infrastructure_as_code__terraform__state_locking.md"},{"title":"Terraform modules","quote":"A Terraform module groups reusable resources, var
