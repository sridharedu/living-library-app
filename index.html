iables, outputs, and internal logic behind a stable interface.","explanation":"","image":"images/part-04/infrastructure_as_code__terraform__terraform_modules.png","doc":"docs/part-04/infrastructure_as_code__terraform__terraform_modules.md"},{"title":"Outputs","quote":"Terraform outputs expose selected values from a module or root configuration for users, automation, or other modules.","explanation":"","image":"images/part-04/infrastructure_as_code__terraform__outputs.png","doc":"docs/part-04/infrastructure_as_code__terraform__outputs.md"},{"title":"Data sources","quote":"Terraform data sources read existing infrastructure or external information without managing its lifecycle.","explanation":"","image":"images/part-04/infrastructure_as_code__terraform__data_sources.png","doc":"docs/part-04/infrastructure_as_code__terraform__data_sources.md"},{"title":"Workspaces","quote":"Terraform workspaces maintain multiple state instances for one configuration. They suit simple variations but are not a full environment-isolation strategy.","explanation":"","image":"images/part-04/infrastructure_as_code__terraform__workspaces.png","doc":"docs/part-04/infrastructure_as_code__terraform__workspaces.md"},{"title":"Plan and apply","quote":"terraform plan previews proposed changes, while terraform apply executes an approved plan against real infrastructure.","explanation":"","image":"images/part-04/infrastructure_as_code__terraform__plan_and_apply.png","doc":"docs/part-04/infrastructure_as_code__terraform__plan_and_apply.md"},{"title":"Import","quote":"Terraform import associates an existing infrastructure object with a resource address in state so it can be managed declaratively.","explanation":"","image":"images/part-04/infrastructure_as_code__terraform__import.png","doc":"docs/part-04/infrastructure_as_code__terraform__import.md"},{"title":"Terraform Cloud","quote":"Terraform Cloud provides remote runs, state, locking, policy checks, variables, collaboration, and private module registries.","explanation":"","image":"images/part-04/infrastructure_as_code__terraform__terraform_cloud.png","doc":"docs/part-04/infrastructure_as_code__terraform__terraform_cloud.md"}]},{"name":"Ansible","topics":[{"title":"Inventory","quote":"An Ansible inventory defines managed hosts and groups along with connection details and variables.","explanation":"","image":"images/part-04/infrastructure_as_code__ansible__inventory.png","doc":"docs/part-04/infrastructure_as_code__ansible__inventory.md"},{"title":"Playbooks","quote":"Ansible playbooks are YAML files that apply ordered plays and tasks to selected hosts.","explanation":"","image":"images/part-04/infrastructure_as_code__ansible__playbooks.png","doc":"docs/part-04/infrastructure_as_code__ansible__playbooks.md"},{"title":"Tasks","quote":"An Ansible task invokes one module with arguments and optional conditions, loops, tags, or privilege escalation.","explanation":"","image":"images/part-04/infrastructure_as_code__ansible__tasks.png","doc":"docs/part-04/infrastructure_as_code__ansible__tasks.md"},{"title":"Modules","quote":"Ansible modules perform specific operations such as package installation, file management, service control, or cloud provisioning.","explanation":"","image":"images/part-04/infrastructure_as_code__ansible__modules.png","doc":"docs/part-04/infrastructure_as_code__ansible__modules.md"},{"title":"Roles","quote":"Ansible roles organize reusable tasks, handlers, defaults, variables, templates, files, and metadata into a standard structure.","explanation":"","image":"images/part-04/infrastructure_as_code__ansible__roles.png","doc":"docs/part-04/infrastructure_as_code__ansible__roles.md"},{"title":"Facts","quote":"Ansible facts are discovered host details such as operating system, addresses, memory, and hardware that playbooks can use.","explanation":"","image":"images/part-04/infrastructure_as_code__ansible__facts.png","doc":"docs/part-04/infrastructure_as_code__ansible__facts.md"},{"title":"Templates","quote":"Ansible templates render Jinja2 files with variables and copy the result to managed hosts.","explanation":"","image":"images/part-04/infrastructure_as_code__ansible__templates.png","doc":"docs/part-04/infrastructure_as_code__ansible__templates.md"},{"title":"Handlers","quote":"Handlers are tasks triggered by notifications and usually run once at the end of a play, commonly to restart changed services.","explanation":"","image":"images/part-04/infrastructure_as_code__ansible__handlers.png","doc":"docs/part-04/infrastructure_as_code__ansible__handlers.md"},{"title":"Vault","quote":"Ansible Vault encrypts sensitive variables or files so secrets can be stored with automation code more safely.","explanation":"","image":"images/part-04/infrastructure_as_code__ansible__vault.png","doc":"docs/part-04/infrastructure_as_code__ansible__vault.md"},{"title":"Idempotency","quote":"An idempotent Ansible task makes a change only when the target differs from the desired state.","explanation":"","image":"images/part-04/infrastructure_as_code__ansible__idempotency.png","doc":"docs/part-04/infrastructure_as_code__ansible__idempotency.md"},{"title":"Dynamic inventory","quote":"Dynamic inventory discovers hosts from cloud APIs, CMDBs, or other live sources instead of using a static file.","explanation":"","image":"images/part-04/infrastructure_as_code__ansible__dynamic_inventory.png","doc":"docs/part-04/infrastructure_as_code__ansible__dynamic_inventory.md"},{"title":"Ansible Tower","quote":"Ansible Tower, now part of Automation Controller, adds a web UI, RBAC, scheduling, credentials, workflows, inventories, and audit history.","explanation":"","image":"images/part-04/infrastructure_as_code__ansible__ansible_tower.png","doc":"docs/part-04/infrastructure_as_code__ansible__ansible_tower.md"}]}]},{"name":"Observability","groups":[{"name":"Monitoring","topics":[{"title":"Metrics","quote":"Metrics are numeric time-series measurements such as latency, error rate, throughput, CPU, or queue depth.","explanation":"","image":"images/part-04/observability__monitoring__metrics.png","doc":"docs/part-04/observability__monitoring__metrics.md"},{"title":"Logs","quote":"Logs are timestamped event records that provide detailed context about application and infrastructure behavior.","explanation":"","image":"images/part-04/observability__monitoring__logs.png","doc":"docs/part-04/observability__monitoring__logs.md"},{"title":"Traces","quote":"Traces follow one request across services and represent its work as related spans.","explanation":"","image":"images/part-04/observability__monitoring__traces.png","doc":"docs/part-04/observability__monitoring__traces.md"},{"title":"Events","quote":"Events represent discrete state changes or occurrences, such as a deployment, failure, login, or scaling action.","explanation":"","image":"images/part-04/observability__monitoring__events.png","doc":"docs/part-04/observability__monitoring__events.md"},{"title":"Golden signals","quote":"The four golden signals are latency, traffic, errors, and saturation. Together they summarize service health from the user and resource perspectives.","explanation":"","image":"images/part-04/observability__monitoring__golden_signals.png","doc":"docs/part-04/observability__monitoring__golden_signals.md"},{"title":"RED method","quote":"The RED method monitors request Rate, Errors, and Duration for request-driven services.","explanation":"","image":"images/part-04/observability__monitoring__red_method.png","doc":"docs/part-04/observability__monitoring__red_method.md"},{"title":"USE method","quote":"The USE method monitors Utilization, Saturation, and Errors for each important resource.","explanation":"","image":"images/part-04/observability__monitoring__use_method.png","doc":"docs/part-04/observability__monitoring__use_method.md"},{"title":"SLIs","quote":"Service Level Indicators are measured values that represent service reliability, such as availability or successful-request latency.","explanation":"","image":"images/part-04/observability__monitoring__slis.png","doc":"docs/part-04/observability__monitoring__slis.md"},{"title":"SLOs","quote":"Service Level Objectives define target values for SLIs over a time window.","explanation":"","image":"images/part-04/observability__monitoring__slos.png","doc":"docs/part-04/observability__monitoring__slos.md"},{"title":"Error budgets","quote":"An error budget is the amount of unreliability allowed by an SLO and helps balance feature delivery against reliability work.","explanation":"","image":"images/part-04/observability__monitoring__error_budgets.png","doc":"docs/part-04/observability__monitoring__error_budgets.md"},{"title":"Alert fatigue","quote":"Alert fatigue occurs when excessive low-value alerts desensitize responders and hide genuinely urgent signals.","explanation":"","image":"images/part-04/observability__monitoring__alert_fatigue.png","doc":"docs/part-04/observability__monitoring__alert_fatigue.md"},{"title":"Alert routing","quote":"Alert routing sends notifications to the correct team and channel based on severity, service, ownership, and time.","explanation":"","image":"images/part-04/observability__monitoring__alert_routing.png","doc":"docs/part-04/observability__monitoring__alert_routing.md"},{"title":"Synthetic monitoring","quote":"Synthetic monitoring runs scripted checks or user journeys on a schedule to detect failures before real users report them.","explanation":"","image":"images/part-04/observability__monitoring__synthetic_monitoring.png","doc":"docs/part-04/observability__monitoring__synthetic_monitoring.md"}]},{"name":"Tools","topics":[{"title":"Prometheus","quote":"Prometheus is a time-series monitoring system that scrapes metrics, stores labeled samples, evaluates rules, and supports alerting.","explanation":"","image":"images/part-04/observability__tools__prometheus.png","doc":"docs/part-04/observability__tools__prometheus.md"},{"title":"PromQL","quote":"PromQL is Prometheus\u0027 query language for filtering, aggregating, joining, and calculating over time-series data.","explanation":"","image":"images/part-04/observability__tools__promql.png","doc":"docs/part-04/observability__tools__promql.md"},{"title":"Grafana","quote":"Grafana creates dashboards, visualizations, alerts, and exploratory views across many telemetry data sources.","explanation":"","image":"images/part-04/observability__tools__grafana.png","doc":"docs/part-04/observability__tools__grafana.md"},{"title":"Alertmanager","quote":"Prometheus Alertmanager groups, deduplicates, silences, and routes alerts to notification channels.","explanation":"","image":"images/part-04/observability__tools__alertmanager.png","doc":"docs/part-04/observability__tools__alertmanager.md"},{"title":"OpenTelemetry","quote":"OpenTelemetry provides vendor-neutral APIs, SDKs, conventions, and collectors for metrics, logs, and traces.","explanation":"","image":"images/part-04/observability__tools__opentelemetry.png","doc":"docs/part-04/observability__tools__opentelemetry.md"},{"title":"Distributed tracing","quote":"Distributed tracing follows a request across process and service boundaries using trace IDs, spans, timing, and parent-child relationships.","explanation":"","image":"images/part-04/observability__tools__distributed_tracing.png","doc":"docs/part-04/observability__tools__distributed_tracing.md"},{"title":"Jaeger","quote":"Jaeger is a distributed tracing platform for collecting, searching, and visualizing traces and service dependencies.","explanation":"","image":"images/part-04/observability__tools__jaeger.png","doc":"docs/part-04/observability__tools__jaeger.md"},{"title":"Zipkin","quote":"Zipkin is a distributed tracing system that records timing data and visualizes request paths across services.","explanation":"","image":"images/part-04/observability__tools__zipkin.png","doc":"docs/part-04/observability__tools__zipkin.md"},{"title":"Elasticsearch","quote":"Elasticsearch is a distributed search and analytics engine commonly used for logs, text search, and operational data.","explanation":"","image":"images/part-04/observability__tools__elasticsearch.png","doc":"docs/part-04/observability__tools__elasticsearch.md"},{"title":"Logstash","quote":"Logstash ingests, transforms, enriches, and routes events through configurable input, filter, and output plugins.","explanation":"","image":"images/part-04/observability__tools__logstash.png","doc":"docs/part-04/observability__tools__logstash.md"},{"title":"Kibana","quote":"Kibana provides search, dashboards, visualization, and management for data stored in Elasticsearch.","explanation":"","image":"images/part-04/observability__tools__kibana.png","doc":"docs/part-04/observability__tools__kibana.md"},{"title":"Loki","quote":"Loki is a log aggregation system that indexes labels rather than full log contents and integrates closely with Grafana.","explanation":"","image":"images/part-04/observability__tools__loki.png","doc":"docs/part-04/observability__tools__loki.md"},{"title":"Tempo","quote":"Grafana Tempo is a distributed tracing backend optimized for storing and querying large trace volumes.","explanation":"","image":"images/part-04/observability__tools__tempo.png","doc":"docs/part-04/observability__tools__tempo.md"},{"title":"Fluent Bit","quote":"Fluent Bit is a lightweight log and telemetry processor used to collect, parse, enrich, and forward data.","explanation":"","image":"images/part-04/observability__tools__fluent_bit.png","doc":"docs/part-04/observability__tools__fluent_bit.md"}]}]},{"name":"Reliability Engineering","groups":[{"name":"SRE","topics":[{"title":"Service level indicators","quote":"A service level indicator is a concrete measurement of service behavior, such as success ratio, latency percentile, or freshness.","explanation":"","image":"images/part-04/reliability_engineering__sre__service_level_indicators.png","doc":"docs/part-04/reliability_engineering__sre__service_level_indicators.md"},{"title":"Service level objectives","quote":"A service level objective is an internal reliability target for one or more service level indicators.","explanation":"","image":"images/part-04/reliability_engineering__sre__service_level_objectives.png","doc":"docs/part-04/reliability_engineering__sre__service_level_objectives.md"},{"title":"Service level agreements","quote":"A service level agreement is a formal commitment to customers and may include consequences when targets are missed.","explanation":"","image":"images/part-04/reliability_engineering__sre__service_level_agreements.png","doc":"docs/part-04/reliability_engineering__sre__service_level_agreements.md"},{"title":"Incident response","quote":"Incident response covers detection, triage, containment, communication, mitigation, recovery, and follow-up.","explanation":"","image":"images/part-04/reliability_engineering__sre__incident_response.png","doc":"docs/part-04/reliability_engineering__sre__incident_response.md"},{"title":"On-call practices","quote":"Healthy on-call practices use clear ownership, useful alerts, escalation paths, runbooks, manageable rotations, and recovery time.","explanation":"","image":"images/part-04/reliability_engineering__sre__on_call_practices.png","doc":"docs/part-04/reliability_engineering__sre__on_call_practices.md"},{"title":"Postmortems","quote":"A postmortem documents impact, timeline, causes, response, lessons, and follow-up actions after an incident.","explanation":"","image":"images/part-04/reliability_engineering__sre__postmortems.png","doc":"docs/part-04/reliability_engineering__sre__postmortems.md"},{"title":"Blameless culture","quote":"A blameless culture examines systems, incentives, and conditions rather than punishing individuals for reasonable actions.","explanation":"","image":"images/part-04/reliability_engineering__sre__blameless_culture.png","doc":"docs/part-04/reliability_engineering__sre__blameless_culture.md"},{"title":"Toil reduction","quote":"Toil reduction automates repetitive, manual, reactive work that scales with service growth and provides little lasting value.","explanation":"","image":"images/part-04/reliability_engineering__sre__toil_reduction.png","doc":"docs/part-04/reliability_engineering__sre__toil_reduction.md"},{"title":"Capacity planning","quote":"Capacity planning forecasts resource needs from demand, growth, redundancy, performance targets, and failure scenarios.","explanation":"","image":"images/part-04/reliability_engineering__sre__capacity_planning.png","doc":"docs/part-04/reliability_engineering__sre__capacity_planning.md"},{"title":"Chaos engineering","quote":"Chaos engineering runs controlled failure experiments to test assumptions and improve resilience before real incidents occur.","explanation":"","image":"images/part-04/reliability_engineering__sre__chaos_engineering.png","doc":"docs/part-04/reliability_engineering__sre__chaos_engineering.md"},{"title":"RTO and RPO","quote":"Recovery Time Objective is the target restoration time, while Recovery Point Objective is the acceptable amount of data loss.","explanation":"","image":"images/part-04/reliability_engineering__sre__rto_and_rpo.png","doc":"docs/part-04/reliability_engineering__sre__rto_and_rpo.md"}]}]},{"name":"Testing","groups":[{"name":"Unit Testing","topics":[{"title":"Unit testing","quote":"Unit testing verifies one small behavior in isolation with fast, deterministic tests.","explanation":"","image":"images/part-04/testing__unit_testing__unit_testing.png","doc":"docs/part-04/testing__unit_testing__unit_testing.md"},{"title":"JUnit 5","quote":"JUnit 5 combines the JUnit Platform, Jupiter programming model, and extension system for modern Java testing.","explanation":"","image":"images/part-04/testing__unit_testing__junit_5.png","doc":"docs/part-04/testing__unit_testing__junit_5.md"},{"title":"Test lifecycle","quote":"The test lifecycle controls setup and cleanup before or after each test or test class.","explanation":"","image":"images/part-04/testing__unit_testing__test_lifecycle.png","doc":"docs/part-04/testing__unit_testing__test_lifecycle.md"},{"title":"Assertions","quote":"Assertions compare actual behavior with expected outcomes and fail the test when the contract is not met.","explanation":"","image":"images/part-04/testing__unit_testing__assertions.png","doc":"docs/part-04/testing__unit_testing__assertions.md"},{"title":"Parameterized tests","quote":"Parameterized tests execute the same test logic with multiple argument sets from values, methods, CSV, enums, or custom sources.","explanation":"","image":"images/part-04/testing__unit_testing__parameterized_tests.png","doc":"docs/part-04/testing__unit_testing__parameterized_tests.md"},{"title":"Nested tests","quote":"Nested tests group related scenarios hierarchically and can share contextual setup through nested classes.","explanation":"","image":"images/part-04/testing__unit_testing__nested_tests.png","doc":"docs/part-04/testing__unit_testing__nested_tests.md"},{"title":"Dynamic tests","quote":"Dynamic tests are generated at runtime from data or logic and returned through @TestFactory methods.","explanation":"","image":"images/part-04/testing__unit_testing__dynamic_tests.png","doc":"docs/part-04/testing__unit_testing__dynamic_tests.md"},{"title":"Exception testing","quote":"Exception tests verify that a specific operation throws the expected type and, where useful, expected details.","explanation":"","image":"images/part-04/testing__unit_testing__exception_testing.png","doc":"docs/part-04/testing__unit_testing__exception_testing.md"},{"title":"Timeout testing","quote":"Timeout testing ensures an operation completes within a defined duration, though strict timing can make tests environment-sensitive.","explanation":"","image":"images/part-04/testing__unit_testing__timeout_testing.png","doc":"docs/part-04/testing__unit_testing__timeout_testing.md"},{"title":"Test fixtures","quote":"Test fixtures are the objects, data, dependencies, and setup needed to run a test consistently.","explanation":"","image":"images/part-04/testing__unit_testing__test_fixtures.png","doc":"docs/part-04/testing__unit_testing__test_fixtures.md"},{"title":"Test naming","quote":"Good test names state the behavior, scenario, and expected outcome rather than repeating implementation details.","explanation":"","image":"images/part-04/testing__unit_testing__test_naming.png","doc":"docs/part-04/testing__unit_testing__test_naming.md"},{"title":"Code coverage","quote":"Code coverage measures which lines, branches, or methods tests execute. It is a gap indicator, not proof of test quality.","explanation":"","image":"images/part-04/testing__unit_testing__code_coverage.png","doc":"docs/part-04/testing__unit_testing__code_coverage.md"}]},{"name":"Mockito","topics":[{"title":"Mockito mocks","quote":"Mockito mocks are configurable test doubles used to simulate collaborators and verify selected interactions.","explanation":"","image":"images/part-04/testing__mockito__mockito_mocks.png","doc":"docs/part-04/testing__mockito__mockito_mocks.md"},{"title":"Stubs","quote":"A stub returns predetermined responses so the test can control a dependency\u0027s behavior.","explanation":"","image":"images/part-04/testing__mockito__stubs.png","doc":"docs/part-04/testing__mockito__stubs.md"},{"title":"Spies","quote":"A spy wraps a real object and allows selective stubbing or verification while other methods execute normally.","explanation":"","image":"images/part-04/testing__mockito__spies.png","doc":"docs/part-04/testing__mockito__spies.md"},{"title":"Mock annotations","quote":"Mockito annotations such as @Mock, @Spy, @InjectMocks, and @Captor reduce test setup boilerplate.","explanation":"","image":"images/part-04/testing__mockito__mock_annotations.png","doc":"docs/part-04/testing__mockito__mock_annotations.md"},{"title":"Argument matchers","quote":"Argument matchers let stubbing or verification accept broad or custom argument conditions instead of exact values.","explanation":"","image":"images/part-04/testing__mockito__argument_matchers.png","doc":"docs/part-04/testing__mockito__argument_matchers.md"},{"title":"ArgumentCaptor","quote":"ArgumentCaptor captures values passed to a mock so the test can inspect them afterward.","explanation":"","image":"images/part-04/testing__mockito__argumentcaptor.png","doc":"docs/part-04/testing__mockito__argumentcaptor.md"},{"title":"Verification","quote":"Mockito verification checks whether a collaborator was called with expected arguments and frequency.","explanation":"","image":"images/part-04/testing__mockito__verification.png","doc":"docs/part-04/testing__mockito__verification.md"},{"title":"Mocking void methods","quote":"Void methods are stubbed with doNothing, doThrow, doAnswer, or doCallRealMethod.","explanation":"","image":"images/part-04/testing__mockito__mocking_void_methods.png","doc":"docs/part-04/testing__mockito__mocking_void_methods.md"},{"title":"Mocking exceptions","quote":"Mockito can configure methods to throw exceptions so tests can verify failure paths and recovery behavior.","explanation":"","image":"images/part-04/testing__mockito__mocking_exceptions.png","doc":"docs/part-04/testing__mockito__mocking_exceptions.md"},{"title":"Strict stubbing","quote":"Strict stubbing detects unused or mismatched stubs, helping keep tests clear and maintainable.","explanation":"","image":"images/part-04/testing__mockito__strict_stubbing.png","doc":"docs/part-04/testing__mockito__strict_stubbing.md"},{"title":"Partial mocks","quote":"Partial mocks execute real behavior for some methods and stub others. Use them sparingly because they often signal difficult design.","explanation":"","image":"images/part-04/testing__mockito__partial_mocks.png","doc":"docs/part-04/testing__mockito__partial_mocks.md"},{"title":"Static mocking","quote":"Mockito can temporarily mock static methods within a scoped block, but dependency injection is usually easier to maintain.","explanation":"","image":"images/part-04/testing__mockito__static_mocking.png","doc":"docs/part-04/testing__mockito__static_mocking.md"},{"title":"Mocking final classes","quote":"Modern Mockito can mock final classes and methods when its inline mock maker is available.","explanation":"","image":"images/part-04/testing__mockito__mocking_final_classes.png","doc":"docs/part-04/testing__mockito__mocking_final_classes.md"}]},{"name":"Integration Testing","topics":[{"title":"Spring Boot Test","quote":"@SpringBootTest loads a broad Spring Boot application context for end-to-end integration testing within the application boundary.","explanation":"","image":"images/part-04/testing__integration_testing__spring_boot_test.png","doc":"docs/part-04/testing__integration_testing__spring_boot_test.md"},{"title":"Test slices","quote":"Spring Boot test slices load only a focused part of the application, such as MVC, JPA, JSON, or REST clients.","explanation":"","image":"images/part-04/testing__integration_testing__test_slices.png","doc":"docs/part-04/testing__integration_testing__test_slices.md"},{"title":"WebMvcTest","quote":"@WebMvcTest loads Spring MVC infrastructure and selected controllers while mocking or supplying their collaborators.","explanation":"","image":"images/part-04/testing__integration_testing__webmvctest.png","doc":"docs/part-04/testing__integration_testing__webmvctest.md"},{"title":"DataJpaTest","quote":"@DataJpaTest loads a focused JPA test slice with repositories, entity mappings, and an embedded or configured database, usually rolling transactions back after each test.","explanation":"","image":"images/part-04/testing__integration_testing__datajpatest.png","doc":"docs/part-04/testing__integration_testing__datajpatest.md"},{"title":"MockMvc","quote":"MockMvc tests Spring MVC request handling without starting a real server. It verifies routing, validation, serialization, status codes, headers, and response bodies.","explanation":"","image":"images/part-04/testing__integration_testing__mockmvc.png","doc":"docs/part-04/testing__integration_testing__mockmvc.md"},{"title":"WebTestClient","quote":"WebTestClient is a fluent HTTP test client for WebFlux and can also test live servers or selected Spring MVC applications.","explanation":"","image":"images/part-04/testing__integration_testing__webtestclient.png","doc":"docs/part-04/testing__integration_testing__webtestclient.md"},{"title":"TestRestTemplate","quote":"TestRestTemplate is a convenient blocking HTTP client for integration tests that start a Spring Boot server on a real port.","explanation":"","image":"images/part-04/testing__integration_testing__testresttemplate.png","doc":"docs/part-04/testing__integration_testing__testresttemplate.md"},{"title":"Testcontainers","quote":"Testcontainers launches disposable Docker containers for databases, brokers, and other dependencies so tests run against realistic infrastructure.","explanation":"","image":"images/part-04/testing__integration_testing__testcontainers.png","doc":"docs/part-04/testing__integration_testing__testcontainers.md"},{"title":"Database integration tests","quote":"Database integration tests verify mappings, SQL, constraints, transactions, migrations, and query behavior against a real database engine.","explanation":"","image":"images/part-04/testing__integration_testing__database_integration_tests.png","doc":"docs/part-04/testing__integration_testing__database_integration_tests.md"},{"title":"Contract testing","quote":"Contract testing verifies that service providers and consumers agree on request, response, event, and compatibility expectations.","explanation":"","image":"images/part-04/testing__integration_testing__contract_testing.png","doc":"docs/part-04/testing__integration_testing__contract_testing.md"},{"title":"WireMock","quote":"WireMock simulates HTTP services with programmable stubs, delays, faults, request matching, and verification.","explanation":"","image":"images/part-04/testing__integration_testing__wiremock.png","doc":"docs/part-04/testing__integration_testing__wiremock.md"},{"title":"Embedded Kafka","quote":"Embedded Kafka starts Kafka brokers inside a test environment for producer, consumer, serialization, and listener integration testing.","explanation":"","image":"images/part-04/testing__integration_testing__embedded_kafka.png","doc":"docs/part-04/testing__integration_testing__embedded_kafka.md"}]},{"name":"Quality Practices","topics":[{"title":"Test-driven development","quote":"Test-driven development follows Red, Green, Refactor: write a failing test, implement the minimum behavior, then improve the design.","explanation":"","image":"images/part-04/testing__quality_practices__test_driven_development.png","doc":"docs/part-04/testing__quality_practices__test_driven_development.md"},{"title":"Behavior-driven development","quote":"Behavior-driven development describes system behavior in business-readable scenarios and connects examples to executable tests.","explanation":"","image":"images/part-04/testing__quality_practices__behavior_driven_development.png","doc":"docs/part-04/testing__quality_practices__behavior_driven_development.md"},{"title":"Acceptance testing","quote":"Acceptance testing verifies that a feature satisfies business requirements and user-visible outcomes.","explanation":"","image":"images/part-04/testing__quality_practices__acceptance_testing.png","doc":"docs/part-04/testing__quality_practices__acceptance_testing.md"},{"title":"Regression testing","quote":"Regression testing reruns existing checks to confirm that new changes did not break previously working behavior.","explanation":"","image":"images/part-04/testing__quality_practices__regression_testing.png","doc":"docs/part-04/testing__quality_practices__regression_testing.md"},{"title":"Performance testing","quote":"Performance testing measures response time, throughput, resource usage, and scalability under defined workloads.","explanation":"","image":"images/part-04/testing__quality_practices__performance_testing.png","doc":"docs/part-04/testing__quality_practices__performance_testing.md"},{"title":"Load testing","quote":"Load testing evaluates system behavior at expected and peak traffic levels.","explanation":"","image":"images/part-04/testing__quality_practices__load_testing.png","doc":"docs/part-04/testing__quality_practices__load_testing.md"},{"title":"Stress testing","quote":"Stress testing pushes a system beyond normal capacity to discover breaking points and recovery behavior.","explanation":"","image":"images/part-04/testing__quality_practices__stress_testing.png","doc":"docs/part-04/testing__quality_practices__stress_testing.md"},{"title":"Soak testing","quote":"Soak testing runs a realistic workload for an extended period to expose memory leaks, resource exhaustion, and gradual degradation.","explanation":"","image":"images/part-04/testing__quality_practices__soak_testing.png","doc":"docs/part-04/testing__quality_practices__soak_testing.md"},{"title":"Mutation testing","quote":"Mutation testing deliberately changes production code and checks whether tests fail, revealing weak assertions and untested behavior.","explanation":"","image":"images/part-04/testing__quality_practices__mutation_testing.png","doc":"docs/part-04/testing__quality_practices__mutation_testing.md"},{"title":"Property-based testing","quote":"Property-based testing generates many inputs and verifies general rules or invariants instead of checking only hand-picked examples.","explanation":"","image":"images/part-04/testing__quality_practices__property_based_testing.png","doc":"docs/part-04/testing__quality_practices__property_based_testing.md"},{"title":"Test pyramid","quote":"The test pyramid favors many fast unit tests, fewer integration tests, and a small number of end-to-end tests.","explanation":"","image":"images/part-04/testing__quality_practices__test_pyramid.png","doc":"docs/part-04/testing__quality_practices__test_pyramid.md"},{"title":"Test trophy","quote":"The test trophy emphasizes integration tests as the highest-value layer, supported by unit, end-to-end, and static checks.","explanation":"","image":"images/part-04/testing__quality_practices__test_trophy.png","doc":"docs/part-04/testing__quality_practices__test_trophy.md"},{"title":"Flaky tests","quote":"Flaky tests pass and fail without relevant code changes, often because of timing, shared state, environment dependence, or nondeterministic data.","explanation":"","image":"images/part-04/testing__quality_practices__flaky_tests.png","doc":"docs/part-04/testing__quality_practices__flaky_tests.md"}]}]},{"name":"Code Quality","groups":[{"name":"Engineering Practices","topics":[{"title":"Clean code","quote":"Clean code communicates intent through clear names, small cohesive units, simple control flow, useful tests, and minimal duplication.","explanation":"","image":"images/part-04/code_quality__engineering_practices__clean_code.png","doc":"docs/part-04/code_quality__engineering_practices__clean_code.md"},{"title":"Code smells","quote":"Code smells are warning signs such as long methods, large classes, duplicated logic, excessive coupling, or primitive obsession.","explanation":"","image":"images/part-04/code_quality__engineering_practices__code_smells.png","doc":"docs/part-04/code_quality__engineering_practices__code_smells.md"},{"title":"Refactoring","quote":"Refactoring improves internal structure without changing externally observable behavior.","explanation":"","image":"images/part-04/code_quality__engineering_practices__refactoring.png","doc":"docs/part-04/code_quality__engineering_practices__refactoring.md"},{"title":"Static analysis","quote":"Static analysis examines source or bytecode without executing it to detect bugs, vulnerabilities, style issues, and maintainability risks.","explanation":"","image":"images/part-04/code_quality__engineering_practices__static_analysis.png","doc":"docs/part-04/code_quality__engineering_practices__static_analysis.md"},{"title":"SonarQube","quote":"SonarQube analyzes code quality, security hotspots, duplication, coverage, and maintainability against configurable quality gates.","explanation":"","image":"images/part-04/code_quality__engineering_practices__sonarqube.png","doc":"docs/part-04/code_quality__engineering_practices__sonarqube.md"},{"title":"Checkstyle","quote":"Checkstyle enforces Java formatting and coding conventions through automated rules.","explanation":"","image":"images/part-04/code_quality__engineering_practices__checkstyle.png","doc":"docs/part-04/code_quality__engineering_practices__checkstyle.md"},{"title":"SpotBugs","quote":"SpotBugs analyzes Java bytecode for patterns associated with defects, null issues, concurrency bugs, and misuse of APIs.","explanation":"","image":"images/part-04/code_quality__engineering_practices__spotbugs.png","doc":"docs/part-04/code_quality__engineering_practices__spotbugs.md"},{"title":"Cyclomatic complexity","quote":"Cyclomatic complexity measures the number of independent control-flow paths through a method. Higher values usually indicate harder testing and maintenance.","explanation":"","image":"images/part-04/code_quality__engineering_practices__cyclomatic_complexity.png","doc":"docs/part-04/code_quality__engineering_practices__cyclomatic_complexity.md"},{"title":"Technical debt","quote":"Technical debt is the future cost created by expedient design, code, or operational decisions that require later correction.","explanation":"","image":"images/part-04/code_quality__engineering_practices__technical_debt.png","doc":"docs/part-04/code_quality__engineering_practices__technical_debt.md"},{"title":"Documentation as code","quote":"Documentation as code stores docs in version control and applies review, automation, testing, and release practices similar to software.","explanation":"","image":"images/part-04/code_quality__engineering_practices__documentation_as_code.png","doc":"docs/part-04/code_quality__engineering_practices__documentation_as_code.md"},{"title":"API documentation","quote":"API documentation explains endpoints, parameters, schemas, authentication, errors, examples, limits, and compatibility expectations.","explanation":"","image":"images/part-04/code_quality__engineering_practices__api_documentation.png","doc":"docs/part-04/code_quality__engineering_practices__api_documentation.md"},{"title":"Semantic versioning","quote":"Semantic versioning uses MAJOR.MINOR.PATCH: major for incompatible changes, minor for backward-compatible features, and patch for backward-compatible fixes.","explanation":"","image":"images/part-04/code_quality__engineering_practices__semantic_versioning.png","doc":"docs/part-04/code_quality__engineering_practices__semantic_versioning.md"}]}]},{"name":"Application Security","groups":[{"name":"Web Security","topics":[{"title":"OWASP Top 10","quote":"The OWASP Top 10 summarizes common web-application security risks such as broken access control, injection, insecure design, and misconfiguration.","explanation":"","image":"images/part-04/application_security__web_security__owasp_top_10.png","doc":"docs/part-04/application_security__web_security__owasp_top_10.md"},{"title":"SQL injection","quote":"SQL injection occurs when untrusted input changes a SQL statement. Prevent it with parameterized queries and strict input handling.","explanation":"","image":"images/part-04/application_security__web_security__sql_injection.png","doc":"docs/part-04/application_security__web_security__sql_injection.md"},{"title":"Cross-site scripting","quote":"Cross-site scripting executes attacker-controlled script in a user\u0027s browser. Prevent it with contextual output encoding, safe templates, and CSP.","explanation":"","image":"images/part-04/application_security__web_security__cross_site_scripting.png","doc":"docs/part-04/application_security__web_security__cross_site_scripting.md"},{"title":"Server-side request forgery","quote":"SSRF tricks a server into making unintended requests to internal or external destinations. Restrict outbound targets and validate URLs carefully.","explanation":"","image":"images/part-04/application_security__web_security__server_side_request_forgery.png","doc":"docs/part-04/application_security__web_security__server_side_request_forgery.md"},{"title":"Insecure deserialization","quote":"Insecure deserialization lets untrusted data create dangerous object graphs or trigger code paths. Use safe formats and strict type control.","explanation":"","image":"images/part-04/application_security__web_security__insecure_deserialization.png","doc":"docs/part-04/application_security__web_security__insecure_deserialization.md"},{"title":"Path traversal","quote":"Path traversal uses sequences such as ../ to access files outside an intended directory. Normalize and constrain resolved paths.","explanation":"","image":"images/part-04/application_security__web_security__path_traversal.png","doc":"docs/part-04/application_security__web_security__path_traversal.md"},{"title":"Command injection","quote":"Command injection occurs when untrusted input becomes part of an operating-system command. Avoid shell execution or use fixed arguments and strict validation.","explanation":"","image":"images/part-04/application_security__web_security__command_injection.png","doc":"docs/part-04/application_security__web_security__command_injection.md"},{"title":"Broken access control","quote":"Broken access control allows users to perform actions or access resources beyond their permissions. Enforce authorization on every protected operation.","explanation":"","image":"images/part-04/application_security__web_security__broken_access_control.png","doc":"docs/part-04/application_security__web_security__broken_access_control.md"},{"title":"Security misconfiguration","quote":"Security misconfiguration includes unsafe defaults, open services, verbose errors, missing headers, weak permissions, and outdated settings.","explanation":"","image":"images/part-04/application_security__web_security__security_misconfiguration.png","doc":"docs/part-04/application_security__web_security__security_misconfiguration.md"},{"title":"Content Security Policy","quote":"Content Security Policy limits which scripts, styles, frames, and other resources a browser may load, reducing XSS impact.","explanation":"","image":"images/part-04/application_security__web_security__content_security_policy.png","doc":"docs/part-04/application_security__web_security__content_security_policy.md"},{"title":"Secure headers","quote":"Secure HTTP headers such as HSTS, CSP, X-Content-Type-Options, and frame restrictions reduce browser-based attack surfaces.","explanation":"","image":"images/part-04/application_security__web_security__secure_headers.png","doc":"docs/part-04/application_security__web_security__secure_headers.md"}]},{"name":"Identity and Access","topics":[{"title":"JWT","quote":"A JSON Web Token carries signed claims between parties. It must be validated for signature, issuer, audience, expiry, and intended use.","explanation":"","image":"images/part-04/application_security__identity_and_access__jwt.png","doc":"docs/part-04/application_security__identity_and_access__jwt.md"},{"title":"SAML","quote":"SAML is an XML-based federation standard commonly used for enterprise single sign-on between identity providers and service providers.","explanation":"","image":"images/part-04/application_security__identity_and_access__saml.png","doc":"docs/part-04/application_security__identity_and_access__saml.md"},{"title":"Single sign-on","quote":"Single sign-on lets a user authenticate once with an identity provider and access multiple trusted applications.","explanation":"","image":"images/part-04/application_security__identity_and_access__single_sign_on.png","doc":"docs/part-04/application_security__identity_and_access__single_sign_on.md"},{"title":"Multi-factor authentication","quote":"Multi-factor authentication requires evidence from more than one factor, such as password, device, biometric, or security key.","explanation":"","image":"images/part-04/application_security__identity_and_access__multi_factor_authentication.png","doc":"docs/part-04/application_security__identity_and_access__multi_factor_authentication.md"},{"title":"ABAC","quote":"Attribute-Based Access Control grants access using attributes of the user, resource, action, and environment.","explanation":"","image":"images/part-04/application_security__identity_and_access__abac.png","doc":"docs/part-04/application_security__identity_and_access__abac.md"},{"title":"Zero trust","quote":"Zero trust assumes no network location is inherently trusted and continuously verifies identity, device, context, and least-privilege access.","explanation":"","image":"images/part-04/application_security__identity_and_access__zero_trust.png","doc":"docs/part-04/application_security__identity_and_access__zero_trust.md"},{"title":"Least privilege","quote":"Least privilege grants only the permissions required for a task and only for as long as needed.","explanation":"","image":"images/part-04/application_security__identity_and_access__least_privilege.png","doc":"docs/part-04/application_security__identity_and_access__least_privilege.md"},{"title":"Secrets management","quote":"Secrets management securely stores, distributes, rotates, audits, and revokes credentials, keys, and tokens.","explanation":"","image":"images/part-04/application_security__identity_and_access__secrets_management.png","doc":"docs/part-04/application_security__identity_and_access__secrets_management.md"}]},{"name":"Cryptography","topics":[{"title":"Encryption at rest","quote":"Encryption at rest protects stored data on disks, databases, backups, and object storage.","explanation":"","image":"images/part-04/application_security__cryptography__encryption_at_rest.png","doc":"docs/part-04/application_security__cryptography__encryption_at_rest.md"},{"title":"Encryption in transit","quote":"Encryption in transit protects data while it moves across networks, usually through TLS.","explanation":"","image":"images/part-04/application_security__cryptography__encryption_in_transit.png","doc":"docs/part-04/application_security__cryptography__encryption_in_transit.md"},{"title":"TLS","quote":"Transport Layer Security authenticates endpoints and provides encrypted, integrity-protected network communication.","explanation":"","image":"images/part-04/application_security__cryptography__tls.png","doc":"docs/part-04/application_security__cryptography__tls.md"},{"title":"Certificates","quote":"A digital certificate binds a public key to an identity and is signed by a trusted certificate authority.","explanation":"","image":"images/part-04/application_security__cryptography__certificates.png","doc":"docs/part-04/application_security__cryptography__certificates.md"},{"title":"Public key infrastructure","quote":"PKI manages certificates, certificate authorities, trust chains, revocation, issuance, and key ownership.","explanation":"","image":"images/part-04/application_security__cryptography__public_key_infrastructure.png","doc":"docs/part-04/application_security__cryptography__public_key_infrastructure.md"},{"title":"Symmetric encryption","quote":"Symmetric encryption uses the same secret key for encryption and decryption and is efficient for bulk data.","explanation":"","image":"images/part-04/application_security__cryptography__symmetric_encryption.png","doc":"docs/part-04/application_security__cryptography__symmetric_encryption.md"},{"title":"Asymmetric encryption","quote":"Asymmetric encryption uses a public-private key pair for encryption, signatures, or secure key exchange.","explanation":"","image":"images/part-04/application_security__cryptography__asymmetric_encryption.png","doc":"docs/part-04/application_security__cryptography__asymmetric_encryption.md"},{"title":"Hashing","quote":"Hashing transforms data into a fixed-size digest and is designed to be one-way and collision resistant.","explanation":"","image":"images/part-04/application_security__cryptography__hashing.png","doc":"docs/part-04/application_security__cryptography__hashing.md"},{"title":"Salting","quote":"Salting adds a unique random value before password hashing so identical passwords do not produce identical hashes.","explanation":"","image":"images/part-04/application_security__cryptography__salting.png","doc":"docs/part-04/application_security__cryptography__salting.md"},{"title":"Digital signatures","quote":"A digital signature uses a private key to prove integrity and origin, and a public key to verify it.","explanation":"","image":"images/part-04/application_security__cryptography__digital_signatures.png","doc":"docs/part-04/application_security__cryptography__digital_signatures.md"},{"title":"Key rotation","quote":"Key rotation replaces cryptographic keys on a schedule or after risk events while preserving access to existing protected data.","explanation":"","image":"images/part-04/application_security__cryptography__key_rotation.png","doc":"docs/part-04/application_security__cryptography__key_rotation.md"},{"title":"Key management","quote":"Key management covers generation, storage, access control, rotation, backup, revocation, and destruction of cryptographic keys.","explanation":"","image":"images/part-04/application_security__cryptography__key_management.png","doc":"docs/part-04/application_security__cryptography__key_management.md"},{"title":"Password hashing","quote":"Password hashing should use adaptive algorithms such as Argon2, scrypt, BCrypt, or PBKDF2 with unique salts.","explanation":"","image":"images/part-04/application_security__cryptography__password_hashing.png","doc":"docs/part-04/application_security__cryptography__password_hashing.md"}]}]},{"name":"API Design","groups":[{"name":"REST APIs","topics":[{"title":"REST constraints","quote":"REST constraints include client-server separation, statelessness, cacheability, a uniform interface, layered systems, and optional code on demand.","explanation":"","image":"images/part-04/api_design__rest_apis__rest_constraints.png","doc":"docs/part-04/api_design__rest_apis__rest_constraints.md"},{"title":"HTTP methods","quote":"HTTP methods express intent: GET reads, POST creates or processes, PUT replaces, PATCH partially updates, and DELETE removes.","explanation":"","image":"images/part-04/api_design__rest_apis__http_methods.png","doc":"docs/part-04/api_design__rest_apis__http_methods.md"},{"title":"HTTP status codes","quote":"HTTP status codes communicate outcome classes: 2xx success, 3xx redirection, 4xx client error, and 5xx server error.","explanation":"","image":"images/part-04/api_design__rest_apis__http_status_codes.png","doc":"docs/part-04/api_design__rest_apis__http_status_codes.md"},{"title":"Resource modeling","quote":"Resource modeling represents domain concepts as stable nouns with clear identifiers, relationships, and operations.","explanation":"","image":"images/part-04/api_design__rest_apis__resource_modeling.png","doc":"docs/part-04/api_design__rest_apis__resource_modeling.md"},{"title":"URI design","quote":"Good URIs are predictable, noun-based, hierarchical where useful, and free from implementation details.","explanation":"","image":"images/part-04/api_design__rest_apis__uri_design.png","doc":"docs/part-04/api_design__rest_apis__uri_design.md"},{"title":"Filtering","quote":"API filtering lets clients restrict results using explicit query parameters with validated fields and operators.","explanation":"","image":"images/part-04/api_design__rest_apis__filtering.png","doc":"docs/part-04/api_design__rest_apis__filtering.md"},{"title":"Partial updates","quote":"Partial updates change selected fields without replacing the full resource, commonly through PATCH.","explanation":"","image":"images/part-04/api_design__rest_apis__partial_updates.png","doc":"docs/part-04/api_design__rest_apis__partial_updates.md"},{"title":"ETags","quote":"An ETag is a response validator representing a resource version and supports caching and optimistic concurrency.","explanation":"","image":"images/part-04/api_design__rest_apis__etags.png","doc":"docs/part-04/api_design__rest_apis__etags.md"},{"title":"Conditional requests","quote":"Conditional requests use headers such as If-Match or If-None-Match to avoid unnecessary transfer or prevent conflicting updates.","explanation":"","image":"images/part-04/api_design__rest_apis__conditional_requests.png","doc":"docs/part-04/api_design__rest_apis__conditional_requests.md"},{"title":"Error response design","quote":"A good API error response includes a stable code, human-readable message, relevant details, correlation ID, and correct HTTP status.","explanation":"","image":"images/part-04/api_design__rest_apis__error_response_design.png","doc":"docs/part-04/api_design__rest_apis__error_response_design.md"}]},{"name":"API Reliability","topics":[{"title":"Rate limiting","quote":"Rate limiting controls how many requests an identity or client may send within a period to protect capacity and fairness.","explanation":"","image":"images/part-04/api_design__api_reliability__rate_limiting.png","doc":"docs/part-04/api_design__api_reliability__rate_limiting.md"},{"title":"Token bucket","quote":"Token bucket adds tokens at a steady rate and allows bursts up to the bucket capacity.","explanation":"","image":"images/part-04/api_design__api_reliability__token_bucket.png","doc":"docs/part-04/api_design__api_reliability__token_bucket.md"},{"title":"Leaky bucket","quote":"Leaky bucket smooths traffic by processing requests at a fixed rate while excess requests queue or overflow.","explanation":"","image":"images/part-04/api_design__api_reliability__leaky_bucket.png","doc":"docs/part-04/api_design__api_reliability__leaky_bucket.md"},{"title":"Fixed window","quote":"Fixed-window limiting counts requests in discrete time blocks and is simple but can allow bursts at window boundaries.","explanation":"","image":"images/part-04/api_design__api_reliability__fixed_window.png","doc":"docs/part-04/api_design__api_reliability__fixed_window.md"},{"title":"Sliding window","quote":"Sliding-window limiting measures activity over a moving time interval for smoother and more accurate enforcement.","explanation":"","image":"images/part-04/api_design__api_reliability__sliding_window.png","doc":"docs/part-04/api_design__api_reliability__sliding_window.md"},{"title":"Idempotency keys","quote":"An idempotency key identifies repeated requests so the server can return the original result instead of repeating side effects.","explanation":"","image":"images/part-04/api_design__api_reliability__idempotency_keys.png","doc":"docs/part-04/api_design__api_reliability__idempotency_keys.md"},{"title":"Retries with backoff","quote":"Retries with backoff wait progressively longer between attempts and should include jitter, limits, and idempotency.","explanation":"","image":"images/part-04/api_design__api_reliability__retries_with_backoff.png","doc":"docs/part-04/api_design__api_reliability__retries_with_backoff.md"},{"title":"Circuit breakers","quote":"Circuit breakers stop calls to an unhealthy dependency, fail fast, and later probe whether recovery has occurred.","explanation":"","image":"images/part-04/api_design__api_reliability__circuit_breakers.png","doc":"docs/part-04/api_design__api_reliability__circuit_breakers.md"},{"title":"Timeout budgets","quote":"A timeout budget divides an end-to-end deadline among downstream calls so one dependency cannot consume all available time.","explanation":"","image":"images/part-04/api_design__api_reliability__timeout_budgets.png","doc":"docs/part-04/api_design__api_reliability__timeout_budgets.md"},{"title":"Request correlation","quote":"Request correlation attaches a shared identifier to logs, traces, and downstream calls for one logical request.","explanation":"","image":"images/part-04/api_design__api_reliability__request_correlation.png","doc":"docs/part-04/api_design__api_reliability__request_correlation.md"},{"title":"API observability","quote":"API observability combines request metrics, logs, traces, errors, latency percentiles, saturation, and business outcomes.","explanation":"","image":"images/part-04/api_design__api_reliability__api_observability.png","doc":"docs/part-04/api_design__api_reliability__api_observability.md"},{"title":"API deprecation","quote":"API deprecation communicates that a contract will be retired and provides timelines, migration guidance, and usage monitoring.","explanation":"","image":"images/part-04/api_design__api_reliability__api_deprecation.png","doc":"docs/part-04/api_design__api_reliability__api_deprecation.md"}]}]},{"name":"System Design","groups":[{"name":"Core Building Blocks","topics":[{"title":"Load balancers","quote":"Load balancers distribute traffic across healthy service instances and may perform health checks, TLS termination, and routing.","explanation":"","image":"images/part-04/system_design__core_building_blocks__load_balancers.png","doc":"docs/part-04/system_design__core_building_blocks__load_balancers.md"},{"title":"Reverse proxies","quote":"A reverse proxy accepts client traffic and forwards it to backend services while hiding internal topology.","explanation":"","image":"images/part-04/system_design__core_building_blocks__reverse_proxies.png","doc":"docs/part-04/system_design__core_building_blocks__reverse_proxies.md"},{"title":"CDNs","quote":"A content-delivery network caches content at edge locations to reduce latency and origin load.","explanation":"","image":"images/part-04/system_design__core_building_blocks__cdns.png","doc":"docs/part-04/system_design__core_building_blocks__cdns.md"},{"title":"Caches","quote":"Caches store frequently used data closer to consumers to reduce latency and backend work.","explanation":"","image":"images/part-04/system_design__core_building_blocks__caches.png","doc":"docs/part-04/system_design__core_building_blocks__caches.md"},{"title":"Databases","quote":"Databases persist structured or unstructured data and provide querying, indexing, consistency, and durability guarantees.","explanation":"","image":"images/part-04/system_design__core_building_blocks__databases.png","doc":"docs/part-04/system_design__core_building_blocks__databases.md"},{"title":"Message queues","quote":"Message queues buffer work between producers and consumers, decoupling their availability and processing rates.","explanation":"","image":"images/part-04/system_design__core_building_blocks__message_queues.png","doc":"docs/part-04/system_design__core_building_blocks__message_queues.md"},{"title":"Object storage","quote":"Object storage keeps data as objects identified by keys and is optimized for durability, scale, and large unstructured content.","explanation":"","image":"images/part-04/system_design__core_building_blocks__object_storage.png","doc":"docs/part-04/system_design__core_building_blocks__object_storage.md"},{"title":"Search engines","quote":"Search engines build inverted indexes and ranking structures for fast full-text and analytical queries.","explanation":"","image":"images/part-04/system_design__core_building_blocks__search_engines.png","doc":"docs/part-04/system_design__core_building_blocks__search_engines.md"},{"title":"API gateways","quote":"API gateways provide a managed entry point for routing, authentication, rate limiting, transformation, and observability.","explanation":"","image":"images/part-04/system_design__core_building_blocks__api_gateways.png","doc":"docs/part-04/system_design__core_building_blocks__api_gateways.md"},{"title":"Configuration management","quote":"Configuration management keeps environment-specific settings controlled, versioned, validated, and separate from application binaries.","explanation":"","image":"images/part-04/system_design__core_building_blocks__configuration_management.png","doc":"docs/part-04/system_design__core_building_blocks__configuration_management.md"}]},{"name":"Caching","topics":[{"title":"Cache-aside","quote":"With cache-aside, the application reads the cache first, loads missing data from the database, and then populates the cache.","explanation":"","image":"images/part-04/system_design__caching__cache_aside.png","doc":"docs/part-04/system_design__caching__cache_aside.md"},{"title":"Read-through cache","quote":"A read-through cache loads missing values through a configured backing store so the application reads only from the cache interface.","explanation":"","image":"images/part-04/system_design__caching__read_through_cache.png","doc":"docs/part-04/system_design__caching__read_through_cache.md"},{"title":"Write-through cache","quote":"A write-through cache updates the cache and backing store in the same request path, keeping them consistent but adding write latency.","explanation":"","image":"images/part-04/system_design__caching__write_through_cache.png","doc":"docs/part-04/system_design__caching__write_through_cache.md"},{"title":"Write-behind cache","quote":"A write-behind cache updates the cache immediately and persists changes asynchronously, improving write speed but increasing durability and ordering complexity.","explanation":"","image":"images/part-04/system_design__caching__write_behind_cache.png","doc":"docs/part-04/system_design__caching__write_behind_cache.md"},{"title":"Cache invalidation","quote":"Cache invalidation removes or updates stale entries when underlying data changes. It is often the hardest part of caching.","explanation":"","image":"images/part-04/system_design__caching__cache_invalidation.png","doc":"docs/part-04/system_design__caching__cache_invalidation.md"},{"title":"TTL","quote":"Time to live defines how long a cached or stored item remains valid before expiring.","explanation":"","image":"images/part-04/system_design__caching__ttl.png","doc":"docs/part-04/system_design__caching__ttl.md"},{"title":"LRU eviction","quote":"Least Recently Used eviction removes the item that has gone unused for the longest time.","explanation":"","image":"images/part-04/system_design__caching__lru_eviction.png","doc":"docs/part-04/system_design__caching__lru_eviction.md"},{"title":"LFU eviction","quote":"Least Frequently Used eviction removes items with the lowest access frequency, often with recency used as a tie-breaker.","explanation":"","image":"images/part-04/system_design__caching__lfu_eviction.png","doc":"docs/part-04/system_design__caching__lfu_eviction.md"},{"title":"Cache stampede","quote":"A cache stampede occurs when many requests miss the same expired key and simultaneously overload the backing store.","explanation":"","image":"images/part-04/system_design__caching__cache_stampede.png","doc":"docs/part-04/system_design__caching__cache_stampede.md"},{"title":"Cache penetration","quote":"Cache penetration happens when repeated requests target missing data and bypass the cache every time. Negative caching or validation can reduce it.","explanation":"","image":"images/part-04/system_design__caching__cache_penetration.png","doc":"docs/part-04/system_design__caching__cache_penetration.md"},{"title":"Cache warming","quote":"Cache warming preloads likely-needed entries before traffic arrives or before an old cache is retired.","explanation":"","image":"images/part-04/system_design__caching__cache_warming.png","doc":"docs/part-04/system_design__caching__cache_warming.md"},{"title":"Distributed caching","quote":"A distributed cache shares cached data across multiple application instances and usually requires network access, partitioning, replication, and consistency choices.","explanation":"","image":"images/part-04/system_design__caching__distributed_caching.png","doc":"docs/part-04/system_design__caching__distributed_caching.md"},{"title":"Local vs distributed cache","quote":"A local cache is fastest but private to one process; a distributed cache is shared and consistent across instances but adds network latency and operational complexity.","explanation":"","image":"images/part-04/system_design__caching__local_vs_distributed_cache.png","doc":"docs/part-04/system_design__caching__local_vs_distributed_cache.md"}]},{"name":"Data Partitioning","topics":[{"title":"Horizontal partitioning","quote":"Horizontal partitioning splits rows across partitions based on a key or range.","explanation":"","image":"images/part-04/system_design__data_partitioning__horizontal_partitioning.png","doc":"docs/part-04/system_design__data_partitioning__horizontal_partitioning.md"},{"title":"Vertical partitioning","quote":"Vertical partitioning separates columns or functional groups into different tables, services, or stores.","explanation":"","image":"images/part-04/system_design__data_partitioning__vertical_partitioning.png","doc":"docs/part-04/system_design__data_partitioning__vertical_partitioning.md"},{"title":"Consistent hashing","quote":"Consistent hashing maps keys and nodes onto a ring so adding or removing nodes moves only a limited portion of keys.","explanation":"","image":"images/part-04/system_design__data_partitioning__consistent_hashing.png","doc":"docs/part-04/system_design__data_partitioning__consistent_hashing.md"},{"title":"Range partitioning","quote":"Range partitioning assigns contiguous key ranges to partitions and supports efficient range scans but may create hotspots.","explanation":"","image":"images/part-04/system_design__data_partitioning__range_partitioning.png","doc":"docs/part-04/system_design__data_partitioning__range_partitioning.md"},{"title":"Hash partitioning","quote":"Hash partitioning distributes records using a hash of the partition key, usually providing more even load.","explanation":"","image":"images/part-04/system_design__data_partitioning__hash_partitioning.png","doc":"docs/part-04/system_design__data_partitioning__hash_partitioning.md"},{"title":"Directory partitioning","quote":"Directory partitioning uses a lookup table or routing service that maps each key or tenant to its partition.","explanation":"","image":"images/part-04/system_design__data_partitioning__directory_partitioning.png","doc":"docs/part-04/system_design__data_partitioning__directory_partitioning.md"},{"title":"Rebalancing","quote":"Rebalancing redistributes data or work when nodes, capacity, or traffic patterns change.","explanation":"","image":"images/part-04/system_design__data_partitioning__rebalancing.png","doc":"docs/part-04/system_design__data_partitioning__rebalancing.md"},{"title":"Replication","quote":"Replication copies data to multiple nodes for availability, durability, read scaling, or geographic locality.","explanation":"","image":"images/part-04/system_design__data_partitioning__replication.png","doc":"docs/part-04/system_design__data_partitioning__replication.md"},{"title":"Leader-follower replication","quote":"Leader-follower replication sends writes to one leader and copies changes to follower replicas.","explanation":"","image":"images/part-04/system_design__data_partitioning__leader_follower_replication.png","doc":"docs/part-04/system_design__data_partitioning__leader_follower_replication.md"},{"title":"Multi-leader replication","quote":"Multi-leader replication allows writes on multiple leaders and therefore requires conflict handling.","explanation":"","image":"images/part-04/system_design__data_partitioning__multi_leader_replication.png","doc":"docs/part-04/system_design__data_partitioning__multi_leader_replication.md"},{"title":"Leaderless replication","quote":"Leaderless replication lets clients write to and read from multiple replicas using quorum-style coordination.","explanation":"","image":"images/part-04/system_design__data_partitioning__leaderless_replication.png","doc":"docs/part-04/system_design__data_partitioning__leaderless_replication.md"}]},{"name":"Reliability","topics":[{"title":"Redundancy","quote":"Redundancy duplicates critical components or data so one failure does not stop the service.","explanation":"","image":"images/part-04/system_design__reliability__redundancy.png","doc":"docs/part-04/system_design__reliability__redundancy.md"},{"title":"Health checks","quote":"Health checks determine whether an instance is alive, ready, or dependent on failing resources and should influence routing or recovery.","explanation":"","image":"images/part-04/system_design__reliability__health_checks.png","doc":"docs/part-04/system_design__reliability__health_checks.md"},{"title":"Bulkheads","quote":"Bulkheads isolate resource pools so failure or saturation in one dependency does not consume all system capacity.","explanation":"","image":"images/part-04/system_design__reliability__bulkheads.png","doc":"docs/part-04/system_design__reliability__bulkheads.md"},{"title":"Retries","quote":"Retries repeat transiently failed operations with limits, backoff, jitter, and idempotency.","explanation":"","image":"images/part-04/system_design__reliability__retries.png","doc":"docs/part-04/system_design__reliability__retries.md"},{"title":"Chaos testing","quote":"Chaos testing injects controlled failures to verify resilience assumptions and recovery behavior.","explanation":"","image":"images/part-04/system_design__reliability__chaos_testing.png","doc":"docs/part-04/system_design__reliability__chaos_testing.md"}]},{"name":"Case Studies","topics":[{"title":"Design a URL shortener","quote":"A URL shortener maps compact unique codes to long URLs. Core concerns are ID generation, redirects, storage, caching, expiration, analytics, and abuse prevention.","explanation":"","image":"images/part-04/system_design__case_studies__design_a_url_shortener.png","doc":"docs/part-04/system_design__case_studies__design_a_url_shortener.md"},{"title":"Design a rate limiter","quote":"A rate limiter tracks request allowance per identity or key using algorithms such as token bucket or sliding window, with fast shared state and clear rejection behavior.","explanation":"","image":"images/part-04/system_design__case_studies__design_a_rate_limiter.png","doc":"docs/part-04/system_design__case_studies__design_a_rate_limiter.md"},{"title":"Design a notification system","quote":"A notification system accepts events, applies user preferences and templates, routes across email, SMS, or push channels, retries failures, and tracks delivery status.","explanation":"","image":"images/part-04/system_design__case_studies__design_a_notification_system.png","doc":"docs/part-04/system_design__case_studies__design_a_notification_system.md"},{"title":"Design a chat system","quote":"A chat system needs low-latency bidirectional communication, message ordering, durable history, presence, fanout, offline delivery, and scalable connection management.","explanation":"","image":"images/part-04/system_design__case_studies__design_a_chat_system.png","doc":"docs/part-04/system_design__case_studies__design_a_chat_system.md"},{"title":"Design a file storage service","quote":"A file storage service separates metadata from object data and needs multipart upload, durability, access control, versioning, checksums, replication, and content delivery.","explanation":"","image":"images/part-04/system_design__case_studies__design_a_file_storage_service.png","doc":"docs/part-04/system_design__case_studies__design_a_file_storage_service.md"},{"title":"Design a search autocomplete","quote":"Autocomplete serves low-latency prefix suggestions using tries, indexes, ranking signals, caching, popularity updates, and typo handling.","explanation":"","image":"images/part-04/system_design__case_studies__design_a_search_autocomplete.png","doc":"docs/part-04/system_design__case_studies__design_a_search_autocomplete.md"},{"title":"Design an API gateway","quote":"An API gateway centralizes routing, authentication, rate limiting, transformation, observability, and resilience while avoiding a single bottleneck.","explanation":"","image":"images/part-04/system_design__case_studies__design_an_api_gateway.png","doc":"docs/part-04/system_design__case_studies__design_an_api_gateway.md"},{"title":"Design a distributed cache","quote":"A distributed cache partitions keys across nodes, replicates important data, handles eviction and expiration, and manages consistency and rebalancing.","explanation":"","image":"images/part-04/system_design__case_studies__design_a_distributed_cache.png","doc":"docs/part-04/system_design__case_studies__design_a_distributed_cache.md"},{"title":"Design a job scheduler","quote":"A job scheduler stores schedules and state, elects or coordinates workers, dispatches tasks once or idempotently, retries failures, and handles misfires.","explanation":"","image":"images/part-04/system_design__case_studies__design_a_job_scheduler.png","doc":"docs/part-04/system_design__case_studies__design_a_job_scheduler.md"},{"title":"Design a payment system","quote":"A payment system prioritizes correctness, idempotency, ledger integrity, authorization, settlement, reconciliation, retries, fraud controls, and auditability.","explanation":"","image":"images/part-04/system_design__case_studies__design_a_payment_system.png","doc":"docs/part-04/system_design__case_studies__design_a_payment_system.md"},{"title":"Design an order management system","quote":"An order system coordinates cart, pricing, inventory, payment, fulfillment, state transitions, events, and compensation across failures.","explanation":"","image":"images/part-04/system_design__case_studies__design_an_order_management_system.png","doc":"docs/part-04/system_design__case_studies__design_an_order_management_system.md"},{"title":"Design an SMS delivery platform","quote":"An SMS platform buffers spikes, applies provider and tenant rate limits, selects routes, retries transient failures, deduplicates messages, and tracks delivery receipts.","explanation":"","image":"images/part-04/system_design__case_studies__design_an_sms_delivery_platform.png","doc":"docs/part-04/system_design__case_studies__design_an_sms_delivery_platform.md"},{"title":"Design a log aggregation system","quote":"A log platform collects, buffers, parses, indexes, stores, searches, and retains high-volume logs while controlling cost and backpressure.","explanation":"","image":"images/part-04/system_design__case_studies__design_a_log_aggregation_system.png","doc":"docs/part-04/system_design__case_studies__design_a_log_aggregation_system.md"},{"title":"Design a metrics platform","quote":"A metrics platform ingests labeled time-series data, aggregates and stores it efficiently, evaluates alerts, and supports dashboards and queries.","explanation":"","image":"images/part-04/system_design__case_studies__design_a_metrics_platform.png","doc":"docs/part-04/system_design__case_studies__design_a_metrics_platform.md"},{"title":"Design a news feed","quote":"A news feed ranks and delivers personalized content using fanout-on-write, fanout-on-read, caching, pagination, and freshness or relevance signals.","explanation":"","image":"images/part-04/system_design__case_studies__design_a_news_feed.png","doc":"docs/part-04/system_design__case_studies__design_a_news_feed.md"},{"title":"Design a ticket booking system","quote":"A ticket booking system must prevent overselling through holds, expirations, concurrency control, idempotent payment, and clear reservation state transitions.","explanation":"","image":"images/part-04/system_design__case_studies__design_a_ticket_booking_system.png","doc":"docs/part-04/system_design__case_studies__design_a_ticket_booking_system.md"}]}]},{"name":"Engineering Tools","groups":[{"name":"Git","topics":[{"title":"Git object model","quote":"Git stores immutable blobs, trees, commits, and annotated tags addressed by content hashes.","explanation":"","image":"images/part-04/engineering_tools__git__git_object_model.png","doc":"docs/part-04/engineering_tools__git__git_object_model.md"},{"title":"Working tree","quote":"The working tree is the checked-out filesystem view where files are edited.","explanation":"","image":"images/part-04/engineering_tools__git__working_tree.png","doc":"docs/part-04/engineering_tools__git__working_tree.md"},{"title":"Staging area","quote":"The staging area, or index, records the exact content that will become the next commit.","explanation":"","image":"images/part-04/engineering_tools__git__staging_area.png","doc":"docs/part-04/engineering_tools__git__staging_area.md"},{"title":"Commits","quote":"A Git commit points to a tree snapshot, parent commits, author metadata, and a message.","explanation":"","image":"images/part-04/engineering_tools__git__commits.png","doc":"docs/part-04/engineering_tools__git__commits.md"},{"title":"Branches","quote":"A Git branch is a movable reference to a commit and advances as new commits are created.","explanation":"","image":"images/part-04/engineering_tools__git__branches.png","doc":"docs/part-04/engineering_tools__git__branches.md"},{"title":"Merge","quote":"Merge combines histories and may create a merge commit when branches have diverged.","explanation":"","image":"images/part-04/engineering_tools__git__merge.png","doc":"docs/part-04/engineering_tools__git__merge.md"},{"title":"Rebase","quote":"Rebase rewrites commits onto a new base to create a linear history. Avoid rebasing shared public history.","explanation":"","image":"images/part-04/engineering_tools__git__rebase.png","doc":"docs/part-04/engineering_tools__git__rebase.md"},{"title":"Cherry-pick","quote":"Cherry-pick applies the change introduced by selected commits onto the current branch.","explanation":"","image":"images/part-04/engineering_tools__git__cherry_pick.png","doc":"docs/part-04/engineering_tools__git__cherry_pick.md"},{"title":"Reset","quote":"git reset moves a branch reference and can also update the staging area and working tree depending on soft, mixed, or hard mode.","explanation":"","image":"images/part-04/engineering_tools__git__reset.png","doc":"docs/part-04/engineering_tools__git__reset.md"},{"title":"Revert","quote":"git revert creates a new commit that undoes the effect of an earlier commit without rewriting history.","explanation":"","image":"images/part-04/engineering_tools__git__revert.png","doc":"docs/part-04/engineering_tools__git__revert.md"},{"title":"Stash","quote":"git stash temporarily saves uncommitted working-tree and index changes so the branch can be cleaned.","explanation":"","image":"images/part-04/engineering_tools__git__stash.png","doc":"docs/part-04/engineering_tools__git__stash.md"},{"title":"Tags","quote":"Git tags are stable references commonly used to mark releases. Annotated tags include metadata and can be signed.","explanation":"","image":"images/part-04/engineering_tools__git__tags.png","doc":"docs/part-04/engineering_tools__git__tags.md"},{"title":"Remote tracking branches","quote":"Remote-tracking branches record the last known positions of branches in a remote repository, such as origin/main.","explanation":"","image":"images/part-04/engineering_tools__git__remote_tracking_branches.png","doc":"docs/part-04/engineering_tools__git__remote_tracking_branches.md"},{"title":"Pull requests","quote":"A pull request proposes branch changes for review, discussion, automated checks, and controlled merge.","explanation":"","image":"images/part-04/engineering_tools__git__pull_requests.png","doc":"docs/part-04/engineering_tools__git__pull_requests.md"},{"title":"Merge conflicts","quote":"A merge conflict occurs when Git cannot automatically reconcile overlapping changes and requires human resolution.","explanation":"","image":"images/part-04/engineering_tools__git__merge_conflicts.png","doc":"docs/part-04/engineering_tools__git__merge_conflicts.md"},{"title":"Git hooks","quote":"Git hooks are scripts triggered by repository events such as commit, push, or receive and can enforce local or server-side checks.","explanation":"","image":"images/part-04/engineering_tools__git__git_hooks.png","doc":"docs/part-04/engineering_tools__git__git_hooks.md"},{"title":"Trunk-based development","quote":"Trunk-based development uses one main branch with frequent small integrations and short-lived branches.","exp
