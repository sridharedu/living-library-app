function clone(value){return JSON.parse(JSON.stringify(value))}
function storageKey(){
  return `livingLibrary.snapshot.${EMBEDDED_LIBRARY_ID}`;
}

function loadLibrary(){
  try{
    // Clean up any stale snapshot keys from localStorage
    for(let i=localStorage.length-1; i>=0; i--){
      const k=localStorage.key(i);
      if(k && k.startsWith('livingLibrary.snapshot.') && k !== storageKey()){
        localStorage.removeItem(k);
      }
    }

    const saved=localStorage.getItem(storageKey());
    if(!saved)return clone(INITIAL_LIBRARY);

    const payload=JSON.parse(saved);

    if(
      payload &&
      payload.embeddedId===EMBEDDED_LIBRARY_ID &&
      Array.isArray(payload.library)
    ){
      // Verify payload doesn't contain stale unparsed HTML template
      const sample = payload.library[0]?.groups[0]?.topics[0]?.explanation || '';
      if(!sample.includes('offline-rich-explanation')){
        return payload.library;
      }
    }
  }catch(error){}

  return clone(INITIAL_LIBRARY);
}

function slugify(val){
  return String(val||'')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, '_')
    .replace(/^_+|_+$/g, '');
}

function getTopicMdFileName(section, group, topic){
  const sSlug = slugify(section && section.name ? section.name : section);
  const gSlug = slugify(group && group.name ? group.name : group);
  const tSlug = slugify(topic && topic.title ? topic.title : topic);
  return `${sSlug}__${gSlug}__${tSlug}.md`;
}
function getTopicImagePath(section, group, topic){
  if(topic && topic.image) return topic.image;
  const sSlug = slugify(section && section.name ? section.name : section);
  const gSlug = slugify(group && group.name ? group.name : group);
  const tSlug = slugify(topic && topic.title ? topic.title : topic);
  return `images/${sSlug}__${gSlug}__${tSlug}.png`;
}

function formatDownloadVersion(
  stable=stableVersion,
  revision=downloadVersion
){
  const padded=String(revision).padStart(3,'0');
  return stable>0?`V${stable}.${padded}`:`V.${padded}`;
}

function syncDownloadStatus(){
  const version=formatDownloadVersion();
  const desktop=$('download');
  const mobile=$('mobileDownload');

  for(const button of [desktop,mobile]){
    if(!button)continue;
    button.classList.toggle('download-pending',downloadPending);
    button.classList.toggle('download-current',!downloadPending);
  }

  const desktopVersion=$('downloadVersion');
  const mobileVersion=$('mobileDownloadVersion');

  if(desktopVersion)desktopVersion.textContent=version;
  if(mobileVersion)mobileVersion.textContent=version;

  const status=downloadPending
    ?`${version} has saved changes waiting for download`
    :`Downloaded through ${version}`;

  if(desktop){
    desktop.title=status;
    desktop.setAttribute('aria-label',status);
  }

  if(mobile){
    mobile.title=status;
    mobile.setAttribute('aria-label',status);
  }
}

function markContentRevisionSaved(){
  downloadVersion+=1;
  downloadPending=true;
  syncDownloadStatus();
  return formatDownloadVersion();
}

function promoteStableVersion(){
  stableVersion+=1;
  downloadVersion=1;
  downloadPending=true;
  syncDownloadStatus();
  showToast(`${formatDownloadVersion()} prepared as the next stable version.`);
}

function markDownloadComplete(){
  downloadPending=false;
  syncDownloadStatus();
  return formatDownloadVersion();
}

function persist(){
  try{
    localStorage.setItem(
      storageKey(),
      JSON.stringify({
        embeddedId:EMBEDDED_LIBRARY_ID,
        library

    );
    return true;
  }catch(error){

}

function collectAllVisibleKeys(){
  const sectionKeys=[];
  const groupKeys=[];

  tree.querySelectorAll('.section').forEach(section=>{

  });

  tree.querySelectorAll('.group').forEach(group=>{
    groupKeys.push(group.dataset.group.replace('-',':'));
  });

  return {sectionKeys,groupKeys};
}

function setAllExpansion(expand){
  const sectionState=currentSectionState();
  const groupState=currentGroupState();
  const {sectionKeys,groupKeys}=collectAllVisibleKeys();

  sectionState.clear();
  groupState.clear();

  if(expand){
    sectionKeys.forEach(key=>sectionState.add(key));
    groupKeys.forEach(key=>groupState.add(key));
  }

  tree.querySelectorAll('.section').forEach(section=>{
    section.classList.toggle('open', expand);
  });
  tree.querySelectorAll('.group').forEach(group=>{
    group.classList.toggle('open', expand);
  });

  syncExpandToggle();
}

function areAnyVisibleElementsClosed(){

function syncExpandToggle(){
  const shouldExpand=areAnyVisibleElementsClosed();
  const icon=shouldExpand?'□':'−';
  const label=shouldExpand?'Expand all':'Collapse all';

  for(const id of ['expandToggle','mobileExpandToggle']){
    const button=$(id);
    if(!button)continue;
    button.textContent=icon;
    button.title=label;
    button.setAttribute('aria-label',label);
  }
}

function toggleAllExpansion(){

}

function initialiseNormalExpansion(){
  normalExpandedSections.clear();
  normalExpandedGroups.clear();

  library.forEach((section,s)=>{
    normalExpandedSections.add(sectionKey(s));
    section.groups.forEach((group,g)=>{
      normalExpandedGroups.add(groupKey(s,g));
    });
  });
}

function getTopicSearchData(topic){
  if(!topic._lcSearch){
    topic._lcTitle = (topic.title || '').toLowerCase();
    topic._lcSearch = ((topic.title || '') + ' ' + (topic.explanation || '')).toLowerCase();
    topic._hasSection = hasSectionExplanation(topic.explanation);
  }
  return topic;
}

function buildSearchExpansionState(query){
  searchExpandedSections.clear();
  searchExpandedGroups.clear();

  library.forEach((section,s)=>{
    const sName = section._lcName || (section._lcName = section.name.toLowerCase());
    const sectionMatch = sName.includes(query);

    section.groups.forEach((group,g)=>{
      const gName = group._lcName || (group._lcName = group.name.toLowerCase());
      const groupMatch = gName.includes(query);
      const hasTopicMatch = group.topics.some(topic=>{
        if(sectionMatch || groupMatch) return true;
        const d = getTopicSearchData(topic);
        return d._lcTitle.includes(query) || d._lcSearch.includes(query);
      });

      if(hasTopicMatch){
        searchExpandedSections.add(sectionKey(s));
        searchExpandedGroups.add(groupKey(s,g));
      }
    });
  });
}

const contextThemes=new Map();
let activeContextKey='';
let lastContextPalette=-1;

function rgbaFromHex(hex,alpha){
  const value=hex.replace('#','');
  const number=parseInt(value,16);
  const red=(number>>16)&255;
  const green=(number>>8)&255;
  const blue=number&255;
  return `rgba(${red},${green},${blue},${alpha})`;
}

function contextKey(ref){
  const section=library[ref.s];
  const group=section?.groups?.[ref.g];
  return `${section?.name||ref.s}::${group?.name||ref.g}`;
}

function chooseContextPalette(key){
  if(contextThemes.has(key))return contextThemes.get(key);

  let index=Math.floor(Math.random()*CONTEXT_GRADIENTS.length);
  if(CONTEXT_GRADIENTS.length>1&&index===lastContextPalette){
    index=(index+1+Math.floor(
      Math.random()*(CONTEXT_GRADIENTS.length-1)
    ))%CONTEXT_GRADIENTS.length;
  }

  lastContextPalette=index;
  contextThemes.set(key,index);
  return index;
}

function applyContextTheme(ref){
  const key=contextKey(ref);
  if(key===activeContextKey)return;

  activeContextKey=key;
  const palette=CONTEXT_GRADIENTS[chooseContextPalette(key)];
  const root=document.documentElement;

  root.style.setProperty('--ctx-a',palette[0]);
  root.style.setProperty('--ctx-b',palette[1]);
  root.style.setProperty('--ctx-c',palette[2]);
  root.style.setProperty('--ctx-ink',palette[3]);
  root.style.setProperty('--ctx-soft-a',rgbaFromHex(palette[0],.18));
  root.style.setProperty('--ctx-soft-b',rgbaFromHex(palette[1],.15));
  root.style.setProperty('--ctx-soft-c',rgbaFromHex(palette[2],.13));

  // Very light paper washes preserve article readability.
  root.style.setProperty('--ctx-paper-a',rgbaFromHex(palette[0],.075));
  root.style.setProperty('--ctx-paper-b',rgbaFromHex(palette[1],.055));
  root.style.setProperty('--ctx-paper-c',rgbaFromHex(palette[2],.045));
  document.body.classList.add('context-themed');
}

function renderTree(){
  const q=search.value.trim().toLowerCase();
  const searching=Boolean(q);

  if(searching && !searchWasActive){
    buildSearchExpansionState(q);
    searchWasActive=true;
  }else if(searching){
    buildSearchExpansionState(q);
  }else if(searchWasActive){
    searchExpandedSections.clear();
    searchExpandedGroups.clear();
    searchWasActive=false;
  }

  const sectionState=searching?searchExpandedSections:normalExpandedSections;
  const groupState=searching?searchExpandedGroups:normalExpandedGroups;

  const html=[];

  library.forEach((section,s)=>{
    const sName = section._lcName || (section._lcName = section.name.toLowerCase());
    const sectionMatch = sName.includes(q);
    const groupsHtml=[];
    let visibleSection=false;

    section.groups.forEach((group,g)=>{
      const gName = group._lcName || (group._lcName = group.name.toLowerCase());
      const groupMatch = gName.includes(q);
      const topicsHtml=[];
      let visibleGroup=false;

      group.topics.forEach((topic,ti)=>{
        const d = getTopicSearchData(topic);
        const match=
          !q ||
          sectionMatch ||
          groupMatch ||
          d._lcTitle.includes(q) ||
          d._lcSearch.includes(q);

        if(!match)return;

        visibleGroup=true;
        visibleSection=true;

        const activeClass=
          active&&active.s===s&&active.g===g&&active.t===ti
            ? ' active'
            : '';
        const incompleteClass=d._hasSection
          ? ''
          : ' incomplete';
        const statusLabel=incompleteClass
          ? ' — explanation pending'
          : '';

        topicsHtml.push(`<button class="topic${activeClass}${incompleteClass}"
          data-s="${s}" data-g="${g}" data-t="${ti}"
          data-explanation-status="${incompleteClass?'pending':'complete'}"
          title="${esc(topic.title+statusLabel)}"
          aria-label="${esc(topic.title+statusLabel)}">${esc(topic.title)}</button>`);
      });

      if(!visibleGroup&&q)return;

      const gKey=groupKey(s,g);
      const groupOpen=groupState.has(gKey);

      groupsHtml.push(`<div class="group${groupOpen?' open':''}${active&&active.s===s&&active.g===g?' context-active':''}" data-group="${s}-${g}">
        <div class="group-row">
          <button class="group-head" data-toggle-group="${s}-${g}">
            <span class="chev">▶</span><span>${esc(group.name)}</span>
            <span class="count">${group.topics.length}</span>
          </button>
          <button class="tree-add-btn" data-add-topic="${s}-${g}" title="Add topic to ${esc(group.name)}" aria-label="Add topic" type="button">＋</button>
        </div>
        <div class="group-topics">${topicsHtml.join('')}</div>
      </div>`);
    });

    if(!visibleSection&&q)return;

    const sKey=sectionKey(s);
    const sectionOpen=sectionState.has(sKey);

    html.push(`<section class="section${sectionOpen?' open':''}${active&&active.s===s?' context-active':''}" data-section="${s}">
      <div class="section-row">
        <button class="section-head" data-toggle-section="${s}">
          <span class="chev">▶</span><span>${esc(section.name)}</span>
          <span class="count">${
            section.groups.reduce((n,g)=>n+g.topics.length,0)
          }</span>
        </button>
        <button class="tree-add-btn" data-add-group="${s}" title="Add group to ${esc(section.name)}" aria-label="Add group" type="button">＋</button>
      </div>
      <div class="section-body">${groupsHtml.join('')}</div>
    </section>`);
  });

  tree.innerHTML=
    html.join('') ||
    '<p style="padding:16px;color:#778287">No matching topics.</p>';

  $('topicCount').textContent=`· ${totalTopics()}`;
  syncExpandToggle();
}

function allTopicRefs(){
  const refs=[];
  library.forEach((section,s)=>section.groups.forEach((group,g)=>
    group.topics.forEach((topic,ti)=>refs.push({s,g,t:ti}))
  ));
  return refs;
}

function openTopic(ref){
  if(editing){
    showToast('Save or cancel the edit first.');
    return;
  }

  const topic=topicAt(ref);
  if(!topic)return;

  active={...ref};
  applyContextTheme(ref);
  const section=library[ref.s];
  const group=section.groups[ref.g];

  title.textContent=topic.title;
  breadcrumb.textContent=`${section.name}  ›  ${group.name}`;

  // Deterministic paths - strictly disk-based from images/ and docs/ (with 500-file part folders)
  const sSlug = slugify(section.name);
  const gSlug = slugify(group.name);
  const tSlug = slugify(topic.title);
  const imageFileName = `${sSlug}__${gSlug}__${tSlug}.png`;
  const mdFileName = `${sSlug}__${gSlug}__${tSlug}.md`;

  const globalIdx = allTopicRefs().findIndex(r => r.s === ref.s && r.g === ref.g && r.t === ref.t);
  const partName = globalIdx >= 0 ? `part-${String(Math.floor(globalIdx / 500) + 1).padStart(2, '0')}` : 'part-01';

  const partImagePath = `images/${partName}/${imageFileName}`;
  const rootImagePath = `images/${imageFileName}`;
  const imagePath = topic.image || partImagePath;

  const quote = getTopicQuote(topic);
  const expl = getTopicExplanation(topic);

  // Component 1: Original Quote Stage (Rendered at top - Mandatory)
  const quoteStage = `
    <div class="topic-quote-stage">
      <blockquote class="topic-quote">
        <strong>${esc(quote)}</strong>
      </blockquote>
    </div>
  `;

  // Component 2: Reference Diagram Stage (In middle)
  // Auto-loaded from images/. If not available on disk, it is NOT rendered!
  const diagramStage = `
    <div class="topic-diagram-stage">
      <div class="diagram-meta">
        <div class="diagram-meta-left">
          <span class="diagram-tag">📐 CHALKBOARD REFERENCE DIAGRAM</span>
        </div>
        <div class="diagram-meta-right">
          <button class="btn-copy-filename" type="button" data-copy-filename="${esc(imageFileName)}" title="Click to copy exact image filename">

        </div>

      <div class="diagram-frame" data-lightbox-src="${esc(imagePath)}" title="Click to view full-screen diagram">
        <img class="diagram-img" src="${esc(imagePath)}" data-fallback-src="${esc(rootImagePath)}" alt="${esc(topic.title)} diagram" loading="lazy" decoding="async" onerror="if(!this.dataset.triedFallback && this.dataset.fallbackSrc){this.dataset.triedFallback='true'; this.src=this.dataset.fallbackSrc;}else{this.onerror=null; const stage=this.closest('.topic-diagram-stage'); if(stage) stage.style.display='none';}">
        <div class="diagram-overlay">
          <span>🔍 Click to expand full-screen</span>
        </div>
      </div>
      <div class="diagram-caption">
        <strong>Disk File:</strong> <code>living-library/${esc(imagePath)}</code>
        <span class="diagram-hint">— Auto-loaded from <code>${esc(partName)}/</code> (max 500 files/folder).</span>
      </div>
    </div>
  `;

  // Component 3: Explanation & Notes Stage (Rendered at bottom)
  // Blank initially; when blank it will NOT be rendered!
  const explanationStage = expl ? `
    <div class="topic-explanation-stage md-doc-container">
      <div class="md-doc-header">
        <div class="md-doc-meta">
          <span class="md-icon">📝</span>
          <span class="md-doc-tag">EXPLANATION & NOTES</span>
          <span class="md-doc-filename">${esc(partName)}/${esc(mdFileName)}</span>
        </div>
        <div class="md-tab-group">
          <button class="md-tab-btn active" type="button" id="tabDocPreview">Document View</button>
          <button class="md-tab-btn" type="button" id="tabDocSource">Markdown Source</button>
        </div>
        <div class="md-doc-actions">
          <button class="md-action-btn" type="button" id="inlineExportMd" title="Export as standalone .md file">
            📥 Export .md
          </button>
          <button class="md-action-btn" type="button" id="inlineEditMd" title="Edit Markdown text">
            ✎ Edit
          </button>
        </div>
      </div>
      <div class="md-doc-body" id="mdRenderedBody">
        ${parseMd(expl)}
      </div>

        <textarea class="md-source-textarea" readonly id="mdSourceText" aria-label="Markdown Source">${esc(expl)}</textarea>

  ` : `

        ✎ Add Explanation / Notes

  content.innerHTML = quoteStage + diagramStage + explanationStage;

  if(!isSearchActive()){

  }else{
    searchExpandedSections.add(sectionKey(ref.s));
    searchExpandedGroups.add(groupKey(ref.s,ref.g));
  }

  updateActiveInTree(ref);
  renderExplore();
  if(window.matchMedia('(max-width:1024px)').matches){

function updateActiveInTree(ref){
  const targetTopic = tree.querySelector(`.topic[data-s="${ref.s}"][data-g="${ref.g}"][data-t="${ref.t}"]`);
  if(!targetTopic){
    renderTree();
    revealActive();
    return;
  }

  const prevActive = tree.querySelector('.topic.active');
  if(prevActive && prevActive !== targetTopic){
    prevActive.classList.remove('active');
  }
  targetTopic.classList.add('active');

  tree.querySelectorAll('.section.context-active, .group.context-active').forEach(el=>{
    el.classList.remove('context-active');
  });

  if(!isSearchActive()){
    tree.querySelectorAll('.section.open').forEach(el=>{
      if(el.dataset.section !== String(ref.s)){
        el.classList.remove('open');
      }
    });
  }

  const sectionEl = tree.querySelector(`[data-section="${ref.s}"]`);
  const groupEl = tree.querySelector(`[data-group="${ref.s}-${ref.g}"]`);

  if(sectionEl){
    sectionEl.classList.add('open', 'context-active');
  }
  if(groupEl){
    groupEl.classList.add('open', 'context-active');
  }

  syncExpandToggle();

  requestAnimationFrame(()=>{
    targetTopic.scrollIntoView({block:'nearest'});
  });
}

function moveTopic(step){
  if(editing){
    showToast('Save or cancel the edit first.');
    return;
  }

  const refs=allTopicRefs();
  if(!refs.length)return;

  let index=active
    ? refs.findIndex(ref=>keyOf(ref)===keyOf(active))
    : -1;

  index=(index+step+refs.length)%refs.length;
  openTopic(refs[index]);
}

function focusVisibleTopic(step){
  const topics=[...tree.querySelectorAll('.topic')];
  if(!topics.length)return;

  let index=topics.findIndex(item=>item.classList.contains('keyboard-focus'));
  if(index<0){
    index=topics.findIndex(item=>item.classList.contains('active'));
  }

  index=(index+step+topics.length)%topics.length;

  topics.forEach(item=>item.classList.remove('keyboard-focus'));
  const next=topics[index];
  next.classList.add('keyboard-focus');
  next.focus({preventScroll:true});
  next.scrollIntoView({block:'nearest'});
}

function revealActive(){
  if(!active)return;

  const sectionState=currentSectionState();
  const groupState=currentGroupState();

  if(!isSearchActive()){
    sectionState.clear();
  }

  sectionState.add(sectionKey(active.s));
  groupState.add(groupKey(active.s,active.g));

  const section=tree.querySelector(`[data-section="${active.s}"]`);
  const group=tree.querySelector(`[data-group="${active.s}-${active.g}"]`);

  section?.classList.add('open');
  group?.classList.add('open');

  requestAnimationFrame(()=>{
    tree.querySelector('.topic.active')?.scrollIntoView({block:'center'});
    syncExpandToggle();
  });
}

tree.addEventListener('click',event=>{
  const addTopicBtn = event.target.closest('[data-add-topic]');
  if(addTopicBtn){
    event.stopPropagation();
    const parts = addTopicBtn.dataset.addTopic.split('-');
    quickAddTopic(+parts[0], +parts[1]);
    return;
  }

  const addGroupBtn = event.target.closest('[data-add-group]');
  if(addGroupBtn){
    event.stopPropagation();
    quickAddGroup(+addGroupBtn.dataset.addGroup);
    return;
  }

  const topic=event.target.closest('.topic');

  if(topic){
    openTopic({
      s:+topic.dataset.s,
      g:+topic.dataset.g,
      t:+topic.dataset.t
    });
    return;
  }

  const sectionButton=event.target.closest('[data-toggle-section]');

  if(sectionButton){
    const sectionIndex=sectionButton.dataset.toggleSection;
    const state=currentSectionState();
    const key=sectionKey(sectionIndex);
    const opening=!state.has(key);

    if(!isSearchActive() && opening){
      state.clear();
      tree.querySelectorAll('.section.open').forEach(el=>{
        if(el.dataset.section !== String(sectionIndex)) el.classList.remove('open');
      });
    }

    if(opening){
      state.add(key);
    }else{
      state.delete(key);
    }

    const sectionEl = tree.querySelector(`[data-section="${sectionIndex}"]`);
    if(sectionEl){
      sectionEl.classList.toggle('open', opening);
    }
    syncExpandToggle();
    return;
  }

  const groupButton=event.target.closest('[data-toggle-group]');

  if(groupButton){
    const [s,g]=groupButton.dataset.toggleGroup.split('-');
    const state=currentGroupState();
    const key=groupKey(s,g);
    const opening=!state.has(key);

    if(!opening){
      state.delete(key);
    }else{
      state.add(key);
      currentSectionState().add(sectionKey(s));
      const sectionEl = tree.querySelector(`[data-section="${s}"]`);
      if(sectionEl) sectionEl.classList.add('open');
    }

    const groupEl = tree.querySelector(`[data-group="${s}-${g}"]`);
    if(groupEl){
      groupEl.classList.toggle('open', opening);
    }
    syncExpandToggle();
    return;
  }
});

async function beginClipboardEdit(){
  if(editing){
    cancelEdit();
    return false;
  }

  if(!active)return false;

  const topic=topicAt(active);
  if(!topic)return false;

  /*
   * Read the clipboard only after the user explicitly clicks Edit.
   * Browsers permit this most reliably from a direct user gesture.
   */
  if(navigator.clipboard?.readText && window.isSecureContext){
    try{
      const clipboardText=await navigator.clipboard.readText();
      enterEditorWithText(topic,clipboardText);

      showToast(
        clipboardText
          ?'Clipboard replaced the explanation. Save or cancel.'
          :'Clipboard was empty. Save to clear, or cancel.'
      );

      return true;
    }catch(error){}
  }

  /*
   * Fallback for local files and browsers that block clipboard.readText:
   * open the editor, select the current content, and wait for one paste.
   * The user can paste directly without losing the original until Save.
   */
  originalEdit=topic.explanation||'';
  editor.value=originalEdit;
  editing=true;
  dirty=false;
  syncEditControls();

  requestAnimationFrame(()=>{
    editor.focus();
    editor.select();
  });

  const pasteHandler=event=>{
    const pasted=event.clipboardData?.getData('text/plain');

    if(typeof pasted==='string'){
      event.preventDefault();
      editor.value=pasted;
      dirty=editor.value!==originalEdit;
      syncEditControls();
      showToast('Clipboard replaced the explanation. Save or cancel.');
    }

    editor.removeEventListener('paste',pasteHandler);
  };

  editor.addEventListener('paste',pasteHandler);
  showToast('Paste now. The existing explanation is selected.');

  return true;
}

/* Used only by Add Topic after creating a blank explanation. */
// ── Pure Clipboard-First Editor ─────────────────────────────
async function beginEdit(){
  if(!active) return;
  const topic = topicAt(active);
  if(!topic) return;

  let textToLoad = '';

  // 1. Read clipboard automatically on Edit click
  if(navigator.clipboard && navigator.clipboard.readText){
    try {
      const clip = await navigator.clipboard.readText();
      if(clip && typeof clip === 'string'){
        textToLoad = clip;
      }
    } catch(err) {
      // Clipboard permission blocked or empty
    }
  }

  // 2. Edit should paste whatever is in clipboard. If nothing, blank screen.
  editor.value = textToLoad;

  // 3. Save button is immediately enabled
  editing = true;
  dirty = true;
  syncEditControls();

  requestAnimationFrame(() => {
    editor.focus();
    if(editor.value){
      editor.select();
    }
  });

  if(textToLoad){
    showToast('Clipboard content pasted. Save button enabled.');
  } else {
    showToast('Blank screen ready. Long-press to paste or type, then Save.');
  }
}

function cancelEdit(){
  if(!editing) return;
  editing = false;
  dirty = false;
  editor.value = '';
  syncEditControls();
  showToast('Edit cancelled.');
}

function saveEdit(){
  if(!editing || !active) return;
  const topic = topicAt(active);
  if(!topic) return;

  // Save the text box content directly as the topic's explanation
  const nextExpl = editor.value.trim();
  topic.explanation = nextExpl;

  // Quote and image remain 100% fixed & untouched!
  delete topic._lcSearch;
  delete topic._hasSection;
  delete topic._lcTokens;

  persist();
  markContentRevisionSaved();

  editing = false;
  dirty = false;
  syncEditControls();

  renderTree();
  openTopic(active);
  showToast('✓ Saved!');
}

async function handleOutsideEdit(){
  if(editing){
    cancelEdit();
    return;
  }
  await beginEdit();
}

document.addEventListener('pointerdown',event=>{
  if(!editing)return;

  if(event.target.closest(
    '#editor,#mode,#mobileMode,#saveMenu,#mobileSave,#deleteBtn'
  ))return;

  event.preventDefault();
  event.stopImmediatePropagation();
  showToast('Save, cancel, or delete this topic first.');
},true);
document.addEventListener('keydown',event=>{
  const interactive=event.target.closest('input,textarea,select,[contenteditable="true"]');
  if(event.key==='Escape'&&editing){event.preventDefault();cancelEdit();return}
  if((event.ctrlKey||event.metaKey)&&event.key.toLowerCase()==='s'&&editing){
    event.preventDefault();saveEdit();return;
  }
  if(interactive||editing)return;
  if(document.body.classList.contains('map-open')&&
     window.matchMedia('(max-width:1024px) and (orientation:portrait)').matches){
    if(event.key==='ArrowDown'){event.preventDefault();focusVisibleTopic(1);return}
    if(event.key==='ArrowUp'){event.preventDefault();focusVisibleTopic(-1);return}
    if(event.key==='Enter'){
      const focused=tree.querySelector('.topic.keyboard-focus');
      if(focused){
        event.preventDefault();
        openTopic({s:+focused.dataset.s,g:+focused.dataset.g,t:+focused.dataset.t});
      }
      return;
    }
  }
  if(event.key==='ArrowRight'||event.key==='ArrowDown'){
    event.preventDefault();moveTopic(1);return;
  }
  if(event.key==='ArrowLeft'||event.key==='ArrowUp'){
    event.preventDefault();moveTopic(-1);
  }
});

function deleteActive(){
  if(!active)return;

  const topic=topicAt(active);
  if(!topic)return;

  if(!confirm(`Delete “${topic.title}” completely?`))return;

  editing=false;
  dirty=false;
  originalEdit='';
  editor.value='';

  const group=library[active.s].groups[active.g];
  group.topics.splice(active.t,1);

  if(!group.topics.length)library[active.s].groups.splice(active.g,1);
  if(!library[active.s].groups.length)library.splice(active.s,1);

  persist();
  markContentRevisionSaved();
  active=null;
  syncEditControls();
  renderTree();
  randomTopic();
  showToast('Topic deleted.');
}

const GENERIC_QUERY_WORDS=new Set([
  'concept','concepts','overview','introduction','intro','basics','basic',
  'original','outline','topic','topics','section','subsection','guide',
  'guides','notes','details','detail','definition'
]);

const AMBIGUOUS_TOPIC_WORDS=new Set([
  'example','examples','configuration','config','lifecycle','flow','usage',
  'implementation','internals','architecture','patterns','operations',
  'methods','features','handling','management','processing','setup','design',
  'testing','security','performance','optimization','transactions',
  'transaction','partitioning','serialization','deserialization','mapping',
  'validation','monitoring'
]);

const JAVA_ECOSYSTEM_TERMS=[
  'java','jvm','jdk','jre','spring','spring boot','hibernate','jpa','jakarta',
  'maven','gradle','servlet','jsp','jdbc','junit','mockito','micronaut',
  'quarkus','vert.x','webflux','completablefuture','forkjoinpool','hashmap',
  'concurrenthashmap','stream api','bytecode'
];

function normalizeQueryText(value){
  return String(value||'')
    .replace(/&/g,' and ')
    .replace(/[–—|/\\()[\]{}:;,_]+/g,' ')
    .replace(/\s+/g,' ')
    .trim();
}

function meaningfulTokens(value){
  return normalizeQueryText(value)
    .split(' ')
    .filter(Boolean)
    .filter(word=>!GENERIC_QUERY_WORDS.has(word.toLowerCase()));
}

function containsPhrase(haystack,needle){
  const a=normalizeQueryText(haystack).toLowerCase();
  const b=normalizeQueryText(needle).toLowerCase();
  return Boolean(b)&&a.includes(b);
}

function isJavaContext(value){
  const text=' '+normalizeQueryText(value).toLowerCase()+' ';
  return JAVA_ECOSYSTEM_TERMS.some(term=>text.includes(' '+term+' '));
}

function isPlaceholderGroupName(value){
  const normalized=normalizeQueryText(value).toLowerCase();
  return [
    'original outline',
    'original',
    'outline',
    'default group',
    'miscellaneous',
    'misc'
  ].includes(normalized);
}

function compactContextName(value){
  const tokens=meaningfulTokens(value);
  if(!tokens.length)return '';
  const joined=tokens.join(' ').toLowerCase();
  const preferred=[
    'core java',
    'java collections',
    'functional java',
    'java streams',
    'java concurrency',
    'spring boot',
    'spring security',
    'spring data jpa',
    'spring transactions',
    'spring integration',
    'spring webflux',
    'spring mvc',
    'spring aop',
    'apache kafka',
    'microservices',
    'system design',
    'spring',
    'hibernate',
    'jpa',
    'jvm',
    'java',
    'kafka',
    'concurrency',
    'collections',
    'security',
    'kubernetes',
    'docker',
    'aws',
    'database',
    'sql',
    'rest',
    'api'
  ];
  const displayNames={
    'core java':'Core Java',
    'java collections':'Java Collections',
    'functional java':'Functional Java',
    'java streams':'Java Streams',
    'java concurrency':'Java Concurrency',
    'spring boot':'Spring Boot',
    'spring security':'Spring Security',
    'spring data jpa':'Spring Data JPA',
    'spring transactions':'Spring Transactions',
    'spring integration':'Spring Integration',
    'spring webflux':'Spring WebFlux',
    'spring mvc':'Spring MVC',
    'spring aop':'Spring AOP',
    'apache kafka':'Apache Kafka',
    'microservices':'Microservices',
    'system design':'System Design',
    'spring':'Spring',
    'hibernate':'Hibernate',
    'jpa':'JPA',
    'jvm':'JVM',
    'java':'Java',
    'kafka':'Kafka',
    'concurrency':'Concurrency',
    'collections':'Collections',
    'security':'Security',
    'kubernetes':'Kubernetes',
    'docker':'Docker',
    'aws':'AWS',
    'database':'Database',
    'sql':'SQL',
    'rest':'REST',
    'api':'API'
  };

  for(const phrase of preferred){
    if(joined.includes(phrase)){
      return displayNames[phrase]||phrase;
    }
  }

  return tokens.slice(0,3).join(' ');
}

function addUniquePhrase(parts,phrase){
  const cleaned=normalizeQueryText(phrase);
  if(!cleaned)return;
  const existing=new Set(parts.join(' ').toLowerCase().split(/\s+/));
  const useful=cleaned.split(' ').filter(word=>!existing.has(word.toLowerCase()));
  if(useful.length)parts.push(useful.join(' '));
}

function buildContextAwareQuery(ref=active){
  const topic=topicAt(ref);
  if(!topic)return 'software engineering';

  const section=library[ref.s];
  const group=section?.groups?.[ref.g];
  const topicText=normalizeQueryText(topic.title);
  const rawGroupText=normalizeQueryText(group?.name);
  const groupText=isPlaceholderGroupName(rawGroupText)?'':rawGroupText;
  const sectionText=normalizeQueryText(section?.name);

  const parts=[];
  addUniquePhrase(parts,topicText);

  const topicTokens=meaningfulTokens(topicText);
  const ambiguous=
    topicTokens.length<=2 ||
    topicTokens.some(token=>AMBIGUOUS_TOPIC_WORDS.has(token.toLowerCase()));

  if(
    ambiguous &&
    groupText &&
    !containsPhrase(topicText,groupText) &&
    !containsPhrase(groupText,topicText)
  ){
    addUniquePhrase(parts,compactContextName(groupText)||groupText);
  }

  const current=parts.join(' ');
  const needsSectionContext=
    !groupText ||
    meaningfulTokens(current).length<3 ||
    (ambiguous && parts.length===1);

  if(
    needsSectionContext &&
    sectionText &&
    !containsPhrase(current,sectionText) &&
    !containsPhrase(sectionText,current)
  ){
    const sectionContext=compactContextName(sectionText)||sectionText;
    addUniquePhrase(parts,sectionContext);
  }

  let query=parts.join(' ').replace(/\s+/g,' ').trim();
  const fullContext=[topicText,groupText,sectionText].join(' ');

  const contextAlreadyJava=
    isJavaContext(query) ||
    isJavaContext(topicText) ||
    isJavaContext(groupText) ||
    isJavaContext(sectionText);

  if(!contextAlreadyJava){
    query+=' Java';
  }

  const seen=new Set();
  return query
    .split(' ')
    .filter(token=>{
      const key=token.toLowerCase();
      if(
        !key ||
        seen.has(key) ||
        key==='original' ||
        key==='outline'
      )return false;
      seen.add(key);
      return true;
    })
    .slice(0,8)
    .join(' ');
}

function stripHtmlToReadableText(html){
  const holder=document.createElement('div');
  holder.innerHTML=String(html||'');

  holder.querySelectorAll('br').forEach(node=>node.replaceWith('\n'));
  holder.querySelectorAll('p,div,section,article,h1,h2,h3,h4,h5,h6,li,tr,pre')
    .forEach(node=>node.append('\n'));

  return holder.textContent
    .replace(/\u00a0/g,' ')
    .replace(/[ \t]+\n/g,'\n')
    .replace(/\n{3,}/g,'\n\n')
    .trim();
}

function buildCopyContext(ref=active){
  const topic=topicAt(ref);
  if(!topic)return '';

  const section=library[ref.s];
  const group=section?.groups?.[ref.g];

  const sectionName=normalizeQueryText(section?.name);
  const rawGroupName=normalizeQueryText(group?.name);
  const groupName=isPlaceholderGroupName(rawGroupName)?'':rawGroupName;
  const topicName=normalizeQueryText(topic.title);
  const explanation=stripHtmlToReadableText(topic.explanation);

  const contextParts=[topicName,groupName,sectionName].filter(Boolean);
  const contextText=contextParts.join(' ');
  const javaSuffix=isJavaContext(contextText)?'':' in Java';

  const lines=[
    `Topic: ${topicName}${javaSuffix}`,
    sectionName?`Section: ${sectionName}`:'',
    groupName?`Subtopic: ${groupName}`:'',
    '',
    'Current explanation:',
    explanation||'No explanation is available yet.',
    '',
    `Explain only "${topicName}" within the context of ${
      [groupName,sectionName].filter(Boolean).join(' — ')||'this technical subject'
    }${javaSuffix}. Stay focused on this exact topic and do not expand into unrelated areas.`
  ];

  return lines.filter((line,index,array)=>{
    if(line!=='')return true;
    return index>0&&array[index-1]!=='';
  }).join('\n');
}

async function copyActiveContext(){
  const copyText=buildCopyContext();

  if(!copyText){
    showToast('Open a topic first.');
    return;
  }

  try{
    await navigator.clipboard.writeText(copyText);
    showToast('Topic context copied.');
    return;
  }catch(error){}

  const area=document.createElement('textarea');
  area.value=copyText;
  area.setAttribute('readonly','');
  area.style.position='fixed';
  area.style.opacity='0';
  document.body.appendChild(area);
  area.select();

  try{
    document.execCommand('copy');
    showToast('Topic context copied.');
  }catch(error){
    showToast('Copy was not available.');
  }

  area.remove();
}


function buildExploreUrl(item,query){
  const encoded=encodeURIComponent(query);

  if(item.kind==='web'){
    return 'https://www.google.com/search?q='+
      encodeURIComponent(query+' '+item.suffix);
  }

  const nativeRoutes={
    youtube:'https://www.youtube.com/results?search_query='+encoded,
    linkedin:'https://www.linkedin.com/search/results/content/?keywords='+encoded,
    github:'https://github.com/search?q='+encoded+'&type=repositories',
    geeksforgeeks:'https://www.geeksforgeeks.org/?s='+encoded,
    stackoverflow:'https://stackoverflow.com/search?q='+encoded
  };

  if(nativeRoutes[item.source]){
    return nativeRoutes[item.source];
  }

  const fallbackNames={
    bytebytego:'ByteByteGo',
    baeldung:'Baeldung',
    dzone:'DZone',
    oracle:'Oracle Docs',
    spring:'Spring',
    infoq:'InfoQ',
    digitalocean:'DigitalOcean',
    javatpoint:'JavaTpoint'
  };

  const sourceName=fallbackNames[item.source]||item.label||'';

  return 'https://www.google.com/search?q='+
    encodeURIComponent([query,sourceName].filter(Boolean).join(' '));
}

function hashSnapshot(value){
  let hash=2166136261;
  const text=JSON.stringify(value);

  for(let index=0;index<text.length;index++){
    hash^=text.charCodeAt(index);
    hash=Math.imul(hash,16777619);
  }

  return (hash>>>0).toString(16).padStart(8,'0');
}

function buildDownload(){
  // Auto-commit active editor changes if user was typing
  if(editing && dirty && active){
    const topic=topicAt(active);
    if(topic){
      topic.explanation=editor.value.trim()||'<p>Explanation not added yet.</p>';
      persist();
      editing=false;
      dirty=false;
    }
  }

  const nextRevision = downloadVersion + 1;
  const embeddedJson = JSON.stringify(library).replace(/</g,'\\u003c');
  const nextId = hashSnapshot(library);

  // Exact boundary index slicing (Windows CRLF & Unix LF resilient)
  const startMarker = 'const INITIAL_LIBRARY=';
  const startIdx = sourceTemplate.indexOf(startMarker);
  if (startIdx === -1) {
    throw new Error('INITIAL_LIBRARY marker was not found in sourceTemplate.');
  }

  const endMarker = 'const EMBEDDED_LIBRARY_REVISION=';
  const revIdx = sourceTemplate.indexOf(endMarker, startIdx);
  if (revIdx === -1) {
    throw new Error('EMBEDDED_LIBRARY_REVISION marker was not found in sourceTemplate.');
  }
  const lineEndIdx = sourceTemplate.indexOf(';', revIdx);
  if (lineEndIdx === -1) {
    throw new Error('End of library definitions was not found in sourceTemplate.');
  }

  const before = sourceTemplate.slice(0, startIdx);
  const after = sourceTemplate.slice(lineEndIdx + 1);

  const replacement = `const INITIAL_LIBRARY=${embeddedJson};
const EMBEDDED_LIBRARY_ID='${nextId}';
const EMBEDDED_STABLE_VERSION=${stableVersion};
const EMBEDDED_LIBRARY_REVISION=${nextRevision};`;

  let exported = before + replacement + after;

  const formattedVer = stableVersion > 0 ? `V${stableVersion}.${String(nextRevision).padStart(3,'0')}` : `V.${String(nextRevision).padStart(3,'0')}`;
  exported = exported.replace(/<b id="downloadVersion">[^<]*<\/b>/g, `<b id="downloadVersion">V.014</b>`);
  exported = exported.replace(/<small id="mobileDownloadVersion">[^<]*<\/small>/g, `<small id="mobileDownloadVersion">V.014</small>`);

  return { html: exported, version: formattedVer, nextRevision };
}

function attachDownloadLongPress(button){
  let timer=null;
  let startX=0;
  let startY=0;

  const cancel=()=>{
    clearTimeout(timer);
    timer=null;
  };

  button.addEventListener('pointerdown',event=>{
    if(event.button!==undefined&&event.button!==0)return;

    startX=event.clientX;
    startY=event.clientY;

    timer=setTimeout(()=>{
      timer=null;
      suppressNextDownloadClick=true;
      promoteStableVersion();

      setTimeout(()=>{
        suppressNextDownloadClick=false;
      },650);
    },650);
  });

  button.addEventListener('pointermove',event=>{
    if(
      Math.abs(event.clientX-startX)>12 ||
      Math.abs(event.clientY-startY)>12
    )cancel();
  });

  button.addEventListener('pointerup',cancel);
  button.addEventListener('pointercancel',cancel);
  button.addEventListener('pointerleave',cancel);
  button.addEventListener('contextmenu',event=>{
    if(suppressNextDownloadClick)event.preventDefault();
  });
}

  try{
    const { html, version, nextRevision } = buildDownload();
    const blob=new Blob(
      [html],
      {type:'text/html;charset=utf-8'}
    );
    const url=URL.createObjectURL(blob);
    const anchor=document.createElement('a');

    anchor.href=url;
    const now=new Date();
    const pad=(value,size=2)=>String(value).padStart(size,'0');
    const timestamp=[
      now.getFullYear(),
      pad(now.getMonth()+1),
      pad(now.getDate())
    ].join('-')+'_'+[
      pad(now.getHours()),
      pad(now.getMinutes()),
      pad(now.getSeconds()),
      pad(now.getMilliseconds(),3)
    ].join('-');

    anchor.download=`Living_Library_${version}_${timestamp}.html`;

    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();

    downloadVersion = nextRevision;
    const completedVersion=markDownloadComplete();

    setTimeout(()=>URL.revokeObjectURL(url),1000);
    showToast(`${completedVersion} downloaded with all saved edits.`);
  }catch(error){
    console.error(error);
    showToast('Download could not be prepared: ' + error.message);
  }
});

// Global Lightbox & Copy-Filename click listeners
let lbScale = 1;
let lbPosX = 0;
let lbPosY = 0;
let lbIsDragging = false;
let lbStartX = 0, lbStartY = 0;
let lbTouchStartDist = 0;
let lbTouchStartScale = 1;
let lbLastTapTime = 0;

function updateLightboxTransform() {
  const img = $('lightboxImg');
  const zoomVal = $('lightboxZoomVal');
  if (!img) return;
  img.style.transform = `translate(${lbPosX}px, ${lbPosY}px) scale(${lbScale})`;
  img.style.cursor = lbScale > 1.05 ? 'grab' : 'zoom-in';
  if (zoomVal) zoomVal.textContent = `${Math.round(lbScale * 100)}%`;
}

function resetLightboxZoom() {
  lbScale = 1;
  lbPosX = 0;
  lbPosY = 0;
  updateLightboxTransform();
}

function setLightboxZoom(newScale) {
  lbScale = Math.min(5.0, Math.max(1.0, newScale));
  if (lbScale <= 1.02) {
    lbScale = 1;
    lbPosX = 0;
    lbPosY = 0;
  }
  updateLightboxTransform();
}

function openLightbox(src, title) {
  const modal = $('lightboxModal');
  const img = $('lightboxImg');
  const titleEl = $('lightboxTitle');
  if (!modal || !img) return;
  img.src = src;
  if (titleEl) titleEl.textContent = title || 'Diagram Full View';
  resetLightboxZoom();
  modal.classList.add('active');
  modal.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  const modal = $('lightboxModal');
  if (!modal) return;
  modal.classList.remove('active');
  modal.setAttribute('aria-hidden', 'true');
  document.body.style.overflow = '';
  resetLightboxZoom();
}

// Setup touch and mouse zoom controls
window.addEventListener('DOMContentLoaded', () => {
  const lbBody = $('lightboxBody');
  const lbImg = $('lightboxImg');
  if (!lbBody) return;

  // Zoom buttons
  $('zoomInBtn')?.addEventListener('click', (e) => { e.stopPropagation(); setLightboxZoom(lbScale + 0.5); });
  $('zoomOutBtn')?.addEventListener('click', (e) => { e.stopPropagation(); setLightboxZoom(lbScale - 0.5); });
  $('zoomResetBtn')?.addEventListener('click', (e) => { e.stopPropagation(); resetLightboxZoom(); });

  // Touch: Pinch zoom, Pan, and Tap to close
  lbBody.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      e.preventDefault();
      lbTouchStartDist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      lbTouchStartScale = lbScale;
    } else if (e.touches.length === 1) {
      const touch = e.touches[0];
      lbStartX = touch.clientX - lbPosX;
      lbStartY = touch.clientY - lbPosY;
      lbIsDragging = lbScale > 1.05;
    }
  }, { passive: false });

  lbBody.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2) {
      e.preventDefault();
      const dist = Math.hypot(
        e.touches[0].clientX - e.touches[1].clientX,
        e.touches[0].clientY - e.touches[1].clientY
      );
      if (lbTouchStartDist > 0) {
        const factor = dist / lbTouchStartDist;
        setLightboxZoom(lbTouchStartScale * factor);
      }
    } else if (e.touches.length === 1 && lbIsDragging && lbScale > 1.05) {
      e.preventDefault();
      const touch = e.touches[0];
      lbPosX = touch.clientX - lbStartX;
      lbPosY = touch.clientY - lbStartY;
      updateLightboxTransform();
    }
  }, { passive: false });

  lbBody.addEventListener('touchend', (e) => {
    if (e.touches.length === 0) {
      lbIsDragging = false;
      lbTouchStartDist = 0;
      
      const now = Date.now();
      if (now - lbLastTapTime < 300) {
        // Double tap: toggle zoom
        if (lbScale > 1.5) {
          resetLightboxZoom();
        } else {
          setLightboxZoom(2.5);
        }
      } else {
        // Single tap: if at normal scale and tapped inside lightbox, close back to normal view
        if (lbScale <= 1.05 && !e.target.closest('.lightbox-bar') && !e.target.closest('.lightbox-tools')) {
          closeLightbox();
        }
      }
      lbLastTapTime = now;
    }
  });

  // Mouse wheel zoom
  lbBody.addEventListener('wheel', (e) => {
    e.preventDefault();
    const step = e.deltaY < 0 ? 0.25 : -0.25;
    setLightboxZoom(lbScale + step);
  }, { passive: false });

  // Mouse drag to pan
  lbBody.addEventListener('mousedown', (e) => {
    if (e.button !== 0) return;
    if (lbScale > 1.05) {
      lbIsDragging = true;
      lbStartX = e.clientX - lbPosX;
      lbStartY = e.clientY - lbPosY;
      if (lbImg) lbImg.style.cursor = 'grabbing';
      e.preventDefault();
    }
  });

  window.addEventListener('mousemove', (e) => {
    if (lbIsDragging && lbScale > 1.05) {
      lbPosX = e.clientX - lbStartX;
      lbPosY = e.clientY - lbStartY;
      updateLightboxTransform();
    }
  });

  window.addEventListener('mouseup', () => {
    lbIsDragging = false;
    if (lbImg && lbScale > 1.05) lbImg.style.cursor = 'grab';
  });

  // Double click: toggle zoom
  lbBody.addEventListener('dblclick', (e) => {
    if (e.target.closest('.lightbox-bar') || e.target.closest('.lightbox-tools')) return;
    if (lbScale > 1.5) {
      resetLightboxZoom();
    } else {
      setLightboxZoom(2.5);
    }
  });
});

/**
 * MOBILE TAP NAVIGATION
 *
 * Horizontal swipes remain available to the browser and embedded
 * content instead of changing topics. A short tap on the left or
 * right half of the reading panel moves to the previous or next topic.
 * Desktop and laptop interactions are unchanged.
 */
let mobileTapStart=null;

function isProtectedTapTarget(target){
  return Boolean(target.closest(
    'a,button,input,textarea,select,option,label,'+
    'summary,details,[contenteditable="true"],[role="button"]'
  ));
}

content.addEventListener('touchstart',event=>{
  if(
    editing ||
    !window.matchMedia('(max-width:1024px) and (orientation:portrait)').matches ||
    event.touches.length!==1 ||
    isProtectedTapTarget(event.target)
  ){
    mobileTapStart=null;
    return;
  }

  const touch=event.touches[0];
  mobileTapStart={
    x:touch.clientX,
    y:touch.clientY,
    time:performance.now(),
    target:event.target
  };
},{passive:true});

content.addEventListener('touchend',event=>{
  if(!mobileTapStart || editing){
    mobileTapStart=null;
    return;
  }

  const touch=event.changedTouches[0];
  const dx=touch.clientX-mobileTapStart.x;
  const dy=touch.clientY-mobileTapStart.y;
  const elapsed=performance.now()-mobileTapStart.time;
  const selection=window.getSelection?.();
  const selectedText=selection && !selection.isCollapsed;

  mobileTapStart=null;

  // Ignore scrolling, long presses, selections, and interactive controls.
  if(
    Math.abs(dx)>12 ||
    Math.abs(dy)>12 ||
    elapsed>450 ||
    selectedText ||
    isProtectedTapTarget(event.target)
  )return;

  const bounds=content.getBoundingClientRect();
  const localX=touch.clientX-bounds.left;

  // Left half goes back; right half advances.
  moveTopic(localX<bounds.width/2?-1:1);
},{passive:true});

content.addEventListener('touchcancel',()=>{
  mobileTapStart=null;
},{passive:true});


/**
 * LANDSCAPE / DESKTOP TOUCH NAVIGATION
 *
 * Tablets and touch laptops using the desktop layout can swipe:
 * - left  -> next topic
 * - right -> previous topic
 *
 * Keyboard arrows remain unchanged.
 */
let landscapeSwipeStart=null;

function isLandscapeDesktopLayout(){
  return window.matchMedia(
    '(orientation:landscape), (min-width:1025px)'
  ).matches;
}

function isSwipeBlockedTarget(target){
  return Boolean(target.closest(
    'a,button,input,textarea,select,option,label,'+
    'summary,details,[contenteditable="true"],[role="button"],'+
    'pre,code,table,.explore,.dialog'
  ));
}

content.addEventListener('touchstart',event=>{
  if(
    editing ||
    !isLandscapeDesktopLayout() ||
    event.touches.length!==1 ||
    isSwipeBlockedTarget(event.target) ||
    document.body.classList.contains('desktop-explore-open')
  ){
    landscapeSwipeStart=null;
    return;
  }

  const touch=event.touches[0];

  landscapeSwipeStart={
    x:touch.clientX,
    y:touch.clientY,
    time:performance.now()
  };
},{passive:true});

content.addEventListener('touchend',event=>{
  if(!landscapeSwipeStart || editing){
    landscapeSwipeStart=null;
    return;
  }

  const touch=event.changedTouches[0];
  const dx=touch.clientX-landscapeSwipeStart.x;
  const dy=touch.clientY-landscapeSwipeStart.y;
  const elapsed=performance.now()-landscapeSwipeStart.time;

  landscapeSwipeStart=null;

  const horizontalEnough=Math.abs(dx)>=70;
  const mostlyHorizontal=Math.abs(dx)>Math.abs(dy)*1.35;
  const timely=elapsed<=900;

  if(!horizontalEnough || !mostlyHorizontal || !timely)return;

  moveTopic(dx<0?1:-1);
},{passive:true});

content.addEventListener('touchcancel',()=>{
  landscapeSwipeStart=null;
},{passive:true});

/* ── Export .md ───────────────────────────────────────────────── */
function exportTopicMd(){
  if(!active) { showToast('Open a topic first.'); return; }
  const topic = topicAt(active);
  if(!topic) return;
  const section = library[active.s];
  const group = section.groups[active.g];
  const fileName = getTopicMdFileName(section, group, topic);

  const mdContent = getTopicMdContent(topic);
  const blob = new Blob([mdContent], { type: 'text/markdown;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = fileName;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  showToast(`Exported: ${fileName}`);
}

function applyTheme(isDark){
  document.body.classList.toggle('dark-mode', isDark);
  const icon = $('themeIcon');
  const text = $('themeText');
  const btn = $('themeToggleBtn');
  if(icon) icon.textContent = isDark ? '☀️' : '🌙';
  if(text) text.textContent = isDark ? 'Paper' : 'Dark';
  if(btn) btn.title = isDark ? 'Switch to Warm Paper Mode' : 'Switch to Slate Dark Mode';
  try {
    localStorage.setItem('livingLibrary.theme', isDark ? 'dark' : 'paper');
  } catch(e){}
}

document.addEventListener('click', e => {
  if (e.target.closest('#themeToggleBtn')) {
    const isDark = !document.body.classList.contains('dark-mode');
    applyTheme(isDark);
    showToast(isDark ? '🌙 Slate Dark Mode enabled.' : '☀️ Warm Paper Mode enabled.');
  }
});

  const savedTheme = localStorage.getItem('livingLibrary.theme');
  if (savedTheme === 'dark') {
    applyTheme(true);
  }
} catch(e){}
