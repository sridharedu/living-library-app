gn__instance_members.png","doc":"docs/part-02/core_java__object_oriented_design__instance_members.md"},{"title":"Composition over inheritance","quote":"Composition builds behavior by containing collaborators, while inheritance creates an is-a relationship. Composition is usually more flexible and less coupled.","explanation":"","image":"images/part-02/core_java__object_oriented_design__composition_over_inheritance.png","doc":"docs/part-02/core_java__object_oriented_design__composition_over_inheritance.md"},{"title":"Method overloading","quote":"Overloading defines methods with the same name but different parameter lists. Resolution happens at compile time.","explanation":"","image":"images/part-02/core_java__object_oriented_design__method_overloading.png","doc":"docs/part-02/core_java__object_oriented_design__method_overloading.md"},{"title":"Method overriding","quote":"Overriding provides a subclass implementation of an inherited method with a compatible signature. Dispatch happens at runtime.","explanation":"","image":"images/part-02/core_java__object_oriented_design__method_overriding.png","doc":"docs/part-02/core_java__object_oriented_design__method_overriding.md"},{"title":"Covariant return types","quote":"An overriding method may return a more specific reference type than the parent method. This improves type precision without breaking polymorphism.","explanation":"","image":"images/part-02/core_java__object_oriented_design__covariant_return_types.png","doc":"docs/part-02/core_java__object_oriented_design__covariant_return_types.md"},{"title":"Abstract classes","quote":"An abstract class can hold state, constructors, concrete methods, and abstract methods. It cannot be instantiated directly.","explanation":"","image":"images/part-02/core_java__object_oriented_design__abstract_classes.png","doc":"docs/part-02/core_java__object_oriented_design__abstract_classes.md"},{"title":"Interfaces","quote":"An interface defines a contract that classes can implement. It supports abstract, default, static, and private methods but no instance state.","explanation":"","image":"images/part-02/core_java__object_oriented_design__interfaces.png","doc":"docs/part-02/core_java__object_oriented_design__interfaces.md"},{"title":"Default interface methods","quote":"Default methods let interfaces add behavior without breaking existing implementers. They should support evolution, not become hidden base classes.","explanation":"","image":"images/part-02/core_java__object_oriented_design__default_interface_methods.png","doc":"docs/part-02/core_java__object_oriented_design__default_interface_methods.md"},{"title":"Marker interfaces","quote":"A marker interface has no methods and signals a capability or category, such as Serializable. Annotations are often a modern alternative.","explanation":"","image":"images/part-02/core_java__object_oriented_design__marker_interfaces.png","doc":"docs/part-02/core_java__object_oriented_design__marker_interfaces.md"},{"title":"Nested classes","quote":"Nested classes are declared inside another class. They include static nested classes and non-static inner classes.","explanation":"","image":"images/part-02/core_java__object_oriented_design__nested_classes.png","doc":"docs/part-02/core_java__object_oriented_design__nested_classes.md"},{"title":"Inner classes","quote":"An inner class is tied to an instance of the enclosing class and can access its instance members directly.","explanation":"","image":"images/part-02/core_java__object_oriented_design__inner_classes.png","doc":"docs/part-02/core_java__object_oriented_design__inner_classes.md"},{"title":"Anonymous classes","quote":"An anonymous class creates a one-off subclass or interface implementation inline. Lambdas are preferable for functional interfaces.","explanation":"","image":"images/part-02/core_java__object_oriented_design__anonymous_classes.png","doc":"docs/part-02/core_java__object_oriented_design__anonymous_classes.md"},{"title":"Object class methods","quote":"Object defines core methods such as equals, hashCode, toString, getClass, clone, wait, notify, and notifyAll.","explanation":"","image":"images/part-02/core_java__object_oriented_design__object_class_methods.png","doc":"docs/part-02/core_java__object_oriented_design__object_class_methods.md"},{"title":"equals and hashCode contract","quote":"Equal objects must return the same hash code. equals must be reflexive, symmetric, transitive, consistent, and return false for null.","explanation":"","image":"images/part-02/core_java__object_oriented_design__equals_and_hashcode_contract.png","doc":"docs/part-02/core_java__object_oriented_design__equals_and_hashcode_contract.md"},{"title":"toString best practices","quote":"toString should provide concise diagnostic information without exposing secrets or producing unstable, excessively large output.","explanation":"","image":"images/part-02/core_java__object_oriented_design__tostring_best_practices.png","doc":"docs/part-02/core_java__object_oriented_design__tostring_best_practices.md"}]},{"name":"Strings and Numbers","topics":[{"title":"String immutability","quote":"String objects cannot change after creation. Operations return new strings, enabling safe sharing, caching, and hash-based use.","explanation":"","image":"images/part-02/core_java__strings_and_numbers__string_immutability.png","doc":"docs/part-02/core_java__strings_and_numbers__string_immutability.md"},{"title":"String pool","quote":"The string pool stores canonical string literals and interned strings so identical values can share one object.","explanation":"","image":"images/part-02/core_java__strings_and_numbers__string_pool.png","doc":"docs/part-02/core_java__strings_and_numbers__string_pool.md"},{"title":"StringBuilder vs StringBuffer","quote":"StringBuilder is faster for single-threaded mutable text, while StringBuffer synchronizes methods for thread safety.","explanation":"","image":"images/part-02/core_java__strings_and_numbers__stringbuilder_vs_stringbuffer.png","doc":"docs/part-02/core_java__strings_and_numbers__stringbuilder_vs_stringbuffer.md"},{"title":"String concatenation performance","quote":"Repeated concatenation in loops can create many temporary objects. Use StringBuilder for incremental construction.","explanation":"","image":"images/part-02/core_java__strings_and_numbers__string_concatenation_performance.png","doc":"docs/part-02/core_java__strings_and_numbers__string_concatenation_performance.md"},{"title":"Text blocks","quote":"Text blocks use triple quotes for readable multi-line strings while handling indentation and embedded quotes more naturally.","explanation":"","image":"images/part-02/core_java__strings_and_numbers__text_blocks.png","doc":"docs/part-02/core_java__strings_and_numbers__text_blocks.md"},{"title":"Regular expressions","quote":"Regular expressions describe text patterns for matching, validation, splitting, and replacement. Java provides Pattern and Matcher.","explanation":"","image":"images/part-02/core_java__strings_and_numbers__regular_expressions.png","doc":"docs/part-02/core_java__strings_and_numbers__regular_expressions.md"},{"title":"BigDecimal precision","quote":"BigDecimal represents decimal numbers exactly and is preferred for money. Construct it from strings and specify rounding explicitly.","explanation":"","image":"images/part-02/core_java__strings_and_numbers__bigdecimal_precision.png","doc":"docs/part-02/core_java__strings_and_numbers__bigdecimal_precision.md"},{"title":"BigInteger","quote":"BigInteger supports integers larger than primitive long. Its operations return new immutable values.","explanation":"","image":"images/part-02/core_java__strings_and_numbers__biginteger.png","doc":"docs/part-02/core_java__strings_and_numbers__biginteger.md"},{"title":"Number formatting","quote":"NumberFormat and DecimalFormat convert numbers to locale-sensitive strings and parse formatted values.","explanation":"","image":"images/part-02/core_java__strings_and_numbers__number_formatting.png","doc":"docs/part-02/core_java__strings_and_numbers__number_formatting.md"},{"title":"Locale-aware formatting","quote":"Locale-aware formatting adapts numbers, currencies, dates, and text rules to regional conventions.","explanation":"","image":"images/part-02/core_java__strings_and_numbers__locale_aware_formatting.png","doc":"docs/part-02/core_java__strings_and_numbers__locale_aware_formatting.md"},{"title":"Date and time API","quote":"The java.time API provides immutable, thread-safe types for dates, times, durations, zones, and formatting.","explanation":"","image":"images/part-02/core_java__strings_and_numbers__date_and_time_api.png","doc":"docs/part-02/core_java__strings_and_numbers__date_and_time_api.md"},{"title":"Instant vs LocalDateTime","quote":"Instant represents a moment on the UTC timeline, while LocalDateTime represents a date and time without a zone or offset.","explanation":"","image":"images/part-02/core_java__strings_and_numbers__instant_vs_localdatetime.png","doc":"docs/part-02/core_java__strings_and_numbers__instant_vs_localdatetime.md"},{"title":"Time zones and ZoneId","quote":"ZoneId identifies a region-based time zone with daylight-saving rules. ZonedDateTime combines local date-time with that zone.","explanation":"","image":"images/part-02/core_java__strings_and_numbers__time_zones_and_zoneid.png","doc":"docs/part-02/core_java__strings_and_numbers__time_zones_and_zoneid.md"},{"title":"Duration and Period","quote":"Duration measures time-based amounts such as seconds, while Period measures date-based amounts such as years, months, and days.","explanation":"","image":"images/part-02/core_java__strings_and_numbers__duration_and_period.png","doc":"docs/part-02/core_java__strings_and_numbers__duration_and_period.md"},{"title":"DateTimeFormatter","quote":"DateTimeFormatter formats and parses java.time values. It is immutable, thread-safe, and supports predefined or custom patterns.","explanation":"","image":"images/part-02/core_java__strings_and_numbers__datetimeformatter.png","doc":"docs/part-02/core_java__strings_and_numbers__datetimeformatter.md"}]},{"name":"Exceptions","topics":[{"title":"Checked vs unchecked exceptions","quote":"Checked exceptions must be declared or handled, while unchecked exceptions extend RuntimeException and usually represent programming or validation failures.","explanation":"","image":"images/part-02/core_java__exceptions__checked_vs_unchecked_exceptions.png","doc":"docs/part-02/core_java__exceptions__checked_vs_unchecked_exceptions.md"},{"title":"Exception hierarchy","quote":"Throwable is the root type. Error represents serious JVM conditions, while Exception represents conditions applications may handle.","explanation":"","image":"images/part-02/core_java__exceptions__exception_hierarchy.png","doc":"docs/part-02/core_java__exceptions__exception_hierarchy.md"},{"title":"Try-catch-finally","quote":"A try block contains risky code, catch handles matching exceptions, and finally runs cleanup logic whether execution succeeds or fails. Avoid returning from finally because it can hide errors.","explanation":"","image":"images/part-02/core_java__exceptions__try_catch_finally.png","doc":"docs/part-02/core_java__exceptions__try_catch_finally.md"},{"title":"Try-with-resources","quote":"Try-with-resources automatically closes AutoCloseable resources in reverse order. It is safer than manual finally cleanup and preserves close failures as suppressed exceptions.","explanation":"","image":"images/part-02/core_java__exceptions__try_with_resources.png","doc":"docs/part-02/core_java__exceptions__try_with_resources.md"},{"title":"Multi-catch","quote":"Multi-catch handles several unrelated exception types in one catch block using the pipe symbol. The caught variable is effectively final.","explanation":"","image":"images/part-02/core_java__exceptions__multi_catch.png","doc":"docs/part-02/core_java__exceptions__multi_catch.md"},{"title":"Exception propagation","quote":"An unchecked exception propagates up the call stack until a matching handler is found. Checked exceptions must be caught or declared.","explanation":"","image":"images/part-02/core_java__exceptions__exception_propagation.png","doc":"docs/part-02/core_java__exceptions__exception_propagation.md"},{"title":"Exception translation","quote":"Exception translation converts a low-level exception into a domain-appropriate one while preserving the original cause. It keeps implementation details from leaking across layers.","explanation":"","image":"images/part-02/core_java__exceptions__exception_translation.png","doc":"docs/part-02/core_java__exceptions__exception_translation.md"},{"title":"Suppressed exceptions","quote":"When both the main operation and resource closing fail, try-with-resources keeps the primary exception and attaches close failures as suppressed exceptions.","explanation":"","image":"images/part-02/core_java__exceptions__suppressed_exceptions.png","doc":"docs/part-02/core_java__exceptions__suppressed_exceptions.md"},{"title":"Best practices for exception messages","quote":"Exception messages should explain what failed, include useful identifiers, and avoid secrets. Preserve the cause so the original stack trace remains available.","explanation":"","image":"images/part-02/core_java__exceptions__best_practices_for_exception_messages.png","doc":"docs/part-02/core_java__exceptions__best_practices_for_exception_messages.md"},{"title":"Global exception handling patterns","quote":"Global handlers centralize error mapping, logging, status codes, and response shape. In Spring, @ControllerAdvice is commonly used for this purpose.","explanation":"","image":"images/part-02/core_java__exceptions__global_exception_handling_patterns.png","doc":"docs/part-02/core_java__exceptions__global_exception_handling_patterns.md"},{"title":"Avoiding swallowed exceptions","quote":"Do not catch and ignore exceptions. Either handle them meaningfully, wrap and rethrow them, or let them propagate with enough context.","explanation":"","image":"images/part-02/core_java__exceptions__avoiding_swallowed_exceptions.png","doc":"docs/part-02/core_java__exceptions__avoiding_swallowed_exceptions.md"}]},{"name":"Generics","topics":[{"title":"Generic classes","quote":"A generic class declares type parameters so the same implementation can work safely with different types, such as Box.","explanation":"","image":"images/part-02/core_java__generics__generic_classes.png","doc":"docs/part-02/core_java__generics__generic_classes.md"},{"title":"Generic methods","quote":"A generic method declares its own type parameters before the return type. It can infer types independently of the containing class.","explanation":"","image":"images/part-02/core_java__generics__generic_methods.png","doc":"docs/part-02/core_java__generics__generic_methods.md"},{"title":"Bounded type parameters","quote":"A bounded type parameter restricts allowed types, such as . Bounds let generic code safely use methods from the bound.","explanation":"","image":"images/part-02/core_java__generics__bounded_type_parameters.png","doc":"docs/part-02/core_java__generics__bounded_type_parameters.md"},{"title":"Wildcards","quote":"A wildcard represents an unknown generic type using ?. It is useful when code should accept a family of parameterized types without naming the exact type.","explanation":"","image":"images/part-02/core_java__generics__wildcards.png","doc":"docs/part-02/core_java__generics__wildcards.md"},{"title":"Upper bounded wildcards","quote":"? extends T accepts T or its subtypes and is best for reading values as T. Adding non-null values is generally unsafe.","explanation":"","image":"images/part-02/core_java__generics__upper_bounded_wildcards.png","doc":"docs/part-02/core_java__generics__upper_bounded_wildcards.md"},{"title":"Lower bounded wildcards","quote":"? super T accepts T or its supertypes and is best for writing T values. Reads are only guaranteed as Object.","explanation":"","image":"images/part-02/core_java__generics__lower_bounded_wildcards.png","doc":"docs/part-02/core_java__generics__lower_bounded_wildcards.md"},{"title":"PECS principle","quote":"PECS means Producer Extends, Consumer Super. Use ? extends T when reading T values and ? super T when writing T values.","explanation":"","image":"images/part-02/core_java__generics__pecs_principle.png","doc":"docs/part-02/core_java__generics__pecs_principle.md"},{"title":"Type erasure","quote":"Java generics are implemented mostly through type erasure, so generic type arguments are removed at runtime and replaced with bounds or Object.","explanation":"","image":"images/part-02/core_java__generics__type_erasure.png","doc":"docs/part-02/core_java__generics__type_erasure.md"},{"title":"Generic inheritance","quote":"Generic types are invariant: List is not a subtype of List. Wildcards express flexible relationships between parameterized types.","explanation":"","image":"images/part-02/core_java__generics__generic_inheritance.png","doc":"docs/part-02/core_java__generics__generic_inheritance.md"},{"title":"Raw types","quote":"A raw type omits generic arguments, such as List instead of List. It disables compile-time type safety and should be avoided.","explanation":"","image":"images/part-02/core_java__generics__raw_types.png","doc":"docs/part-02/core_java__generics__raw_types.md"},{"title":"Heap pollution","quote":"Heap pollution occurs when a variable of a parameterized type refers to an object with an incompatible type, often through raw types or unsafe varargs.","explanation":"","image":"images/part-02/core_java__generics__heap_pollution.png","doc":"docs/part-02/core_java__generics__heap_pollution.md"},{"title":"Generic varargs","quote":"Generic varargs can cause heap pollution because the runtime array does not retain generic type information. @SafeVarargs is valid only when the method is truly safe.","explanation":"","image":"images/part-02/core_java__generics__generic_varargs.png","doc":"docs/part-02/core_java__generics__generic_varargs.md"},{"title":"ParameterizedTypeReference","quote":"ParameterizedTypeReference captures full generic type information through an anonymous subclass, helping frameworks deserialize types such as List.","explanation":"","image":"images/part-02/core_java__generics__parameterizedtypereference.png","doc":"docs/part-02/core_java__generics__parameterizedtypereference.md"}]},{"name":"I/O and Files","topics":[{"title":"Java IO streams","quote":"Java IO streams model sequential input and output. Byte streams handle binary data, while character streams handle text.","explanation":"","image":"images/part-02/core_java__i_o_and_files__java_io_streams.png","doc":"docs/part-02/core_java__i_o_and_files__java_io_streams.md"},{"title":"Byte streams","quote":"InputStream and OutputStream process raw bytes. They are appropriate for images, archives, network payloads, and other binary data.","explanation":"","image":"images/part-02/core_java__i_o_and_files__byte_streams.png","doc":"docs/part-02/core_java__i_o_and_files__byte_streams.md"},{"title":"Character streams","quote":"Reader and Writer process characters and handle encoding through bridges such as InputStreamReader and OutputStreamWriter.","explanation":"","image":"images/part-02/core_java__i_o_and_files__character_streams.png","doc":"docs/part-02/core_java__i_o_and_files__character_streams.md"},{"title":"Buffered streams","quote":"Buffered streams reduce expensive underlying read or write calls by using an in-memory buffer. They usually improve IO performance significantly.","explanation":"","image":"images/part-02/core_java__i_o_and_files__buffered_streams.png","doc":"docs/part-02/core_java__i_o_and_files__buffered_streams.md"},{"title":"Serialization","quote":"Java serialization converts an object graph into bytes using Serializable. It is fragile for long-term storage and unsafe with untrusted input.","explanation":"","image":"images/part-02/core_java__i_o_and_files__serialization.png","doc":"docs/part-02/core_java__i_o_and_files__serialization.md"},{"title":"Externalization","quote":"Externalizable gives a class full control over its serialized form through writeExternal and readExternal. It is more manual than Serializable.","explanation":"","image":"images/part-02/core_java__i_o_and_files__externalization.png","doc":"docs/part-02/core_java__i_o_and_files__externalization.md"},{"title":"NIO","quote":"Java NIO introduces buffers, channels, selectors, and non-blocking IO. It is useful for scalable networking and efficient file operations.","explanation":"","image":"images/part-02/core_java__i_o_and_files__nio.png","doc":"docs/part-02/core_java__i_o_and_files__nio.md"},{"title":"NIO.2 Path and Files","quote":"NIO.2 provides Path and Files for modern filesystem operations such as copying, moving, walking directories, permissions, and symbolic links.","explanation":"","image":"images/part-02/core_java__i_o_and_files__nio_2_path_and_files.png","doc":"docs/part-02/core_java__i_o_and_files__nio_2_path_and_files.md"},{"title":"File channels","quote":"FileChannel supports reading, writing, positioning, locking, transferring, and memory mapping files, often with better control than stream APIs.","explanation":"","image":"images/part-02/core_java__i_o_and_files__file_channels.png","doc":"docs/part-02/core_java__i_o_and_files__file_channels.md"},{"title":"Memory-mapped files","quote":"A memory-mapped file maps file regions into virtual memory using MappedByteBuffer. It can speed random access but requires careful resource and size management.","explanation":"","image":"images/part-02/core_java__i_o_and_files__memory_mapped_files.png","doc":"docs/part-02/core_java__i_o_and_files__memory_mapped_files.md"},{"title":"Directory walking","quote":"Files.walk and Files.walkFileTree traverse directory trees. Streams returned by Files.walk should be closed.","explanation":"","image":"images/part-02/core_java__i_o_and_files__directory_walking.png","doc":"docs/part-02/core_java__i_o_and_files__directory_walking.md"},{"title":"WatchService","quote":"WatchService monitors directories for create, modify, and delete events. It is useful for file-based automation but behavior can vary by operating system.","explanation":"","image":"images/part-02/core_java__i_o_and_files__watchservice.png","doc":"docs/part-02/core_java__i_o_and_files__watchservice.md"},{"title":"Reading large files efficiently","quote":"Read large files incrementally with buffered streams, channels, or streaming APIs rather than loading the entire file into memory.","explanation":"","image":"images/part-02/core_java__i_o_and_files__reading_large_files_efficiently.png","doc":"docs/part-02/core_java__i_o_and_files__reading_large_files_efficiently.md"},{"title":"Temporary files","quote":"Files.createTempFile and createTempDirectory create temporary resources safely. Applications should define cleanup behavior explicitly.","explanation":"","image":"images/part-02/core_java__i_o_and_files__temporary_files.png","doc":"docs/part-02/core_java__i_o_and_files__temporary_files.md"},{"title":"ZIP file handling","quote":"Java supports ZIP archives through ZipInputStream, ZipOutputStream, ZipFile, and the ZIP filesystem provider.","explanation":"","image":"images/part-02/core_java__i_o_and_files__zip_file_handling.png","doc":"docs/part-02/core_java__i_o_and_files__zip_file_handling.md"}]},{"name":"Reflection and Runtime","topics":[{"title":"Reflection API","quote":"Reflection inspects and invokes classes, fields, methods, and constructors at runtime. It is powerful but slower, less type-safe, and can break encapsulation.","explanation":"","image":"images/part-02/core_java__reflection_and_runtime__reflection_api.png","doc":"docs/part-02/core_java__reflection_and_runtime__reflection_api.md"},{"title":"Class metadata","quote":"Class objects expose runtime metadata such as name, modifiers, superclass, interfaces, annotations, fields, methods, and constructors.","explanation":"","image":"images/part-02/core_java__reflection_and_runtime__class_metadata.png","doc":"docs/part-02/core_java__reflection_and_runtime__class_metadata.md"},{"title":"Dynamic proxies","quote":"JDK dynamic proxies create runtime implementations of interfaces and route calls through an InvocationHandler. Spring AOP commonly uses them.","explanation":"","image":"images/part-02/core_java__reflection_and_runtime__dynamic_proxies.png","doc":"docs/part-02/core_java__reflection_and_runtime__dynamic_proxies.md"},{"title":"Method handles","quote":"MethodHandle provides typed, efficient, dynamically invocable references to methods, constructors, and fields. It is more flexible than reflection.","explanation":"","image":"images/part-02/core_java__reflection_and_runtime__method_handles.png","doc":"docs/part-02/core_java__reflection_and_runtime__method_handles.md"},{"title":"Custom class loaders","quote":"A custom class loader controls how classes are located and defined. It is used in plugin systems, containers, isolation, and hot deployment.","explanation":"","image":"images/part-02/core_java__reflection_and_runtime__custom_class_loaders.png","doc":"docs/part-02/core_java__reflection_and_runtime__custom_class_loaders.md"},{"title":"ServiceLoader","quote":"ServiceLoader discovers implementations of a service interface from classpath or module metadata, enabling lightweight plugin architectures.","explanation":"","image":"images/part-02/core_java__reflection_and_runtime__serviceloader.png","doc":"docs/part-02/core_java__reflection_and_runtime__serviceloader.md"},{"title":"Java modules","quote":"Java modules group packages with explicit dependencies and exported APIs. They improve encapsulation and reliable configuration.","explanation":"","image":"images/part-02/core_java__reflection_and_runtime__java_modules.png","doc":"docs/part-02/core_java__reflection_and_runtime__java_modules.md"},{"title":"JPMS","quote":"The Java Platform Module System uses module-info.java to declare requires, exports, opens, uses, and provides relationships.","explanation":"","image":"images/part-02/core_java__reflection_and_runtime__jpms.png","doc":"docs/part-02/core_java__reflection_and_runtime__jpms.md"},{"title":"Runtime annotations","quote":"Runtime-retained annotations are available through reflection and are widely used by frameworks for configuration and metadata.","explanation":"","image":"images/part-02/core_java__reflection_and_runtime__runtime_annotations.png","doc":"docs/part-02/core_java__reflection_and_runtime__runtime_annotations.md"},{"title":"Annotation processing","quote":"Annotation processors run at compile time to inspect annotations and generate source code, metadata, or validation errors.","explanation":"","image":"images/part-02/core_java__reflection_and_runtime__annotation_processing.png","doc":"docs/part-02/core_java__reflection_and_runtime__annotation_processing.md"},{"title":"Unsafe alternatives","quote":"Modern alternatives to sun.misc.Unsafe include VarHandle, MethodHandle, ByteBuffer, foreign-memory APIs, and standard concurrency classes.","explanation":"","image":"images/part-02/core_java__reflection_and_runtime__unsafe_alternatives.png","doc":"docs/part-02/core_java__reflection_and_runtime__unsafe_alternatives.md"},{"title":"Native methods and JNI","quote":"JNI lets Java call native code and native code call Java. It enables platform integration but adds complexity, portability risk, and memory-safety concerns.","explanation":"","image":"images/part-02/core_java__reflection_and_runtime__native_methods_and_jni.png","doc":"docs/part-02/core_java__reflection_and_runtime__native_methods_and_jni.md"}]}]},{"name":"Java Collections","groups":[{"name":"Core Interfaces","topics":[{"title":"Collection interface","quote":"Collection is the root interface for groups of elements, excluding maps. It defines operations such as add, remove, contains, size, and iteration.","explanation":"","image":"images/part-02/java_collections__core_interfaces__collection_interface.png","doc":"docs/part-02/java_collections__core_interfaces__collection_interface.md"},{"title":"Deque interface","quote":"Deque supports insertion and removal at both ends. It can act as a queue or stack and is usually preferred over Stack.","explanation":"","image":"images/part-02/java_collections__core_interfaces__deque_interface.png","doc":"docs/part-02/java_collections__core_interfaces__deque_interface.md"},{"title":"Map interface","quote":"Map stores key-value associations with unique keys. It is not a subtype of Collection.","explanation":"","image":"images/part-02/java_collections__core_interfaces__map_interface.png","doc":"docs/part-02/java_collections__core_interfaces__map_interface.md"},{"title":"SortedSet","quote":"SortedSet maintains elements in sorted order according to natural ordering or a Comparator.","explanation":"","image":"images/part-02/java_collections__core_interfaces__sortedset.png","doc":"docs/part-02/java_collections__core_interfaces__sortedset.md"},{"title":"NavigableSet","quote":"NavigableSet extends SortedSet with closest-match operations such as lower, floor, ceiling, and higher.","explanation":"","image":"images/part-02/java_collections__core_interfaces__navigableset.png","doc":"docs/part-02/java_collections__core_interfaces__navigableset.md"},{"title":"SortedMap","quote":"SortedMap keeps keys ordered and supports range views such as headMap, tailMap, and subMap.","explanation":"","image":"images/part-02/java_collections__core_interfaces__sortedmap.png","doc":"docs/part-02/java_collections__core_interfaces__sortedmap.md"},{"title":"NavigableMap","quote":"NavigableMap extends SortedMap with navigation methods for nearest keys and descending views.","explanation":"","image":"images/part-02/java_collections__core_interfaces__navigablemap.png","doc":"docs/part-02/java_collections__core_interfaces__navigablemap.md"},{"title":"Iterable and Iterator","quote":"Iterable provides iterator(), enabling enhanced for loops. Iterator traverses elements one at a time and may support safe removal.","explanation":"","image":"images/part-02/java_collections__core_interfaces__iterable_and_iterator.png","doc":"docs/part-02/java_collections__core_interfaces__iterable_and_iterator.md"}]},{"name":"List Implementations","topics":[{"title":"ArrayList internals","quote":"ArrayList stores elements in a resizable array. Random access is fast, while insertion or removal in the middle shifts elements.","explanation":"","image":"images/part-02/java_collections__list_implementations__arraylist_internals.png","doc":"docs/part-02/java_collections__list_implementations__arraylist_internals.md"},{"title":"LinkedList internals","quote":"LinkedList uses doubly linked nodes. End operations are cheap, but indexed access is slow and memory overhead is higher.","explanation":"","image":"images/part-02/java_collections__list_implementations__linkedlist_internals.png","doc":"docs/part-02/java_collections__list_implementations__linkedlist_internals.md"},{"title":"Vector","quote":"Vector is a legacy synchronized resizable array. ArrayList with explicit synchronization or concurrent collections is usually preferred.","explanation":"","image":"images/part-02/java_collections__list_implementations__vector.png","doc":"docs/part-02/java_collections__list_implementations__vector.md"},{"title":"Stack class","quote":"Stack is a legacy LIFO collection extending Vector. ArrayDeque is generally faster and cleaner for stack behavior.","explanation":"","image":"images/part-02/java_collections__list_implementations__stack_class.png","doc":"docs/part-02/java_collections__list_implementations__stack_class.md"},{"title":"CopyOnWriteArrayList","quote":"CopyOnWriteArrayList creates a new internal array for each modification. It is ideal for many reads and very few writes.","explanation":"","image":"images/part-02/java_collections__list_implementations__copyonwritearraylist.png","doc":"docs/part-02/java_collections__list_implementations__copyonwritearraylist.md"},{"title":"Immutable lists","quote":"An immutable list cannot be structurally modified. It is safe to share when its elements are also effectively immutable.","explanation":"","image":"images/part-02/java_collections__list_implementations__immutable_lists.png","doc":"docs/part-02/java_collections__list_implementations__immutable_lists.md"},{"title":"List.of","quote":"List.of creates a compact immutable list that rejects null values and modification operations.","explanation":"","image":"images/part-02/java_collections__list_implementations__list_of.png","doc":"docs/part-02/java_collections__list_implementations__list_of.md"},{"title":"SubList behavior","quote":"subList returns a view backed by the original list. Structural changes outside the view can invalidate it and cause ConcurrentModificationException.","explanation":"","image":"images/part-02/java_collections__list_implementations__sublist_behavior.png","doc":"docs/part-02/java_collections__list_implementations__sublist_behavior.md"},{"title":"Random access lists","quote":"Lists implementing RandomAccess, such as ArrayList, support efficient indexed access. Algorithms may optimize based on this marker interface.","explanation":"","image":"images/part-02/java_collections__list_implementations__random_access_lists.png","doc":"docs/part-02/java_collections__list_implementations__random_access_lists.md"},{"title":"List performance trade-offs","quote":"ArrayList favors indexed reads and append operations; LinkedList favors end insertion but has poor cache locality and usually performs worse in practice.","explanation":"","image":"images/part-02/java_collections__list_implementations__list_performance_trade_offs.png","doc":"docs/part-02/java_collections__list_implementations__list_performance_trade_offs.md"}]},{"name":"Set Implementations","topics":[{"title":"HashSet internals","quote":"HashSet stores elements as keys in a backing HashMap. Uniqueness depends on correct equals and hashCode implementations.","explanation":"","image":"images/part-02/java_collections__set_implementations__hashset_internals.png","doc":"docs/part-02/java_collections__set_implementations__hashset_internals.md"},{"title":"LinkedHashSet","quote":"LinkedHashSet preserves insertion order while providing hash-based uniqueness and near-constant-time lookup.","explanation":"","image":"images/part-02/java_collections__set_implementations__linkedhashset.png","doc":"docs/part-02/java_collections__set_implementations__linkedhashset.md"},{"title":"TreeSet","quote":"TreeSet stores unique elements in sorted order using a balanced tree. Operations are typically O(log n).","explanation":"","image":"images/part-02/java_collections__set_implementations__treeset.png","doc":"docs/part-02/java_collections__set_implementations__treeset.md"},{"title":"EnumSet","quote":"EnumSet is a compact, high-performance set implementation for enum values, internally represented with bit vectors.","explanation":"","image":"images/part-02/java_collections__set_implementations__enumset.png","doc":"docs/part-02/java_collections__set_implementations__enumset.md"},{"title":"CopyOnWriteArraySet","quote":"CopyOnWriteArraySet is optimized for small sets with frequent reads and rare writes. Iterators see a stable snapshot.","explanation":"","image":"images/part-02/java_collections__set_implementations__copyonwritearrayset.png","doc":"docs/part-02/java_collections__set_implementations__copyonwritearrayset.md"},{"title":"ConcurrentSkipListSet","quote":"ConcurrentSkipListSet is a thread-safe sorted set with scalable concurrent access and O(log n) operations.","explanation":"","image":"images/part-02/java_collections__set_implementations__concurrentskiplistset.png","doc":"docs/part-02/java_collections__set_implementations__concurrentskiplistset.md"},{"title":"Set uniqueness rules","quote":"A Set considers elements duplicates according to equals, or according to the Comparator in sorted sets. Consistency between equality and ordering matters.","explanation":"","image":"images/part-02/java_collections__set_implementations__set_uniqueness_rules.png","doc":"docs/part-02/java_collections__set_implementations__set_uniqueness_rules.md"},{"title":"Hash collision handling","quote":"Hash-based collections resolve collisions by storing multiple entries in the same bucket. Modern HashMap may treeify heavily populated buckets.","explanation":"","image":"images/part-02/java_collections__set_implementations__hash_collision_handling.png","doc":"docs/part-02/java_collections__set_implementations__hash_collision_handling.md"}]},{"name":"Map Implementations","topics":[{"title":"HashMap internals","quote":"HashMap uses an array of buckets with linked nodes or balanced trees. Capacity, load factor, hashing, and resizing determine performance.","explanation":"","image":"images/part-02/java_collections__map_implementations__hashmap_internals.png","doc":"docs/part-02/java_collections__map_implementations__hashmap_internals.md"},{"title":"LinkedHashMap","quote":"LinkedHashMap maintains insertion or access order using a linked list across entries. It is useful for predictable iteration and LRU caches.","explanation":"","image":"images/part-02/java_collections__map_implementations__linkedhashmap.png","doc":"docs/part-02/java_collections__map_implementations__linkedhashmap.md"},{"title":"TreeMap","quote":"TreeMap stores entries in a red-black tree ordered by key. Lookup, insertion, and removal are O(log n).","explanation":"","image":"images/part-02/java_collections__map_implementations__treemap.png","doc":"docs/part-02/java_collections__map_implementations__treemap.md"},{"title":"Hashtable","quote":"Hashtable is a legacy synchronized map that rejects null keys and values. ConcurrentHashMap is generally preferred.","explanation":"","image":"images/part-02/java_collections__map_implementations__hashtable.png","doc":"docs/part-02/java_collections__map_implementations__hashtable.md"},{"title":"WeakHashMap","quote":"WeakHashMap holds keys with weak references, allowing entries to disappear when keys are no longer strongly reachable.","explanation":"","image":"images/part-02/java_collections__map_implementations__weakhashmap.png","doc":"docs/part-02/java_collections__map_implementations__weakhashmap.md"},{"title":"IdentityHashMap","quote":"IdentityHashMap compares keys with == instead of equals. It is useful for graph traversal and identity-based metadata.","explanation":"","image":"images/part-02/java_collections__map_implementations__identityhashmap.png","doc":"docs/part-02/java_collections__map_implementations__identityhashmap.md"},{"title":"EnumMap","quote":"EnumMap is a compact and fast map specialized for enum keys. It preserves enum declaration order.","explanation":"","image":"images/part-02/java_collections__map_implementations__enummap.png","doc":"docs/part-02/java_collections__map_implementations__enummap.md"},{"title":"ConcurrentHashMap internals","quote":"ConcurrentHashMap supports high concurrency with fine-grained synchronization and CAS. Reads are mostly non-blocking and nulls are disallowed.","explanation":"","image":"images/part-02/java_collections__map_implementations__concurrenthashmap_internals.png","doc":"docs/part-02/java_collections__map_implementations__concurrenthashmap_internals.md"},{"title":"ConcurrentSkipListMap","quote":"ConcurrentSkipListMap is a thread-safe sorted map implemented with a skip list. It supports scalable navigation and range operations.","explanation":"","image":"images/part-02/java_collections__map_implementations__concurrentskiplistmap.png","doc":"docs/part-02/java_collections__map_implementations__concurrentskiplistmap.md"},{"title":"Map.computeIfAbsent","quote":"computeIfAbsent calculates and inserts a value only when a key is missing. The mapping function should be short and side-effect free.","explanation":"","image":"images/part-02/java_collections__map_implementations__map_computeifabsent.png","doc":"docs/part-02/java_collections__map_implementations__map_computeifabsent.md"},{"title":"Map.merge","quote":"merge inserts a value for a missing key or combines it with the existing value through a remapping function.","explanation":"","image":"images/part-02/java_collections__map_implementations__map_merge.png","doc":"docs/part-02/java_collections__map_implementations__map_merge.md"},{"title":"LRU cache with LinkedHashMap","quote":"An LRU cache can use LinkedHashMap in access-order mode and override removeEldestEntry to evict the least recently used item.","explanation":"","image":"images/part-02/java_collections__map_implementations__lru_cache_with_linkedhashmap.png","doc":"docs/part-02/java_collections__map_implementations__lru_cache_with_linkedhashmap.md"}]},{"name":"Queues and Heaps","topics":[{"title":"PriorityQueue internals","quote":"PriorityQueue uses a binary heap. The smallest element by default is at the head, while iteration order is not sorted.","explanation":"","image":"images/part-02/java_collections__queues_and_heaps__priorityqueue_internals.png","doc":"docs/part-02/java_collections__queues_and_heaps__priorityqueue_internals.md"},{"title":"ArrayDeque","quote":"ArrayDeque is a resizable circular-array deque with fast operations at both ends. It is preferred for stack and queue use.","explanation":"","image":"images/part-02/java_collections__queues_and_heaps__arraydeque.png","doc":"docs/part-02/java_collections__queues_and_heaps__arraydeque.md"},{"title":"BlockingQueue","quote":"BlockingQueue supports producer-consumer coordination by waiting when the queue is empty or full.","explanation":"","image":"images/part-02/java_collections__queues_and_heaps__blockingqueue.png","doc":"docs/part-02/java_collections__queues_and_heaps__blockingqueue.md"},{"title":"ArrayBlockingQueue","quote":"ArrayBlockingQueue is a bounded, array-backed FIFO queue with predictable capacity and optional fairness.","explanation":"","image":"images/part-02/java_collections__queues_and_heaps__arrayblockingqueue.png","doc":"docs/part-02/java_collections__queues_and_heaps__arrayblockingqueue.md"},{"title":"LinkedBlockingQueue","quote":"LinkedBlockingQueue is optionally bounded and node-based. It often offers higher throughput but uses more memory.","explanation":"","image":"images/part-02/java_collections__queues_and_heaps__linkedblockingqueue.png","doc":"docs/part-02/java_collections__queues_and_heaps__linkedblockingqueue.md"},{"title":"PriorityBlockingQueue","quote":"PriorityBlockingQueue is an unbounded thread-safe priority queue. Consumers receive elements by priority rather than insertion order.","explanation":"","image":"images/part-02/java_collections__queues_and_heaps__priorityblockingqueue.png","doc":"docs/part-02/java_collections__queues_and_heaps__priorityblockingqueue.md"},{"title":"DelayQueue","quote":"DelayQueue stores Delayed elements and exposes them only after their delay expires. It is useful for scheduling and expiry workflows.","explanation":"","image":"images/part-02/java_collections__queues_and_heaps__delayqueue.png","doc":"docs/part-02/java_collections__queues_and_heaps__delayqueue.md"},{"title":"SynchronousQueue","quote":"SynchronousQueue has no capacity; each put waits for a matching take. It directly hands work from producer to consumer.","explanation":"","image":"images/part-02/java_collections__queues_and_heaps__synchronousqueue.png","doc":"docs/part-02/java_collections__queues_and_heaps__synchronousqueue.md"},{"title":"TransferQueue","quote":"TransferQueue lets producers optionally wait until consumers receive elements. LinkedTransferQueue is a scalable implementation.","explanation":"","image":"images/part-02/java_collections__queues_and_heaps__transferqueue.png","doc":"docs/part-02/java_collections__queues_and_heaps__transferqueue.md"},{"title":"Deque as stack and queue","quote":"Use addLast and removeFirst for queue behavior, or push and pop for stack behavior. ArrayDeque is usually the best implementation.","explanation":"","image":"images/part-02/java_collections__queues_and_heaps__deque_as_stack_and_queue.png","doc":"docs/part-02/java_collections__queues_and_heaps__deque_as_stack_and_queue.md"}]},{"name":"Iteration and Sorting","topics":[{"title":"Iterator","quote":"Iterator traverses a collection using hasNext and next, and may support remove for the current element.","explanation":"","image":"images/part-02/java_collections__iteration_and_sorting__iterator.png","doc":"docs/part-02/java_collections__iteration_and_sorting__iterator.md"},{"title":"ListIterator","quote":"ListIterator traverses a list in both directions and supports add, set, remove, and index-aware navigation.","explanation":"","image":"images/part-02/java_collections__iteration_and_sorting__listiterator.png","doc":"docs/part-02/java_collections__iteration_and_sorting__listiterator.md"},{"title":"Fail-fast iterators","quote":"Fail-fast iterators detect structural modification outside the iterator and may throw ConcurrentModificationException. This is a bug detector, not a thread-safety guarantee.","explanation":"","image":"images/part-02/java_collections__iteration_and_sorting__fail_fast_iterators.png","doc":"docs/part-02/java_collections__iteration_and_sorting__fail_fast_iterators.md"},{"title":"Fail-safe iteration","quote":"Fail-safe is an informal term for iterators that traverse a snapshot or concurrent structure without throwing ConcurrentModificationException. They may not reflect every concurrent update.","explanation":"","image":"images/part-02/java_collections__iteration_and_sorting__fail_safe_iteration.png","doc":"docs/part-02/java_collections__iteration_and_sorting__fail_safe_iteration.md"},{"title":"Concurrent modification","quote":"Concurrent modification means a collection changes structurally while it is being iterated. With ordinary collections this can invalidate the iterator and trigger ConcurrentModificationException.","explanation":"","image":"images/part-02/java_collections__iteration_and_sorting__concurrent_modification.png","doc":"docs/part-02/java_collections__iteration_and_sorting__concurrent_modification.md"},{"title":"Comparable","quote":"Comparable defines a type\u0027s natural ordering through compareTo. The ordering should be consistent, transitive, and preferably compatible with equals.","explanation":"","image":"images/part-02/java_collections__iteration_and_sorting__comparable.png","doc":"docs/part-02/java_collections__iteration_and_sorting__comparable.md"},{"title":"Comparator","quote":"Comparator defines an external ordering strategy without changing the class itself. It is ideal when multiple sort orders are needed.","explanation":"","image":"images/part-02/java_collections__iteration_and_sorting__comparator.png","doc":"docs/part-02/java_collections__iteration_and_sorting__comparator.md"},{"title":"Comparator chaining","quote":"Comparator chaining combines multiple sort keys using thenComparing. Each later comparator breaks ties from the previous one.","explanation":"","image":"images/part-02/java_collections__iteration_and_sorting__comparator_chaining.png","doc":"docs/part-02/java_collections__iteration_and_sorting__comparator_chaining.md"},{"title":"Stable sorting","quote":"A stable sort preserves the original relative order of elements that compare as equal. This matters when sorting by multiple keys in stages.","explanation":"","image":"images/part-02/java_collections__iteration_and_sorting__stable_sorting.png","doc":"docs/part-02/java_collections__iteration_and_sorting__stable_sorting.md"},{"title":"TimSort","quote":"TimSort is a stable hybrid sorting algorithm used for many object-array and list sorts in Java. It exploits already ordered runs for good real-world performance.","explanation":"","image":"images/part-02/java_collections__iteration_and_sorting__timsort.png","doc":"docs/part-02/java_collections__iteration_and_sorting__timsort.md"},{"title":"Binary search","quote":"Binary search repeatedly halves a sorted search range, giving O(log n) lookup. The data must be sorted with the same ordering used by the search.","explanation":"","image":"images/part-02/java_collections__iteration_and_sorting__binary_search.png","doc":"docs/part-02/java_collections__iteration_and_sorting__binary_search.md"},{"title":"Collection views","quote":"Collection views such as keySet, values, entrySet, subList, and subMap are backed by the original collection. Changes can be reflected both ways.","explanation":"","image":"images/part-02/java_collections__iteration_and_sorting__collection_views.png","doc":"docs/part-02/java_collections__iteration_and_sorting__collection_views.md"},{"title":"Unmodifiable collections","quote":"An unmodifiable collection blocks mutation through that reference but may still reflect changes made to the backing collection.","explanation":"","image":"images/part-02/java_collections__iteration_and_sorting__unmodifiable_collections.png","doc":"docs/part-02/java_collections__iteration_and_sorting__unmodifiable_collections.md"},{"title":"Immutable collections","quote":"An immutable collection cannot change after creation and has no mutable backing state exposed. List.of and Set.of create compact immutable collections.","explanation":"","image":"images/part-02/java_collections__iteration_and_sorting__immutable_collections.png","doc":"docs/part-02/java_collections__iteration_and_sorting__immutable_collections.md"}]}]},{"name":"Functional Java","groups":[{"name":"Functional Interfaces","topics":[{"title":"FunctionalInterface annotation","quote":"@FunctionalInterface documents that an interface must have exactly one abstract method. The compiler reports an error if that contract is broken.","explanation":"","image":"images/part-02/functional_java__functional_interfaces__functionalinterface_annotation.png","doc":"docs/part-02/functional_java__functional_interfaces__functionalinterface_annotation.md"},{"title":"Predicate","quote":"Predicate tests a value and returns boolean. Predicates can be combined with and, or, and negate.","explanation":"","image":"images/part-02/functional_java__functional_interfaces__predicate.png","doc":"docs/part-02/functional_java__functional_interfaces__predicate.md"},{"title":"BiPredicate","quote":"BiPredicate tests two inputs and returns boolean. It is useful for rules that depend on a pair of values.","explanation":"","image":"images/part-02/functional_java__functional_interfaces__bipredicate.png","doc":"docs/part-02/functional_java__functional_interfaces__bipredicate.md"},{"title":"BiFunction","quote":"BiFunction accepts two inputs and produces one result. It generalizes transformations that need two values.","explanation":"","image":"images/part-02/functional_java__functional_interfaces__bifunction.png","doc":"docs/part-02/functional_java__functional_interfaces__bifunction.md"},{"title":"UnaryOperator","quote":"UnaryOperator is a Function whose input and output types are the same. It represents a value transformation.","explanation":"","image":"images/part-02/functional_java__functional_interfaces__unaryoperator.png","doc":"docs/part-02/functional_java__functional_interfaces__unaryoperator.md"},{"title":"BinaryOperator","quote":"BinaryOperator is a BiFunction. It is commonly used in reductions where two values combine into one of the same type.","explanation":"","image":"images/part-02/functional_java__functional_interfaces__binaryoperator.png","doc":"docs/part-02/functional_java__functional_interfaces__binaryoperator.md"},{"title":"BiConsumer","quote":"BiConsumer accepts two values and returns nothing. It is useful for side effects such as processing map entries.","explanation":"","image":"images/part-02/functional_java__functional_interfaces__biconsumer.png","doc":"docs/part-02/functional_java__functional_interfaces__biconsumer.md"},{"title":"Callable","quote":"Callable represents a task that returns a value and may throw checked exceptions. Executors submit Callables and return Futures.","explanation":"","image":"images/part-02/functional_java__functional_interfaces__callable.png","doc":"docs/part-02/functional_java__functional_interfaces__callable.md"},{"title":"Custom functional interfaces","quote":"Create a custom functional interface when standard interfaces do not express the domain clearly or require checked exceptions or specialized signatures.","explanation":"","image":"images/part-02/functional_java__functional_interfaces__custom_functional_interfaces.png","doc":"docs/part-02/functional_java__functional_interfaces__custom_functional_interfaces.md"}]},{"name":"Lambdas","topics":[{"title":"Lambda syntax","quote":"A lambda has parameters, an arrow, and an expression or block body. Types and parentheses may be omitted when the compiler can infer them.","explanation":"","image":"images/part-02/functional_java__lambdas__lambda_syntax.png","doc":"docs/part-02/functional_java__lambdas__lambda_syntax.md"},{"title":"Variable capture","quote":"A lambda can capture local variables from its enclosing scope only when they are final or effectively final. Instance fields can still change.","explanation":"","image":"images/part-02/functional_java__lambdas__variable_capture.png","doc":"docs/part-02/functional_java__lambdas__variable_capture.md"},{"title":"Effectively final variables","quote":"A local variable is effectively final when assigned once and never reassigned. Lambdas may capture it even without the final keyword.","explanation":"","image":"images/part-02/functional_java__lambdas__effectively_final_variables.png","doc":"docs/part-02/functional_java__lambdas__effectively_final_variables.md"},{"title":"Constructor references","quote":"Constructor references such as ArrayList::new create objects through a compatible functional interface. They are concise alternatives to simple construction lambdas.","explanation":"","image":"images/part-02/functional_java__lambdas__constructor_references.png","doc":"docs/part-02/functional_java__lambdas__constructor_references.md"},{"title":"Lambda target typing","quote":"A lambda has no standalone type; its type comes from the target functional interface in the surrounding assignment or method call.","explanation":"","image":"images/part-02/functional_java__lambdas__lambda_target_typing.png","doc":"docs/part-02/functional_java__lambdas__lambda_target_typing.md"},{"title":"Lambda vs anonymous class","quote":"Lambdas are concise implementations of functional interfaces and do not introduce a new this scope. Anonymous classes create a distinct object and class body.","explanation":"","image":"images/part-02/functional_java__lambdas__lambda_vs_anonymous_class.png","doc":"docs/part-02/functional_java__lambdas__lambda_vs_anonymous_class.md"},{"title":"Closures in Java","quote":"A Java lambda behaves like a closure by carrying access to captured values from its lexical scope. Captured locals must be effectively final.","explanation":"","image":"images/part-02/functional_java__lambdas__closures_in_java.png","doc":"docs/part-02/functional_java__lambdas__closures_in_java.md"},{"title":"Currying in Java","quote":"Currying transforms a function of multiple arguments into nested single-argument functions, such as Function\u003e.","explanation":"","image":"images/part-02/functional_java__lambdas__currying_in_java.png","doc":"docs/part-02/functional_java__lambdas__currying_in_java.md"},{"title":"Function composition","quote":"Function composition combines transformations into pipelines using compose and andThen. Order matters because output from one becomes input to the next.","explanation":"","image":"images/part-02/functional_java__lambdas__function_composition.png","doc":"docs/part-02/functional_java__lambdas__function_composition.md"}]}]},{"name":"Java Streams","groups":[{"name":"Stream Fundamentals","topics":[{"title":"Lazy evaluation","quote":"Lazy evaluation delays work until a result is requested. Java streams are lazy for intermediate operations and execute only at a terminal operation.","explanation":"","image":"images/part-02/java_streams__stream_fundamentals__lazy_evaluation.png","doc":"docs/part-02/java_streams__stream_fundamentals__lazy_evaluation.md"},{"title":"Stateless operations","quote":"Stateless stream operations process each element independently, such as filter and map. They are easy to parallelize.","explanation":"","image":"images/part-02/java_streams__stream_fundamentals__stateless_operations.png","doc":"docs/part-02/java_streams__stream_fundamentals__stateless_operations.md"},{"title":"Stateful operations","quote":"Stateful stream operations need information from multiple elements, such as sorted, distinct, limit, or skip. They may require buffering.","explanation":"","image":"images/part-02/java_streams__stream_fundamentals__stateful_operations.png","doc":"docs/part-02/java_streams__stream_fundamentals__stateful_operations.md"},{"title":"Short-circuit operations","quote":"Short-circuit operations can finish without processing every element, such as findFirst, anyMatch, limit, and takeWhile.","explanation":"","image":"images/part-02/java_streams__stream_fundamentals__short_circuit_operations.png","doc":"docs/part-02/java_streams__stream_fundamentals__short_circuit_operations.md"},{"title":"Stream pipeline","quote":"A stream pipeline consists of a source, zero or more intermediate operations, and one terminal operation. Data flows through lazily.","explanation":"","image":"images/part-02/java_streams__stream_fundamentals__stream_pipeline.png","doc":"docs/part-02/java_streams__stream_fundamentals__stream_pipeline.md"},{"title":"Single-use streams","quote":"A stream can be consumed only once. After a terminal operation, create a new stream from the source for another traversal.","explanation":"","image":"images/part-02/java_streams__stream_fundamentals__single_use_streams.png","doc":"docs/part-02/java_streams__stream_fundamentals__single_use_streams.md"},{"title":"Primitive streams","quote":"IntStream, LongStream, and DoubleStream avoid boxing overhead and provide numeric operations such as sum, average, and range.","explanation":"","image":"images/part-02/java_streams__stream_fundamentals__primitive_streams.png","doc":"docs/part-02/java_streams__stream_fundamentals__primitive_streams.md"}]},{"name":"Common Operations","topics":[{"title":"filter","quote":"filter keeps only elements that satisfy a Predicate. It is a stateless intermediate operation.","explanation":"","image":"images/part-02/java_streams__common_operations__filter.png","doc":"docs/part-02/java_streams__common_operations__filter.md"},{"title":"map","quote":"map transforms each stream element into another value using a Function. It preserves one output per input.","explanation":"","image":"images/part-02/java_streams__common_operations__map.png","doc":"docs/part-02/java_streams__common_operations__map.md"},{"title":"flatMap","quote":"flatMap transforms each element into a stream and flattens the nested streams into one sequence.","explanation":"","image":"images/part-02/java_streams__common_operations__flatmap.png","doc":"docs/part-02/java_streams__common_operations__flatmap.md"},{"title":"mapMulti","quote":"mapMulti emits zero or more results through a consumer without creating a temporary stream for each input. It can be more efficient than flatMap.","explanation":"","image":"images/part-02/java_streams__common_operations__mapmulti.png","doc":"docs/part-02/java_streams__common_operations__mapmulti.md"},{"title":"distinct","quote":"distinct removes duplicates according to equals and hashCode. It is stateful because previously seen elements must be tracked.","explanation":"","image":"images/part-02/java_streams__common_operations__distinct.png","doc":"docs/part-02/java_streams__common_operations__distinct.md"},{"title":"sorted","quote":"sorted orders elements by natural order or a Comparator. It is stateful and may need to buffer the whole stream.","explanation":"","image":"images/part-02/java_streams__common_operations__sorted.png","doc":"docs/part-02/java_streams__common_operations__sorted.md"},{"title":"peek","quote":"peek observes elements as they pass through a stream, mainly for debugging. Do not rely on it for essential side effects.","explanation":"","image":"images/part-02/java_streams__common_operations__peek.png","doc":"docs/part-02/java_streams__common_operations__peek.md"},{"title":"limit","quote":"limit keeps at most the first n elements. On ordered parallel streams it can be expensive because encounter order must be preserved.","explanation":"","image":"images/part-02/java_streams__common_operations__limit.png","doc":"docs/part-02/java_streams__common_operations__limit.md"},{"title":"skip","quote":"skip discards the first n elements. Like limit, it may add ordering cost in parallel pipelines.","explanation":"","image":"images/part-02/java_streams__common_operations__skip.png","doc":"docs/part-02/java_streams__common_operations__skip.md"},{"title":"takeWhile","quote":"takeWhile returns the longest prefix of an ordered stream that matches a predicate. Processing stops at the first failure.","explanation":"","image":"images/part-02/java_streams__common_operations__takewhile.png","doc":"docs/part-02/java_streams__common_operations__takewhile.md"},{"title":"dropWhile","quote":"dropWhile removes the longest matching prefix, then returns the remaining elements.","explanation":"","image":"images/part-02/java_streams__common_operations__dropwhile.png","doc":"docs/part-02/java_streams__common_operations__dropwhile.md"},{"title":"forEach","quote":"forEach performs an action for each element. In parallel streams, execution order is not guaranteed.","explanation":"","image":"images/part-02/java_streams__common_operations__foreach.png","doc":"docs/part-02/java_streams__common_operations__foreach.md"},{"title":"forEachOrdered","quote":"forEachOrdered preserves encounter order even in parallel streams, usually at some performance cost.","explanation":"","image":"images/part-02/java_streams__common_operations__foreachordered.png","doc":"docs/part-02/java_streams__common_operations__foreachordered.md"},{"title":"reduce","quote":"reduce combines stream elements into one result using an associative accumulator. Parallel reductions also require a compatible identity and combiner.","explanation":"","image":"images/part-02/java_streams__common_operations__reduce.png","doc":"docs/part-02/java_streams__common_operations__reduce.md"},{"title":"collect","quote":"collect performs mutable reduction into a container or result structure using a Collector or supplier, accumulator, and combiner.","explanation":"","image":"images/part-02/java_streams__common_operations__collect.png","doc":"docs/part-02/java_streams__common_operations__collect.md"},{"title":"toList","quote":"Stream.toList returns an unmodifiable list in encounter order. Do not assume a specific concrete implementation.","explanation":"","image":"images/part-02/java_streams__common_operations__tolist.png","doc":"docs/part-02/java_streams__common_operations__tolist.md"},{"title":"count","quote":"count returns the number of elements in the stream as a long.","explanation":"","image":"images/part-02/java_streams__common_operations__count.png","doc":"docs/part-02/java_streams__common_operations__count.md"},{"title":"min and max","quote":"min and max return an Optional containing the smallest or largest element according to a Comparator.","explanation":"","image":"images/part-02/java_streams__common_operations__min_and_max.png","doc":"docs/part-02/java_streams__common_operations__min_and_max.md"},{"title":"findFirst","quote":"findFirst returns the first element in encounter order. Preserving order can reduce parallel performance.","explanation":"","image":"images/part-02/java_streams__common_operations__findfirst.png","doc":"docs/part-02/java_streams__common_operations__findfirst.md"},{"title":"findAny","quote":"findAny may return any matching element and is often more flexible for parallel execution.","explanation":"","image":"images/part-02/java_streams__common_operations__findany.png","doc":"docs/part-02/java_streams__common_operations__findany.md"},{"title":"anyMatch","quote":"anyMatch returns true when at least one element satisfies the predicate and may stop early.","explanation":"","image":"images/part-02/java_streams__common_operations__anymatch.png","doc":"docs/part-02/java_streams__common_operations__anymatch.md"},{"title":"allMatch","quote":"allMatch returns true only when every element satisfies the predicate. It returns true for an empty stream.","explanation":"","image":"images/part-02/java_streams__common_operations__allmatch.png","doc":"docs/part-02/java_streams__common_operations__allmatch.md"},{"title":"noneMatch","quote":"noneMatch returns true when no element satisfies the predicate. It also returns true for an empty stream.","explanation":"","image":"images/part-02/java_streams__common_operations__nonematch.png","doc":"docs/part-02/java_streams__common_operations__nonematch.md"}]},{"name":"Collectors","topics":[{"title":"Collectors.toList","quote":"Collectors.toList accumulates elements into a List, but does not guarantee mutability or implementation type.","explanation":"","image":"images/part-02/java_streams__collectors__collectors_tolist.png","doc":"docs/part-02/java_streams__collectors__collectors_tolist.md"},{"title":"Collectors.toSet","quote":"Collectors.toSet accumulates unique elements into a Set without guaranteeing ordering or implementation type.","explanation":"","image":"images/part-02/java_streams__collectors__collectors_toset.png","doc":"docs/part-02/java_streams__collectors__collectors_toset.md"},{"title":"Collectors.toMap","quote":"Collectors.toMap builds a Map from key and value functions. Duplicate keys require a merge function.","explanation":"","image":"images/part-02/java_streams__collectors__collectors_tomap.png","doc":"docs/part-02/java_streams__collectors__collectors_tomap.md"},{"title":"Collectors.groupingBy","quote":"groupingBy classifies elements into a Map of groups and can apply a downstream collector to each group.","explanation":"","image":"images/part-02/java_streams__collectors__collectors_groupingby.png","doc":"docs/part-02/java_streams__collectors__collectors_groupingby.md"},{"title":"Collectors.partitioningBy","quote":"partitioningBy divides elements into two groups keyed by true and false based on a Predicate.","explanation":"","image":"images/part-02/java_streams__collectors__collectors_partitioningby.png","doc":"docs/part-02/java_streams__collectors__collectors_partitioningby.md"},{"title":"Collectors.joining","quote":"joining concatenates character sequences, optionally using a delimiter, prefix, and suffix.","explanation":"","image":"images/part-02/java_streams__collectors__collectors_joining.png","doc":"docs/part-02/java_streams__collectors__collectors_joining.md"},{"title":"Collectors.mapping","quote":"mapping transforms elements before passing them to a downstream collector.","explanation":"","image":"images/part-02/java_streams__collectors__collectors_mapping.png","doc":"docs/part-02/java_streams__collectors__collectors_mapping.md"},{"title":"Collectors.flatMapping","quote":"flatMapping maps each input to a stream and flattens the results into a downstream collector.","explanation":"","image":"images/part-02/java_streams__collectors__collectors_flatmapping.png","doc":"docs/part-02/java_streams__collectors__collectors_flatmapping.md"},{"title":"Collectors.filtering","quote":"filtering applies a predicate before forwarding elements to a downstream collector, useful inside grouping operations.","explanation":"","image":"images/part-02/java_streams__collectors__collectors_filtering.png","doc":"docs/part-02/java_streams__collectors__collectors_filtering.md"},{"title":"Collectors.collectingAndThen","quote":"collectingAndThen applies a finishing transformation after another collector completes, such as wrapping a result as unmodifiable.","explanation":"","image":"images/part-02/java_streams__collectors__collectors_collectingandthen.png","doc":"docs/part-02/java_streams__collectors__collectors_collectingandthen.md"},{"title":"Collectors.summarizingInt","quote":"summarizingInt collects count, sum, minimum, maximum, and average into IntSummaryStatistics.","explanation":"","image":"images/part-02/java_streams__collectors__collectors_summarizingint.png","doc":"docs/part-02/java_streams__collectors__collectors_summarizingint.md"},{"title":"Downstream collectors","quote":"A downstream collector processes values inside groupingBy, partitioningBy, mapping, filtering, or flatMapping to produce richer grouped results.","explanation":"","image":"images/part-02/java_streams__collectors__downstream_collectors.png","doc":"docs/part-02/java_streams__collectors__downstream_collectors.md"},{"title":"Custom collectors","quote":"A custom Collector defines supplier, accumulator, combiner, finisher, and characteristics. It should obey associativity and identity rules.","explanation":"","image":"images/part-02/java_streams__collectors__custom_collectors.png","doc":"docs/part-02/java_streams__collectors__custom_collectors.md"}]},{"name":"Parallelism","topics":[{"title":"ForkJoinPool common pool","quote":"The common ForkJoinPool is shared by parallel streams and many CompletableFuture operations. Blocking or heavy unrelated work can cause contention.","explanation":"","image":"images/part-02/java_streams__parallelism__forkjoinpool_common_pool.png","doc":"docs/part-02/java_streams__parallelism__forkjoinpool_common_pool.md"},{"title":"Spliterator","quote":"Spliterator traverses and partitions elements for sequential or parallel processing. Its characteristics help streams optimize execution.","explanation":"","image":"images/part-02/java_streams__parallelism__spliterator.png","doc":"docs/part-02/java_streams__parallelism__spliterator.md"},{"title":"Custom Spliterator","quote":"A custom Spliterator defines traversal, splitting, size estimates, and characteristics for a custom data source.","explanation":"","image":"images/part-02/java_streams__parallelism__custom_spliterator.png","doc":"docs/part-02/java_streams__parallelism__custom_spliterator.md"},{"title":"Associativity in reductions","quote":"A reduction operator must be associative so regrouping values produces the same result. This is essential for correct parallel execution.","explanation":"","image":"images/part-02/java_streams__parallelism__associativity_in_reductions.png","doc":"docs/part-02/java_streams__parallelism__associativity_in_reductions.md"},{"title":"Ordering costs","quote":"Preserving encounter order in parallel streams can require coordination and buffering. Unordered processing may improve scalability when order is irrelevant.","explanation":"","image":"images/part-02/java_streams__parallelism__ordering_costs.png","doc":"docs/part-02/java_streams__parallelism__ordering_costs.md"},{"title":"Parallel stream pitfalls","quote":"Pitfalls include shared mutable state, blocking calls, small workloads, ordering overhead, common-pool contention, and non-associative reductions.","explanation":"","image":"images/part-02/java_streams__parallelism__parallel_stream_pitfalls.png","doc":"docs/part-02/java_streams__parallelism__parallel_stream_pitfalls.md"},{"title":"When parallel streams help","quote":"Parallel streams help with large, splittable, CPU-bound, stateless workloads where each element requires meaningful computation.","explanation":"","image":"images/part-02/java_streams__parallelism__when_parallel_streams_help.png","doc":"docs/part-02/java_streams__parallelism__when_parallel_streams_help.md"},{"title":"Blocking operations in parallel streams","quote":"Blocking IO inside parallel streams ties up common-pool workers and can starve unrelated tasks. Dedicated executors are usually safer.","explanation":"","image":"images/part-02/java_streams__parallelism__blocking_operations_in_parallel_streams.png","doc":"docs/part-02/java_streams__parallelism__blocking_operations_in_parallel_streams.md"},{"title":"Custom pool for parallel streams","quote":"A parallel stream can run inside a custom ForkJoinPool by submitting the whole pipeline to that pool, but pool usage should be explicit and measured.","explanation":"","image":"images/part-02/java_streams__parallelism__custom_pool_for_parallel_streams.png","doc":"docs/part-02/java_streams__parallelism__custom_pool_for_parallel_streams.md"}]}]},{"name":"Java Concurrency","groups":[{"name":"Thread Fundamentals","topics":[{"title":"Process vs thread","quote":"A process has its own memory space and resources, while threads share a process\u0027s memory and run independently within it.","explanation":"","image":"images/part-02/java_concurrency__thread_fundamentals__process_vs_thread.png","doc":"docs/part-02/java_concurrency__thread_fundamentals__process_vs_thread.md"},{"title":"Thread lifecycle","quote":"A thread is created, started, becomes runnable, may block or wait, and eventually terminates. Java exposes these phases through Thread.State.","explanation":"","image":"images/part-02/java_concurrency__thread_fundamentals__thread_lifecycle.png","doc":"docs/part-02/java_concurrency__thread_fundamentals__thread_lifecycle.md"},{"title":"Creating threads","quote":"Threads can be created directly, through Runnable or Callable, or more commonly through executors and virtual-thread APIs.","explanation":"","image":"images/part-02/java_concurrency__thread_fundamentals__creating_threads.png","doc":"docs/part-02/java_concurrency__thread_fundamentals__creating_threads.md"},{"title":"Runnable vs Callable","quote":"Runnable returns no result and cannot declare checked exceptions, while Callable returns a value and may throw checked exceptions.","explanation":"","image":"images/part-02/java_concurrency__thread_fundamentals__runnable_vs_callable.png","doc":"docs/part-02/java_concurrency__thread_fundamentals__runnable_vs_callable.md"},{"title":"Thread interruption","quote":"Interruption is a cooperative cancellation signal. Code should check the interrupt status or handle InterruptedException and usually restore the flag when propagating.","explanation":"","image":"images/part-02/java_concurrency__thread_fundamentals__thread_interruption.png","doc":"docs/part-02/java_concurrency__thread_fundamentals__thread_interruption.md"},{"title":"Daemon threads","quote":"Daemon threads do not keep the JVM alive when only daemon threads remain. They are unsuitable for critical work that must finish.","explanation":"","image":"images/part-02/java_concurrency__thread_fundamentals__daemon_threads.png","doc":"docs/part-02/java_concurrency__thread_fundamentals__daemon_threads.md"},{"title":"Thread priorities","quote":"Thread priorities are scheduler hints with platform-dependent behavior. Correctness must never rely on them.","explanation":"","image":"images/part-02/java_concurrency__thread_fundamentals__thread_priorities.png","doc":"docs/part-02/java_concurrency__thread_fundamentals__thread_priorities.md"},{"title":"Thread groups","quote":"ThreadGroup is a legacy mechanism for grouping threads. Modern code typically uses executors, structured concurrency, and explicit tracking.","explanation":"","image":"images/part-02/java_concurrency__thread_fundamentals__thread_groups.png","doc":"docs/part-02/java_concurrency__thread_fundamentals__thread_groups.md"},{"title":"Thread uncaught exception handler","quote":"An uncaught exception handler receives exceptions that terminate a thread without being caught. It is useful for logging and failure reporting.","explanation":"","image":"images/part-02/java_concurrency__thread_fundamentals__thread_uncaught_exception_handler.png","doc":"docs/part-02/java_concurrency__thread_fundamentals__thread_uncaught_exception_handler.md"},{"title":"Thread states","quote":"Java thread states are NEW, RUNNABLE, BLOCKED, WAITING, TIMED_WAITING, and TERMINATED.","explanation":"","image":"images/part-02/java_concurrency__thread_fundamentals__thread_states.png","doc":"docs/part-02/java_concurrency__thread_fundamentals__thread_states.md"}]},{"name":"Synchronization","topics":[{"title":"Intrinsic locks","quote":"Every Java object has an intrinsic monitor lock used by synchronized methods and blocks. Lock acquisition is reentrant.","explanation":"","image":"images/part-02/java_concurrency__synchronization__intrinsic_locks.png","doc":"docs/part-02/java_concurrency__synchronization__intrinsic_locks.md"},{"title":"synchronized methods","quote":"A synchronized instance method locks this; a synchronized static method locks the Class object. Only one thread can hold that monitor at a time.","explanation":"","image":"images/part-02/java_concurrency__synchronization__synchronized_methods.png","doc":"docs/part-02/java_concurrency__synchronization__synchronized_methods.md"},{"title":"synchronized blocks","quote":"A synchronized block locks a chosen object for a limited critical section, allowing finer control than synchronizing an entire method.","explanation":"","image":"images/part-02/java_concurrency__synchronization__synchronized_blocks.png","doc":"docs/part-02/java_concurrency__synchronization__synchronized_blocks.md"},{"title":"ReentrantLock","quote":"ReentrantLock provides explicit locking with tryLock, interruptible acquisition, fairness options, and multiple Conditions.","explanation":"","image":"images/part-02/java_concurrency__synchronization__reentrantlock.png","doc":"docs/part-02/java_concurrency__synchronization__reentrantlock.md"},{"title":"ReadWriteLock","quote":"ReadWriteLock separates shared read access from exclusive write access. It helps when reads greatly outnumber writes.","explanation":"","image":"images/part-02/java_concurrency__synchronization__readwritelock.png","doc":"docs/part-02/java_concurrency__synchronization__readwritelock.md"},{"title":"StampedLock","quote":"StampedLock supports write, read, and optimistic-read modes. It is not reentrant and requires careful stamp validation and release.","explanation":"","image":"images/part-02/java_concurrency__synchronization__stampedlock.png","doc":"docs/part-02/java_concurrency__synchronization__stampedlock.md"},{"title":"Condition","quote":"A Condition works with Lock like multiple wait sets, providing await and signal operations for specific state changes.","explanation":"","image":"images/part-02/java_concurrency__synchronization__condition.png","doc":"docs/part-02/java_concurrency__synchronization__condition.md"},{"title":"Lock fairness","quote":"A fair lock tends to grant access in waiting order, reducing starvation but often lowering throughput.","explanation":"","image":"images/part-02/java_concurrency__synchronization__lock_fairness.png","doc":"docs/part-02/java_concurrency__synchronization__lock_fairness.md"},{"title":"Deadlock","quote":"Deadlock occurs when threads wait forever for locks held by one another. Prevent it with consistent lock ordering, timeouts, or reduced lock scope.","explanation":"","image":"images/part-02/java_concurrency__synchronization__deadlock.png","doc":"docs/part-02/java_concurrency__synchronization__deadlock.md"},{"title":"Livelock","quote":"Livelock occurs when threads keep reacting to each other and changing state but make no real progress. Unlike deadlock, they remain active.","explanation":"","image":"images/part-02/java_concurrency__synchronization__livelock.png","doc":"docs/part-02/java_concurrency__synchronization__livelock.md"},{"title":"Starvation","quote":"Starvation happens when a thread is repeatedly denied CPU time, locks, or other resources because other threads keep winning access.","explanation":"","image":"images/part-02/java_concurrency__synchronization__starvation.png","doc":"docs/part-02/java_concurrency__synchronization__starvation.md"},{"title":"Lock ordering","quote":"Lock ordering prevents deadlock by requiring every thread to acquire multiple locks in the same global order.","explanation":"","image":"images/part-02/java_concurrency__synchronization__lock_ordering.png","doc":"docs/part-02/java_concurrency__synchronization__lock_ordering.md"},{"title"
