nation":"","image":"images/part-02/spring_security__token_security__refresh_tokens.png","doc":"docs/part-02/spring_security__token_security__refresh_tokens.md"},{"title":"Token rotation","quote":"Token rotation replaces a refresh token each time it is used and detects reuse of older tokens.","explanation":"","image":"images/part-02/spring_security__token_security__token_rotation.png","doc":"docs/part-02/spring_security__token_security__token_rotation.md"},{"title":"Token revocation","quote":"Token revocation invalidates a token before natural expiry through server-side state, deny lists, token versioning, or key rotation.","explanation":"","image":"images/part-02/spring_security__token_security__token_revocation.png","doc":"docs/part-02/spring_security__token_security__token_revocation.md"},{"title":"OAuth 2.0","quote":"OAuth 2.0 is an authorization framework that lets clients obtain scoped access tokens without handling the user\u0027s password.","explanation":"","image":"images/part-02/spring_security__token_security__oauth_2_0.png","doc":"docs/part-02/spring_security__token_security__oauth_2_0.md"},{"title":"OpenID Connect","quote":"OpenID Connect adds authentication and identity claims on top of OAuth 2.0, commonly through an ID token and user-info endpoint.","explanation":"","image":"images/part-02/spring_security__token_security__openid_connect.png","doc":"docs/part-02/spring_security__token_security__openid_connect.md"},{"title":"Resource server","quote":"A resource server hosts protected APIs and validates access tokens before serving requests.","explanation":"","image":"images/part-02/spring_security__token_security__resource_server.png","doc":"docs/part-02/spring_security__token_security__resource_server.md"},{"title":"Authorization server","quote":"An authorization server authenticates users or clients and issues access, refresh, and identity tokens according to configured grants.","explanation":"","image":"images/part-02/spring_security__token_security__authorization_server.png","doc":"docs/part-02/spring_security__token_security__authorization_server.md"},{"title":"PKCE","quote":"Proof Key for Code Exchange binds an authorization-code flow to the client that initiated it, protecting public clients from code interception.","explanation":"","image":"images/part-02/spring_security__token_security__pkce.png","doc":"docs/part-02/spring_security__token_security__pkce.md"},{"title":"Client credentials flow","quote":"The client credentials grant issues an access token directly to a trusted machine client acting on its own behalf.","explanation":"","image":"images/part-02/spring_security__token_security__client_credentials_flow.png","doc":"docs/part-02/spring_security__token_security__client_credentials_flow.md"}]}]},{"name":"Spring Data JPA","groups":[{"name":"Repositories","topics":[{"title":"JpaRepository","quote":"JpaRepository extends repository abstractions with JPA-specific operations such as flush, batch deletion, and entity references.","explanation":"","image":"images/part-02/spring_data_jpa__repositories__jparepository.png","doc":"docs/part-02/spring_data_jpa__repositories__jparepository.md"},{"title":"CrudRepository","quote":"CrudRepository provides basic create, read, update, delete, count, and existence operations.","explanation":"","image":"images/part-02/spring_data_jpa__repositories__crudrepository.png","doc":"docs/part-02/spring_data_jpa__repositories__crudrepository.md"},{"title":"PagingAndSortingRepository","quote":"PagingAndSortingRepository adds pagination and sorting operations to repository access.","explanation":"","image":"images/part-02/spring_data_jpa__repositories__pagingandsortingrepository.png","doc":"docs/part-02/spring_data_jpa__repositories__pagingandsortingrepository.md"},{"title":"Derived query methods","quote":"Spring Data derives queries from method names such as findByStatusAndCreatedAtAfter. Keep names readable and use explicit queries when logic becomes complex.","explanation":"","image":"images/part-02/spring_data_jpa__repositories__derived_query_methods.png","doc":"docs/part-02/spring_data_jpa__repositories__derived_query_methods.md"},{"title":"JPQL","quote":"JPQL queries entities and their mapped fields rather than tables and columns.","explanation":"","image":"images/part-02/spring_data_jpa__repositories__jpql.png","doc":"docs/part-02/spring_data_jpa__repositories__jpql.md"},{"title":"Native queries","quote":"Native queries execute database-specific SQL directly. They provide full SQL power but reduce portability.","explanation":"","image":"images/part-02/spring_data_jpa__repositories__native_queries.png","doc":"docs/part-02/spring_data_jpa__repositories__native_queries.md"},{"title":"Specifications","quote":"Specifications build reusable, composable JPA predicates for dynamic queries through the Criteria API.","explanation":"","image":"images/part-02/spring_data_jpa__repositories__specifications.png","doc":"docs/part-02/spring_data_jpa__repositories__specifications.md"},{"title":"Query by example","quote":"Query by example builds a query from a probe object and matching rules. It is convenient for simple dynamic filters.","explanation":"","image":"images/part-02/spring_data_jpa__repositories__query_by_example.png","doc":"docs/part-02/spring_data_jpa__repositories__query_by_example.md"},{"title":"Projections","quote":"Projections return only selected fields through interfaces, DTOs, tuples, or records, reducing unnecessary entity loading.","explanation":"","image":"images/part-02/spring_data_jpa__repositories__projections.png","doc":"docs/part-02/spring_data_jpa__repositories__projections.md"},{"title":"Pagination","quote":"Pagination retrieves a limited slice of results. Offset pagination is simple, while keyset pagination scales better for deep pages.","explanation":"","image":"images/part-02/spring_data_jpa__repositories__pagination.png","doc":"docs/part-02/spring_data_jpa__repositories__pagination.md"},{"title":"Sorting","quote":"Sorting defines result order by one or more properties and directions. Stable pagination requires a deterministic final sort key.","explanation":"","image":"images/part-02/spring_data_jpa__repositories__sorting.png","doc":"docs/part-02/spring_data_jpa__repositories__sorting.md"},{"title":"Auditing","quote":"Spring Data auditing automatically records created-by, created-date, last-modified-by, and last-modified-date values.","explanation":"","image":"images/part-02/spring_data_jpa__repositories__auditing.png","doc":"docs/part-02/spring_data_jpa__repositories__auditing.md"}]},{"name":"Persistence Behavior","topics":[{"title":"Persistence context","quote":"The persistence context tracks managed entities, guarantees identity within its scope, and coordinates dirty checking and writes.","explanation":"","image":"images/part-02/spring_data_jpa__persistence_behavior__persistence_context.png","doc":"docs/part-02/spring_data_jpa__persistence_behavior__persistence_context.md"},{"title":"Entity states","quote":"JPA entity states are transient, managed, detached, and removed. Operations behave differently depending on the current state.","explanation":"","image":"images/part-02/spring_data_jpa__persistence_behavior__entity_states.png","doc":"docs/part-02/spring_data_jpa__persistence_behavior__entity_states.md"},{"title":"Dirty checking","quote":"Dirty checking detects changes to managed entities and generates updates during flush without an explicit update call.","explanation":"","image":"images/part-02/spring_data_jpa__persistence_behavior__dirty_checking.png","doc":"docs/part-02/spring_data_jpa__persistence_behavior__dirty_checking.md"},{"title":"Flush","quote":"Flush synchronizes pending persistence-context changes with the database while the transaction may still remain uncommitted.","explanation":"","image":"images/part-02/spring_data_jpa__persistence_behavior__flush.png","doc":"docs/part-02/spring_data_jpa__persistence_behavior__flush.md"},{"title":"First-level cache","quote":"The first-level cache is the mandatory persistence-context cache. Repeated lookup of the same entity ID returns the same managed instance.","explanation":"","image":"images/part-02/spring_data_jpa__persistence_behavior__first_level_cache.png","doc":"docs/part-02/spring_data_jpa__persistence_behavior__first_level_cache.md"},{"title":"Second-level cache","quote":"The second-level cache stores entity data beyond one persistence context and can reduce database reads across transactions.","explanation":"","image":"images/part-02/spring_data_jpa__persistence_behavior__second_level_cache.png","doc":"docs/part-02/spring_data_jpa__persistence_behavior__second_level_cache.md"},{"title":"Lazy loading","quote":"Lazy loading delays fetching related data until it is first accessed. It reduces unnecessary work but can fail outside an active persistence context and can trigger many hidden queries.","explanation":"","image":"images/part-03/spring_data_jpa__persistence_behavior__lazy_loading.png","doc":"docs/part-03/spring_data_jpa__persistence_behavior__lazy_loading.md"},{"title":"Eager loading","quote":"Eager loading fetches related data immediately with the parent entity. It can simplify access but may load too much data and create large joins.","explanation":"","image":"images/part-03/spring_data_jpa__persistence_behavior__eager_loading.png","doc":"docs/part-03/spring_data_jpa__persistence_behavior__eager_loading.md"},{"title":"N+1 problem","quote":"The N+1 problem occurs when one query loads parent rows and then one additional query runs for each parent to load related data.","explanation":"","image":"images/part-03/spring_data_jpa__persistence_behavior__n_1_problem.png","doc":"docs/part-03/spring_data_jpa__persistence_behavior__n_1_problem.md"},{"title":"Fetch join","quote":"A fetch join loads an entity and selected associations in one JPQL query. It is effective for targeted reads but can multiply rows for collection joins.","explanation":"","image":"images/part-03/spring_data_jpa__persistence_behavior__fetch_join.png","doc":"docs/part-03/spring_data_jpa__persistence_behavior__fetch_join.md"},{"title":"Entity graph","quote":"An entity graph declares which associations should be fetched for a specific query without changing the entity\u0027s default fetch configuration.","explanation":"","image":"images/part-03/spring_data_jpa__persistence_behavior__entity_graph.png","doc":"docs/part-03/spring_data_jpa__persistence_behavior__entity_graph.md"},{"title":"Batch fetching","quote":"Batch fetching loads several lazy associations or entities in one query using an IN clause, reducing repeated database round trips.","explanation":"","image":"images/part-03/spring_data_jpa__persistence_behavior__batch_fetching.png","doc":"docs/part-03/spring_data_jpa__persistence_behavior__batch_fetching.md"},{"title":"Optimistic locking","quote":"Optimistic locking detects concurrent updates using a version field. Conflicting transactions fail instead of silently overwriting each other.","explanation":"","image":"images/part-03/spring_data_jpa__persistence_behavior__optimistic_locking.png","doc":"docs/part-03/spring_data_jpa__persistence_behavior__optimistic_locking.md"},{"title":"Pessimistic locking","quote":"Pessimistic locking asks the database to lock rows during a transaction. It prevents conflicting access but can reduce concurrency and cause deadlocks.","explanation":"","image":"images/part-03/spring_data_jpa__persistence_behavior__pessimistic_locking.png","doc":"docs/part-03/spring_data_jpa__persistence_behavior__pessimistic_locking.md"}]}]},{"name":"Spring Transactions","groups":[{"name":"Transaction Management","topics":[{"title":"Transactional annotation","quote":"@Transactional defines transaction boundaries and settings such as propagation, isolation, read-only behavior, timeout, and rollback rules.","explanation":"","image":"images/part-03/spring_transactions__transaction_management__transactional_annotation.png","doc":"docs/part-03/spring_transactions__transaction_management__transactional_annotation.md"},{"title":"Transaction proxy","quote":"Spring usually applies transactions through an AOP proxy that starts and completes a transaction around eligible method calls.","explanation":"","image":"images/part-03/spring_transactions__transaction_management__transaction_proxy.png","doc":"docs/part-03/spring_transactions__transaction_management__transaction_proxy.md"},{"title":"Propagation REQUIRED","quote":"REQUIRED joins an existing transaction or creates a new one when none exists. It is Spring\u0027s default propagation mode.","explanation":"","image":"images/part-03/spring_transactions__transaction_management__propagation_required.png","doc":"docs/part-03/spring_transactions__transaction_management__propagation_required.md"},{"title":"Propagation REQUIRES_NEW","quote":"REQUIRES_NEW suspends the current transaction and starts an independent one. Its commit or rollback is separate from the outer transaction.","explanation":"","image":"images/part-03/spring_transactions__transaction_management__propagation_requires_new.png","doc":"docs/part-03/spring_transactions__transaction_management__propagation_requires_new.md"},{"title":"Propagation NESTED","quote":"NESTED creates a savepoint inside the existing transaction when supported, allowing partial rollback while keeping the outer transaction active.","explanation":"","image":"images/part-03/spring_transactions__transaction_management__propagation_nested.png","doc":"docs/part-03/spring_transactions__transaction_management__propagation_nested.md"},{"title":"Propagation SUPPORTS","quote":"SUPPORTS joins a transaction when one exists but executes without a transaction otherwise.","explanation":"","image":"images/part-03/spring_transactions__transaction_management__propagation_supports.png","doc":"docs/part-03/spring_transactions__transaction_management__propagation_supports.md"},{"title":"Isolation levels","quote":"Isolation levels control which concurrent transaction effects can be observed, balancing consistency against locking and throughput.","explanation":"","image":"images/part-03/spring_transactions__transaction_management__isolation_levels.png","doc":"docs/part-03/spring_transactions__transaction_management__isolation_levels.md"},{"title":"Read-only transactions","quote":"A read-only transaction communicates intent and may enable persistence or database optimizations, but it is not a universal enforcement mechanism.","explanation":"","image":"images/part-03/spring_transactions__transaction_management__read_only_transactions.png","doc":"docs/part-03/spring_transactions__transaction_management__read_only_transactions.md"},{"title":"Rollback rules","quote":"Spring rolls back by default for unchecked exceptions and Errors. Checked exceptions require explicit rollback rules when rollback is desired.","explanation":"","image":"images/part-03/spring_transactions__transaction_management__rollback_rules.png","doc":"docs/part-03/spring_transactions__transaction_management__rollback_rules.md"},{"title":"Transaction synchronization","quote":"Transaction synchronization registers callbacks that run before commit, after commit, after completion, or when resources are bound and released.","explanation":"","image":"images/part-03/spring_transactions__transaction_management__transaction_synchronization.png","doc":"docs/part-03/spring_transactions__transaction_management__transaction_synchronization.md"},{"title":"Programmatic transactions","quote":"Programmatic transaction management uses TransactionTemplate or a transaction manager directly when transaction boundaries must be controlled dynamically.","explanation":"","image":"images/part-03/spring_transactions__transaction_management__programmatic_transactions.png","doc":"docs/part-03/spring_transactions__transaction_management__programmatic_transactions.md"},{"title":"Self-invocation transaction pitfall","quote":"A method call from one method to another on the same object bypasses the Spring proxy, so @Transactional on the called method may not take effect.","explanation":"","image":"images/part-03/spring_transactions__transaction_management__self_invocation_transaction_pitfall.png","doc":"docs/part-03/spring_transactions__transaction_management__self_invocation_transaction_pitfall.md"}]}]},{"name":"Spring Integration","groups":[{"name":"Messaging and Integration","topics":[{"title":"Spring Integration","quote":"Spring Integration implements enterprise integration patterns such as channels, routers, transformers, filters, adapters, and gateways.","explanation":"","image":"images/part-03/spring_integration__messaging_and_integration__spring_integration.png","doc":"docs/part-03/spring_integration__messaging_and_integration__spring_integration.md"},{"title":"Message channels","quote":"A message channel connects producers and consumers. It may deliver messages directly, queue them, publish to many subscribers, or bridge external systems.","explanation":"","image":"images/part-03/spring_integration__messaging_and_integration__message_channels.png","doc":"docs/part-03/spring_integration__messaging_and_integration__message_channels.md"},{"title":"Message handlers","quote":"Message handlers consume messages and perform work such as transformation, routing, filtering, persistence, or outbound communication.","explanation":"","image":"images/part-03/spring_integration__messaging_and_integration__message_handlers.png","doc":"docs/part-03/spring_integration__messaging_and_integration__message_handlers.md"},{"title":"Spring Cloud Stream","quote":"Spring Cloud Stream builds message-driven applications through binder abstractions for systems such as Kafka and RabbitMQ.","explanation":"","image":"images/part-03/spring_integration__messaging_and_integration__spring_cloud_stream.png","doc":"docs/part-03/spring_integration__messaging_and_integration__spring_cloud_stream.md"},{"title":"Binding model","quote":"The binding model connects application inputs and outputs to external messaging destinations through configurable binders.","explanation":"","image":"images/part-03/spring_integration__messaging_and_integration__binding_model.png","doc":"docs/part-03/spring_integration__messaging_and_integration__binding_model.md"},{"title":"Functional bindings","quote":"Functional bindings expose Supplier, Function, or Consumer beans as message producers, processors, or consumers.","explanation":"","image":"images/part-03/spring_integration__messaging_and_integration__functional_bindings.png","doc":"docs/part-03/spring_integration__messaging_and_integration__functional_bindings.md"},{"title":"Spring Kafka","quote":"Spring Kafka provides templates, listener containers, serialization support, transactions, retries, error handling, and testing utilities for Kafka.","explanation":"","image":"images/part-03/spring_integration__messaging_and_integration__spring_kafka.png","doc":"docs/part-03/spring_integration__messaging_and_integration__spring_kafka.md"},{"title":"KafkaTemplate","quote":"KafkaTemplate sends records to Kafka asynchronously and supports keys, headers, partitions, callbacks, and transactions.","explanation":"","image":"images/part-03/spring_integration__messaging_and_integration__kafkatemplate.png","doc":"docs/part-03/spring_integration__messaging_and_integration__kafkatemplate.md"},{"title":"Kafka listener containers","quote":"Listener containers manage Kafka consumers, polling, thread assignment, acknowledgments, commits, retries, and lifecycle.","explanation":"","image":"images/part-03/spring_integration__messaging_and_integration__kafka_listener_containers.png","doc":"docs/part-03/spring_integration__messaging_and_integration__kafka_listener_containers.md"},{"title":"Spring AMQP","quote":"Spring AMQP provides abstractions for AMQP messaging, especially RabbitMQ, including templates, listener containers, converters, and retry support.","explanation":"","image":"images/part-03/spring_integration__messaging_and_integration__spring_amqp.png","doc":"docs/part-03/spring_integration__messaging_and_integration__spring_amqp.md"},{"title":"RabbitTemplate","quote":"RabbitTemplate sends and receives RabbitMQ messages and supports exchanges, routing keys, conversion, confirms, and returns.","explanation":"","image":"images/part-03/spring_integration__messaging_and_integration__rabbittemplate.png","doc":"docs/part-03/spring_integration__messaging_and_integration__rabbittemplate.md"},{"title":"Integration testing messaging","quote":"Messaging integration tests should verify serialization, routing, acknowledgments, retries, ordering, and failure behavior against a real or containerized broker.","explanation":"","image":"images/part-03/spring_integration__messaging_and_integration__integration_testing_messaging.png","doc":"docs/part-03/spring_integration__messaging_and_integration__integration_testing_messaging.md"}]}]},{"name":"Microservices","groups":[{"name":"Foundations","topics":[{"title":"Microservices architecture","quote":"Microservices architecture structures a system as independently deployable services aligned to business capabilities and owned by autonomous teams.","explanation":"","image":"images/part-03/microservices__foundations__microservices_architecture.png","doc":"docs/part-03/microservices__foundations__microservices_architecture.md"},{"title":"Monolith vs microservices","quote":"A monolith deploys one application unit, while microservices split capabilities into distributed services. Microservices add operational and consistency complexity.","explanation":"","image":"images/part-03/microservices__foundations__monolith_vs_microservices.png","doc":"docs/part-03/microservices__foundations__monolith_vs_microservices.md"},{"title":"Modular monolith","quote":"A modular monolith remains one deployment but enforces strong internal module boundaries, making it simpler than microservices while preserving separation.","explanation":"","image":"images/part-03/microservices__foundations__modular_monolith.png","doc":"docs/part-03/microservices__foundations__modular_monolith.md"},{"title":"Service boundaries","quote":"Service boundaries define what a service owns, exposes, and changes independently. Good boundaries follow business capabilities rather than technical layers.","explanation":"","image":"images/part-03/microservices__foundations__service_boundaries.png","doc":"docs/part-03/microservices__foundations__service_boundaries.md"},{"title":"Bounded contexts","quote":"A bounded context defines a domain model and language that are internally consistent. Different contexts may model the same real-world concept differently.","explanation":"","image":"images/part-03/microservices__foundations__bounded_contexts.png","doc":"docs/part-03/microservices__foundations__bounded_contexts.md"},{"title":"Independent deployment","quote":"Independent deployment means a service can be released without coordinating changes across unrelated services, provided contracts remain compatible.","explanation":"","image":"images/part-03/microservices__foundations__independent_deployment.png","doc":"docs/part-03/microservices__foundations__independent_deployment.md"},{"title":"Database per service","quote":"Database per service gives each service exclusive ownership of its data. Other services access that data through APIs or events rather than direct queries.","explanation":"","image":"images/part-03/microservices__foundations__database_per_service.png","doc":"docs/part-03/microservices__foundations__database_per_service.md"},{"title":"Polyglot persistence","quote":"Polyglot persistence selects different storage technologies for different service needs, such as relational, document, key-value, or graph databases.","explanation":"","image":"images/part-03/microservices__foundations__polyglot_persistence.png","doc":"docs/part-03/microservices__foundations__polyglot_persistence.md"},{"title":"Team ownership","quote":"Strong service ownership means one team is responsible for design, delivery, operation, reliability, and evolution of a capability.","explanation":"","image":"images/part-03/microservices__foundations__team_ownership.png","doc":"docs/part-03/microservices__foundations__team_ownership.md"},{"title":"Microservice granularity","quote":"Service granularity should balance autonomy and cohesion against network cost, operational overhead, and distributed transactions.","explanation":"","image":"images/part-03/microservices__foundations__microservice_granularity.png","doc":"docs/part-03/microservices__foundations__microservice_granularity.md"},{"title":"Distributed systems fallacies","quote":"The distributed systems fallacies are false assumptions such as reliable networks, zero latency, infinite bandwidth, and stable topology.","explanation":"","image":"images/part-03/microservices__foundations__distributed_systems_fallacies.png","doc":"docs/part-03/microservices__foundations__distributed_systems_fallacies.md"}]},{"name":"Communication","topics":[{"title":"Synchronous REST communication","quote":"Synchronous REST communication gives immediate request-response semantics but couples availability and latency between caller and callee.","explanation":"","image":"images/part-03/microservices__communication__synchronous_rest_communication.png","doc":"docs/part-03/microservices__communication__synchronous_rest_communication.md"},{"title":"Asynchronous messaging","quote":"Asynchronous messaging decouples producers and consumers in time, absorbs spikes, and supports retries, but introduces eventual consistency and operational complexity.","explanation":"","image":"images/part-03/microservices__communication__asynchronous_messaging.png","doc":"docs/part-03/microservices__communication__asynchronous_messaging.md"},{"title":"Request-response","quote":"Request-response sends a request and expects a corresponding result. It may be synchronous or asynchronous but retains a direct interaction relationship.","explanation":"","image":"images/part-03/microservices__communication__request_response.png","doc":"docs/part-03/microservices__communication__request_response.md"},{"title":"Publish-subscribe","quote":"Publish-subscribe lets one producer emit an event to multiple independent subscribers without knowing who consumes it.","explanation":"","image":"images/part-03/microservices__communication__publish_subscribe.png","doc":"docs/part-03/microservices__communication__publish_subscribe.md"},{"title":"gRPC","quote":"gRPC is a high-performance RPC framework using Protocol Buffers and HTTP/2. It supports strongly typed contracts, streaming, and generated clients.","explanation":"","image":"images/part-03/microservices__communication__grpc.png","doc":"docs/part-03/microservices__communication__grpc.md"},{"title":"GraphQL federation","quote":"GraphQL federation composes multiple domain-owned GraphQL subgraphs into one unified schema and query entry point.","explanation":"","image":"images/part-03/microservices__communication__graphql_federation.png","doc":"docs/part-03/microservices__communication__graphql_federation.md"},{"title":"Service contracts","quote":"A service contract defines request, response, event, error, authentication, and compatibility expectations between providers and consumers.","explanation":"","image":"images/part-03/microservices__communication__service_contracts.png","doc":"docs/part-03/microservices__communication__service_contracts.md"},{"title":"API versioning","quote":"API versioning allows incompatible contract changes while older consumers continue working. Prefer backward-compatible evolution before introducing a new version.","explanation":"","image":"images/part-03/microservices__communication__api_versioning.png","doc":"docs/part-03/microservices__communication__api_versioning.md"},{"title":"Backward compatibility","quote":"A change is backward compatible when existing consumers continue to function without modification.","explanation":"","image":"images/part-03/microservices__communication__backward_compatibility.png","doc":"docs/part-03/microservices__communication__backward_compatibility.md"},{"title":"Consumer-driven contracts","quote":"Consumer-driven contract testing captures consumer expectations and verifies that providers continue satisfying them.","explanation":"","image":"images/part-03/microservices__communication__consumer_driven_contracts.png","doc":"docs/part-03/microservices__communication__consumer_driven_contracts.md"},{"title":"Idempotent APIs","quote":"An idempotent API produces the same intended result when the same request is repeated, usually through stable identifiers or idempotency keys.","explanation":"","image":"images/part-03/microservices__communication__idempotent_apis.png","doc":"docs/part-03/microservices__communication__idempotent_apis.md"},{"title":"Correlation IDs","quote":"A correlation ID follows one logical request across services, logs, traces, and messages to simplify distributed debugging.","explanation":"","image":"images/part-03/microservices__communication__correlation_ids.png","doc":"docs/part-03/microservices__communication__correlation_ids.md"}]},{"name":"Discovery and Routing","topics":[{"title":"Client-side discovery","quote":"With client-side discovery, the caller queries a service registry and chooses an instance directly.","explanation":"","image":"images/part-03/microservices__discovery_and_routing__client_side_discovery.png","doc":"docs/part-03/microservices__discovery_and_routing__client_side_discovery.md"},{"title":"Server-side discovery","quote":"With server-side discovery, a load balancer or gateway discovers service instances and routes requests on behalf of clients.","explanation":"","image":"images/part-03/microservices__discovery_and_routing__server_side_discovery.png","doc":"docs/part-03/microservices__discovery_and_routing__server_side_discovery.md"},{"title":"Eureka","quote":"Eureka is a service registry where instances register themselves and clients discover available endpoints.","explanation":"","image":"images/part-03/microservices__discovery_and_routing__eureka.png","doc":"docs/part-03/microservices__discovery_and_routing__eureka.md"},{"title":"Consul","quote":"Consul provides service discovery, health checks, key-value configuration, and service-mesh capabilities.","explanation":"","image":"images/part-03/microservices__discovery_and_routing__consul.png","doc":"docs/part-03/microservices__discovery_and_routing__consul.md"},{"title":"Kubernetes service discovery","quote":"Kubernetes provides service discovery through stable Service names and cluster DNS while Pods can be created and replaced dynamically.","explanation":"","image":"images/part-03/microservices__discovery_and_routing__kubernetes_service_discovery.png","doc":"docs/part-03/microservices__discovery_and_routing__kubernetes_service_discovery.md"},{"title":"Spring Cloud Gateway","quote":"Spring Cloud Gateway is a reactive API gateway for routing, filtering, security integration, rate limiting, and cross-cutting policies.","explanation":"","image":"images/part-03/microservices__discovery_and_routing__spring_cloud_gateway.png","doc":"docs/part-03/microservices__discovery_and_routing__spring_cloud_gateway.md"},{"title":"Gateway routing","quote":"Gateway routing matches incoming requests by path, host, headers, method, or custom predicates and forwards them to downstream services.","explanation":"","image":"images/part-03/microservices__discovery_and_routing__gateway_routing.png","doc":"docs/part-03/microservices__discovery_and_routing__gateway_routing.md"},{"title":"Gateway filters","quote":"Gateway filters modify requests or responses and implement concerns such as authentication, logging, retries, header changes, and circuit breaking.","explanation":"","image":"images/part-03/microservices__discovery_and_routing__gateway_filters.png","doc":"docs/part-03/microservices__discovery_and_routing__gateway_filters.md"},{"title":"Rate limiting at gateway","quote":"Gateway rate limiting protects downstream services by restricting requests per identity, tenant, route, or time window.","explanation":"","image":"images/part-03/microservices__discovery_and_routing__rate_limiting_at_gateway.png","doc":"docs/part-03/microservices__discovery_and_routing__rate_limiting_at_gateway.md"},{"title":"BFF pattern","quote":"Backend for Frontend creates a dedicated backend tailored to one client type, such as mobile or web, reducing client-specific complexity in shared services.","explanation":"","image":"images/part-03/microservices__discovery_and_routing__bff_pattern.png","doc":"docs/part-03/microservices__discovery_and_routing__bff_pattern.md"}]},{"name":"Resilience","topics":[{"title":"Circuit breaker","quote":"A circuit breaker stops calls to a failing dependency after a threshold, then probes recovery after a delay.","explanation":"","image":"images/part-03/microservices__resilience__circuit_breaker.png","doc":"docs/part-03/microservices__resilience__circuit_breaker.md"},{"title":"Retry","quote":"Retry repeats a failed operation when the failure is likely transient. It requires limits, backoff, jitter, and idempotency.","explanation":"","image":"images/part-03/microservices__resilience__retry.png","doc":"docs/part-03/microservices__resilience__retry.md"},{"title":"Timeouts","quote":"Timeouts bound how long a service waits for a dependency. Every remote call should have explicit connection and response deadlines.","explanation":"","image":"images/part-03/microservices__resilience__timeouts.png","doc":"docs/part-03/microservices__resilience__timeouts.md"},{"title":"Bulkhead","quote":"A bulkhead isolates resources such as threads, connections, or concurrency limits so one failing dependency cannot exhaust the entire service.","explanation":"","image":"images/part-03/microservices__resilience__bulkhead.png","doc":"docs/part-03/microservices__resilience__bulkhead.md"},{"title":"Rate limiter","quote":"A rate limiter controls request frequency using algorithms such as token bucket, leaky bucket, fixed window, or sliding window.","explanation":"","image":"images/part-03/microservices__resilience__rate_limiter.png","doc":"docs/part-03/microservices__resilience__rate_limiter.md"},{"title":"Fallback","quote":"A fallback returns an alternate result or reduced capability when a dependency fails. It must not hide critical errors or return misleading data.","explanation":"","image":"images/part-03/microservices__resilience__fallback.png","doc":"docs/part-03/microservices__resilience__fallback.md"},{"title":"Hedged requests","quote":"Hedged requests send a duplicate request after a delay and use the first successful response, reducing tail latency at the cost of extra load.","explanation":"","image":"images/part-03/microservices__resilience__hedged_requests.png","doc":"docs/part-03/microservices__resilience__hedged_requests.md"},{"title":"Load shedding","quote":"Load shedding rejects low-priority or excess work before resources are exhausted, preserving service for critical traffic.","explanation":"","image":"images/part-03/microservices__resilience__load_shedding.png","doc":"docs/part-03/microservices__resilience__load_shedding.md"},{"title":"Resilience4j","quote":"Resilience4j provides lightweight Java implementations of circuit breaker, retry, rate limiter, bulkhead, timeout, and cache patterns.","explanation":"","image":"images/part-03/microservices__resilience__resilience4j.png","doc":"docs/part-03/microservices__resilience__resilience4j.md"},{"title":"Retry storms","quote":"A retry storm occurs when many clients retry failures simultaneously, multiplying load on an already unhealthy system.","explanation":"","image":"images/part-03/microservices__resilience__retry_storms.png","doc":"docs/part-03/microservices__resilience__retry_storms.md"},{"title":"Cascading failures","quote":"A cascading failure spreads when one slow or failing component consumes shared resources and causes dependent components to fail.","explanation":"","image":"images/part-03/microservices__resilience__cascading_failures.png","doc":"docs/part-03/microservices__resilience__cascading_failures.md"},{"title":"Graceful degradation","quote":"Graceful degradation keeps essential functionality available while disabling or simplifying noncritical features during failure.","explanation":"","image":"images/part-03/microservices__resilience__graceful_degradation.png","doc":"docs/part-03/microservices__resilience__graceful_degradation.md"}]},{"name":"Distributed Data","topics":[{"title":"Distributed transactions","quote":"Distributed transactions coordinate changes across multiple resources or services. They are expensive and often replaced by sagas or event-driven consistency.","explanation":"","image":"images/part-03/microservices__distributed_data__distributed_transactions.png","doc":"docs/part-03/microservices__distributed_data__distributed_transactions.md"},{"title":"Saga pattern","quote":"A saga breaks a business transaction into local transactions connected by events or commands, with compensations for failure.","explanation":"","image":"images/part-03/microservices__distributed_data__saga_pattern.png","doc":"docs/part-03/microservices__distributed_data__saga_pattern.md"},{"title":"Choreography saga","quote":"In choreography, each service reacts to events and emits the next event without a central coordinator.","explanation":"","image":"images/part-03/microservices__distributed_data__choreography_saga.png","doc":"docs/part-03/microservices__distributed_data__choreography_saga.md"},{"title":"Orchestration saga","quote":"In orchestration, a central coordinator directs each saga step and decides compensating actions when a step fails.","explanation":"","image":"images/part-03/microservices__distributed_data__orchestration_saga.png","doc":"docs/part-03/microservices__distributed_data__orchestration_saga.md"},{"title":"Transactional outbox","quote":"The transactional outbox stores business changes and an event record in the same database transaction, then publishes the event asynchronously.","explanation":"","image":"images/part-03/microservices__distributed_data__transactional_outbox.png","doc":"docs/part-03/microservices__distributed_data__transactional_outbox.md"},{"title":"Inbox pattern","quote":"The inbox pattern records processed message IDs or incoming events so consumers can handle redelivery idempotently.","explanation":"","image":"images/part-03/microservices__distributed_data__inbox_pattern.png","doc":"docs/part-03/microservices__distributed_data__inbox_pattern.md"},{"title":"Eventual consistency","quote":"Eventual consistency means replicas or services may temporarily disagree but converge after updates propagate.","explanation":"","image":"images/part-03/microservices__distributed_data__eventual_consistency.png","doc":"docs/part-03/microservices__distributed_data__eventual_consistency.md"},{"title":"Compensating transactions","quote":"A compensating transaction semantically reverses or offsets a completed business step when a later saga step fails.","explanation":"","image":"images/part-03/microservices__distributed_data__compensating_transactions.png","doc":"docs/part-03/microservices__distributed_data__compensating_transactions.md"},{"title":"Dual-write problem","quote":"The dual-write problem occurs when updating a database and publishing a message separately, allowing one operation to succeed while the other fails.","explanation":"","image":"images/part-03/microservices__distributed_data__dual_write_problem.png","doc":"docs/part-03/microservices__distributed_data__dual_write_problem.md"},{"title":"Change data capture","quote":"Change data capture streams database changes from logs or tables into downstream systems without modifying the original write path.","explanation":"","image":"images/part-03/microservices__distributed_data__change_data_capture.png","doc":"docs/part-03/microservices__distributed_data__change_data_capture.md"},{"title":"Idempotent consumers","quote":"An idempotent consumer safely handles the same message more than once by detecting duplicates or making repeated processing harmless.","explanation":"","image":"images/part-03/microservices__distributed_data__idempotent_consumers.png","doc":"docs/part-03/microservices__distributed_data__idempotent_consumers.md"},{"title":"Exactly-once semantics","quote":"Exactly-once semantics means each logical effect occurs once despite retries or failures. In practice it requires coordinated idempotency, transactions, or deduplication.","explanation":"","image":"images/part-03/microservices__distributed_data__exactly_once_semantics.png","doc":"docs/part-03/microservices__distributed_data__exactly_once_semantics.md"}]},{"name":"Event-Driven Architecture","topics":[{"title":"Domain events","quote":"A domain event represents something meaningful that happened inside a bounded context, such as OrderConfirmed.","explanation":"","image":"images/part-03/microservices__event_driven_architecture__domain_events.png","doc":"docs/part-03/microservices__event_driven_architecture__domain_events.md"},{"title":"Integration events","quote":"An integration event is a stable external message used to notify other services about a completed business fact.","explanation":"","image":"images/part-03/microservices__event_driven_architecture__integration_events.png","doc":"docs/part-03/microservices__event_driven_architecture__integration_events.md"},{"title":"Event sourcing","quote":"Event sourcing stores an entity\u0027s state as an append-only sequence of events and rebuilds current state by replaying them.","explanation":"","image":"images/part-03/microservices__event_driven_architecture__event_sourcing.png","doc":"docs/part-03/microservices__event_driven_architecture__event_sourcing.md"},{"title":"CQRS","quote":"Command Query Responsibility Segregation separates write models from read models so each can be optimized independently.","explanation":"","image":"images/part-03/microservices__event_driven_architecture__cqrs.png","doc":"docs/part-03/microservices__event_driven_architecture__cqrs.md"},{"title":"Event schema evolution","quote":"Event schema evolution changes event structure without breaking old producers, consumers, or retained historical messages.","explanation":"","image":"images/part-03/microservices__event_driven_architecture__event_schema_evolution.png","doc":"docs/part-03/microservices__event_driven_architecture__event_schema_evolution.md"},{"title":"Event versioning","quote":"Event versioning identifies incompatible event shapes or semantics and provides migration or compatibility strategies.","explanation":"","image":"images/part-03/microservices__event_driven_architecture__event_versioning.png","doc":"docs/part-03/microservices__event_driven_architecture__event_versioning.md"},{"title":"Dead-letter queues","quote":"A dead-letter queue stores messages that could not be processed after configured retries, allowing investigation and controlled replay.","explanation":"","image":"images/part-03/microservices__event_driven_architecture__dead_letter_queues.png","doc":"docs/part-03/microservices__event_driven_architecture__dead_letter_queues.md"},{"title":"Poison messages","quote":"A poison message repeatedly fails processing because of invalid content, unsupported schema, or a deterministic consumer bug.","explanation":"","image":"images/part-03/microservices__event_driven_architecture__poison_messages.png","doc":"docs/part-03/microservices__event_driven_architecture__poison_messages.md"},{"title":"Replay strategies","quote":"Replay strategies define how historical events are reprocessed safely, including offsets, rate limits, idempotency, and side-effect control.","explanation":"","image":"images/part-03/microservices__event_driven_architecture__replay_strategies.png","doc":"docs/part-03/microservices__event_driven_architecture__replay_strategies.md"},{"title":"Event ordering","quote":"Event ordering guarantees depend on the broker and partitioning model. Global ordering is expensive, so systems usually preserve order per key.","explanation":"","image":"images/part-03/microservices__event_driven_architecture__event_ordering.png","doc":"docs/part-03/microservices__event_driven_architecture__event_ordering.md"},{"title":"Event deduplication","quote":"Event deduplication detects repeated event IDs or business keys and prevents duplicate side effects within a defined retention window.","explanation":"","image":"images/part-03/microservices__event_driven_architecture__event_deduplication.png","doc":"docs/part-03/microservices__event_driven_architecture__event_deduplication.md"},{"title":"Event-driven observability","quote":"Event-driven observability traces an event from producer to consumer using correlation IDs, broker metrics, consumer lag, retries, failures, and processing latency.","explanation":"","image":"images/part-03/microservices__event_driven_architecture__event_driven_observability.png","doc":"docs/part-03/microservices__event_driven_architecture__event_driven_observability.md"}]}]},{"name":"Software Architecture","groups":[{"name":"Architecture Styles","topics":[{"title":"Layered architecture","quote":"Layered architecture separates responsibilities into layers such as presentation, application, domain, and data access. It is simple but can encourage rigid dependencies.","explanation":"","image":"images/part-03/software_architecture__architecture_styles__layered_architecture.png","doc":"docs/part-03/software_architecture__architecture_styles__layered_architecture.md"},{"title":"Hexagonal architecture","quote":"Hexagonal architecture places domain logic at the center and connects external systems through ports and adapters, keeping business rules independent of frameworks.","explanation":"","image":"images/part-03/software_architecture__architecture_styles__hexagonal_architecture.png","doc":"docs/part-03/software_architecture__architecture_styles__hexagonal_architecture.md"},{"title":"Clean architecture","quote":"Clean architecture organizes code around use cases and dependency rules that point inward toward stable business policies.","explanation":"","image":"images/part-03/software_architecture__architecture_styles__clean_architecture.png","doc":"docs/part-03/software_architecture__architecture_styles__clean_architecture.md"},{"title":"Onion architecture","quote":"Onion architecture uses concentric layers with the domain model at the center. Outer infrastructure depends on inner abstractions, never the reverse.","explanation":"","image":"images/part-03/software_architecture__architecture_styles__onion_architecture.png","doc":"docs/part-03/software_architecture__architecture_styles__onion_architecture.md"},{"title":"Event-driven architecture","quote":"Event-driven architecture lets components publish and react to events asynchronously, improving decoupling and scalability while introducing eventual consistency.","explanation":"","image":"images/part-03/software_architecture__architecture_styles__event_driven_architecture.png","doc":"docs/part-03/software_architecture__architecture_styles__event_driven_architecture.md"},{"title":"Pipe-and-filter","quote":"Pipe-and-filter architecture processes data through independent transformation stages connected as a pipeline.","explanation":"","image":"images/part-03/software_architecture__architecture_styles__pipe_and_filter.png","doc":"docs/part-03/software_architecture__architecture_styles__pipe_and_filter.md"},{"title":"Microkernel architecture","quote":"Microkernel architecture keeps a small core system and adds optional capabilities through plugins, making product customization easier.","explanation":"","image":"images/part-03/software_architecture__architecture_styles__microkernel_architecture.png","doc":"docs/part-03/software_architecture__architecture_styles__microkernel_architecture.md"},{"title":"Space-based architecture","quote":"Space-based architecture distributes processing and state across in-memory nodes to reduce database bottlenecks during extreme load.","explanation":"","image":"images/part-03/software_architecture__architecture_styles__space_based_architecture.png","doc":"docs/part-03/software_architecture__architecture_styles__space_based_architecture.md"},{"title":"Serverless architecture","quote":"Serverless architecture uses managed functions and services that scale on demand, reducing infrastructure work but increasing platform coupling and cold-start concerns.","explanation":"","image":"images/part-03/software_architecture__architecture_styles__serverless_architecture.png","doc":"docs/part-03/software_architecture__architecture_styles__serverless_architecture.md"},{"title":"Service-oriented architecture","quote":"Service-oriented architecture organizes business capabilities as reusable services, often with centralized integration and governance.","explanation":"","image":"images/part-03/software_architecture__architecture_styles__service_oriented_architecture.png","doc":"docs/part-03/software_architecture__architecture_styles__service_oriented_architecture.md"},{"title":"Cell-based architecture","quote":"Cell-based architecture divides a system into isolated, repeatable units containing compute, data, and dependencies, limiting failure blast radius.","explanation":"","image":"images/part-03/software_architecture__architecture_styles__cell_based_architecture.png","doc":"docs/part-03/software_architecture__architecture_styles__cell_based_architecture.md"}]},{"name":"Design Principles","topics":[{"title":"Separation of concerns","quote":"Separation of concerns assigns different responsibilities to distinct modules so each can change with minimal impact on others.","explanation":"","image":"images/part-03/software_architecture__design_principles__separation_of_concerns.png","doc":"docs/part-03/software_architecture__design_principles__separation_of_concerns.md"},{"title":"High cohesion","quote":"High cohesion means a module contains closely related responsibilities that belong together.","explanation":"","image":"images/part-03/software_architecture__design_principles__high_cohesion.png","doc":"docs/part-03/software_architecture__design_principles__high_cohesion.md"},{"title":"Low coupling","quote":"Low coupling means modules depend on each other through small, stable contracts rather than internal details.","explanation":"","image":"images/part-03/software_architecture__design_principles__low_coupling.png","doc":"docs/part-03/software_architecture__design_principles__low_coupling.md"},{"title":"Information hiding","quote":"Information hiding keeps implementation decisions private behind an interface so callers depend only on stable behavior.","explanation":"","image":"images/part-03/software_architecture__design_principles__information_hiding.png","doc":"docs/part-03/software_architecture__design_principles__information_hiding.md"},{"title":"Design for change","quote":"Design for change isolates volatile decisions, keeps contracts explicit, and avoids premature abstractions that make evolution harder.","explanation":"","image":"images/part-03/software_architecture__design_principles__design_for_change.png","doc":"docs/part-03/software_architecture__design_principles__design_for_change.md"},{"title":"Evolutionary architecture","quote":"Evolutionary architecture supports incremental change through modularity, automation, observability, and continuous architectural validation.","explanation":"","image":"images/part-03/software_architecture__design_principles__evolutionary_architecture.png","doc":"docs/part-03/software_architecture__design_principles__evolutionary_architecture.md"},{"title":"Architecture fitness functions","quote":"Architecture fitness functions are automated checks that verify qualities such as dependency rules, latency, security, or resilience over time.","explanation":"","image":"images/part-03/software_architecture__design_principles__architecture_fitness_functions.png","doc":"docs/part-03/software_architecture__design_principles__architecture_fitness_functions.md"},{"title":"Trade-off analysis","quote":"Trade-off analysis compares architecture options against competing qualities such as latency, cost, consistency, complexity, and operability.","explanation":"","image":"images/part-03/software_architecture__design_principles__trade_off_analysis.png","doc":"docs/part-03/software_architecture__design_principles__trade_off_analysis.md"},{"title":"Architecture decision records","quote":"An architecture decision record captures a significant decision, its context, alternatives, consequences, and current status.","explanation":"","image":"images/part-03/software_architecture__design_principles__architecture_decision_records.png","doc":"docs/part-03/software_architecture__design_principles__architecture_decision_records.md"}]},{"name":"Distributed Systems","topics":[{"title":"CAP theorem","quote":"CAP states that during a network partition, a distributed system must choose between consistent responses and always-available responses.","explanation":"","image":"images/part-03/software_architecture__distributed_systems__cap_theorem.png","doc":"docs/part-03/software_architecture__distributed_systems__cap_theorem.md"},{"title":"PACELC theorem","quote":"PACELC extends CAP: during a partition choose availability or consistency, and otherwise choose latency or consistency.","explanation":"","image":"images/part-03/software_architecture__distributed_systems__pacelc_theorem.png","doc":"docs/part-03/software_architecture__distributed_systems__pacelc_theorem.md"},{"title":"Consensus","quote":"Consensus lets distributed nodes agree on one value or ordered log despite failures, using algorithms such as Raft or Paxos.","explanation":"","image":"images/part-03/software_architecture__distributed_systems__consensus.png","doc":"docs/part-03/software_architecture__distributed_systems__consensus.md"},{"title":"Leader election","quote":"Leader election selects one node to coordinate work or writes while other nodes follow or stand by.","explanation":"","image":"images/part-03/software_architecture__distributed_systems__leader_election.png","doc":"docs/part-03/software_architecture__distributed_systems__leader_election.md"},{"title":"Quorum reads and writes","quote":"Quorum reads and writes require responses from a subset of replicas. Choosing read and write quorum sizes can improve consistency.","explanation":"","image":"images/part-03/software_architecture__distributed_systems__quorum_reads_and_writes.png","doc":"docs/part-03/software_architecture__distributed_systems__quorum_reads_and_writes.md"},{"title":"Vector clocks","quote":"Vector clocks track causal history across nodes and can detect whether versions are ordered or concurrent.","explanation":"","image":"images/part-03/software_architecture__distributed_systems__vector_clocks.png","doc":"docs/part-03/software_architecture__distributed_systems__vector_clocks.md"},{"title":"Lamport clocks","quote":"Lamport clocks assign logical timestamps that preserve causal ordering, though they cannot detect all concurrent events.","explanation":"","image":"images/part-03/software_architecture__distributed_systems__lamport_clocks.png","doc":"docs/part-03/software_architecture__distributed_systems__lamport_clocks.md"},{"title":"Distributed locks","quote":"A distributed lock coordinates exclusive access across processes. Correct designs require leases, fencing tokens, and failure handling.","explanation":"","image":"images/part-03/software_architecture__distributed_systems__distributed_locks.png","doc":"docs/part-03/software_architecture__distributed_systems__distributed_locks.md"},{"title":"Split-brain","quote":"Split-brain occurs when multiple partitions believe they are authoritative, risking conflicting writes and divergent state.","explanation":"","image":"images/part-03/software_architecture__distributed_systems__split_brain.png","doc":"docs/part-03/software_architecture__distributed_systems__split_brain.md"},{"title":"Clock skew","quote":"Clock skew is the difference between machine clocks. Distributed systems should avoid assuming perfectly synchronized wall-clock time.","explanation":"","image":"images/part-03/software_architecture__distributed_systems__clock_skew.png","doc":"docs/part-03/software_architecture__distributed_systems__clock_skew.md"},{"title":"Network partitions","quote":"A network partition prevents nodes from communicating while they may still be running. Systems must define availability and consistency behavior during it.","explanation":"","image":"images/part-03/software_architecture__distributed_systems__network_partitions.png","doc":"docs/part-03/software_architecture__distributed_systems__network_partitions.md"},{"title":"Gossip protocols","quote":"Gossip protocols spread state gradually through peer-to-peer exchanges, providing scalable membership and failure information.","explanation":"","image":"images/part-03/software_architecture__distributed_systems__gossip_protocols.png","doc":"docs/part-03/software_architecture__distributed_systems__gossip_protocols.md"},{"title":"Failure detectors","quote":"Failure detectors infer whether nodes are unavailable using heartbeats, timeouts, or suspicion levels, but cannot be perfectly accurate in asynchronous networks.","explanation":"","image":"images/part-03/software_architecture__distributed_systems__failure_detectors.png","doc":"docs/part-03/software_architecture__distributed_systems__failure_detectors.md"}]},{"name":"Scalability","topics":[{"title":"Horizontal scaling","quote":"Horizontal scaling adds more instances and distributes traffic or data among them.","explanation":"","image":"images/part-03/software_architecture__scalability__horizontal_scaling.png","doc":"docs/part-03/software_architecture__scalability__horizontal_scaling.md"},{"title":"Vertical scaling","quote":"Vertical scaling gives one machine more CPU, memory, or storage. It is simple but eventually reaches hardware and availability limits.","explanation":"","image":"images/part-03/software_architecture__scalability__vertical_scaling.png","doc":"docs/part-03/software_architecture__scalability__vertical_scaling.md"},{"title":"Stateless services","quote":"A stateless service keeps no client-specific session state locally, making requests easy to route across interchangeable instances.","explanation":"","image":"images/part-03/software_architecture__scalability__stateless_services.png","doc":"docs/part-03/software_architecture__scalability__stateless_services.md"},{"title":"Load balancing","quote":"Load balancing distributes requests across healthy instances using algorithms such as round robin, least connections, hashing, or weighted routing.","explanation":"","image":"images/part-03/software_architecture__scalability__load_balancing.png","doc":"docs/part-03/software_architecture__scalability__load_balancing.md"},{"title":"Caching strategies","quote":"Caching strategies include cache-aside, read-through, write-through, write-behind, and refresh-ahead, each with different consistency trade-offs.","explanation":"","image":"images/part-03/software_architecture__scalability__caching_strategies.png","doc":"docs/part-03/software_architecture__scalability__caching_strategies.md"},{"title":"Partitioning","quote":"Partitioning divides data or workload into smaller independent segments to improve scale, locality, and manageability.","explanation":"","image":"images/part-03/software_architecture__scalability__partitioning.png","doc":"docs/part-03/software_architecture__scalability__partitioning.md"},{"title":"Sharding","quote":"Sharding distributes data partitions across separate database nodes, usually according to a shard key.","explanation":"","image":"images/part-03/software_architecture__scalability__sharding.png","doc":"docs/part-03/software_architecture__scalability__sharding.md"},{"title":"Read replicas","quote":"Read replicas copy data from a primary and serve read traffic, improving scale but introducing replication lag.","explanation":"","image":"images/part-03/software_architecture__scalability__read_replicas.png","doc":"docs/part-03/software_architecture__scalability__read_replicas.md"},{"title":"CQRS for scaling","quote":"CQRS scales reads and writes independently by separating command models from query models.","explanation":"","image":"images/part-03/software_architecture__scalability__cqrs_for_scaling.png","doc":"docs/part-03/software_architecture__scalability__cqrs_for_scaling.md"},{"title":"Hot partition problem","quote":"A hot partition receives disproportionate traffic because of a poor key distribution or popular item, creating a localized bottleneck.","explanation":"","image":"images/part-03/software_architecture__scalability__hot_partition_problem.png","doc":"docs/part-03/software_architecture__scalability__hot_partition_problem.md"},{"title":"Multi-region architecture","quote":"Multi-region architecture deploys workloads across geographic regions for latency, resilience, or regulatory needs, but complicates data consistency.","explanation":"","image":"images/part-03/software_architecture__scalability__multi_region_architecture.png","doc":"docs/part-03/software_architecture__scalability__multi_region_architecture.md"},{"title":"Active-active architecture","quote":"Active-active architecture serves traffic from multiple regions or sites simultaneously and requires conflict-aware data handling.","explanation":"","image":"images/part-03/software_architecture__scalability__active_active_architecture.png","doc":"docs/part-03/software_architecture__scalability__active_active_architecture.md"},{"title":"Active-passive architecture","quote":"Active-passive architecture uses one active site and one standby site that takes over during failure.","explanation":"","image":"images/part-03/software_architecture__scalability__active_passive_architecture.png","doc":"docs/part-03/software_architecture__scalability__active_passive_architecture.md"}]}]},{"name":"Design Patterns","groups":[{"name":"Creational Patterns","topics":[{"title":"Singleton","quote":"Singleton ensures one shared instance within a defined scope. It should be used carefully because global state harms testing and modularity.","explanation":"","image":"images/part-03/design_patterns__creational_patterns__singleton.png","doc":"docs/part-03/design_patterns__creational_patterns__singleton.md"},{"title":"Factory Method","quote":"Factory Method delegates object creation to subclasses or specialized methods while callers depend on an abstraction.","explanation":"","image":"images/part-03/design_patterns__creational_patterns__factory_method.png","doc":"docs/part-03/design_patterns__creational_patterns__factory_method.md"},{"title":"Abstract Factory","quote":"Abstract Factory creates families of related objects without exposing concrete classes.","explanation":"","image":"images/part-03/design_patterns__creational_patterns__abstract_factory.png","doc":"docs/part-03/design_patterns__creational_patterns__abstract_factory.md"},{"title":"Builder","quote":"Builder constructs complex objects step by step and is useful when many optional parameters or validation rules exist.","explanation":"","image":"images/part-03/design_patterns__creational_patterns__builder.png","doc":"docs/part-03/design_patterns__creational_patterns__builder.md"},{"title":"Prototype","quote":"Prototype creates new objects by copying an existing configured instance.","explanation":"","image":"images/part-03/design_patterns__creational_patterns__prototype.png","doc":"docs/part-03/design_patterns__creational_patterns__prototype.md"}]},{"name":"Structural Patterns","topics":[{"title":"Adapter","quote":"Adapter converts one interface into another expected by a client.","explanation":"","image":"images/part-03/design_patterns__structural_patterns__adapter.png","doc":"docs/part-03/design_patterns__structural_patterns__adapter.md"},{"title":"Bridge","quote":"Bridge separates an abstraction from its implementation so both can evolve independently.","explanation":"","image":"images/part-03/design_patterns__structural_patterns__bridge.png","doc":"docs/part-03/design_patterns__structural_patterns__bridge.md"},{"title":"Composite","quote":"Composite represents individual objects and groups through the same interface, enabling tree structures.","explanation":"","image":"images/part-03/design_patterns__structural_patterns__composite.png","doc":"docs/part-03/design_patterns__structural_patterns__composite.md"},{"title":"Decorator","quote":"Decorator adds behavior by wrapping an object without changing its class.","explanation":"","image":"images/part-03/design_patterns__structural_patterns__decorator.png","doc":"docs/part-03/design_patterns__structural_patterns__decorator.md"},{"title":"Facade","quote":"Facade provides a simplified entry point over a complex subsystem.","explanation":"","image":"images/part-03/design_patterns__structural_patterns__facade.png","doc":"docs/part-03/design_patterns__structural_patterns__facade.md"},{"title":"Flyweight","quote":"Flyweight reduces memory by sharing immutable intrinsic state across many lightweight objects.","explanation":"","image":"images/part-03/design_patterns__structural_patterns__flyweight.png","doc":"docs/part-03/design_patterns__structural_patterns__flyweight.md"},{"title":"Proxy","quote":"Proxy stands in for another object to control access, add lazy loading, remote communication, caching, or security.","explanation":"","image":"images/part-03/design_patterns__structural_patterns__proxy.png","doc":"docs/part-03/design_patterns__structural_patterns__proxy.md"}]},{"name":"Behavioral Patterns","topics":[{"title":"Chain of Responsibility","quote":"Chain of Responsibility passes a request through handlers until one processes it or the chain ends.","explanation":"","image":"images/part-03/design_patterns__behavioral_patterns__chain_of_responsibility.png","doc":"docs/part-03/design_patterns__behavioral_patterns__chain_of_responsibility.md"},{"title":"Command","quote":"Command represents an action as an object, enabling queuing, retries, logging, undo, and decoupled invocation.","explanation":"","image":"images/part-03/design_patterns__behavioral_patterns__command.png","doc":"docs/part-03/design_patterns__behavioral_patterns__command.md"},{"title":"Mediator","quote":"Mediator centralizes communication between collaborating objects so they do not depend directly on each other.","explanation":"","image":"images/part-03/design_patterns__behavioral_patterns__mediator.png","doc":"docs/part-03/design_patterns__behavioral_patterns__mediator.md"},{"title":"Memento","quote":"Memento captures an object\u0027s state so it can later be restored without exposing internals.","explanation":"","image":"images/part-03/design_patterns__behavioral_patterns__memento.png","doc":"docs/part-03/design_patterns__behavioral_patterns__memento.md"},{"title":"Observer","quote":"Observer notifies subscribed listeners when a subject changes, supporting one-to-many event propagation.","explanation":"","image":"images/part-03/design_patterns__behavioral_patterns__observer.png","doc":"docs/part-03/design_patterns__behavioral_patterns__observer.md"},{"title":"State","quote":"State lets an object change behavior when its internal state changes by delegating to state-specific implementations.","explanation":"","image":"images/part-03/design_patterns__behavioral_patterns__state.png","doc":"docs/part-03/design_patterns__behavioral_patterns__state.md"},{"title":"Strategy","quote":"Strategy encapsulates interchangeable algorithms behind one interface and selects one at runtime.","explanation":"","image":"images/part-03/design_patterns__behavioral_patterns__strategy.png","doc":"docs/part-03/design_patterns__behavioral_patterns__strategy.md"},{"title":"Template Method","quote":"Template Method defines an algorithm skeleton in a base class while subclasses customize selected steps.","explanation":"","image":"images/part-03/design_patterns__behavioral_patterns__template_method.png","doc":"docs/part-03/design_patterns__behavioral_patterns__template_method.md"},{"title":"Visitor","quote":"Visitor adds operations to a stable object structure without modifying the element classes, at the cost of harder model evolution.","explanation":"","image":"images/part-03/design_patterns__behavioral_patterns__visitor.png","doc":"docs/part-03/design_patterns__behavioral_patterns__visitor.md"}]},{"name":"Enterprise Patterns","topics":[{"title":"Repository pattern","quote":"Repository provides a collection-like abstraction over domain object persistence and query operations.","explanation":"","image":"images/part-03/design_patterns__enterprise_patterns__repository_pattern.png","doc":"docs/part-03/design_patterns__enterprise_patterns__repository_pattern.md"},{"title":"Unit of Work","quote":"Unit of Work tracks changes to multiple objects and commits them as one coordinated transaction.","explanation":"","image":"images/part-03/design_patterns__enterprise_patterns__unit_of_work.png","doc":"docs/part-03/design_patterns__enterprise_patterns__unit_of_work.md"},{"title":"Data Mapper","quote":"Data Mapper transfers data between domain objects and storage without making domain objects responsible for persistence.","explanation":"","image":"images/part-03/design_patterns__enterprise_patterns__data_mapper.png","doc":"docs/part-03/design_patterns__enterprise_patterns__data_mapper.md"},{"title":"Active Record","quote":"Active Record combines data and persistence operations in the same object, such as save, update, and delete.","explanation":"","image":"images/part-03/design_patterns__enterprise_patterns__active_record.png","doc":"docs/part-03/design_patterns__enterprise_patterns__active_record.md"},{"title":"Service Layer","quote":"Service Layer defines application use cases and coordinates domain objects, transactions, and external systems.","explanation":"","image":"images/part-03/design_patterns__enterprise_patterns__service_layer.png","doc":"docs/part-03/design_patterns__enterprise_patterns__service_layer.md"},{"title":"DTO pattern","quote":"A Data Transfer Object carries data across process or layer boundaries without exposing internal entity structure.","explanation":"","image":"images/part-03/design_patterns__enterprise_patterns__dto_pattern.png","doc":"docs/part-03/design_patterns__enterprise_patterns__dto_pattern.md"},{"title":"Anti-corruption layer","quote":"An anti-corruption layer translates between external models and the local domain model so outside concepts do not leak inward.","explanation":"","image":"images/part-03/design_patterns__enterprise_patterns__anti_corruption_layer.png","doc":"docs/part-03/design_patterns__enterprise_patterns__anti_corruption_layer.md"},{"title":"Strangler Fig","quote":"The Strangler Fig pattern gradually replaces a legacy system by routing selected capabilities to new components over time.","explanation":"","image":"images/part-03/design_patterns__enterprise_patterns__strangler_fig.png","doc":"docs/part-03/design_patterns__enterprise_patterns__strangler_fig.md"},{"title":"Backend for Frontend","quote":"Backend for Frontend provides a client-specific API tailored to one user interface, such as mobile or web.","explanation":"","image":"images/part-03/design_patterns__enterprise_patterns__backend_for_frontend.png","doc":"docs/part-03/design_patterns__enterprise_patterns__backend_for_frontend.md"},{"title":"Sidecar pattern","quote":"The sidecar pattern runs a helper component beside the main application to provide capabilities such as proxying, logging, or configuration.","explanation":"","image":"images/part-03/design_patterns__enterprise_patterns__sidecar_pattern.png","doc":"docs/part-03/design_patterns__enterprise_patterns__sidecar_pattern.md"},{"title":"Ambassador pattern","quote":"The ambassador pattern places a local proxy beside an application to manage outbound communication, retries, security, or discovery.","explanation":"","image":"images/part-03/design_patterns__enterprise_patterns__ambassador_pattern.png","doc":"docs/part-03/design_patterns__enterprise_patterns__ambassador_pattern.md"}]}]},{"name":"Apache Kafka","groups":[{"name":"Kafka Fundamentals","topics":[{"title":"Kafka architecture","quote":"Apache Kafka is built as a distributed append-only log. Producers write records to named topics, Kafka stores those records across brokers, and consumers read them independently at their own pace.","explanation":"","image":"images/part-03/apache_kafka__kafka_fundamentals__kafka_architecture.png","doc":"docs/part-03/apache_kafka__kafka_fundamentals__kafka_architecture.md"},{"title":"Broker","quote":"A Kafka broker is a server in the Kafka cluster that stores topic partitions and handles requests from Java producers and consumers.","explanation":"","image":"images/part-03/apache_kafka__kafka_fundamentals__broker.png","doc":"docs/part-03/apache_kafka__kafka_fundamentals__broker.md"},{"title":"Topic","quote":"A Kafka topic is a named logical stream where related records are published and stored. In a Java application, producers send records to a topic name, and consumers subscribe to that same topic to read them.","explanation":"","image":"images/part-03/apache_kafka__kafka_fundamentals__topic.png","doc":"docs/part-03/apache_kafka__kafka_fundamentals__topic.md"},{"title":"Partition","quote":"A Kafka partition is an ordered, append-only sequence of records inside a topic. Every new record is added to the end of the partition and receives a unique, increasing offset.","explanation":"","image":"images/part-03/apache_kafka__kafka_fundamentals__partition.png","doc":"docs/part-03/apache_kafka__kafka_fundamentals__partition.md"},{"title":"Offset","quote":"A Kafka offset is the numeric position of a record inside one partition. Each record receives an increasing offset when it is appended to that partition.","explanation":"","image":"images/part-03/apache_kafka__kafka_fundamentals__offset.png","doc":"docs/part-03/apache_kafka__kafka_fundamentals__offset.md"},{"title":"Producer","quote":"A Kafka producer is the Java client responsible for creating and sending records to Kafka topics. It is typically implemented using KafkaProducer\u003cK, V\u003e.","explanation":"","image":"images/part-03/apache_kafka__kafka_fundamentals__producer.png","doc":"docs/part-03/apache_kafka__kafka_fundamentals__producer.md"},{"title":"Consumer group","quote":"A consumer group shares topic partitions among members so each partition is processed by only one member at a time.","explanation":"","image":"images/part-03/apache_kafka__kafka_fundamentals__consumer_group.png","doc":"docs/part-03/apache_kafka__kafka_fundamentals__consumer_group.md"},{"title":"Replication factor","quote":"Replication factor defines how many broker copies each partition has, improving durability and availability.","explanation":"","image":"images/part-03/apache_kafka__kafka_fundamentals__replication_factor.png","doc":"docs/part-03/apache_kafka__kafka_fundamentals__replication_factor.md"},{"title":"Leader and follower replicas","quote":"The leader replica handles reads and writes, while follower replicas copy its log and can take over after failure.","explanation":"","image":"images/part-03/apache_kafka__kafka_fundamentals__leader_and_follower_replicas.png","doc":"docs/part-03/apache_kafka__kafka_fundamentals__leader_and_follower_replicas.md"},{"title":"ISR","quote":"ISR means in-sync replicas: replicas sufficiently caught up with the partition leader to remain eligible for leadership.","explanation":"","image":"images/part-03/apache_kafka__kafka_fundamentals__isr.png","doc":"docs/part-03/apache_kafka__kafka_fundamentals__isr.md"},{"title":"Kafka controller","quote":"The Kafka controller manages partition leadership, broker changes, and cluster metadata coordination.","explanation":"","image":"images/part-03/apache_kafka__kafka_fundamentals__kafka_controller.png","doc":"docs/part-03/apache_kafka__kafka_fundamentals__kafka_controller.md"},{"title":"KRaft","quote":"KRaft is Kafka\u0027s built-in Raft-based metadata quorum that replaces ZooKeeper.","explanation":"","image":"images/part-03/apache_kafka__kafka_fundamentals__kraft.png","doc":"docs/part-03/apache_kafka__kafka_fundamentals__kraft.md"},{"title":"Code-walk-through","quote":"Kafka Fundamentals Code Walkthrough: An end-to-end implementation walkthrough illustrating Kafka architecture, topic creation, partition replication across brokers, asynchronous producer dispatch, and consumer-group processing.","explanation":"","image":"images/part-03/apache_kafka__kafka_fundamentals__code_walk_through.png","doc":"docs/part-03/apache_kafka__kafka_fundamentals__code_walk_through.md"}]},{"name":"Producer Internals","topics":[{"title":"Producer batching","quote":"Producer batching groups records for the same partition into fewer network requests, improving throughput.","explanation":"","image":"images/part-03/apache_kafka__producer_internals__producer_batching.png","doc":"docs/part-03/apache_kafka__producer_internals__producer_batching.md"},{"title":"linger.ms","quote":"linger.ms controls how long a Kafka producer may wait for more records before sending a partially filled batch.","explanation":"","image":"images/part-03/apache_kafka__producer_internals__linger_ms.png","doc":"docs/part-03/apache_kafka__producer_internals__linger_ms.md"},{"title":"batch.size","quote":"batch.size sets the target maximum byte size of a producer batch for one partition.","explanation":"","image":"images/part-03/apache_kafka__producer_internals__batch_size.png","doc":"docs/part-03/apache_kafka__producer_internals__batch_size.md"},{"title":"Compression","quote":"Kafka compression reduces network and storage usage by compressing record batches with codecs such as gzip, snappy, lz4, or zstd.","explanation":"","image":"images/part-03/apache_kafka__producer_internals__compression.png","doc":"docs/part-03/apache_kafka__producer_internals__compression.md"},{"title":"Acknowledgements","quote":"Producer acknowledgements control durability: acks=0 waits for none, acks=1 waits for the leader, and acks=all waits for required in-sync replicas.","explanation":"","image":"images/part-03/apache_kafka__producer_internals__acknowledgements.png","doc":"docs/part-03/apache_kafka__producer_internals__acknowledgements.md"},{"title":"Idempotent producer","quote":"An idempotent Kafka producer prevents duplicate records caused by retries within a producer session and partition.","explanation":"","image":"images/part-03/apache_kafka__producer_internals__idempotent_producer.png","doc":"docs/part-03/apache_kafka__producer_internals__idempotent_producer.md"},{"title":"Transactional producer","quote":"A transactional producer atomically writes records to multiple partitions and can coordinate consumed offsets with produced output.","explanation":"","image":"images/part-03/apache_kafka__producer_internals__transactional_producer.png","doc":"docs/part-03/apache_kafka__producer_internals__transactional_producer.md"},{"title":"Partitioner","quote":"A Kafka partitioner selects the target partition using the key, a custom rule, or sticky batching behavior.","explanation":"","image":"images/part-03/apache_kafka__producer_internals__partitioner.png","doc":"docs/part-03/apache_kafka__producer_internals__partitioner.md"},{"title":"Message keys","quote":"In Apache Kafka, a message key is the value a producer sends along with a record to influence which partition receives it. In Java, the key is the first generic type in ProducerRecord\u003cK, V\u003e.","explanation":"","image":"images/part-03/apache_kafka__producer_internals__message_keys.png","doc":"docs/part-03/apache_kafka__producer_internals__message_keys.md"},{"title":"Producer retries","quote":"Kafka producer retries resend records after transient failures. Use idempotence, bounded delivery time, and backoff so retries do not create duplicates or overload.","explanation":"","image":"images/part-03/apache_kafka__producer_intern
